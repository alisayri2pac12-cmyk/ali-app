<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>Árbol de Matemática</title>
<script>
if(/^https?:$/.test(location.protocol)){
  document.write('<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">');
  if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Árbol Ali">
<style>
:root{
  --bg:#0d1017; --bg2:#151a23; --bg3:#1d2330; --line:#2a3242; --tx:#e6e8ee; --tx2:#9aa3b2; --tx3:#6b7383;
  --ok:#4ade80; --mid:#facc15; --bad:#f87171; --acc:#7aa2ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;height:calc(100vh - 44px);height:calc(100dvh - 44px - env(safe-area-inset-top))}
#appSw{display:flex;gap:6px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:#090c12;border-bottom:1px solid var(--line);height:calc(44px + env(safe-area-inset-top))}
#appSw button{flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--tx2);border-radius:10px;font-size:14px;font-weight:700}
#appSw button.on{background:var(--acc);border-color:var(--acc);color:#0b1020}
#mallaFrame{display:none;width:100%;border:0;height:calc(100vh - 44px);height:calc(100dvh - 44px - env(safe-area-inset-top));background:var(--bg)}
body.malla #app{display:none} body.malla #mallaFrame{display:block}
/* Cabecera */
header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
#rankIcon{flex:0 0 auto;width:44px;height:50px}
.hd-txt{min-width:0;flex:1}
.hd-rank{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-rank small{font-weight:500;color:var(--tx2);font-size:12px;margin-left:4px}
.hd-next{font-size:12.5px;color:var(--tx2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hd-next b{color:var(--tx)}
.hd-days{flex:0 0 auto;text-align:center;background:var(--bg3);border-radius:10px;padding:4px 8px;line-height:1.1}
.hd-days b{display:block;font-size:18px}
.hd-days span{font-size:10.5px;color:var(--tx2)}
main{position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none;padding:14px 14px 30px}
.view.active{display:block}
#vTree{padding:0;overflow:hidden}
/* Navegación */
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:8px 2px 9px;color:var(--tx3);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:19px;line-height:1}
nav button.active{color:var(--tx)}
nav button{position:relative}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:#f87171;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px;line-height:1.3}
.hd-days .stk{display:block;font-size:11px;color:#fbd3ab;margin-top:2px}
nav button.active .ic{filter:drop-shadow(0 0 6px var(--acc))}
/* Árbol */
#tree{width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none;background:
 radial-gradient(circle at 1px 1px,#1c2230 1px,transparent 1.5px) 0 0/22px 22px}
.node{cursor:pointer;transition:opacity .2s}
.node .box{stroke-width:2}
.node text{pointer-events:none}
.node .nid{font-weight:800;font-size:12px}
.node .nwk{font-size:10.5px}
.node .ntl{font-size:12.5px;font-weight:600}
.st-lock .box{fill:#161a22;stroke:#4a5160}
.st-lock text{fill:#7d8595}
.st-avail .box{fill:#141925}
.st-avail text{fill:#e6e8ee}
.st-avail .nid,.st-prog .nid{fill:var(--c)}
.st-prog .box{fill:#141925;stroke-width:3}
.st-prog .over{fill:var(--c);opacity:.22}
.st-prog text{fill:#f2f4f8}
.st-dom .box{fill:var(--c)}
.st-dom text{fill:#10131a}
.node .bar-bg{fill:#00000055}
.node .bar{fill:var(--c)}
.st-dom .bar{fill:#10131a;opacity:.45}
.node.dim{opacity:.18}
.node.sel .box{stroke:#fff;stroke-width:3.5}
.node.hl .box{filter:drop-shadow(0 0 6px var(--c))}
.edge{fill:none;stroke:#465064;stroke-width:1.6;transition:opacity .2s}
.edge.dash{stroke-dasharray:6 5}
.edge.dim{opacity:.12}
.edge.hl{stroke:#e8ecf5;stroke-width:2.4}
.edge.path{stroke:#facc15;stroke-width:2.6}
.now-ring{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:4 4;opacity:.8;animation:spin 6s linear infinite}
@keyframes spin{to{stroke-dashoffset:-80}}
.now-tag{font-size:10.5px;font-weight:700;fill:#fff}
.side-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#4ade80;opacity:.8}
.lvl-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.75}
.tb{position:absolute;display:flex;gap:6px;flex-wrap:wrap}
.tb-top{top:10px;left:10px;right:10px}
@media (max-width:600px){.tb-top .chip{flex:1 1 0;line-height:1.2;font-size:12px;padding:6px 8px}}
.chip{border:1px solid var(--line);background:#151a23e6;backdrop-filter:blur(4px);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--tx)}
.chip.on{background:#facc15;color:#111;border-color:#facc15;font-weight:700}
.tb-zoom{right:10px;bottom:12px;flex-direction:column}
.zbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#151a23e6;font-size:20px;color:var(--tx)}
.legend{position:absolute;left:10px;bottom:12px;background:#151a23e6;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:11px;color:var(--tx2);display:grid;grid-template-columns:auto auto;gap:3px 10px}
.legend.min{grid-template-columns:auto}.legend.min div{display:none}.legend.min::before{content:'Leyenda ▸'}
@media (max-width:600px){.legend{font-size:10px}}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:2px solid #7aa2ff}
.banner{flex:1 0 100%;background:#2a2410f2;border:1px solid #facc1580;color:#fde68a;border-radius:12px;padding:9px 12px;font-size:13px;display:none}
.banner.show{display:block}
/* Panel de nodo */
#panel{position:absolute;left:0;right:0;bottom:0;max-height:74%;overflow:auto;background:var(--bg2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px #0008;transform:translateY(105%);transition:transform .25s ease;padding:0 16px 20px;z-index:5;overscroll-behavior:contain}
#panel.open{transform:none}
.grab{position:sticky;top:0;background:var(--bg2);padding:10px 0 8px;z-index:2;display:flex;align-items:flex-start;gap:10px}
.grab::before{content:"";position:absolute;left:50%;top:5px;width:40px;height:4px;border-radius:2px;background:#3a4252;transform:translateX(-50%)}
.p-id{font-weight:800;font-size:13px;padding:3px 8px;border-radius:8px;color:#111;margin-top:9px}
.p-title{flex:1;margin-top:6px}
.p-title h2{margin:0;font-size:17px;line-height:1.25}
.p-title div{font-size:12.5px;color:var(--tx2)}
.xbtn{background:var(--bg3);border:0;border-radius:10px;width:36px;height:36px;font-size:18px;margin-top:6px;flex:0 0 auto}
.sec{margin-top:12px}
.sec h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{border:1px solid var(--line);background:var(--bg3);border-radius:8px;padding:5px 9px;font-size:13px}
.nchip b{color:var(--c)}
.nchip.done{background:color-mix(in srgb,var(--c) 25%,var(--bg3))}
.nchip.done::after{content:" ✓";color:var(--ok)}
.muted{color:var(--tx3);font-size:13px}
.warn{background:#2b1d10;border:1px solid #f4a26166;color:#fbd3ab;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.goal{background:var(--bg3);border-radius:10px;padding:9px 11px;font-size:14px}
.counter{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.counter button{background:var(--bg3);border:1px solid var(--line);border-radius:10px;min-width:44px;height:40px;font-size:16px;font-weight:700}
.counter input[type=number]{width:72px;height:40px;text-align:center;font-size:17px;font-weight:700}
.counter .of{color:var(--tx2);font-size:15px}
input[type=number],input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:40px}
input[type=date]{color-scheme:dark}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
label.f{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.pbar{height:9px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-top:6px}
.pbar>i{display:block;height:100%;background:var(--c,var(--acc));border-radius:6px;transition:width .3s}
.stbtn{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:0;font-weight:800;font-size:15px;color:#111}
.stnow{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg3)}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:700}
.btn.danger{background:#3a1518;border-color:#f8717166;color:#fecaca}
.btn.sm{padding:6px 10px;font-size:13px}
/* Tarjetas */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px}
.big{font-size:28px;font-weight:800;line-height:1.1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg3);border-radius:12px;padding:10px}
.stat span{display:block;font-size:12px;color:var(--tx2)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700}
.pill.ok{background:#14361f;color:#86efac}.pill.mid{background:#3a2f0b;color:#fde68a}.pill.bad{background:#3a1518;color:#fecaca}.pill.info{background:#172443;color:#bfd0ff}
.ph-row{margin:9px 0}
.ph-row .t{display:flex;justify-content:space-between;font-size:13.5px}
.ph-row .t span{color:var(--tx2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13.5px}
.tl li.cur{background:#1a2338;border-radius:10px;border-bottom-color:transparent}
.tl .wk{font-weight:800;color:var(--tx2);font-size:12px;text-align:center}
.tl .d{font-size:11.5px;color:var(--tx3)}
.tl .rv{color:var(--tx2);font-style:italic}
.ev{border-left:4px solid var(--line)}
.ev.next{border-left-color:var(--acc)}
.ev .meta{font-size:12.5px;color:var(--tx2)}
.ev .inp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ev .inp input[type=number]{width:76px;text-align:center}
.ev .res{margin-top:9px;font-size:13.5px}
.rule{font-size:13px;color:var(--tx2)}
.rule li{margin:3px 0}
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:10px;padding:8px 10px}
.nitem .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.nitem .tx{flex:1;min-width:0;font-size:13.5px}
.nitem .tx small{display:block;color:var(--tx3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranks{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;gap:10px;align-items:center;font-size:13.5px}
.rk svg{flex:0 0 auto}
.rk.lock{opacity:.4}
.rk small{display:block;color:var(--tx2);font-size:12px}
/* Modal */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92dvh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.mbox h2{margin:0 0 10px;font-size:18px}
.mbox .fld{margin-bottom:11px}
.reqbox{display:flex;flex-wrap:wrap;gap:6px}
.reqbox label{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.reqbox label.no{opacity:.35}
.reqbox input{width:auto;min-height:0;margin:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:20px;height:20px;min-height:0}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.err{color:#fca5a5;font-size:13px;min-height:1em}
#exam{position:fixed;inset:0;background:var(--bg);z-index:18;overflow:auto;display:none;padding:12px 14px calc(30px + env(safe-area-inset-bottom));padding-top:max(12px,env(safe-area-inset-top))}
#exam.show{display:block}
.ex-wrap{max-width:700px;margin:0 auto}
.ex-top{display:flex;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:-12px;background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
.ex-clock{font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;background:var(--bg3);border-radius:10px;padding:4px 10px;flex:0 0 auto}
.ex-clock.low{color:#fca5a5}
.ex-list{padding-left:22px}.ex-list li{margin:12px 0;font-size:16px}
.ex-mk{display:flex;gap:8px;margin-top:6px}
.pomo{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg3);border-radius:12px;padding:10px;margin-top:10px}
.pomo .ex-clock{font-size:20px;background:var(--bg)}
.tips{margin-top:10px;font-size:13.5px}.tips summary{cursor:pointer;color:var(--tx2)}.tips li{margin:5px 0}
a{color:#9ab8ff}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#e6e8ee;color:#111;padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (min-width:900px){
  #panel{left:auto;top:0;width:400px;max-height:none;border-radius:18px 0 0 18px;border-left:1px solid var(--line);transform:translateX(105%)}
  #panel.open{transform:none}
  .grab::before{display:none}
  .view:not(#vTree)>.wrap{max-width:760px;margin:0 auto}
  .modal{align-items:center}.mbox{border-radius:18px}
}
</style>
</head>
<body>
<div id="appSw"><button class="on" data-app="mat">🧮 Matemática</button><button data-app="malla">🎓 Malla</button></div>
<iframe id="mallaFrame" title="Malla de la carrera"></iframe>
<div id="app">
  <header>
    <svg id="rankIcon" viewBox="0 0 44 50" aria-hidden="true"></svg>
    <div class="hd-txt">
      <div class="hd-rank" id="hdRank"></div>
      <div class="hd-next" id="hdNext"></div>
    </div>
    <div class="hd-days" id="hdDays"></div>
  </header>
  <main>
    <section class="view active" id="vTree">
      <svg id="tree"><defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#465064"/></marker>
        <marker id="arH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8ecf5"/></marker>
        <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#facc15"/></marker>
      </defs><g id="world"></g></svg>
      <div class="tb tb-top">
        <button class="chip" data-path="U1">Camino a Matemática para Ingenieros I</button>
        <button class="chip" data-path="U2">Camino a Matemática para Ingenieros II</button>
        <div class="banner" id="banner"></div>
      </div>
      <div class="legend" id="legend" title="Toca para ocultar">
        <div><i style="border-color:#4a5160;background:#161a22"></i>Bloqueado</div>
        <div><i style="background:#141925"></i>Disponible</div>
        <div><i style="background:#2a3a66;border-width:3px"></i>En progreso</div>
        <div><i style="background:#7aa2ff"></i>Dominado</div>
      </div>
      <div class="tb tb-zoom">
        <button class="zbtn" id="zIn" aria-label="Acercar">+</button>
        <button class="zbtn" id="zOut" aria-label="Alejar">−</button>
        <button class="zbtn" id="zFit" aria-label="Centrar" style="font-size:16px">⌖</button>
      </div>
      <aside id="panel" aria-live="polite"></aside>
    </section>
    <section class="view" id="vProg"><div class="wrap" id="progWrap"></div></section>
    <section class="view" id="vStudy"><div class="wrap" id="studyWrap"></div></section>
    <section class="view" id="vEval"><div class="wrap" id="evalWrap"></div></section>
    <section class="view" id="vEdit"><div class="wrap" id="editWrap"></div></section>
  </main>
  <nav>
    <button data-v="vTree" class="active"><span class="ic">🌳</span>Árbol</button>
    <button data-v="vProg"><span class="ic">📈</span>Progreso</button>
    <button data-v="vStudy"><span class="ic">🔥</span>Estudio<span class="badge" id="dueBadge" hidden></span></button>
    <button data-v="vEval"><span class="ic">📝</span>Pruebas</button>
    <button data-v="vEdit"><span class="ic">⚙️</span>Editar</button>
  </nav>
</div>
<div id="exam" role="dialog" aria-label="Modo examen"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

}

/* ===================== Plan / semana ===================== */
function planStatus(){
  const w = curWeek(); const plan = S.nodes.filter(n=>n.week);
  const due = plan.filter(n=>n.week < w && !isDom(n.id)).sort((a,b)=>a.week-b.week);
  const ahead = plan.filter(n=>n.week > w && isDom(n.id));
  if(w>19 && !due.length) return {k:'ok', t:'Plan terminado', due, ahead};
  if(due.length) return {k:'bad', t:'Atrasado', due, ahead};
  if(ahead.length) return {k:'info', t:'Adelantado', due, ahead};
  return {k:'ok', t:'Al día', due, ahead};
}
function weekLabel(w){
  if(w<1) return 'El plan empieza el lunes 16 nov 2026';
  if(w>19) return 'Plan de 19 semanas terminado';
  const n = S.nodes.find(x=>x.week===w);
  return 'Semana '+w+': '+(n? n.id+' · '+n.title : (REVIEW_WEEKS[w]||'—'));
}

const W=150, H=78, GX=18, GY=58;
let LAY = {};
function computeLayout(){
  const B=byId(), lvl={}, visiting=new Set();
  function L(id){
    if(lvl[id]!==undefined) return lvl[id];
    if(visiting.has(id)) return 0; visiting.add(id);
    const n=B[id]; let v=0;
    n.reqs.forEach(r=>{ if(B[r]) v=Math.max(v, L(r)+1); });
    if(n.row!==undefined) v=Math.max(v,n.row);
    visiting.delete(id); return lvl[id]=v;
  }
  S.nodes.forEach(n=>L(n.id));
  const SIDE=['P','R']; const main = S.nodes.filter(n=>!SIDE.includes(n.phase)), side = S.nodes.filter(n=>SIDE.includes(n.phase));
  const rows = {}; main.forEach(n=>(rows[lvl[n.id]]=rows[lvl[n.id]]||[]).push(n));
  const pos = {}; let half = W/2;
  Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(l=>{
    const r = rows[l];
    r.forEach(n=>{ const xs=n.reqs.filter(q=>pos[q]).map(q=>pos[q].x+W/2); n._b = xs.length? xs.reduce((a,b)=>a+b,0)/xs.length : 0; });
    r.sort((a,b)=> (a._b-b._b) || ((a.week||99)-(b.week||99)) || a.id.localeCompare(b.id,'es',{numeric:true}));
    const tot = r.length*W + (r.length-1)*GX; half = Math.max(half, tot/2);
    r.forEach((n,i)=>{ pos[n.id] = {x:-tot/2 + i*(W+GX), y:l*(H+GY)}; });
  });
  const sx = half + 70, cols = SIDE.filter(ph=>side.some(n=>n.phase===ph)), colX = {};
  cols.forEach((ph,i)=>{ colX[ph]=sx+i*(W+40); const used={}; side.filter(n=>n.phase===ph).sort((a,b)=>lvl[a.id]-lvl[b.id]||a.id.localeCompare(b.id,'es',{numeric:true})).forEach(n=>{ let l=lvl[n.id]; while(used[l]) l++; used[l]=1; pos[n.id]={x:colX[ph], y:l*(H+GY)}; }); });
  const maxL = Math.max(0,...Object.values(pos).map(p=>p.y));
  LAY = {pos, half, sx, colX, hasSide:side.length>0, minX:-half, maxX: cols.length? sx+(cols.length-1)*(W+40)+W : half, maxY:maxL+H};
}

/* ===================== Árbol: dibujo ===================== */
const svg = document.getElementById('tree'), world = document.getElementById('world');
let selected = null, pathMode = null;
function wrap(text, max){
  const words = String(text).split(/\s+/), lines=[]; let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>max && cur){ lines.push(cur); cur=w; } else cur=(cur+' '+w).trim(); });
  if(cur) lines.push(cur);
  if(lines.length>3){ lines.length=3; lines[2]=lines[2].slice(0,max-1)+'…'; }
  return lines;
}
function renderTree(){

  if(selected && B[selected]){ lit = new Set([selected, ...ancestors(selected), ...descendants(selected)]); }
  if(pathMode && B[pathMode]){ pathSet = new Set([...ancestors(pathMode), pathMode].filter(id=>!isDom(id))); }
  const A = selected ? ancestors(selected) : null, D = selected ? descendants(selected) : null;
  // reparto de entradas/salidas para que las flechas no se encimen
  const inc = {}, out = {};
  S.nodes.forEach(n=>n.reqs.forEach(r=>{ if(B[r]){ (inc[n.id]=inc[n.id]||[]).push(r); (out[r]=out[r]||[]).push(n.id); } }));
  const slot = (list, key, id) => { const arr=(list[key]||[]).slice().sort((a,b)=>pos[a].x-pos[b].x); const i=arr.indexOf(id), k=arr.length; return k<=1?0:(i/(k-1)-.5)*W*0.6; };
  let h = '';
  // etiquetas laterales
  if(LAY.colX.P!==undefined) h += `<text class="side-lbl" x="${LAY.colX.P+W/2}" y="-14" text-anchor="middle">RAMA P · PROGRAMACIÓN</text>`;
  if(LAY.colX.R!==undefined) h += `<text class="side-lbl" x="${LAY.colX.R+W/2}" y="-14" text-anchor="middle" style="fill:#fb7185">RAMA R · PREPARACIÓN</text>`;
  const uNodes = S.nodes.filter(n=>n.phase==='U'&&pos[n.id]);
  if(uNodes.length){ const y=Math.min(...uNodes.map(n=>pos[n.id].y)); h += `<line x1="${-LAY.half-20}" x2="${LAY.half+20}" y1="${y-GY/2}" y2="${y-GY/2}" stroke="#facc1555" stroke-dasharray="3 6"/><text class="lvl-lbl" x="${-LAY.half-16}" y="${y-GY/2-7}" fill="#facc15">UNIVERSIDAD · 29 MAR 2027</text>`; }
  h += `<text class="lvl-lbl" x="${-LAY.half-16}" y="-14" fill="#9aa3b2">ANTES DE LA UNIVERSIDAD</text>`;
  // flechas
  S.nodes.forEach(n=>n.reqs.forEach(r=>{
    if(!B[r]||!pos[r]||!pos[n.id]) return;
    const a=pos[r], b=pos[n.id];
    const x1=a.x+W/2+slot(out,r,n.id), y1=a.y+H, x2=b.x+W/2+slot(inc,n.id,r), y2=b.y-2;
    const dy=Math.max(28,(y2-y1)*0.45);
    let cls='edge', mk='ar';
    if(n.dashed||B[r].dashed) cls+=' dash';
    if(lit){ const on=(r===selected||A.has(r))&&(n.id===selected||A.has(n.id)) || (r===selected||D.has(r))&&(n.id===selected||D.has(n.id)); cls+= on?' hl':' dim'; if(on) mk='arH'; }
    else if(pathSet){ const on=pathSet.has(n.id)&&(pathSet.has(r)); cls+= on?' path':' dim'; if(on) mk='arP'; }
    h += `<path class="${cls}" marker-end="url(#${mk})" d="M${x1} ${y1} C${x1} ${y1+dy} ${x2} ${y2-dy} ${x2} ${y2}"/>`;
  }));
  // nodos
  S.nodes.forEach(n=>{
    const p=pos[n.id]; if(!p) return;
    const st=nodeState(n), pr=S.progress[n.id]||{}, c=col(n);
    let cls='node st-'+st;
    if(lit) cls += lit.has(n.id)?' hl':' dim';
    else if(pathSet) cls += pathSet.has(n.id)?' hl':' dim';
    if(n.id===selected) cls+=' sel';
    const lines = wrap(n.title, 19);
    const ty = 46 - (lines.length-1)*6.5;
    const wk = n.week ? 'Sem '+n.week : (n.dates.length<=14 ? n.dates : (/^ciclo/i.test(n.dates) ? n.dates.split(' ').slice(0,2).join(' ')+'+' : n.dates.split(' ')[0]));
    let g = `<g class="${cls}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})" style="--c:${c}">`;
    if(n.week===w && st!=='dom') g += `<rect class="now-ring" x="-6" y="-6" width="${W+12}" height="${H+12}" rx="15"/><text class="now-tag" x="${W/2}" y="-10" text-anchor="middle">▼ ESTA SEMANA</text>`;
    g += `<rect class="box" width="${W}" height="${H}" rx="11" style="stroke:${st==='lock'?'':c}" ${n.dashed?'stroke-dasharray="7 5"':''}/>`;
    if(st==='prog') g += `<rect class="over" width="${W}" height="${H}" rx="11"/>`;
    g += `<text class="nid" x="10" y="17">${esc(n.id)}${st==='dom'?' ✓':''}${reviewDue(n.id)?' 🔁':''}${st==='lock'?' 🔒':''}</text>`;
    g += `<text class="nwk" x="${W-9}" y="17" text-anchor="end">${esc(wk)}</text>`;
    g += `<text class="ntl" x="${W/2}" y="${ty}" text-anchor="middle">${lines.map((l,i)=>`<tspan x="${W/2}" dy="${i?14:0}">${esc(l)}</tspan>`).join('')}</text>`;
    if(n.target>0 && !n.grade20){ const r=Math.min(1,(pr.count||0)/n.target); g += `<rect class="bar-bg" x="10" y="${H-9}" width="${W-20}" height="4" rx="2"/><rect class="bar" x="10" y="${H-9}" width="${(W-20)*r}" height="4" rx="2"/>`; }
    else if(n.grade20 && gradeOf(n.id)!==null){ g += `<text class="nwk" x="${W/2}" y="${H-6}" text-anchor="middle">Nota ${gradeOf(n.id)}/20</text>`; }
    g += `</g>`; h += g;
  });
  world.innerHTML = h;
  document.querySelectorAll('[data-path]').forEach(b=>b.classList.toggle('on', b.dataset.path===pathMode));
  const bn = document.getElementById('banner');
  if(pathSet){
    const list=[...pathSet].filter(id=>id!==pathMode).map(id=>B[id]).sort((a,b)=>(a.week||99)-(b.week||99));
    bn.innerHTML = list.length ? `Te faltan <b>${list.length}</b> temas para llegar a <b>${esc(B[pathMode].title)}</b>: ${list.map(n=>esc(n.id)).join(', ')}` : (isDom(pathMode)?`¡Ya dominaste ${esc(B[pathMode].title)}!`:`¡Tienes todo lo necesario para <b>${esc(B[pathMode].title)}</b>!`);
    bn.classList.add('show');
  } else bn.classList.remove('show');
  applyView();
}

/* ===================== Zoom y desplazamiento ===================== */
let view = {x:0,y:0,s:1};
const clampS = s => Math.min(2.5, Math.max(0.25, s));
function applyView(){ world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.s})`); }
function fitView(){
  const r = svg.getBoundingClientRect(); if(!r.width) return;
  const tw = LAY.maxX - LAY.minX + 60;
  let s = Math.min(1.1, r.width / tw);
  if(r.width < 600) s = Math.max(s, 0.62);
  view.s = s;
  // en celular: centrar la columna principal; en pantalla grande: todo el ancho
  const cx = (s*tw <= r.width) ? (LAY.minX+LAY.maxX)/2 : 0;
  view.x = r.width/2 - cx*s; view.y = 100;
  const cur = S.nodes.find(n=>n.week===curWeek()), cp = cur && LAY.pos[cur.id];
  if(cp && view.y + (cp.y+H)*s > r.height - 90){ view.y = r.height*0.35 - cp.y*s; if(r.width<600) view.x = r.width/2 - (cp.x+W/2)*s; }
  applyView();
}
function zoomAt(f, cx, cy){ const ns=clampS(view.s*f); const wx=(cx-view.x)/view.s, wy=(cy-view.y)/view.s; view.s=ns; view.x=cx-wx*ns; view.y=cy-wy*ns; applyView(); }
const pts = new Map(); let gest = null;
const local = e => { const r=svg.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
svg.addEventListener('pointerdown', e=>{
  svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e));
  if(pts.size===1){ const p=local(e); gest={t:'pan', sx:p.x, sy:p.y, vx:view.x, vy:view.y, moved:false, target:e.target}; }
  else if(pts.size===2){ const [a,b]=[...pts.values()]; const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; gest={t:'pinch', d0:Math.hypot(a.x-b.x,a.y-b.y)||1, s0:view.s, wx:(m.x-view.x)/view.s, wy:(m.y-view.y)/view.s, moved:true}; }
});
svg.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)||!gest) return; pts.set(e.pointerId, local(e));
  if(gest.t==='pan' && pts.size===1){ const p=local(e); const dx=p.x-gest.sx, dy=p.y-gest.sy; if(Math.hypot(dx,dy)>7) gest.moved=true; if(gest.moved){ view.x=gest.vx+dx; view.y=gest.vy+dy; applyView(); } }
  else if(gest.t==='pinch' && pts.size>=2){ const [a,b]=[...pts.values()]; const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; const s=clampS(gest.s0*Math.hypot(a.x-b.x,a.y-b.y)/gest.d0); view.s=s; view.x=m.x-gest.wx*s; view.y=m.y-gest.wy*s; applyView(); }
});
function endPtr(e){
  if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
  if(gest && gest.t==='pan' && !gest.moved && e.type==='pointerup'){
    const g = gest.target && gest.target.closest && gest.target.closest('.node');
    if(g) selectNode(g.dataset.id); else { if(selected) closePanel(); }
  }
  if(pts.size===1 && gest && gest.t==='pinch'){ const p=[...pts.values()][0]; gest={t:'pan',sx:p.x,sy:p.y,vx:view.x,vy:view.y,moved:true}; }
  if(!pts.size) gest=null;
}
svg.addEventListener('pointerup', endPtr); svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e=>{ e.preventDefault(); const p=local(e); zoomAt(Math.exp(-e.deltaY*0.0015), p.x, p.y); }, {passive:false});
document.getElementById('zIn').onclick = ()=>{ const r=svg.getBoundingClientRect(); zoomAt(1.25, r.width/2, r.height/2); };
document.getElementById('zOut').onclick = ()=>{ const r=svg.getBoundingClientRect(); zoomAt(0.8, r.width/2, r.height/2); };
document.getElementById('zFit').onclick = fitView;
if(innerWidth<600) document.getElementById('legend').classList.add('min');
document.getElementById('legend').onclick = e=>e.currentTarget.classList.toggle('min');
document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{ pathMode = pathMode===b.dataset.path?null:b.dataset.path; if(pathMode){ selected=null; closePanel(true); } renderTree(); });

  const p=LAY.pos[id]; if(!p) return; const r=svg.getBoundingClientRect();

/* ===================== Evaluaciones ===================== */
function weakness(n){ const p=S.progress[n.id]||{}; const t=(p.test===null||p.test===undefined)?null:+p.test; const r=n.target?(+p.count||0)/n.target:1; return (t===null?5:t)*10 + r*10 + (isDom(n.id)?50:0); }
function evalAdvice(e,pct){
  if(pct>=80) return '';
  const B=byId(); const ns=(e.nodes||[]).map(i=>B[i]).filter(Boolean).sort((a,b)=>weakness(a)-weakness(b));
  if(!ns.length) return '';
  const lbl = n => esc(n.id+' ('+n.title+(n.week?', semana '+n.week:'')+')');
  if(pct>=60) return `<div class="muted" style="margin-top:5px">Repasa sobre todo: ${ns.slice(0,2).map(lbl).join(' y ')}.</div>`;
  return `<div class="warn">Semana más débil sugerida: <b>${lbl(ns[0])}</b>. Se elige por la nota de prueba más baja y menos ejercicios hechos.</div>`;
}
function evalMsg(pct){
  if(pct>=80) return {k:'ok', t:'80 % o más: avanza a la semana siguiente.'};
  if(pct>=60) return {k:'mid', t:'Entre 60 y 79 %: avanza, pero repasa los temas que fallaste.'};
  return {k:'bad', t:'Menos de 60 %: repite la semana más débil antes de avanzar.'};
}
function renderEvals(){
  const t=today(); const nextE = S.evals.find(e=>e.date && ymd(e.date)>=t && e.score===null);

  S.evals.forEach(e=>{

    h += `<div class="card ev ${nextE===e?'next':''}" data-ev="${esc(e.id)}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h2 style="margin:0">${esc(e.name)}</h2>${nextE===e?'<span class="pill info">Próxima</span>':''}</div>

      <div class="inp"><label class="f" style="margin:0">Puntaje</label><input type="number" min="0" step="0.5" inputmode="decimal" class="evS" value="${e.score??''}" placeholder="—"><span class="muted">de</span><input type="number" min="1" step="1" inputmode="numeric" class="evM" value="${e.max}"><button class="btn pri sm evSave">Guardar</button></div>
      ${(e.nodes||[]).length?`<div class="meta" style="margin-top:6px">Temas: ${e.nodes.map(esc).join(', ')}</div>`:''}
      <div class="res">${m?`<span class="pill ${m.k}">${pct} %</span> ${esc(m.t)}${evalAdvice(e,pct)}`:(d&&d<t?'<span class="muted">Pendiente de registrar.</span>':'')}</div></div>`;

/* ===================== Estudio: racha y minutos ===================== */
function study(){ if(!S.study||typeof S.study!=='object') S.study={log:{}}; if(!S.study.log) S.study.log={}; return S.study; }
function meta(){ if(!S.meta||typeof S.meta!=='object') S.meta={}; if(!S.meta.firstUse) S.meta.firstUse=iso(today()); return S.meta; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function minutesOn(dt){ return +(study().log[iso(dt)]||0); }
function streak(){
  let d=today(), n=0;
  if(!minutesOn(d)) d=addDays(d,-1);
  while(minutesOn(d)>0){ n++; d=addDays(d,-1); }
  return n;
}
function bestStreak(){
  const days=Object.keys(study().log).filter(k=>study().log[k]>0).sort(); let best=0,cur=0,prev=null;
  days.forEach(k=>{ const d=ymd(k); cur = prev && daysBetween(prev,d)===1 ? cur+1 : 1; best=Math.max(best,cur); prev=d; });
  return best;
}
function logMinutes(min, nodeId){
  min=Math.round(+min); if(!(min>0) || min>600){ toast('Escribe minutos entre 1 y 600'); return; }
  const k=iso(today()); study().log[k]=(+study().log[k]||0)+min;
  if(nodeId && byId()[nodeId]){ const p=P(nodeId); p.minutes=(+p.minutes||0)+min; }
  save(); renderHeader(); toast('+'+min+' min · racha de '+streak()+' día'+(streak()===1?'':'s')+' 🔥');
}

/* ===================== Repaso espaciado ===================== */
const REVIEW_DAYS=[7,21,60];
function reviewInfo(id){
  const p=S.progress[id]; if(!p||p.status!=='dominado'||!p.date||!/^\d{4}-\d{2}-\d{2}$/.test(p.date)) return null;
  const done=Array.isArray(p.reviews)?p.reviews:[]; const i=done.length;
  if(i>=REVIEW_DAYS.length) return {complete:true, done};
  const due=addDays(ymd(p.date), REVIEW_DAYS[i]);
  return {i, due, days:daysBetween(today(),due), done, complete:false};
}
const reviewDue = id => { const r=reviewInfo(id); return !!(r && !r.complete && r.days<=0); };
function markReview(id){ const p=P(id); p.reviews=(Array.isArray(p.reviews)?p.reviews:[]).concat(iso(today())); save(); refreshAll(); if(selected===id) openPanel(id); toast('Repaso de '+id+' registrado'); }
function dueCount(){ return S.nodes.filter(n=>reviewDue(n.id)).length; }

function topicLinks(n){
  if(n.links && n.links.length) return n.links;
  const q=encodeURIComponent(n.title.replace(/\(.*?\)/g,'').trim());
  const L=[

  w.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{ const it=practice.items[+b.dataset.ok]; if(it.ok||it.bad) return; it.ok=true; const p=P(practice.topic); p.count=(+p.count||0)+1; save(); renderTree(); b.disabled=true; b.textContent='✓ Sumado'; b.nextElementSibling.disabled=true; });
  w.querySelectorAll('[data-bad]').forEach(b=>b.onclick=()=>{ const it=practice.items[+b.dataset.bad]; if(it.ok||it.bad) return; it.bad=true; addError(practice.topic, it.q, it.a); renderHeader(); b.disabled=true; b.textContent='📒 Anotado'; b.previousElementSibling.disabled=true; toast('Guardado en tu cuaderno de errores'); });

}

/* ===================== Gráfico de mini evaluaciones ===================== */
function evalChart(){
  const ev=S.evals, n=ev.length; if(!n) return '';
  const W2=320, H2=170, L=38, R=12, T2=12, Bt=28, iw=W2-L-R, ih=H2-T2-Bt;
  const X=i=>L+(n===1?iw/2:i*iw/(n-1)), Y=p=>T2+ih*(1-p/100);
  let s=`<svg viewBox="0 0 ${W2} ${H2}" style="width:100%" role="img" aria-label="Notas de las mini evaluaciones">`;
  s+=`<rect x="${L}" y="${Y(100)}" width="${iw}" height="${Y(80)-Y(100)}" fill="#4ade80" opacity=".07"/><rect x="${L}" y="${Y(80)}" width="${iw}" height="${Y(60)-Y(80)}" fill="#facc15" opacity=".07"/><rect x="${L}" y="${Y(60)}" width="${iw}" height="${Y(0)-Y(60)}" fill="#f87171" opacity=".06"/>`;
  [0,60,80,100].forEach(v=>{ s+=`<line x1="${L}" x2="${W2-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===80?'#4ade80':v===60?'#facc15':'#2a3242'}" stroke-dasharray="${v===60||v===80?'4 4':''}" opacity=".7"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#9aa3b2">${v}%</text>`; });
  const pts=ev.map((e,i)=>[i,evalPct(e)]).filter(p=>p[1]!==null);
  if(pts.length>1) s+=`<polyline fill="none" stroke="#7aa2ff" stroke-width="2" points="${pts.map(([i,p])=>X(i)+','+Y(Math.min(100,p))).join(' ')}"/>`;
  ev.forEach((e,i)=>{ const p=evalPct(e); s+=`<text x="${X(i)}" y="${H2-10}" text-anchor="middle" font-size="9" fill="#9aa3b2">${e.id==='final'?'F':i+1}</text>`;
    if(p!==null){ const c=p>=80?'#4ade80':p>=60?'#facc15':'#f87171'; s+=`<circle cx="${X(i)}" cy="${Y(Math.min(100,p))}" r="4.5" fill="${c}" stroke="#0d1017" stroke-width="1.5"><title>${esc(e.name)}: ${p} %</title></circle><text x="${X(i)}" y="${Y(Math.min(100,p))-8}" text-anchor="middle" font-size="9" fill="#e6e8ee">${Math.round(p)}</text>`; }
    else s+=`<circle cx="${X(i)}" cy="${Y(0)}" r="2.5" fill="#2a3242"/>`; });
  s+=`</svg>`;
  const avg = pts.length ? Math.round(pts.reduce((a,p)=>a+p[1],0)/pts.length) : null;
  return `<div class="card"><h2>📊 Tus notas en el tiempo</h2>${s}<div class="muted">${pts.length?`Promedio: <b style="color:var(--tx)">${avg} %</b> en ${pts.length} prueba${pts.length>1?'s':''}. Verde ≥ 80 %, amarillo 60–79 %, rojo &lt; 60 %.`:'Cuando guardes puntajes aparecerán aquí.'}</div></div>`;
}

const SNAP_KEY='arbolAli.autosnap';

    localStorage.setItem(SNAP_KEY, JSON.stringify({fecha:iso(today()), matematica:S, malla})); m.lastSnap=iso(today()); save(); }catch(e){}
}
function snapInfo(){ try{ const d=JSON.parse(localStorage.getItem(SNAP_KEY)||'null'); return d&&d.fecha?d:null; }catch(e){ return null; } }
function backupCheck(){

/* ===================== Generadores de los temas nuevos ===================== */
Object.assign(GEN, {
  X5:()=>pick([()=>{ const U=[1,2,3,4,5,6,7,8,9]; const A=U.filter(()=>Math.random()<.45), B=U.filter(()=>Math.random()<.45); const f=s=>'{'+(s.length?s.join(', '):'')+'}';
      const op=pick(['∪','∩','−']); const r= op==='∪'?U.filter(x=>A.includes(x)||B.includes(x)):op==='∩'?A.filter(x=>B.includes(x)):A.filter(x=>!B.includes(x));
      return {q:`A = ${f(A)}, B = ${f(B)}. Calcula A ${op} B`, a:r.length?f(r):'∅ (conjunto vacío)'}; },
    ()=>{ const p=pick([true,false]), q=pick([true,false]); const V=b=>b?'V':'F'; const ops=[['p ∧ q',p&&q],['p ∨ q',p||q],['p → q',!p||q],['p ↔ q',p===q],['¬p ∨ q',!p||q],['¬(p ∧ q)',!(p&&q)]]; const [e,v]=pick(ops);
      return {q:`Si p = ${V(p)} y q = ${V(q)}, ¿cuál es el valor de ${e}?`, a:V(v)}; },
    ()=>{ const a=rnd(10,40), b=rnd(10,40), c=rnd(2,Math.min(a,b)-2); return {q:`En un grupo, ${a} estudian Python, ${b} estudian Excel y ${c} estudian ambos. ¿Cuántos estudian al menos uno?`, a:String(a+b-c)}; }])(),
  X6:()=>pick([()=>{ const a=nz(-4,4), b=rnd(-6,6), c=nz(-3,3), x=rnd(-3,3); const g=c*x; return {q:`f(x) = ${terms([[a,'x'],[b,'']])}, g(x) = ${terms([[c,'x']])}. Calcula (f ∘ g)(${num(x)})`, a:num(a*g+b)}; },
    ()=>{ const a=nz(-5,5), b=rnd(-9,9); const inv = b===0 ? `x/${num(a)}` : `(x ${b<0?'+ '+(-b):'− '+b}) / ${num(a)}`; return {q:`Halla la inversa de f(x) = ${terms([[a,'x'],[b,'']])}`, a:`f⁻¹(x) = ${inv}`}; },
    ()=>{ const k=nz(-5,5); return {q:`f(x) = x², g(x) = ${lin(k)}. Escribe (f ∘ g)(x) desarrollado`, a:poly([1,2*k,k*k])}; }])(),
  X7:()=>pick([()=>{ const a=rnd(1,9), d=nz(-4,6), n=rnd(5,15); return {q:`Progresión aritmética: a₁ = ${a}, d = ${num(d)}. Halla a${sub(n)} y la suma de los ${n} primeros términos`, a:`a${sub(n)} = ${num(a+(n-1)*d)}; S = ${num(n*(2*a+(n-1)*d)/2)}`}; },
    ()=>{ const n=rnd(4,10), k=rnd(1,4), c=rnd(0,5); let s=0; for(let i=1;i<=n;i++) s+=k*i+c; return {q:`Calcula Σ (de i = 1 a ${n}) de (${terms([[k,'i'],[c,'']])})`, a:String(s)}; },
    ()=>{ const a=rnd(1,5), r=pick([2,3]), n=rnd(4,7); return {q:`Progresión geométrica: a₁ = ${a}, r = ${r}. Halla a${sub(n)}`, a:String(a*r**(n-1))}; }])(),
  X8:()=>pick([()=>{ const n=rnd(5,10), k=rnd(2,4); let c=1; for(let i=0;i<k;i++) c=c*(n-i)/(i+1); return {q:`¿De cuántas formas puedes elegir ${k} personas de un grupo de ${n}? (el orden no importa)`, a:`C(${n}, ${k}) = ${Math.round(c)}`}; },
    ()=>{ const n=rnd(4,8), k=rnd(2,3); let p=1; for(let i=0;i<k;i++) p*=n-i; return {q:`¿De cuántas formas se reparten ${k} premios distintos entre ${n} personas? (el orden importa)`, a:`P(${n}, ${k}) = ${p}`}; },
    ()=>{ const r=rnd(2,8), b=rnd(2,8); const f=Fr(r,r+b); return {q:`Una bolsa tiene ${r} bolas rojas y ${b} azules. ¿Probabilidad de sacar una roja?`, a:fs(f)}; },
    ()=>{ const s=rnd(2,12); let c=0; for(let i=1;i<=6;i++) for(let j=1;j<=6;j++) if(i+j===s) c++; return {q:`Se lanzan dos dados. ¿Probabilidad de que la suma sea ${s}?`, a:fs(Fr(c,36))}; }])()

/* ===================== Cuaderno de errores ===================== */
function errs(){ if(!Array.isArray(S.errors)) S.errors=[]; return S.errors; }
function addError(topic, q, a){ errs().push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5), topic:topic||'', q:String(q), a:String(a||''), added:iso(today()), due:iso(today()), tries:0}); save(); }
const errorsDue = () => errs().filter(e=>!e.fixed && ymd(e.due)<=today());
function errorRetry(id, ok){ const e=errs().find(x=>x.id===id); if(!e) return;
  if(ok){ e.fixed=iso(today()); toast('¡Error superado! ✅'); } else { e.tries=(e.tries||0)+1; e.due=iso(addDays(today(), e.tries>1?3:2)); toast('Vuelve a salir en '+(e.tries>1?3:2)+' días'); }
  save(); renderHeader(); renderStudy(); }

/* ===================== Modo examen ===================== */
let EX=null, exTimer=null;
function examTopics(){ return S.nodes.filter(n=>GEN[n.id] && /^T\d+$/.test(n.id)); }
function startExam(topic){
  let items, total, mins;
  if(topic==='SIM'){ const ts=examTopics(); total=15; mins=40; items=[]; const order=ts.slice().sort(()=>Math.random()-.5); for(let i=0;i<total;i++){ const t=order[i%order.length]; items.push({...GEN[t.id](), topic:t.id}); } }
  else { total=10; mins = /T1$|T3$/.test(topic)?20: topic==='T4'?10 : 25; items=genFor(topic,total).map(x=>({...x, topic})); }
  const custom = +(document.getElementById('exMin')||{}).value; if(custom>0) mins=custom;
  EX={topic, items, total, mins, start:Date.now(), end:Date.now()+mins*60000, phase:'run'};
  document.getElementById('exam').classList.add('show'); renderExam();
  clearInterval(exTimer); exTimer=setInterval(tickExam, 1000);
}
function tickExam(){ if(!EX||EX.phase!=='run') return clearInterval(exTimer); const left=EX.end-Date.now(); const el=document.getElementById('exClock'); if(el){ const s=Math.max(0,Math.ceil(left/1000)); el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); el.classList.toggle('low', s<=120); }
  if(left<=0){ toast('⏰ Se acabó el tiempo'); finishExam(); } }
function finishExam(){ if(!EX) return; EX.phase='check'; EX.used=Math.max(1,Math.round((Date.now()-EX.start)/60000)); clearInterval(exTimer); renderExam(); }
function renderExam(){
  const box=document.getElementById('exam'), B=byId(); if(!EX){ box.classList.remove('show'); return; }
  const title = EX.topic==='SIM' ? 'Simulacro final · 15 ejercicios' : `Examen de ${EX.topic} · ${esc(B[EX.topic]?.title||'')}`;
  let h = `<div class="ex-top"><div><b>${title}</b><div class="muted">${EX.phase==='run'?'Sin apuntes y sin pistas. Resuelve en papel.':'Corrige con honestidad: marca ✓ o ✗ en cada uno.'}</div></div>`;
  if(EX.phase==='run') h += `<div class="ex-clock" id="exClock">--:--</div></div>`;
  else { const ok=EX.items.filter(i=>i.mark==='ok').length, marked=EX.items.filter(i=>i.mark).length; h += `<div class="ex-clock">${ok}/${EX.total}</div></div><div class="muted" style="margin:6px 0 0">Tiempo usado: ${EX.used} min · corregidos ${marked} de ${EX.total}</div>`; }
  h += `<ol class="ex-list">` + EX.items.map((it,i)=>`<li><div class="ex-q">${esc(it.q)}${EX.topic==='SIM'?` <span class="muted">(${esc(it.topic)})</span>`:''}</div>${EX.phase==='check'?`<div class="goal" style="margin-top:6px">Respuesta: ${esc(it.a)}</div><div class="ex-mk"><button class="btn sm ${it.mark==='ok'?'pri':''}" data-mk="${i}" data-v="ok">✓ Bien</button><button class="btn sm ${it.mark==='bad'?'danger':''}" data-mk="${i}" data-v="bad">✗ Mal</button></div>`:''}</li>`).join('') + `</ol>`;
  if(EX.phase==='run') h += `<div class="mact"><button class="btn" id="exQuit">Abandonar</button><button class="btn pri" id="exEnd">Terminé: ver respuestas</button></div>`;
  else {
    const ok=EX.items.filter(i=>i.mark==='ok').length, all=EX.items.every(i=>i.mark); const pct=Math.round(ok/EX.total*100);
    if(all){ const m=evalMsg(pct); h += `<div class="card" style="margin-top:10px"><div class="big">${ok}/${EX.total} · ${pct} %</div><div style="margin-top:6px">${EX.topic==='SIM'?esc(m.t):(ok>=8?'✅ Cumples el criterio de dominio (8/10 sin apuntes).':'⏳ Aún no llegas a 8/10. Repasa los errores y vuelve a intentarlo en unos días.')}</div>
      <div class="muted" style="margin-top:6px">Al guardar: ${EX.topic==='SIM'?'se anota en el Simulacro final':'la nota va a "Nota de la prueba" de '+esc(EX.topic)}, los ✗ pasan a tu cuaderno de errores y se registran ${EX.used} min de estudio.</div></div>`; }
    h += `<div class="mact"><button class="btn" id="exQuit">Salir sin guardar</button><button class="btn pri" id="exSave" ${all?'':'disabled'}>Guardar resultado</button></div>`;
  }
  box.innerHTML = `<div class="ex-wrap">${h}</div>`;
  const $=s=>box.querySelector(s);
  if($('#exEnd')) $('#exEnd').onclick=finishExam;
  $('#exQuit').onclick=()=>{ if(EX.phase==='run'){ confirmBox('¿Abandonar el examen?','No se guarda nada.','Abandonar',()=>{ clearInterval(exTimer); EX=null; renderExam(); }); } else { EX=null; renderExam(); } };
  box.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{ EX.items[+b.dataset.mk].mark=b.dataset.v; const y=box.scrollTop; renderExam(); box.scrollTop=y; });
  if($('#exSave')) $('#exSave').onclick=saveExam;
  if(EX.phase==='run') tickExam();
}
function saveExam(){
  const ok=EX.items.filter(i=>i.mark==='ok').length;
  EX.items.filter(i=>i.mark==='bad').forEach(i=>addError(i.topic, i.q, i.a));
  const k=iso(today()); study().log[k]=(+study().log[k]||0)+EX.used;
  let msg='';
  if(EX.topic==='SIM'){ const f=S.evals.find(e=>e.id==='final'); if(f){ f.max=EX.total; f.score=ok; } msg='Guardado en el Simulacro final: '+ok+'/'+EX.total; }
  else { const p=P(EX.topic); p.test=Math.round(ok/EX.total*10); p.minutes=(+p.minutes||0)+EX.used; msg='Nota de '+EX.topic+': '+p.test+'/10'; }
  const topic=EX.topic, pass = topic!=='SIM' && ok/EX.total>=0.8 && !isDom(topic);
  save(); EX=null; renderExam(); refreshAll();
  if(pass) confirmBox('¡Llegaste a 8/10!','¿Marcamos '+topic+' como dominado con fecha de hoy?','Sí, dominado',()=>{ const p=P(topic); p.status='dominado'; if(!p.date) p.date=iso(today()); save(); refreshAll(); toast('¡'+topic+' dominado! 🎉'); });
  else toast(msg);
}

/* ===================== Plan del día y pomodoro ===================== */
let pomo=null, pomoTimer=null;
function dayTasks(){
  const t=today(), w=curWeek(), dow=t.getDay(), B=byId(), tasks=[];
  const node=S.nodes.find(n=>n.week===w && /^T|^X/.test(n.id));
  const ev=S.evals.find(e=>e.date===iso(t));
  if(w<1) tasks.push({k:'pre', t:'El plan empieza el lunes 16 nov 2026. Hoy: arma tu horario de estudio.'});
  else if(w>19) tasks.push({k:'uni', t:'¡Plan terminado! Repasa tus temas débiles antes de la universidad.'});
  if(ev) tasks.push({k:'ev', t:`📝 Hoy toca ${ev.name}: ${ev.topic}. Hazla sin apuntes y guarda tu puntaje.`, go:'vEval'});
  if(dow===0){ const p1=B.P1; tasks.push({k:'p1', t:'🐍 Domingo de programación: avanza CS50P (P1).', link:(p1&&p1.links&&p1.links[0])?p1.links[0][1]:'https://cs50.harvard.edu/python/'}); }
  if(w>=1 && w<=19){
    if(REVIEW_WEEKS[w] && dow!==0) tasks.push({k:'rv', t:`🔁 Semana de repaso: ${REVIEW_WEEKS[w]}.`});
    if(node && dow!==0 && !ev){
      const p=S.progress[node.id]||{};
      if(isDom(node.id)) tasks.push({k:'adv', t:`✅ ${node.id} ya está dominado. Adelanta el siguiente tema o practica un tema extra.`});
      else if(dow===6) tasks.push({k:'exam', t:`⏱ Sábado: haz un examen de práctica de ${node.id} (10 ejercicios, meta 8/10).`, exam:node.id});
      else { const rem=Math.max(0,node.target-(+p.count||0)); const daysLeft=Math.max(1, 6-dow); const n=Math.max(5, Math.ceil(rem/daysLeft));
        tasks.push({k:'main', t: rem? `📘 ${node.id} · ${node.title}: resuelve unos ${n} ejercicios (llevas ${+p.count||0} de ${node.target}).` : `📘 ${node.id}: ya hiciste los ${node.target} ejercicios. Prueba el modo examen.`, prac:node.id}); }
    }
  }
  const rv=S.nodes.filter(n=>reviewDue(n.id)); if(rv.length) tasks.push({k:'srs', t:`🔁 Repasa: ${rv.map(n=>n.id).join(', ')} (5 ejercicios cada uno, sin apuntes).`});
  const er=errorsDue().length; if(er) tasks.push({k:'err', t:`📒 Reintenta ${Math.min(er,5)} error${er===1?'':'es'} de tu cuaderno.`});
  tasks.push({k:'min', t:'⏱ Registra tus minutos de hoy para mantener la racha.'});
  return tasks;
}

function tickPomo(){ const el=document.getElementById('pomoClock'); if(!pomo){ clearInterval(pomoTimer); return; } const s=Math.max(0,Math.ceil((pomo.end-Date.now())/1000));

    <li><b>Mezcla tipos de ejercicios</b> en vez de repetir el mismo; así aprendes a elegir el método.</li>
    <li><b>Anota cada error</b> en el cuaderno de errores y vuelve a intentarlo días después.</li>
    <li><b>Duerme bien</b> la noche antes de una evaluación: el sueño consolida lo estudiado.</li></ul></details></div>`;
  return h;
}
function bindPlan(w){
  w.querySelectorAll('[data-day]').forEach(c=>c.onchange=()=>{ dayDone()[c.dataset.day]=c.checked; save(); const tx=c.nextElementSibling; tx.style.textDecoration=c.checked?'line-through':''; tx.style.opacity=c.checked?.6:1; });
  w.querySelectorAll('[data-prac2]').forEach(a=>a.onclick=e=>{ e.preventDefault(); goPractice(a.dataset.prac2); });
  w.querySelectorAll('[data-exam2]').forEach(a=>a.onclick=e=>{ e.preventDefault(); startExam(a.dataset.exam2); });
  w.querySelectorAll('[data-go2]').forEach(a=>a.onclick=e=>{ e.preventDefault(); document.querySelector(`nav button[data-v="${a.dataset.go2}"]`).click(); });
  if(w.querySelector('#pomoGo')) w.querySelector('#pomoGo').onclick=()=>{ startPomo(); renderStudy(); };
  if(w.querySelector('#pomoStop')) w.querySelector('#pomoStop').onclick=()=>{ pomo=null; clearInterval(pomoTimer); renderStudy(); };
  if(pomo) tickPomo();
}
function examCard(){
  const opts = examTopics().map(n=>`<option value="${esc(n.id)}" ${n.week===curWeek()?'selected':''}>${esc(n.id+' · '+n.title)}${isDom(n.id)?' ✓':''}</option>`).join('');
  return `<div class="card"><h2>⏱ Modo examen</h2><p class="muted" style="margin-top:0">10 ejercicios con tiempo y sin pistas, como el criterio de dominio (8/10 sin apuntes). El simulacro mezcla 15 ejercicios de todo el plan.</p>
    <select id="exTopic">${opts}<option value="SIM">Simulacro final · 15 ejercicios de todo</option></select>
    <div class="row" style="margin-top:8px;align-items:center"><label class="f" style="margin:0;flex:0 0 auto">Minutos (opcional)</label><input type="number" id="exMin" min="1" max="180" placeholder="auto" inputmode="numeric"></div>
    <button class="btn pri" id="exGo" style="margin-top:10px;width:100%">Empezar examen</button></div>`;
}
function errorCard(){
  const due=errorsDue(), pend=errs().filter(e=>!e.fixed), fixed=errs().filter(e=>e.fixed).length, B=byId();
  let h=`<div class="card"><h2>📒 Cuaderno de errores</h2><p class="muted" style="margin-top:0">Los ejercicios que fallas vuelven a aparecer hasta que los resuelvas bien. ${pend.length} pendiente${pend.length===1?'':'s'} · ${fixed} superado${fixed===1?'':'s'}.</p>`;
  if(due.length) h += due.slice(0,5).map(e=>`<div class="nitem" style="flex-direction:column;align-items:stretch;margin-bottom:8px"><div><b style="color:${B[e.topic]?col(B[e.topic]):'var(--tx2)'}">${esc(e.topic||'—')}</b> ${esc(e.q)}</div>
     <div class="goal" id="ea-${e.id}" style="display:none;margin-top:6px">${esc(e.a||'(sin respuesta guardada)')}</div>
     <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn sm" data-eshow="${e.id}">Ver respuesta</button><button class="btn sm pri" data-eok="${e.id}">✓ Ya me sale</button><button class="btn sm" data-ebad="${e.id}">✗ Aún no</button></div></div>`).join('') + (due.length>5?`<div class="muted">y ${due.length-5} más…</div>`:'');
  else h += `<div class="muted">${pend.length?'Nada que reintentar hoy. Los próximos vuelven en unos días.':'Aún no hay errores guardados. En Practicar y en Modo examen, marca ✗ cuando falles.'}</div>`;
  h += `<details style="margin-top:10px"><summary class="muted">+ Anotar un error a mano</summary><div style="margin-top:8px"><select id="eTopic">${S.nodes.filter(n=>n.phase!=='U').map(n=>`<option value="${esc(n.id)}">${esc(n.id+' · '+n.title)}</option>`).join('')}</select>
    <input type="text" id="eQ" placeholder="Ejercicio o duda" style="margin-top:6px"><input type="text" id="eA" placeholder="Respuesta correcta (opcional)" style="margin-top:6px"><button class="btn sm pri" id="eAdd" style="margin-top:6px">Guardar en el cuaderno</button></div></details></div>`;
  return h;
}
function bindErrors(w){
  w.querySelectorAll('[data-eshow]').forEach(b=>b.onclick=()=>{ const el=w.querySelector('#ea-'+b.dataset.eshow); el.style.display=el.style.display==='none'?'block':'none'; });
  w.querySelectorAll('[data-eok]').forEach(b=>b.onclick=()=>errorRetry(b.dataset.eok,true));
  w.querySelectorAll('[data-ebad]').forEach(b=>b.onclick=()=>errorRetry(b.dataset.ebad,false));
  const add=w.querySelector('#eAdd'); if(add) add.onclick=()=>{ const q=w.querySelector('#eQ').value.trim(); if(!q){ toast('Escribe el ejercicio'); return; } addError(w.querySelector('#eTopic').value, q, w.querySelector('#eA').value.trim()); toast('Guardado en el cuaderno'); renderStudy(); };
  const go=w.querySelector('#exGo'); if(go) go.onclick=()=>startExam(w.querySelector('#exTopic').value);
}

/* ===================== General ===================== */
let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
let curView='vTree';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  curView=b.dataset.v; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===curView));
  renderCurrent();
});
function renderCurrent(){ if(curView==='vStudy') renderStudy(); else if(curView==='vProg') renderProgress(); else if(curView==='vEval') renderEvals(); else if(curView==='vEdit') renderEditor(); }
function refreshAll(){ renderHeader(); renderTree(); renderCurrent(); }
let firstFit=false;
window.addEventListener('resize', ()=>{ if(!firstFit){ fitView(); } });
meta(); save(); autoSnapshot();
renderHeader(); renderTree(); try{ if(localStorage.getItem('arbolAli.app')==='malla') showApp('malla'); }catch(e){}
setTimeout(backupCheck, 1200);
requestAnimationFrame(()=>{ fitView(); firstFit = !!svg.getBoundingClientRect().width; });
</script>
