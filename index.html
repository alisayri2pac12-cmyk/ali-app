    g:()=>{ const a=rnd(1,5), b=rnd(1,9); return {q:`Factoriza: ${poly([a*a,0,-b*b])}`,a:`(${bin(a,b)})(${bin(a,-b)})`,st:[`Diferencia de cuadrados: ${terms([[a*a,'x²']])} = (${a===1?'':a}x)² y ${b*b} = ${b}²`,`(${bin(a,b)})(${bin(a,-b)})`]}; }},
   {t:'Trinomio x² + bx + c',x:['Busca dos números que multiplicados den c y sumados den b. Entonces x² + bx + c = (x + m)(x + n).','Por qué: (x + m)(x + n) = x² + (m + n)x + mn.'],ej:['x² − x − 12','−4 y 3: (x − 4)(x + 3)'],
    g:()=>{ let p,q; do{ p=nz(-9,9); q=nz(-9,9); }while(p+q===0); return {q:`Factoriza: ${poly([1,p+q,p*q])}`,a:`(${lin(p)})(${lin(q)})`,st:[`Dos números que multiplican ${num(p*q)} y suman ${num(p+q)}: ${num(p)} y ${num(q)}`,`(${lin(p)})(${lin(q)})`]}; }},
   {t:'Trinomio ax² + bx + c (aspa)',x:['Con a ≠ 1: descompón ax² en dos factores y c en otros dos, colócalos en aspa y comprueba que los productos cruzados sumen bx.','Ejemplo: 2x² + 7x + 3 = (2x + 1)(x + 3), porque 2x·3 + 1·x = 7x.'],ej:['3x² − 10x − 8','(3x + 2)(x − 4)'],
    g:()=>{ let a1,a2,p,q; do{ a1=rnd(2,3); a2=rnd(1,2); p=nz(-6,6); q=nz(-6,6); }while(gcd(a1,p)!==1||gcd(a2,q)!==1||a1*q+a2*p===0); return {q:`Factoriza: ${poly([a1*a2,a1*q+a2*p,p*q])}`,a:`(${bin(a1,p)})(${bin(a2,q)})`,st:[`Descompón: ${terms([[a1*a2,'x²']])} = (${a1}x)(${a2===1?'':a2}x) ; ${num(p*q)} = (${num(p)})(${num(q)})`,`Aspa: ${a1}x·${pr(q)} + ${pr(p)}·${a2===1?'':a2}x = ${terms([[a1*q+a2*p,'x']])} ✓`,`(${bin(a1,p)})(${bin(a2,q)})`]}; }},
   {t:'Factorizar completamente',x:['Primero el factor común; después revisa si lo que queda se puede factorizar otra vez (diferencia de cuadrados o trinomio).','Una factorización está completa cuando ningún paréntesis se puede descomponer más.'],ej:['3x² − 27','3(x² − 9) = 3(x + 3)(x − 3)'],
    g:()=>{ const k=rnd(2,5), b=rnd(1,7); return {q:`Factoriza completamente: ${poly([k,0,-k*b*b])}`,a:`${k}(x + ${b})(x − ${b})`,st:[`Factor común ${k}: ${k}(x² − ${b*b})`,`Diferencia de cuadrados: ${k}(x + ${b})(x − ${b})`]}; }}],
  X1:[
   {t:'Ordenar y completar coeficientes',x:['Para dividir polinomios, escríbelos ordenados de mayor a menor grado. Si falta un grado, su coeficiente es 0.','Ejemplo: x³ − 4x + 1 tiene coeficientes 1, 0, −4, 1 (falta x²).'],ej:['2x³ + 5 ','2, 0, 0, 5'],
    g:()=>{ const c=[rnd(1,4),pick([0,nz(-5,5)]),pick([0,nz(-6,6)]),nz(-9,9)]; if(c[1]&&c[2]) c[pick([1,2])]=0; return {q:`Escribe los coeficientes de ${poly(c)}, completando con 0 los grados que faltan`,a:c.map(num).join(', '),st:['Ordena de x³ hasta el término independiente',`Coeficientes: ${c.map(num).join(', ')}`]}; }},
   {t:'Teorema del resto',x:['El residuo de dividir P(x) entre (x − r) es P(r). No hace falta dividir: solo reemplaza.','Ojo: para (x + 2), r = −2, porque x + 2 = x − (−2).'],ej:['Residuo de x² + 3x − 1 entre (x − 2)','P(2) = 4 + 6 − 1 = 9'],
    g:()=>{ const c=[1,nz(-5,5),nz(-9,9)], r=nz(-4,4), R=c[0]*r*r+c[1]*r+c[2]; return {q:`Halla el residuo de (${poly(c)}) entre (x ${r<0?'+':'−'} ${Math.abs(r)}) sin dividir`,a:num(R),st:[`Teorema del resto: r = ${num(r)}`,`P(${num(r)}) = ${num(R)}`]}; }},
   {t:'Ruffini',x:['Ruffini divide entre (x − r). Baja el primer coeficiente; multiplícalo por r y súmalo al siguiente; repite hasta el final.','Los números obtenidos son los coeficientes del cociente (un grado menos) y el último es el residuo.'],ej:['(x³ − 2x² − 5x + 6) ÷ (x − 1)','1 | −1 | −6 | 0 → cociente x² − x − 6, residuo 0'],
    g:()=>{ const c=[rnd(1,3),nz(-6,6),nz(-6,6),nz(-9,9)], r=nz(-3,3); const q=[c[0]]; for(let i=1;i<4;i++) q.push(c[i]+q[i-1]*r); const R=q.pop(); return {q:`Divide con Ruffini: (${poly(c)}) ÷ (x ${r<0?'+':'−'} ${Math.abs(r)})`,a:`Cociente: ${poly(q)} · Residuo: ${num(R)}`,st:[`Ruffini con r = ${num(r)} y coeficientes ${c.map(num).join(', ')}`,`Fila de abajo: ${q.map(num).join(', ')} | ${num(R)}`]}; }},
   {t:'Teorema del factor',x:['(x − r) es factor de P(x) exactamente cuando P(r) = 0 (el residuo es 0).','Las raíces enteras posibles son divisores del término independiente: así sabes qué valores de r probar.'],ej:['¿(x − 2) es factor de x³ − 8?','P(2) = 8 − 8 = 0 → sí'],
    g:()=>{ const r=nz(-3,3), yes=Math.random()<0.5; const b=nz(-4,4), c=nz(-6,6); let d=-(r**3+b*r*r+c*r); if(!yes) d+=nz(-3,3); const v=r**3+b*r*r+c*r+d; return {q:`¿Es (x ${r<0?'+':'−'} ${Math.abs(r)}) un factor de ${poly([1,b,c,d])}?`,a:v===0?`Sí: P(${num(r)}) = 0`:`No: P(${num(r)}) = ${num(v)}`,st:[`Reemplaza x = ${num(r)}`,`P(${num(r)}) = ${num(v)}`]}; }}],
  T7:[
   {t:'La idea de la balanza',x:['Una ecuación es una balanza en equilibrio: si haces lo mismo en los dos lados, sigue en equilibrio.','Para despejar x deshaces lo que le hicieron: si le suman 5, restas 5 en ambos lados.'],ej:['x + 7 = 3','x = 3 − 7 = −4'],
    g:()=>{ const a=nz(-12,12), x=rnd(-12,12); return {q:`Resuelve: x ${a<0?'−':'+'} ${Math.abs(a)} = ${num(x+a)}`,a:`x = ${num(x)}`,st:[`Pasa el ${num(a)} al otro lado con la operación contraria`,`x = ${num(x+a)} ${a<0?'+':'−'} ${Math.abs(a)} = ${num(x)}`]}; }},
   {t:'Despejar con multiplicación',x:['Si x está multiplicada, divide ambos lados entre ese número. Primero se quitan sumas y restas, después multiplicaciones.','Ejemplo: 3x − 4 = 11 → 3x = 15 → x = 5.'],ej:['−2x + 5 = 13','−2x = 8 → x = −4'],
    g:()=>{ const a=nz(-6,6), b=nz(-10,10), x=rnd(-9,9); return {q:`Resuelve: ${terms([[a,'x'],[b,'']])} = ${num(a*x+b)}`,a:`x = ${num(x)}`,st:[`Pasa el ${num(b)}: ${terms([[a,'x']])} = ${num(a*x)}`,`Divide entre ${num(a)}: x = ${num(x)}`]}; }},
   {t:'x en los dos lados',x:['Agrupa las x en un lado y los números en el otro, siempre con la operación contraria.','Ejemplo: 5x − 7 = 2x + 8 → 3x = 15 → x = 5.'],ej:['4x + 1 = x − 8','3x = −9 → x = −3'],
    g:()=>{ let a,c; do{ a=nz(-7,7); c=nz(-7,7); }while(a===c); const x=rnd(-8,8), b=nz(-9,9), d=(a-c)*x+b; return {q:`Resuelve: ${terms([[a,'x'],[b,'']])} = ${terms([[c,'x'],[d,'']])}`,a:`x = ${num(x)}`,st:[`Agrupa las x a la izquierda y los números a la derecha: ${terms([[a-c,'x']])} = ${num(d-b)}`,`Divide entre ${num(a-c)}: x = ${num(x)}`]}; }},
   {t:'Con paréntesis',x:['Primero distribuye para quitar los paréntesis. Cuidado si hay un signo menos delante: cambia todos los signos de adentro.','Después resuelve como antes.'],ej:['3(x − 2) = 2x + 1','3x − 6 = 2x + 1 → x = 7'],
    g:()=>{ const a=rnd(2,6), b=nz(-6,6), x=rnd(-6,8); let c; do c=nz(-4,4); while(a===c); const d=a*(x+b)-c*x; return {q:`Resuelve: ${a}(${lin(b)}) = ${terms([[c,'x'],[d,'']])}`,a:`x = ${num(x)}`,st:[`Distribuye: ${terms([[a,'x'],[a*b,'']])} = ${terms([[c,'x'],[d,'']])}`,`Agrupa: ${terms([[a-c,'x']])} = ${num(d-a*b)}`,`x = ${num(x)}`]}; }},
   {t:'Con fracciones',x:['Multiplica todos los términos, de los dos lados, por el MCM de los denominadores. Así desaparecen las fracciones.','Ejemplo: x/2 + x/3 = 10 → por 6: 3x + 2x = 60 → x = 12.'],ej:['x/4 − x/6 = 1','Por 12: 3x − 2x = 12 → x = 12'],
    g:()=>{ let p,q; do{ p=rnd(2,6); q=rnd(2,6); }while(p===q); const m=lcm(p,q), x=m*nz(-4,4); return {q:`Resuelve: x/${p} + x/${q} = ${fs(Fr(x*(p+q),p*q))}`,a:`x = ${num(x)}`,st:[`Multiplica todo por el MCM = ${p*q/gcd(p,q)}`,`${m/p}x + ${m/q}x = ${fs(fmul(Fr(x*(p+q),p*q),Fr(m)))}`,`x = ${num(x)}`]}; }}],
  T8:[
   {t:'Valores prohibidos',x:['Una fracción algebraica no existe donde su denominador vale 0. Esos valores de x están prohibidos.','Se hallan igualando el denominador a 0. Se anotan siempre, incluso si después se cancela el factor.'],ej:['5/(x − 4)','x − 4 = 0 → x = 4 está prohibido'],
    g:()=>{ const a=nz(-9,9), k=nz(-7,7); return {q:`¿Para qué valor de x no está definida ${num(k)}/(${lin(-a)})?`,a:`x = ${num(a)}`,st:['El denominador no puede ser 0',`${lin(-a)} = 0 → x = ${num(a)}`]}; }},
   {t:'Simplificar factorizando',x:['Factoriza arriba y abajo y cancela los factores iguales. Solo se cancelan factores (lo que multiplica a todo), nunca términos sueltos.','(x² − 9)/(x + 3) = (x + 3)(x − 3)/(x + 3) = x − 3.'],ej:['(x² − 16)/(x − 4)','x + 4'],
    g:()=>pick([()=>{ const a=rnd(1,9), s=pick([1,-1]); return {q:`Simplifica: (x² − ${a*a})/(${lin(s*a)})`,a:lin(-s*a),st:[`Diferencia de cuadrados: (x + ${a})(x − ${a})`,`Cancela (${lin(s*a)}): ${lin(-s*a)}`]}; },()=>{ const k=rnd(2,7), b=rnd(1,8); return {q:`Simplifica: (${k}x + ${k*b})/(x² − ${b*b})`,a:`${k}/(x − ${b})`,st:[`Numerador: factor común → ${k}(x + ${b})`,`Denominador: diferencia de cuadrados → (x + ${b})(x − ${b})`,`Cancela (x + ${b}): ${k}/(x − ${b})`]}; }])() },
   {t:'Multiplicar fracciones algebraicas',x:['Factoriza todo, multiplica y cancela lo que se repite arriba y abajo.','Es igual que con números: (2/3)·(3/5) = 2/5 porque el 3 se cancela.'],ej:['(x² − 4)/(x + 1) · (x + 1)/(x − 2)','x + 2'],
    g:()=>{ const a=rnd(1,8); let b; do b=nz(-8,8); while(b===a||b===-a); return {q:`Multiplica y simplifica: (x² − ${a*a})/(${lin(b)}) · (${lin(b)})/(x − ${a})`,a:`x + ${a}`,st:[`Factoriza: x² − ${a*a} = (x + ${a})(x − ${a})`,`Cancela (${lin(b)}) y (x − ${a})`,`x + ${a}`]}; }},
   {t:'Sumar fracciones algebraicas',x:['Con el mismo denominador, se suman los numeradores.','Con denominadores distintos, usa como denominador común el producto (o el MCM) y ajusta cada numerador.'],ej:['3/(x − 1) + 2/(x − 1) ; 1/x + 1/(x + 2)','5/(x − 1) ; (2x + 2)/(x(x + 2))'],
    g:()=>{ const p=nz(-6,6), a=nz(-5,5), b=nz(-5,5); return {q:`Suma: ${num(a)}/(${lin(-p)}) ${b<0?'−':'+'} ${Math.abs(b)}/(${lin(-p)})`,a:a+b===0?'0':`${num(a+b)}/(${lin(-p)})`,st:['Mismo denominador: suma los numeradores',`${num(a)} + ${pr(b)} = ${num(a+b)}`]}; }},
   {t:'Ecuaciones racionales',x:['Anota los valores prohibidos, multiplica todo por el denominador común y resuelve.','Si una solución es un valor prohibido, se descarta.'],ej:['6/x + 1 = 4','6 + x = 4x → x = 2'],
    g:()=>{ const x=nz(-6,6), b=nz(-4,4), a=nz(-9,9), c=a+b*x; return {q:`Resuelve: ${num(a)}/x ${b<0?'−':'+'} ${Math.abs(b)} = ${num(c)}/x`,a:`x = ${num(x)}`,st:['Restricción: x ≠ 0',`Multiplica todo por x: ${num(a)} ${b<0?'−':'+'} ${Math.abs(b)}x = ${num(c)}`,`${terms([[b,'x']])} = ${num(c-a)} → x = ${num(x)}`]}; }}],
  T9:[
   {t:'Producto cero',x:['Si a·b = 0, entonces a = 0 o b = 0. Es la idea clave para resolver cuadráticas factorizadas.','(x − 2)(x + 5) = 0 → x = 2 o x = −5.'],ej:['(x + 1)(x − 6) = 0','x = −1 o x = 6'],
    g:()=>{ let p,q; do{ p=nz(-9,9); q=nz(-9,9); }while(p===q); return {q:`Resuelve: (${lin(-p)})(${lin(-q)}) = 0`,a:P2(p,q),st:['Producto cero: cada factor puede valer 0',`${lin(-p)} = 0 → x = ${num(p)} ; ${lin(-q)} = 0 → x = ${num(q)}`]}; }},
   {t:'Sin término en x',x:['ax² + c = 0: despeja x² y saca raíz cuadrada con ±, porque tanto k como −k al cuadrado dan k².','Si x² queda igual a un negativo, no hay solución real.'],ej:['2x² − 50 = 0','x² = 25 → x = 5 o x = −5'],
    g:()=>{ const a=rnd(1,4), k=rnd(1,9); return {q:`Resuelve: ${poly([a,0,-a*k*k])} = 0`,a:P2(k,-k),st:[`Despeja x²: x² = ${k*k}`,`Saca raíz cuadrada con ±: x = ±${k}`]}; }},
   {t:'Sin término independiente',x:['ax² + bx = 0: saca x como factor común y usa producto cero. Una solución siempre es x = 0.','No dividas entre x: perderías la solución x = 0.'],ej:['3x² − 12x = 0','3x(x − 4) = 0 → x = 0 o x = 4'],
    g:()=>{ const a=rnd(1,4), r=nz(-8,8); return {q:`Resuelve: ${poly([a,-a*r,0])} = 0`,a:P2(0,r),st:[`Factor común: ${a===1?'':a}x(${lin(-r)}) = 0`,`Producto cero: x = 0 o x = ${num(r)}`]}; }},
   {t:'Factorizando el trinomio',x:['Deja todo igualado a 0, factoriza (dos números que multiplican c y suman b) y usa producto cero.','x² − 5x + 6 = 0 → (x − 2)(x − 3) = 0 → x = 2 o x = 3.'],ej:['x² + 2x − 15 = 0','(x + 5)(x − 3) = 0 → x = −5 o x = 3'],
    g:()=>{ let p,q; do{ p=nz(-9,9); q=nz(-9,9); }while(p===q); return {q:`Resuelve: ${poly([1,-(p+q),p*q])} = 0`,a:P2(p,q),st:[`Factoriza: (${lin(-p)})(${lin(-q)}) = 0`,`Producto cero: x = ${num(p)} o x = ${num(q)}`]}; }},
   {t:'El discriminante',x:['En ax² + bx + c = 0, Δ = b² − 4ac dice cuántas soluciones reales hay: Δ > 0 dos, Δ = 0 una, Δ < 0 ninguna.','Δ es lo que va dentro de la raíz en la fórmula general; por eso su signo decide.'],ej:['x² + 4x + 5 = 0','Δ = 16 − 20 = −4 < 0 → ninguna'],
    g:()=>{ const b=nz(-8,8), c=rnd(-9,12), D=b*b-4*c; return {q:`¿Cuántas soluciones reales tiene ${poly([1,b,c])} = 0? (usa el discriminante)`,a:String(D>0?2:D===0?1:0),st:[`Δ = ${pr(b)}² − 4·1·${pr(c)} = ${num(D)}`,D>0?'Δ > 0: dos soluciones':D===0?'Δ = 0: una solución':'Δ < 0: ninguna solución real']}; }},
   {t:'Fórmula general',x:['x = (−b ± √(b² − 4ac)) / (2a). Sirve siempre, aunque no puedas factorizar.','Pasos: identifica a, b y c con sus signos, calcula Δ, saca su raíz y haz las dos cuentas (con + y con −).'],ej:['2x² − 3x − 2 = 0','Δ = 25 → x = (3 ± 5)/4 → x = 2 o x = −1/2'],
    g:()=>{ let a,r,p; do{ a=pick([2,3]); r=nz(-7,7); p=nz(-5,5); }while(gcd(a,r)!==1||Fr(r,a).n===p*Fr(r,a).d); const A=a, B=-(a*p+r), Cc=r*p, D=B*B-4*A*Cc; return {q:`Resuelve con la fórmula general: ${poly([A,B,Cc])} = 0`,a:`x = ${num(p)} o x = ${fs(Fr(r,a))}`,st:[`a = ${A}, b = ${num(B)}, c = ${num(Cc)}`,`Δ = ${num(D)} → √Δ = ${Math.sqrt(D)}`,`x = (${num(-B)} ± ${Math.sqrt(D)})/${2*A}`,`x = ${num(p)} o x = ${fs(Fr(r,a))}`]}; }}],
  T10:[
   {t:'Qué es la solución de un sistema',x:['Un sistema son dos ecuaciones a la vez. Su solución es el par (x, y) que cumple las DOS.','Gráficamente es el punto donde se cortan las dos rectas.'],ej:['¿(2, 1) cumple x + y = 3 y x − y = 1?','2 + 1 = 3 ✓ y 2 − 1 = 1 ✓ → sí'],
    g:()=>{ const x=rnd(-5,5), y=rnd(-5,5), a=nz(-3,3), b=nz(-3,3), c=nz(-3,3), d=nz(-3,3), ok=Math.random()<0.5, e2=c*x+d*y+(ok?0:nz(-3,3)); return {q:`¿El punto (${num(x)}, ${num(y)}) es solución de ${terms([[a,'x'],[b,'y']])} = ${num(a*x+b*y)} ;  ${terms([[c,'x'],[d,'y']])} = ${num(e2)}? (responde sí o no)`,a:ok?'Sí':'No',st:[`Primera: ${num(a*x+b*y)} ✓`,`Segunda: ${terms([[c,'x'],[d,'y']])} vale ${num(c*x+d*y)} ${ok?'✓':'≠ '+num(e2)}`]}; }},
   {t:'Sustitución',x:['Si una variable ya está despejada (por ejemplo y = 2x + 1), reemplázala en la otra ecuación. Te queda una ecuación con una sola incógnita.','Con x hallada, vuelve a la ecuación despejada para hallar y.'],ej:['y = 2x ; x + y = 9','x + 2x = 9 → x = 3 ; y = 6'],
    g:()=>{ const x=rnd(-5,5), y=rnd(-5,5), m=nz(-3,3), b=y-m*x; let a,c; do{ a=nz(-4,4); c=nz(-4,4); }while(a+c*m===0); return {q:`Resuelve: y = ${terms([[m,'x'],[b,'']])} ;  ${terms([[a,'x'],[c,'y']])} = ${num(a*x+c*y)}`,a:`x = ${num(x)}, y = ${num(y)}`,st:['Sustituye y en la segunda ecuación',`${terms([[a+c*m,'x']])} = ${num(a*x+c*y-c*b)} → x = ${num(x)}`,`y = ${num(y)}`]}; }},
   {t:'Reducción (sumando ecuaciones)',x:['Si una variable tiene coeficientes opuestos (como +y y −y), suma las ecuaciones: esa variable desaparece.','Sumar ecuaciones es válido porque sumas cantidades iguales a ambos lados.'],ej:['x + y = 10 ; x − y = 4','2x = 14 → x = 7 ; y = 3'],
    g:()=>{ const x=rnd(-6,6), y=rnd(-6,6), a=nz(-4,4), c=nz(-4,4), b=rnd(1,4); return a+c===0?{q:`Resuelve: ${terms([[1,'x'],[1,'y']])} = ${num(x+y)} ;  ${terms([[1,'x'],[-1,'y']])} = ${num(x-y)}`,a:`x = ${num(x)}, y = ${num(y)}`,st:['Suma las ecuaciones: se cancela y',`2x = ${num(2*x)} → x = ${num(x)}`,`y = ${num(y)}`]}:{q:`Resuelve: ${terms([[a,'x'],[b,'y']])} = ${num(a*x+b*y)} ;  ${terms([[c,'x'],[-b,'y']])} = ${num(c*x-b*y)}`,a:`x = ${num(x)}, y = ${num(y)}`,st:['Suma las ecuaciones: se cancela y',`${terms([[a+c,'x']])} = ${num((a+c)*x)} → x = ${num(x)}`,`Reemplaza: y = ${num(y)}`]}; }},
   {t:'Reducción multiplicando',x:['Si ninguna variable se cancela directamente, multiplica una (o las dos) ecuaciones para que una variable tenga coeficientes opuestos.','Ejemplo: 2x + 3y = 8 y x + y = 3 → multiplica la segunda por −2.'],ej:['2x + 3y = 8 ; x + y = 3','−2x − 2y = −6 → sumando: y = 2 ; x = 1'],
    g:()=>{ let a,b,c,d; do{ a=nz(-5,5); b=nz(-5,5); c=nz(-5,5); d=nz(-5,5); }while(a*d-b*c===0||Math.abs(a)===Math.abs(c)||Math.abs(b)===Math.abs(d)); const x=rnd(-5,5), y=rnd(-5,5); return {q:`Resuelve: ${terms([[a,'x'],[b,'y']])} = ${num(a*x+b*y)} ;  ${terms([[c,'x'],[d,'y']])} = ${num(c*x+d*y)}`,a:`x = ${num(x)}, y = ${num(y)}`,st:[`Multiplica la primera por ${num(d)} y la segunda por ${num(-b)}: se cancela y`,`${terms([[a*d-b*c,'x']])} = ${num((a*d-b*c)*x)} → x = ${num(x)}`,`Reemplaza: y = ${num(y)}`]}; }},
   {t:'Problemas con sistemas',x:['Usa una letra por cada cosa desconocida y escribe una ecuación por cada dato del enunciado.','Ejemplo: “dos números suman 20 y su diferencia es 6” → x + y = 20 ; x − y = 6.'],ej:['Suman 20 y se diferencian en 6','x = 13, y = 7'],
    g:()=>{ const a=rnd(5,40), b=rnd(1,a-1); return {q:`Dos números suman ${a+b} y su diferencia es ${a-b}. ¿Cuáles son?`,a:`${a} y ${b}`,st:[`x + y = ${a+b} ; x − y = ${a-b}`,`Suma: 2x = ${2*a} → x = ${a}`,`y = ${b}`]}; }}],
  T11:[
   {t:'Desigualdades e intervalos',x:['x > 3 son todos los números mayores que 3. En intervalo: (3, +∞). El paréntesis indica que el 3 no se incluye.','Con ≤ o ≥ el extremo sí se incluye y se usa corchete: x ≤ 2 → (−∞, 2]. En ∞ siempre va paréntesis.'],ej:['x ≥ −1 ; x < 4','[−1, +∞) ; (−∞, 4)'],
    g:()=>{ const a=nz(-9,9), op=pick(['>','≥','<','≤']); const ans=op==='>'?iv(a,Infinity,0,0):op==='≥'?iv(a,Infinity,1,0):op==='<'?iv(-Infinity,a,0,0):iv(-Infinity,a,0,1); return {q:`Escribe x ${op} ${num(a)} como intervalo`,a:ans,st:[`${op==='≥'||op==='≤'?'Incluye el extremo: corchete':'No incluye el extremo: paréntesis'}`,ans]}; }},
   {t:'Inecuación lineal',x:['Se resuelve como una ecuación: x a un lado y números al otro.','Mientras multipliques o dividas por positivos, el signo de la desigualdad no cambia.'],ej:['2x + 1 > 7','2x > 6 → x > 3 → (3, +∞)'],
    g:()=>{ const a=rnd(2,6), b=nz(-9,9), x0=rnd(-6,6), op=pick(['>','≥','<','≤']); const inc=op==='≥'||op==='≤', up=op==='>'||op==='≥'; return {q:`Resuelve: ${terms([[a,'x'],[b,'']])} ${op} ${num(a*x0+b)}`,a:`x ∈ ${up?iv(x0,Infinity,inc,0):iv(-Infinity,x0,0,inc)}`,st:[`Pasa el ${num(b)}: ${a}x ${op} ${num(a*x0)}`,`Divide entre ${a} (positivo, el signo se mantiene): x ${op} ${num(x0)}`]}; }},
   {t:'Dividir entre un negativo',x:['Si multiplicas o divides entre un número negativo, la desigualdad se invierte: 2 < 3, pero −2 > −3.','Es el error más común de este tema.'],ej:['−3x ≤ 12','x ≥ −4 → [−4, +∞)'],
    g:()=>{ const a=-rnd(2,6), b=nz(-9,9), x0=rnd(-6,6), op=pick(['>','≥','<','≤']); const inv={'>':'<','≥':'≤','<':'>','≤':'≥'}[op], inc=op==='≥'||op==='≤', up=inv==='>'||inv==='≥'; return {q:`Resuelve: ${terms([[a,'x'],[b,'']])} ${op} ${num(a*x0+b)}`,a:`x ∈ ${up?iv(x0,Infinity,inc,0):iv(-Infinity,x0,0,inc)}`,st:[`Pasa el ${num(b)}: ${num(a)}x ${op} ${num(a*x0)}`,`Divide entre ${num(a)}: se invierte el signo → x ${inv} ${num(x0)}`]}; }},
   {t:'Valor absoluto menor que',x:['|A| es la distancia de A al 0. |A| < k significa que A está a menos de k del 0: −k < A < k.','Se resuelve haciendo lo mismo en las tres partes.'],ej:['|x − 1| < 4','−4 < x − 1 < 4 → −3 < x < 5 → (−3, 5)'],
    g:()=>{ const h=nz(-6,6), k=rnd(1,7), le=Math.random()<0.5; return {q:`Resuelve: |${lin(-h)}| ${le?'≤':'<'} ${k}`,a:`x ∈ ${iv(h-k,h+k,le,le)}`,st:[`${num(-k)} ${le?'≤':'<'} ${lin(-h)} ${le?'≤':'<'} ${k}`,`${h>0?'Suma':'Resta'} ${Math.abs(h)} en las tres partes: ${num(h-k)} ${le?'≤':'<'} x ${le?'≤':'<'} ${num(h+k)}`]}; }},
   {t:'Valor absoluto mayor que',x:['|A| > k significa que A está a más de k del 0: A > k o A < −k. Son dos zonas separadas.','Se unen con ∪.'],ej:['|x| ≥ 3','x ≤ −3 o x ≥ 3 → (−∞, −3] ∪ [3, +∞)'],
    g:()=>{ const h=nz(-6,6), k=rnd(1,7), ge=Math.random()<0.5; return {q:`Resuelve: |${lin(-h)}| ${ge?'≥':'>'} ${k}`,a:`x ∈ ${iv(-Infinity,h-k,0,ge)} ∪ ${iv(h+k,Infinity,ge,0)}`,st:[`Separa: ${lin(-h)} ${ge?'≥':'>'} ${k} o ${lin(-h)} ${ge?'≤':'<'} ${num(-k)}`,`x ${ge?'≥':'>'} ${num(h+k)} o x ${ge?'≤':'<'} ${num(h-k)}`]}; }},
   {t:'Inecuación cuadrática',x:['Halla las raíces. Una parábola con a > 0 es negativa entre las raíces y positiva afuera.','< 0 → entre las raíces ; > 0 → afuera (unión de dos intervalos).'],ej:['x² − 4 < 0','raíces ±2 → (−2, 2)'],
    g:()=>{ let p,q; do{ p=nz(-7,7); q=nz(-7,7); }while(p>=q); const op=pick(['<','>']); return {q:`Resuelve: ${poly([1,-(p+q),p*q])} ${op} 0`,a:op==='<'?`x ∈ ${iv(p,q,0,0)}`:`x ∈ ${iv(-Infinity,p,0,0)} ∪ ${iv(q,Infinity,0,0)}`,st:[`Factoriza: (${lin(-p)})(${lin(-q)}) ${op} 0 → raíces ${num(p)} y ${num(q)}`,op==='<'?'Se pide < 0: entre las raíces':'Se pide > 0: afuera de las raíces']}; }}],
  T12:[
   {t:'Distancia entre dos puntos',x:['La distancia es la hipotenusa de un triángulo con catetos Δx y Δy: d = √((x₂ − x₁)² + (y₂ − y₁)²).','Es el teorema de Pitágoras en el plano.'],ej:['(1, 2) y (4, 6)','Δx = 3, Δy = 4 → d = 5'],
    g:()=>{ const [p,q,r]=pick(TR), sw=Math.random()<0.5, x1=rnd(-5,5), y1=rnd(-5,5), x2=x1+(sw?p:q)*pick([1,-1]), y2=y1+(sw?q:p)*pick([1,-1]); return {q:`Distancia entre (${num(x1)}, ${num(y1)}) y (${num(x2)}, ${num(y2)})`,a:`d = ${r}`,st:[`Δx = ${Math.abs(x2-x1)} ; Δy = ${Math.abs(y2-y1)}`,`Pitágoras: d = √(${(x2-x1)**2} + ${(y2-y1)**2}) = ${r}`]}; }},
   {t:'Punto medio',x:['El punto medio es el promedio de las coordenadas: M = ((x₁ + x₂)/2, (y₁ + y₂)/2).','Está a la misma distancia de los dos extremos.'],ej:['(2, 5) y (6, −1)','(4, 2)'],
    g:()=>{ const x1=rnd(-8,8), y1=rnd(-8,8), x2=x1+2*nz(-4,4), y2=y1+2*nz(-4,4); return {q:`Punto medio entre (${num(x1)}, ${num(y1)}) y (${num(x2)}, ${num(y2)})`,a:`(${num((x1+x2)/2)}, ${num((y1+y2)/2)})`,st:['Promedia las coordenadas',`x: (${num(x1)} + ${pr(x2)})/2 = ${num((x1+x2)/2)} ; y: (${num(y1)} + ${pr(y2)})/2 = ${num((y1+y2)/2)}`]}; }},
   {t:'Pendiente',x:['La pendiente m mide la inclinación: cuánto sube y por cada paso en x. m = (y₂ − y₁)/(x₂ − x₁).','m > 0 sube, m < 0 baja, m = 0 es horizontal.'],ej:['(1, 3) y (3, 7)','m = 4/2 = 2'],
    g:()=>{ const x1=rnd(-6,6), y1=rnd(-6,6); let dx; do dx=nz(-5,5); while(false); const dy=nz(-8,8), x2=x1+dx, y2=y1+dy; return {q:`Pendiente de la recta que pasa por (${num(x1)}, ${num(y1)}) y (${num(x2)}, ${num(y2)})`,a:`m = ${fs(Fr(dy,dx))}`,st:['m = (y₂ − y₁)/(x₂ − x₁)',`m = ${num(dy)}/${num(dx)} = ${fs(Fr(dy,dx))}`]}; }},
   {t:'Ecuación de la recta',x:['Con la pendiente m y un punto (x₁, y₁): y − y₁ = m(x − x₁). Luego despeja y para llegar a y = mx + b.','b es el corte con el eje y (el valor de y cuando x = 0).'],ej:['Pasa por (1, 2) y (3, 8)','m = 3 → y − 2 = 3(x − 1) → y = 3x − 1'],
    g:()=>{ const m=nz(-4,4), b=rnd(-6,6), x1=rnd(-4,4); let x2; do x2=rnd(-4,4); while(x2===x1); return {q:`Ecuación de la recta que pasa por (${num(x1)}, ${num(m*x1+b)}) y (${num(x2)}, ${num(m*x2+b)})`,a:`y = ${terms([[m,'x'],[b,'']])}`,st:[`m = ${num(m*(x2-x1))}/${num(x2-x1)} = ${num(m)}`,`Punto-pendiente con (${num(x1)}, ${num(m*x1+b)}) y despeja y`,`y = ${terms([[m,'x'],[b,'']])}`]}; }},
   {t:'Paralelas y perpendiculares',x:['Paralelas: misma pendiente. Perpendiculares: m₁·m₂ = −1, es decir, la pendiente se invierte y cambia de signo (2 → −1/2).','Con la nueva pendiente y el punto dado, usa punto-pendiente.'],ej:['Paralela a y = 2x + 1 por (1, 5)','m = 2 → y = 2x + 3'],
    g:()=>{ const m=nz(-3,3), b0=rnd(-5,5), par=Math.random()<0.5; if(par){ const x0=rnd(-4,4), y0=rnd(-6,6); return {q:`Recta paralela a y = ${terms([[m,'x'],[b0,'']])} que pasa por (${num(x0)}, ${num(y0)})`,a:`y = ${terms([[m,'x'],[y0-m*x0,'']])}`,st:[`Paralela: m = ${num(m)}`,`y − ${pr(y0)} = ${num(m)}(x − ${pr(x0)})`,`y = ${terms([[m,'x'],[y0-m*x0,'']])}`]}; }
      const x0=m*rnd(-2,2), y0=rnd(-5,5), M=Fr(-1,m), b=y0+x0/m; return {q:`Recta perpendicular a y = ${terms([[m,'x'],[b0,'']])} que pasa por (${num(x0)}, ${num(y0)})`,a:`y = ${M.d===1?terms([[M.n,'x']]):(M.n<0?'−':'')+`(${Math.abs(M.n)}/${M.d})x`}${shk(b)}`,st:[`Perpendicular: m = ${fs(M)}`,`y − ${pr(y0)} = ${fs(M)}(x − ${pr(x0)})`,`b = ${num(b)}`]}; }}],
  T13:[
   {t:'Qué es una función y cómo evaluarla',x:['Una función asigna a cada x un solo valor f(x). Evaluar es reemplazar x por el número, entre paréntesis.','Ojo: si f(x) = −x² y x = −3, f(−3) = −(−3)² = −9.'],ej:['f(x) = x² − 2x, f(−1)','1 + 2 = 3'],
    g:()=>{ const c=[pick([1,-1,2]),nz(-6,6),rnd(-9,9)], v=nz(-4,4); return {q:`Si f(x) = ${poly(c)}, calcula f(${num(v)})`,a:num(c[0]*v*v+c[1]*v+c[2]),st:[`Reemplaza x por ${pr(v)}`,`f(${num(v)}) = ${num(c[0]*v*v+c[1]*v+c[2])}`]}; }},
   {t:'Dominio con raíz cuadrada',x:['El dominio son los x permitidos. Una raíz cuadrada pide que lo de adentro sea ≥ 0.','√(x − 3): x − 3 ≥ 0 → x ≥ 3 → [3, +∞).'],ej:['√(5 − x)','5 − x ≥ 0 → x ≤ 5 → (−∞, 5]'],
    g:()=>{ const a=nz(-8,8), rev=Math.random()<0.4; return rev?{q:`Dominio de f(x) = √(${num(a)} − x)`,a:iv(-Infinity,a,0,1),st:[`${num(a)} − x ≥ 0`,`x ≤ ${num(a)}`]}:{q:`Dominio de f(x) = √(${lin(-a)})`,a:iv(a,Infinity,1,0),st:[`${lin(-a)} ≥ 0`,`x ≥ ${num(a)}`]}; }},
   {t:'Dominio con fracción',x:['Una fracción pide que el denominador no sea 0. Se quitan esos valores de ℝ.','5/(x − 2) → x ≠ 2 → ℝ − {2}.'],ej:['3/(x² − 9)','x ≠ 3 y x ≠ −3 → ℝ − {−3, 3}'],
    g:()=>{ const a=nz(-9,9), k=nz(-7,7); return {q:`Dominio de f(x) = ${num(k)}/(${lin(-a)})`,a:`ℝ − {${num(a)}}`,st:[`${lin(-a)} ≠ 0`,`x ≠ ${num(a)}`]}; }},
   {t:'Vértice de una parábola',x:['En f(x) = ax² + bx + c, el vértice está en x = −b/(2a), el eje de simetría. Su y es f(−b/(2a)).','Si a > 0 la parábola abre hacia arriba y el vértice es el punto más bajo.'],ej:['x² − 6x + 5','x = 3 ; f(3) = −4 → (3, −4)'],
    g:()=>{ const h=nz(-5,5), k=rnd(-8,8); return {q:`Vértice de f(x) = ${poly([1,-2*h,h*h+k])}`,a:`(${num(h)}, ${num(k)})`,st:[`x = −b/(2a) = ${num(2*h)}/2 = ${num(h)}`,`f(${num(h)}) = ${num(k)}`]}; }},
   {t:'Rango de una parábola',x:['El rango son los valores que toma f(x). Si a > 0, empieza en la y del vértice y sube: [k, +∞). Si a < 0, baja: (−∞, k].','Por eso, para el rango basta hallar el vértice y ver hacia dónde abre.'],ej:['x² − 4x + 1','V(2, −3), a > 0 → rango [−3, +∞)'],
    g:()=>{ const a=pick([1,-1,2,-2]), h=nz(-4,4), k=rnd(-8,8); return {q:`Vértice y rango de f(x) = ${poly([a,-2*a*h,a*h*h+k])}`,a:`(${num(h)}, ${num(k)}); rango ${a>0?iv(k,Infinity,1,0):iv(-Infinity,k,0,1)}`,st:[`x = −b/(2a) = ${num(h)} ; f(${num(h)}) = ${num(k)}`,`a = ${num(a)} ${a>0?'> 0: abre hacia arriba':'< 0: abre hacia abajo'}`]}; }}],
  X10:[
   {t:'Funciones a trozos',x:['Una función a trozos usa una fórmula distinta según dónde esté x. Para evaluar, primero mira qué condición cumple x.','f(x) = x² si x < 1 ; 3x − 1 si x ≥ 1 → f(−2) usa x² = 4 y f(3) usa 3·3 − 1 = 8.'],ej:['f(x) = 2x si x < 0 ; x + 5 si x ≥ 0 → f(−3)','−3 < 0 → 2(−3) = −6'],
    g:()=>{ const c=rnd(-2,2), m=nz(-3,3), b=rnd(-5,5), v=pick([c-2,c-1,c,c+1,c+3]), val=v<c?v*v:m*v+b; return {q:`f(x) = x² si x < ${num(c)} ;  ${terms([[m,'x'],[b,'']])} si x ≥ ${num(c)}. Calcula f(${num(v)})`,a:num(val),st:[`${num(v)} ${v<c?'<':'≥'} ${num(c)}: usa el ${v<c?'primer':'segundo'} trozo`,`f(${num(v)}) = ${num(val)}`]}; }},
   {t:'Traslaciones',x:['f(x − h) + k mueve la gráfica h a la derecha y k hacia arriba. Ojo: (x − 3) mueve a la DERECHA y (x + 3) a la izquierda.','Para la parábola y = x², el vértice (0, 0) pasa a (h, k).'],ej:['y = (x + 2)² − 3','vértice (−2, −3)'],
    g:()=>{ const h=nz(-5,5), k=nz(-6,6); return {q:`Vértice de f(x) = ${sh(h)}²${shk(k)}`,a:`(${num(h)}, ${num(k)})`,st:[`${h>0?`x − ${h}`:`x + ${-h}`} adentro: ${Math.abs(h)} a la ${h>0?'derecha':'izquierda'}`,`${num(k)} afuera: ${Math.abs(k)} hacia ${k>0?'arriba':'abajo'}`,`Vértice (${num(h)}, ${num(k)})`]}; }},
   {t:'Reflexiones',x:['−f(x) refleja la gráfica sobre el eje x (lo de arriba pasa abajo). f(−x) la refleja sobre el eje y.','y = −x² es la parábola y = x² abriendo hacia abajo.'],ej:['Refleja y = x² sobre el eje x y súbela 2','y = −x² + 2'],
    g:()=>{ const k=nz(-6,6); return {q:`Escribe la ecuación: toma y = x², reflejala sobre el eje x y ${k>0?'súbela':'bájala'} ${Math.abs(k)}`,a:`y = −x²${shk(k)}`,st:['Reflejo sobre el eje x: y = −x²',`${k>0?'Sube':'Baja'} ${Math.abs(k)}: y = −x²${shk(k)}`]}; }},
   {t:'Continuidad en las funciones a trozos',x:['Para que la gráfica no tenga salto, los dos trozos deben dar el mismo valor en la frontera.','Se reemplaza la frontera en ambas fórmulas y se igualan.'],ej:['x + 1 si x < 2 ; 2x + b si x ≥ 2','3 = 4 + b → b = −1'],
    g:()=>{ const c=nz(-3,3), a=nz(-5,5), m=pick([-3,-2,-1,2,3]); const b=c+a-m*c; return {q:`f(x) = x ${a<0?'−':'+'} ${Math.abs(a)} si x < ${num(c)} ;  ${terms([[m,'x']])} + b si x ≥ ${num(c)}. ¿Qué valor de b la hace continua?`,a:`b = ${num(b)}`,st:[`Los dos trozos deben valer lo mismo en x = ${num(c)}`,`${num(c+a)} = ${num(m*c)} + b → b = ${num(b)}`]}; }}],
  T14:[
   {t:'Ecuación de la circunferencia',x:['Todos los puntos a distancia r del centro (h, k) cumplen (x − h)² + (y − k)² = r². Sale de la fórmula de distancia.','Ojo con los signos: centro (−2, 3) da (x + 2)² + (y − 3)².'],ej:['Centro (1, −2), radio 3','(x − 1)² + (y + 2)² = 9'],
    g:()=>{ const h=nz(-6,6), k=nz(-6,6), r=rnd(1,7); return {q:`Ecuación de la circunferencia con centro (${num(h)}, ${num(k)}) y radio ${r}`,a:`${sh(h)}² + ${sh(k,'y')}² = ${r*r}`,st:['(x − h)² + (y − k)² = r²',`${sh(h)}² + ${sh(k,'y')}² = ${r*r}`]}; }},
   {t:'Leer el centro y el radio',x:['De (x − h)² + (y − k)² = R se lee el centro (h, k) cambiando los signos, y el radio es √R.','(x + 4)² + (y − 1)² = 25 → centro (−4, 1), radio 5.'],ej:['(x − 2)² + (y + 5)² = 49','Centro (2, −5); radio 7'],
    g:()=>{ const h=nz(-6,6), k=nz(-6,6), r=rnd(1,9); return {q:`Centro y radio de ${sh(h)}² + ${sh(k,'y')}² = ${r*r}`,a:`Centro (${num(h)}, ${num(k)}); radio ${r}`,st:[`Centro: cambia los signos → (${num(h)}, ${num(k)})`,`Radio: √${r*r} = ${r}`]}; }},
   {t:'Completar cuadrados',x:['Si la ecuación viene desarrollada (x² + y² + Dx + Ey + F = 0), completa cuadrados: x² + Dx = (x + D/2)² − (D/2)².','Así llegas a la forma (x − h)² + (y − k)² = r².'],ej:['x² + y² − 6x + 4y − 3 = 0','(x − 3)² + (y + 2)² = 16 → C(3, −2), r = 4'],
    g:()=>{ const h=nz(-5,5), k=nz(-5,5), r=rnd(1,7); return {q:`Centro y radio: ${terms([[1,'x²'],[1,'y²'],[-2*h,'x'],[-2*k,'y'],[h*h+k*k-r*r,'']])} = 0`,a:`Centro (${num(h)}, ${num(k)}); radio ${r}`,st:[`Completa cuadrados: ${sh(h)}² + ${sh(k,'y')}² = ${r*r}`,`Centro (${num(h)}, ${num(k)}), radio ${r}`]}; }},
   {t:'¿Dentro, fuera o sobre?',x:['Reemplaza el punto en (x − h)² + (y − k)² y compáralo con r²: menor → dentro, igual → sobre, mayor → fuera.','Es comparar la distancia al centro con el radio (al cuadrado, para no sacar raíces).'],ej:['(1, 1) y x² + y² = 4','1 + 1 = 2 < 4 → dentro'],
    g:()=>{ const h=rnd(-3,3), k=rnd(-3,3), r=5, [p,q]=pick([[3,4],[4,3],[5,0],[0,5],[1,2],[2,4],[5,3],[6,1]]); const x=h+p*pick([1,-1]), y=k+q*pick([1,-1]), d=p*p+q*q; return {q:`¿El punto (${num(x)}, ${num(y)}) está dentro, fuera o sobre ${sh(h)}² + ${sh(k,'y')}² = 25?`,a:d<25?'Dentro':d===25?'Sobre':'Fuera',st:[`${sh(h).replace('x',pr(x))}² + ${sh(k,'y').replace('y',pr(y))}² = ${d}`,`Compara con r² = 25: ${d<25?'menor → dentro':d===25?'igual → sobre':'mayor → fuera'}`]}; }},
   {t:'Parábola: vértice y foco',x:['Una parábola son los puntos a igual distancia de un foco y de una recta (directriz). (x − h)² = 4p(y − k) tiene vértice (h, k) y foco (h, k + p).','Si p > 0 abre hacia arriba; si p < 0, hacia abajo.'],ej:['(x − 1)² = 8(y + 2)','4p = 8 → p = 2 → V(1, −2), F(1, 0)'],
    g:()=>{ const h=nz(-5,5), k=nz(-5,5), p=nz(-3,3); return {q:`Vértice y foco de ${sh(h)}² = ${num(4*p)}${sh(k,'y')}`,a:`V(${num(h)}, ${num(k)}); F(${num(h)}, ${num(k+p)})`,st:[`Vértice (${num(h)}, ${num(k)})`,`4p = ${4*p} → p = ${num(p)}`,`Foco: (${num(h)}, ${num(k)} ${p<0?'−':'+'} ${Math.abs(p)}) = (${num(h)}, ${num(k+p)})`]}; }}],
  T15:[
   {t:'Qué es una matriz',x:['Una matriz es una tabla de números. aᵢⱼ es el elemento de la fila i y la columna j.','En [1 2; 3 4], el ; separa filas: a₂₁ = 3 (fila 2, columna 1).'],ej:['A = [5 −1; 0 7], a₁₂','−1'],
    g:()=>{ const A=[[nz(-9,9),nz(-9,9)],[nz(-9,9),nz(-9,9)]], i=rnd(1,2), j=rnd(1,2); return {q:`En A = [${A[0].map(num).join(' ')}; ${A[1].map(num).join(' ')}], ¿cuánto vale a${sub(i)}${sub(j)}?`,a:num(A[i-1][j-1]),st:[`Fila ${i}, columna ${j}`,num(A[i-1][j-1])]}; }},
   {t:'Sumar matrices',x:['Se suman posición por posición. Solo se pueden sumar matrices del mismo tamaño.'],ej:['[1 2; 3 4] + [0 5; −1 2]','[1 7; 2 6]'],
    g:()=>{ const M=()=>[[rnd(-9,9),rnd(-9,9)],[rnd(-9,9),rnd(-9,9)]], A=M(), B=M(), S=A.map((r,i)=>r.map((v,j)=>v+B[i][j])), f=X=>`[${X[0].map(num).join(' ')}; ${X[1].map(num).join(' ')}]`; return {q:`Suma: ${f(A)} + ${f(B)}`,a:f(S),st:['Se suma elemento a elemento',f(S)]}; }},
   {t:'Número por matriz',x:['k·A multiplica cada elemento de A por k.'],ej:['3·[1 −2; 0 4]','[3 −6; 0 12]'],
    g:()=>{ const k=nz(-4,4), A=[[rnd(-6,6),rnd(-6,6)],[rnd(-6,6),rnd(-6,6)]], f=X=>`[${X[0].map(num).join(' ')}; ${X[1].map(num).join(' ')}]`; return {q:`Calcula ${num(k)}·${f(A)}`,a:f(A.map(r=>r.map(v=>k*v))),st:[`Multiplica cada elemento por ${num(k)}`,f(A.map(r=>r.map(v=>k*v)))]}; }},
   {t:'Fila por columna',x:['El producto de una fila por una columna es la suma de los productos de sus elementos: [a b]·[c; d] = ac + bd.','Es la pieza básica de la multiplicación de matrices.'],ej:['[2 3]·[4; 1]','2·4 + 3·1 = 11'],
    g:()=>{ const a=nz(-6,6), b=nz(-6,6), c=nz(-6,6), d=nz(-6,6); return {q:`Calcula [${num(a)} ${num(b)}] · [${num(c)}; ${num(d)}]`,a:`[${num(a*c+b*d)}]`,st:[`${num(a)}·${pr(c)} + ${pr(b)}·${pr(d)}`,`= ${num(a*c+b*d)}`]}; }},
   {t:'Multiplicar matrices 2×2',x:['El elemento (i, j) de A·B es la fila i de A por la columna j de B.','El orden importa: en general A·B ≠ B·A.'],ej:['[1 2; 3 4]·[0 1; 1 0]','[2 1; 4 3]'],
    g:()=>{ const M=()=>[[rnd(-4,4),rnd(-4,4)],[rnd(-4,4),rnd(-4,4)]], A=M(), B=M(), P=A.map(r=>[0,1].map(j=>r[0]*B[0][j]+r[1]*B[1][j])), f=X=>`[${X[0].map(num).join(' ')}; ${X[1].map(num).join(' ')}]`; return {q:`Multiplica A·B con A = ${f(A)} y B = ${f(B)}`,a:f(P),st:['Fila 1 por columna 1 y por columna 2: '+P[0].map(num).join(' ; '),'Fila 2 por columna 1 y por columna 2: '+P[1].map(num).join(' ; ')]}; }}],
  X9:[
   {t:'Determinante 2×2',x:['det [a b; c d] = ad − bc: diagonal principal menos diagonal secundaria.','Si el determinante es 0, la matriz no tiene inversa.'],ej:['det [3 1; 4 2]','6 − 4 = 2'],
    g:()=>{ const a=nz(-7,7), b=nz(-7,7), c=nz(-7,7), d=nz(-7,7); return {q:`Determinante de [${num(a)} ${num(b)}; ${num(c)} ${num(d)}]`,a:`det = ${num(a*d-b*c)}`,st:[`${num(a)}·${pr(d)} − ${pr(b)}·${pr(c)}`,`= ${num(a*d-b*c)}`]}; }},
   {t:'Matriz inversa 2×2',x:['A⁻¹ = (1/det)·[d −b; −c a]: intercambia a y d, cambia el signo de b y c, y divide entre el determinante.','Comprueba siempre: A·A⁻¹ debe dar la identidad [1 0; 0 1].'],ej:['A = [2 1; 5 3]','det = 1 → A⁻¹ = [3 −1; −5 2]'],
    g:()=>{ let a,b,c,d; do{ a=nz(-5,5); b=nz(-5,5); c=nz(-5,5); d=nz(-5,5); }while(Math.abs(a*d-b*c)!==1); const D=a*d-b*c, e=v=>num(v*D); return {q:`¿Tiene inversa A = [${num(a)} ${num(b)}; ${num(c)} ${num(d)}]? Si la tiene, hállala`,a:`Sí: A⁻¹ = [${e(d)} ${e(-b)}; ${e(-c)} ${e(a)}]`,st:[`det = ${num(D)}`,`Intercambia a y d, cambia el signo de b y c: [${num(d)} ${num(-b)}; ${num(-c)} ${num(a)}]`,`Divide entre ${num(D)}`]}; }},
   {t:'Regla de Cramer',x:['En ax + by = e ; cx + dy = f: x = det Aₓ / det A y y = det Aᵧ / det A.','Aₓ es la matriz con la columna de x cambiada por los resultados (e, f); Aᵧ, con la columna de y cambiada.'],ej:['2x + y = 7 ; x − y = 2','det A = −3, det Aₓ = −9 → x = 3 ; det Aᵧ = −3 → y = 1'],
    g:()=>{ let a,b,c,d; do{ a=nz(-5,5); b=nz(-5,5); c=nz(-5,5); d=nz(-5,5); }while(a*d-b*c===0); const x=rnd(-5,5), y=rnd(-5,5), e=a*x+b*y, f=c*x+d*y, D=a*d-b*c; return {q:`Resuelve con la regla de Cramer: ${terms([[a,'x'],[b,'y']])} = ${num(e)} ;  ${terms([[c,'x'],[d,'y']])} = ${num(f)}`,a:`x = ${num(x)}, y = ${num(y)}`,st:[`det A = ${num(D)}`,`det Aₓ = ${num(e*d-b*f)} → x = ${num(x)}`,`det Aᵧ = ${num(a*f-e*c)} → y = ${num(y)}`]}; }},
   {t:'Determinante 3×3 (Sarrus)',x:['Sarrus: suma los productos de las 3 diagonales hacia abajo y resta los de las 3 diagonales hacia arriba.','Sirve solo para matrices 3×3.'],ej:['[2 1 0; 1 3 1; 0 1 2]','12 − 4 = 8'],
    g:()=>{ const A=[0,1,2].map(()=>[rnd(-3,3),rnd(-3,3),rnd(-3,3)]); const dn=A[0][0]*A[1][1]*A[2][2]+A[0][1]*A[1][2]*A[2][0]+A[0][2]*A[1][0]*A[2][1], up=A[0][2]*A[1][1]*A[2][0]+A[0][0]*A[1][2]*A[2][1]+A[0][1]*A[1][0]*A[2][2]; return {q:`Calcula con Sarrus el det de [${A.map(r=>r.map(num).join(' ')).join('; ')}]`,a:`det = ${num(dn-up)}`,st:[`Diagonales hacia abajo: ${num(dn)}`,`Diagonales hacia arriba: ${num(up)}`,`Resta: ${num(dn-up)}`]}; }}],
  T16:[
   {t:'Qué es un logaritmo',x:['logᵦ(x) es el exponente al que hay que elevar b para obtener x: log₂(8) = 3 porque 2³ = 8.','Pregúntate: “¿b elevado a qué da x?”.'],ej:['log₃(81)','3⁴ = 81 → 4'],
    g:()=>{ const b=pick([2,3,5,10]), n=rnd(0,b===2?6:b===10?4:3); return {q:`Calcula: log${b===10?'':sub(b)}(${b**n})`,a:String(n),st:[`¿${b} elevado a qué da ${b**n}?`,`${b}${sup(n)} = ${b**n} → ${n}`]}; }},
   {t:'De potencia a logaritmo',x:['bʸ = x es lo mismo que logᵦ(x) = y. Son la misma relación escrita de dos formas.','La base queda como base, el resultado va adentro del log y el exponente es lo que da el log.'],ej:['5² = 25','log₅(25) = 2'],
    g:()=>{ const b=pick([2,3,4,5,10]), n=rnd(2,4); return {q:`Escribe ${b}${sup(n)} = ${b**n} en forma de logaritmo`,a:`log${sub(b)}(${b**n}) = ${n}`,st:['bʸ = x  ⇔  log_b(x) = y',`log${sub(b)}(${b**n}) = ${n}`]}; }},
   {t:'Ecuación exponencial con la misma base',x:['Escribe los dos lados como potencias de la misma base. Si bᵐ = bⁿ, entonces m = n.','Ejemplo: 2ˣ⁺¹ = 32 = 2⁵ → x + 1 = 5 → x = 4.'],ej:['3ˣ⁻² = 27','3ˣ⁻² = 3³ → x = 5'],
    g:()=>{ const b=pick([2,3,5]), n=rnd(1,b===2?6:3), c=nz(-4,4); return {q:`Resuelve: ${b}^(${lin(c)}) = ${b**n}`,a:`x = ${num(n-c)}`,st:[`Escribe ${b**n} como potencia: ${b}${sup(n)}`,`Iguala exponentes: ${lin(c)} = ${n}`,`x = ${num(n-c)}`]}; }},
   {t:'Propiedades de los logaritmos',x:['log(a) + log(b) = log(ab) ; log(a) − log(b) = log(a/b) ; log(aⁿ) = n·log(a).','Vienen de las leyes de exponentes: multiplicar potencias suma exponentes.'],ej:['log₂(4) + log₂(8)','log₂(32) = 5'],
    g:()=>{ const b=pick([2,3]), n=rnd(2,b===2?6:4), k=rnd(1,n-1); let p=b**k, q=b**(n-k); if(Math.random()<0.5){ const m=pick([2,3].filter(v=>v!==b)); p*=m; q=Fr(q,m); return {q:`Calcula: log${sub(b)}(${p}) + log${sub(b)}(${fs(q)})`,a:String(n),st:[`Suma de logaritmos: log${sub(b)}(${p}·${fs(q)})`,`= log${sub(b)}(${b**n}) = ${n}`]}; } return {q:`Calcula: log${sub(b)}(${p}) + log${sub(b)}(${q})`,a:String(n),st:[`Suma de logaritmos: log${sub(b)}(${p}·${q}) = log${sub(b)}(${b**n})`,`= ${n}`]}; }},
   {t:'Ecuación logarítmica',x:['logᵦ(A) = c se pasa a forma exponencial: A = bᶜ.','Al final verifica que lo de adentro del log sea positivo; si no, la solución se descarta.'],ej:['log₂(x − 3) = 4','x − 3 = 16 → x = 19'],
    g:()=>{ const b=pick([2,3,5]), n=rnd(1,b===2?5:3), c=nz(-6,6); return {q:`Resuelve: log${sub(b)}(${lin(c)}) = ${n}`,a:`x = ${num(b**n-c)}`,st:[`Forma exponencial: ${lin(c)} = ${b}${sup(n)} = ${b**n}`,`x = ${num(b**n-c)}`]}; }}],
  T17:[
   {t:'La idea de límite y el reemplazo directo',x:['lím x→a f(x) es el valor al que se acerca f(x) cuando x se acerca a a.','Si f es un polinomio (continua, sin saltos ni huecos), el límite es simplemente f(a).'],ej:['lím x→2 (x² + 3x)','4 + 6 = 10'],
    g:()=>{ const c=[nz(-3,3),nz(-6,6),rnd(-9,9)], a=nz(-3,3); return {q:`lím x→${num(a)} (${poly(c)})`,a:num(c[0]*a*a+c[1]*a+c[2]),st:['Es un polinomio: es continuo, reemplaza directo',`= ${num(c[0]*a*a+c[1]*a+c[2])}`]}; }},
   {t:'Indeterminación 0/0: factorizar',x:['Si al reemplazar sale 0/0, no es que el límite no exista: hay un factor común escondido.','Factoriza, cancela el factor (se puede porque x ≠ a mientras se acerca) y vuelve a reemplazar.'],ej:['lím x→3 (x² − 9)/(x − 3)','(x + 3)(x − 3)/(x − 3) → x + 3 → 6'],
    g:()=>{ const a=nz(-6,6), b=nz(-6,6); if(a===b) return {q:`lím x→${num(a)} (x² − ${a*a})/(${lin(-a)})`,a:num(2*a),st:[`Reemplazar da 0/0`,`Factoriza: (${lin(a)})(${lin(-a)}) ÷ (${lin(-a)}) → ${lin(a)}`,`Reemplaza: ${num(2*a)}`]}; return {q:`lím x→${num(a)} (${poly([1,-(a+b),a*b])})/(${lin(-a)})`,a:num(a-b),st:['Reemplazar da 0/0',`Factoriza: (${lin(-a)})(${lin(-b)}) ÷ (${lin(-a)}) → ${lin(-b)}`,`Reemplaza: ${num(a-b)}`]}; }},
   {t:'Límites laterales',x:['Por la izquierda (x → a⁻) y por la derecha (x → a⁺) pueden dar distinto en funciones a trozos.','El límite existe solo si los dos laterales coinciden.'],ej:['x + 1 si x < 2 ; 3x − 3 si x ≥ 2','izq: 3 ; der: 3 → existe y vale 3'],
    g:()=>{ const c=nz(-3,3), a=nz(-4,4), m=pick([-3,-2,-1,2,3]), same=Math.random()<0.5, b=same?c+a-m*c:c+a-m*c+nz(-3,3), L=c+a, R=m*c+b; return {q:`f(x) = x ${a<0?'−':'+'} ${Math.abs(a)} si x < ${num(c)} ;  ${terms([[m,'x'],[b,'']])} si x ≥ ${num(c)}. ¿Existe lím x→${num(c)} f(x)? (responde sí o no)`,a:L===R?`Sí: ${num(L)}`:'No',st:[`Por la izquierda: ${num(L)}`,`Por la derecha: ${num(R)}`,L===R?'Los laterales coinciden':'Los laterales son distintos']}; }},
   {t:'Límites al infinito',x:['Cuando x → ∞, en un cociente de polinomios mandan los términos de mayor grado.','Mismo grado: el límite es el cociente de los coeficientes principales. Mayor grado abajo: 0.'],ej:['lím x→∞ (3x² + 1)/(6x² − x)','3/6 = 1/2'],
    g:()=>{ const a=nz(-6,6), b=rnd(1,6), n=rnd(1,3); return {q:`lím x→∞ (${poly([a].concat(Array(n).fill(0).map(()=>rnd(-5,5))))})/(${poly([b].concat(Array(n).fill(0).map(()=>rnd(-5,5))))})`,a:fs(Fr(a,b)),st:[`Mismo grado (${n}): cociente de coeficientes principales`,`${num(a)}/${b} = ${fs(Fr(a,b))}`]}; }},
   {t:'Con raíces: el conjugado',x:['Si sale 0/0 y hay una raíz, multiplica arriba y abajo por el conjugado (√A + B). Se forma una diferencia de cuadrados que quita la raíz.','Luego cancela y reemplaza.'],ej:['lím x→0 (√(x + 9) − 3) ÷ x','1/(√(x + 9) + 3) → 1/6'],
    g:()=>{ const k=rnd(1,5); return {q:`lím x→0 (√(x + ${k*k}) − ${k}) ÷ x`,a:fs(Fr(1,2*k)),st:[`Reemplazar da 0/0`,`Multiplica arriba y abajo por el conjugado: x ÷ (x(√(x + ${k*k}) + ${k}))`,`Cancela x y reemplaza: 1/(${k} + ${k}) = ${fs(Fr(1,2*k))}`]}; }}],
  T18:[
   {t:'Qué es la derivada',x:['La derivada f′(x) es la pendiente de la recta tangente: mide qué tan rápido cambia f en cada punto.','Regla de la potencia: (xⁿ)′ = n·xⁿ⁻¹. El número que multiplica se queda: (5x³)′ = 15x².'],ej:['(4x⁵)′','20x⁴'],
    g:()=>{ const a=nz(-6,6), n=rnd(2,6); return {q:`Deriva: f(x) = ${terms([[a,'x'+sup(n)]])}`,a:`f′(x) = ${terms([[a*n,'x'+(n-1>1?sup(n-1):'')]])}`,st:[`Regla de la potencia: baja el ${n} y resta 1 al exponente`,`${num(a)}·${n}x${n-1>1?sup(n-1):''}`]}; }},
   {t:'Sumas y constantes',x:['La derivada de una suma es la suma de las derivadas: se deriva término a término.','La derivada de una constante es 0 (no cambia), y (ax)′ = a.'],ej:['(2x³ − 5x + 7)′','6x² − 5'],
    g:()=>{ const c=[nz(-4,4),rnd(-6,6),nz(-9,9),rnd(-9,9)]; return {q:`Deriva: f(x) = ${poly(c)}`,a:`f′(x) = ${poly([3*c[0],2*c[1],c[2]])}`,st:['Regla de la potencia en cada término; la constante da 0',`f′(x) = ${poly([3*c[0],2*c[1],c[2]])}`]}; }},
   {t:'Potencias negativas y raíces',x:['Escribe 1/xⁿ como x⁻ⁿ y √x como x^(1/2). Luego aplica la regla de la potencia.','(3/x²)′ = (3x⁻²)′ = −6x⁻³ = −6/x³.'],ej:['(2/x)′','(2x⁻¹)′ = −2x⁻² = −2/x²'],
    g:()=>{ const a=nz(-6,6), n=rnd(1,3); return {q:`Deriva: f(x) = ${num(a)}/x${n>1?sup(n):''}`,a:`f′(x) = ${num(-a*n)}/x${sup(n+1)}`,st:[`Escribe como potencia: ${num(a)}x⁻${sup(n)}`,`Regla de la potencia: ${num(-a*n)}x⁻${sup(n+1)} = ${num(-a*n)}/x${sup(n+1)}`]}; }},
   {t:'Regla del producto',x:['(f·g)′ = f′·g + f·g′. No es f′·g′.','También puedes multiplicar primero y derivar después; los dos caminos dan lo mismo.'],ej:['(x²)(x + 1)','2x(x + 1) + x² = 3x² + 2x'],
    g:()=>{ const a=nz(-5,5), b=nz(-5,5); return {q:`Deriva con la regla del producto: f(x) = (x² ${a<0?'−':'+'} ${Math.abs(a)})(${lin(b)})`,a:`f′(x) = ${poly([3,2*b,a])}`,st:[`f′g = 2x(${lin(b)}) ; fg′ = (x² ${a<0?'−':'+'} ${Math.abs(a)})·1`,`Suma: ${poly([3,2*b,a])}`]}; }},
   {t:'Regla de la cadena',x:['Para una función dentro de otra: deriva la de afuera (dejando igual lo de adentro) y multiplica por la derivada de lo de adentro.','((3x + 1)⁴)′ = 4(3x + 1)³·3 = 12(3x + 1)³.'],ej:['((2x − 5)³)′','3(2x − 5)²·2 = 6(2x − 5)²'],
    g:()=>{ const a=rnd(2,5), b=nz(-7,7), n=rnd(2,5); return {q:`Deriva con la regla de la cadena: f(x) = (${bin(a,b)})${sup(n)}`,a:`f′(x) = ${n*a}(${bin(a,b)})${n-1>1?sup(n-1):''}`,st:[`Afuera: ( )${sup(n)} → ${n}( )${n-1>1?sup(n-1):''}`,`Adentro: (${bin(a,b)})′ = ${a}`,`Multiplica: ${n*a}(${bin(a,b)})${n-1>1?sup(n-1):''}`]}; }},
   {t:'Recta tangente',x:['La recta tangente en x = a pasa por (a, f(a)) y tiene pendiente f′(a). Usa punto-pendiente: y − f(a) = f′(a)(x − a).'],ej:['f(x) = x² en x = 3','(3, 9), m = 6 → y = 6x − 9'],
    g:()=>{ const b=nz(-5,5), c=rnd(-5,5), a=nz(-3,3), fa=a*a+b*a+c, m=2*a+b; return {q:`Recta tangente a f(x) = ${poly([1,b,c])} en x = ${num(a)}`,a:`y = ${terms([[m,'x'],[fa-m*a,'']])}`,st:[`Punto: f(${num(a)}) = ${num(fa)}`,`Pendiente: f′(x) = ${poly([2,b])} → f′(${num(a)}) = ${num(m)}`,`y = ${terms([[m,'x'],[fa-m*a,'']])}`]}; }}],
  X2:[
   {t:'Grados y radianes',x:['Una vuelta completa son 360° = 2π radianes, así que 180° = π. Para pasar de grados a radianes multiplica por π/180.','Ejemplo: 60° = 60π/180 = π/3.'],ej:['135°','135π/180 = 3π/4'],
    g:()=>{ const d=pick([30,45,60,90,120,135,150,180,210,225,240,270,300,315,330]); return {q:`Convierte ${d}° a radianes`,a:piF(Fr(d,180)),st:[`Multiplica por π/180: ${d}π/180`,`Simplifica: ${piF(Fr(d,180))}`]}; }},
   {t:'Teorema de Pitágoras',x:['En un triángulo rectángulo, hipotenusa² = cateto² + cateto². La hipotenusa es el lado más largo, frente al ángulo recto.'],ej:['Catetos 6 y 8','√(36 + 64) = 10'],
    g:()=>{ const [a,b,c]=pick(TR); return Math.random()<0.6?{q:`Un triángulo rectángulo tiene catetos ${a} y ${b}. Halla la hipotenusa`,a:String(c),st:[`h² = ${a}² + ${b}² = ${c*c}`,`h = ${c}`]}:{q:`Un triángulo rectángulo tiene hipotenusa ${c} y un cateto ${a}. Halla el otro cateto`,a:String(b),st:[`b² = ${c}² − ${a}² = ${b*b}`,`b = ${b}`]}; }},
   {t:'Seno, coseno y tangente',x:['sen θ = opuesto/hipotenusa ; cos θ = adyacente/hipotenusa ; tan θ = opuesto/adyacente (SOH-CAH-TOA).','“Opuesto” es el cateto frente al ángulo θ; “adyacente” el que lo toca.'],ej:['Catetos 3 y 4, θ frente al 3','sen θ = 3/5 ; cos θ = 4/5 ; tan θ = 3/4'],
    g:()=>{ const [a,b,c]=pick(TR), w=pick(['sen','cos','tan']), v=w==='sen'?Fr(a,c):w==='cos'?Fr(b,c):Fr(a,b); return {q:`Un triángulo rectángulo tiene catetos ${a} y ${b}. Si θ es el ángulo opuesto al cateto ${a}, halla ${w} θ`,a:fs(v),st:[`Hipotenusa: √(${a*a} + ${b*b}) = ${c}`,`${w} θ = ${w==='sen'?`${a}/${c}`:w==='cos'?`${b}/${c}`:`${a}/${b}`} = ${fs(v)}`]}; }},
   {t:'Valores notables',x:['Salen de dos triángulos: el de 45°-45°-90° (catetos 1 y 1, hipotenusa √2) y el de 30°-60°-90° (lados 1, √3 y 2).','sen 30° = 1/2, cos 30° = √3/2, tan 30° = √3/3 ; sen 45° = cos 45° = √2/2, tan 45° = 1 ; sen 60° = √3/2, cos 60° = 1/2, tan 60° = √3.'],ej:['cos 60°','1/2'],
    g:()=>{ const T={sen:{30:'1/2',45:'√2/2',60:'√3/2'},cos:{30:'√3/2',45:'√2/2',60:'1/2'},tan:{30:'√3/3',45:'1',60:'√3'}}, w=pick(['sen','cos','tan']), d=pick([30,45,60]); return {q:`Valor exacto de ${w} ${d}°`,a:T[w][d],st:[`Triángulo de ${d===45?'45°-45°-90°':'30°-60°-90°'}`,`${w} ${d}° = ${T[w][d]}`]}; }},
   {t:'Problemas de altura',x:['Dibuja el triángulo: la altura suele ser el cateto opuesto al ángulo de elevación y la distancia al pie, el adyacente. Entonces tan θ = altura/distancia.'],ej:['A 20 m, elevación 45°','altura = 20·tan 45° = 20 m'],
    g:()=>{ const th=pick([45,60,30]), d=th===30?3*rnd(2,10):rnd(5,40), ans=th===45?String(d):th===60?`${d}√3`:`${d/3===1?'':d/3}√3`; return {q:`Desde ${d} m de un poste ves su punta con un ángulo de elevación de ${th}°. ¿Cuánto mide el poste?`,a:ans,st:[`tan ${th}° = altura ÷ ${d}`,`tan ${th}° = ${th===45?'1':th===60?'√3':'√3/3'}`,`altura = ${ans}`]}; }}],
  X3:[
   {t:'Elipse: leer a y b',x:['En x²/a² + y²/b² = 1, a es la mitad del eje sobre x y b la mitad del eje sobre y. El denominador mayor indica el eje largo.','x²/25 + y²/9 = 1 → a = 5, b = 3: la elipse corta al eje x en ±5 y al eje y en ±3.'],ej:['x²/16 + y²/4 = 1','vértices (±4, 0), corta al eje y en (0, ±2)'],
    g:()=>{ const a=rnd(3,8); let b; do b=rnd(1,7); while(b>=a); return {q:`¿Dónde corta x²/${a*a} + y²/${b*b} = 1 al eje x? (da el valor positivo)`,a:`x = ${a}`,st:[`a² = ${a*a} → a = ${a}`,`Corta en (±${a}, 0)`]}; }},
   {t:'Focos de la elipse',x:['En la elipse, c² = a² − b² (a es el semieje mayor). Los focos están dentro, sobre el eje largo, a distancia c del centro.','x²/25 + y²/9 = 1: c² = 16 → focos (±4, 0).'],ej:['x²/100 + y²/36 = 1','c² = 64 → (±8, 0)'],

   {t:'Contar con diagramas de Venn',x:['n(A ∪ B) = n(A) + n(B) − n(A ∩ B): los que están en ambos se contaron dos veces, por eso se restan una vez.','Los que no están en ninguno = total − n(A ∪ B).'],ej:['40 alumnos: 25 Mate, 18 Física, 10 ambos','25 + 18 − 10 = 33 → ninguno: 7'],

  const W2=320, H2=170, L=38, R=12, T2=12, Bt=28, iw=W2-L-R, ih=H2-T2-Bt;

  let s=`<svg viewBox="0 0 ${W2} ${H2}" style="width:100%" role="img" aria-label="Notas de las mini evaluaciones">`;
  s+=`<rect x="${L}" y="${Y(100)}" width="${iw}" height="${Y(80)-Y(100)}" fill="#4ade80" opacity=".07"/><rect x="${L}" y="${Y(80)}" width="${iw}" height="${Y(60)-Y(80)}" fill="#facc15" opacity=".07"/><rect x="${L}" y="${Y(60)}" width="${iw}" height="${Y(0)-Y(60)}" fill="#f87171" opacity=".06"/>`;
  [0,60,80,100].forEach(v=>{ s+=`<line x1="${L}" x2="${W2-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===80?'#4ade80':v===60?'#facc15':'var(--line)'}" stroke-dasharray="${v===60||v===80?'4 4':''}" opacity=".7"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#9aa3b2">${v}%</text>`; });
  const pts=ev.map((e,i)=>[i,evalPct(e)]).filter(p=>p[1]!==null);
  if(pts.length>1) s+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map(([i,p])=>X(i)+','+Y(Math.min(100,p))).join(' ')}"/>`;
  ev.forEach((e,i)=>{ const p=evalPct(e); s+=`<text x="${X(i)}" y="${H2-10}" text-anchor="middle" font-size="9" fill="var(--tx2)">${e.id==='final'?'F':i+1}</text>`;
    if(p!==null){ const c=p>=80?'#4ade80':p>=60?'#facc15':'#f87171'; s+=`<circle cx="${X(i)}" cy="${Y(Math.min(100,p))}" r="4.5" fill="${c}" stroke="var(--bg2)" stroke-width="1.5"><title>${esc(e.name)}: ${p} %</title></circle><text x="${X(i)}" y="${Y(Math.min(100,p))-8}" text-anchor="middle" font-size="9" fill="var(--tx)">${Math.round(p)}</text>`; }
    else s+=`<circle cx="${X(i)}" cy="${Y(0)}" r="2.5" fill="#2a3242"/>`; });
  s+=`</svg>`;
  const avg = pts.length ? Math.round(pts.reduce((a,p)=>a+p[1],0)/pts.length) : null;
  return `<div class="card"><h2>📊 Tus notas en el tiempo</h2>${s}<div class="muted">${pts.length?`Promedio: <b style="color:var(--tx)">${avg} %</b> en ${pts.length} prueba${pts.length>1?'s':''}. Verde ≥ 80 %, amarillo 60–79 %, rojo &lt; 60 %.`:'Cuando guardes puntajes aparecerán aquí.'}</div></div>`;
}

/* ===================== Respaldo semanal ===================== */
const SNAP_KEY='arbolAli.autosnap';
function hasAnyData(){ return errs().length>0 || Object.values(S.progress).some(p=>p&&(p.status!=='pendiente'||p.count||p.notes)) || S.evals.some(e=>e.score!==null) || Object.keys(study().log).length>0; }
function autoSnapshot(){
  const m=meta(); if(m.lastSnap && daysBetween(ymd(m.lastSnap),today())<7) return;
  try{ let malla=null; try{ malla=JSON.parse(localStorage.getItem(MALLA_KEY)||'null'); }catch(e){}
    localStorage.setItem(SNAP_KEY, JSON.stringify({fecha:iso(today()), matematica:S, malla})); m.lastSnap=iso(today()); save(); }catch(e){}
}
function snapInfo(){ try{ const d=JSON.parse(localStorage.getItem(SNAP_KEY)||'null'); return d&&d.fecha?d:null; }catch(e){ return null; } }
function backupCheck(){
  const m=meta(); if(!hasAnyData()) return;
  const ref = m.lastBackup || m.firstUse; const ago = daysBetween(ymd(ref), today());
  if(ago<7) return; if(m.snoozeUntil && ymd(m.snoozeUntil)>today()) return;
  showModal(`<h2>💾 Hora de tu respaldo semanal</h2><p style="color:var(--tx2)">${m.lastBackup?'Tu último respaldo fue hace '+ago+' días.':'Aún no has descargado ningún respaldo.'} Tu progreso solo vive en este navegador: si se borran los datos del navegador, se pierde. Descarga el archivo y guárdalo en Drive o en tu correo.</p>
    <div class="mact"><button class="btn" id="bLater">Mañana</button><button class="btn pri" id="bNow">Descargar respaldo</button></div>`);
  mbox.querySelector('#bLater').onclick=()=>{ m.snoozeUntil=iso(addDays(today(),1)); save(); hideModal(); };
  mbox.querySelector('#bNow').onclick=()=>{ hideModal(); exportJSON(); };
}
function restoreSnap(){
  const d=snapInfo(); if(!d) return;
  confirmBox('¿Restaurar la copia automática?','Vuelve todo (Matemática y Malla) a como estaba el '+fmt(ymd(d.fecha),{day:'numeric',month:'long',year:'numeric'})+'. Lo que hiciste después se pierde.','Restaurar',()=>{

/* ===================== Cuaderno de errores ===================== */
function errs(){ if(!Array.isArray(S.errors)) S.errors=[]; return S.errors; }
function addError(topic, q, a){ errs().push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5), topic:topic||'', q:String(q), a:String(a||''), added:iso(today()), due:iso(today()), tries:0}); save(); }
const errorsDue = () => errs().filter(e=>!e.fixed && ymd(e.due)<=today());
function errorRetry(id, ok){ const e=errs().find(x=>x.id===id); if(!e) return; addAcc(!!ok);
  if(ok){ e.fixed=iso(today()); toast('¡Error superado! ✅'); } else { e.tries=(e.tries||0)+1; e.due=iso(addDays(today(), e.tries>1?3:2)); toast('Vuelve a salir en '+(e.tries>1?3:2)+' días'); }
  save(); renderHeader(); renderStudy(); }

/* ===================== Modo examen ===================== */
let EX=null, exTimer=null;
function examTopics(){ return S.nodes.filter(n=>GEN[n.id]); }
function simTopics(){ const t=S.nodes.filter(n=>GEN[n.id] && n.week); return t.length?t:examTopics(); }
function startExam(topic){
  let items, total, mins;
  if(topic==='SIM'){ const ts=simTopics(); total=15; mins=40; items=[]; const order=ts.slice().sort(()=>Math.random()-.5); for(let i=0;i<total;i++){ const t=order[i%order.length]; items.push({...genOne(t.id,0), topic:t.id}); } }
  else { total=10; mins = (topic==='T1'||topic==='T3')?20: topic==='T4'?10 : 25; items=genFor(topic,total,0).map(x=>({...x, topic})); }
  const custom = +(document.getElementById('exMin')||{}).value; if(custom>0) mins=custom;
  EX={topic, items, total, mins, start:Date.now(), end:Date.now()+mins*60000, phase:'run'};
  document.getElementById('exam').classList.add('show'); renderExam();
  clearInterval(exTimer); exTimer=setInterval(tickExam, 1000);
}
function tickExam(){ if(!EX||EX.phase!=='run') return clearInterval(exTimer); const left=EX.end-Date.now(); const el=document.getElementById('exClock'); if(el){ const s=Math.max(0,Math.ceil(left/1000)); el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); el.classList.toggle('low', s<=120); }
  if(left<=0){ toast('⏰ Se acabó el tiempo'); finishExam(); } }
function finishExam(){ if(!EX) return; EX.phase='check'; EX.used=Math.max(1,Math.round((Date.now()-EX.start)/60000)); clearInterval(exTimer); renderExam(); }
function renderExam(){
  const box=document.getElementById('exam'), B=byId(); if(!EX){ box.classList.remove('show'); return; }
  const title = EX.topic==='SIM' ? 'Simulacro final · 15 ejercicios' : `Examen de ${EX.topic} · ${esc(B[EX.topic]?.title||'')}`;
  let h = `<div class="ex-top"><div><b>${title}</b><div class="muted">${EX.phase==='run'?'Sin apuntes y sin pistas. Resuelve en papel.':'Corrige con honestidad: marca ✓ o ✗ en cada uno.'}</div></div>`;
  if(EX.phase==='run') h += `<div class="ex-clock" id="exClock">--:--</div></div>`;
  else { const ok=EX.items.filter(i=>i.mark==='ok').length, marked=EX.items.filter(i=>i.mark).length; h += `<div class="ex-clock">${ok}/${EX.total}</div></div><div class="muted" style="margin:6px 0 0">Tiempo usado: ${EX.used} min · corregidos ${marked} de ${EX.total}</div>`; }
  h += `<ol class="ex-list">` + EX.items.map((it,i)=>`<li><div class="ex-q">${mth(it.q)}${EX.topic==='SIM'?` <span class="muted">(${esc(it.topic)})</span>`:''}</div>${EX.phase==='check'?`<div class="goal" style="margin-top:6px">Respuesta: ${mth(it.a)}</div><div class="ex-mk"><button class="btn sm ${it.mark==='ok'?'pri':''}" data-mk="${i}" data-v="ok">✓ Bien</button><button class="btn sm ${it.mark==='bad'?'danger':''}" data-mk="${i}" data-v="bad">✗ Mal</button></div>`:''}</li>`).join('') + `</ol>`;
  if(EX.phase==='run') h += `<div class="mact"><button class="btn" id="exQuit">Abandonar</button><button class="btn pri" id="exEnd">Terminé: ver respuestas</button></div>`;
  else {
    const ok=EX.items.filter(i=>i.mark==='ok').length, all=EX.items.every(i=>i.mark); const pct=Math.round(ok/EX.total*100);
    if(all){ const m=evalMsg(pct); h += `<div class="card" style="margin-top:10px"><div class="big">${ok}/${EX.total} · ${pct} %</div><div style="margin-top:6px">${EX.topic==='SIM'?esc(m.t):(ok>=8?'✅ Cumples el criterio de dominio (8/10 sin apuntes).':'⏳ Aún no llegas a 8/10. Repasa los errores y vuelve a intentarlo en unos días.')}</div>
      <div class="muted" style="margin-top:6px">Al guardar: ${EX.topic==='SIM'?'se anota en el Simulacro final':'la nota va a "Nota de la prueba" de '+esc(EX.topic)}, los ✗ pasan a tu cuaderno de errores y se registran ${EX.used} min de estudio.</div></div>`; }
    h += `<div class="mact"><button class="btn" id="exQuit">Salir sin guardar</button><button class="btn pri" id="exSave" ${all?'':'disabled'}>Guardar resultado</button></div>`;
  }
  box.innerHTML = `<div class="ex-wrap">${h}</div>`;
  const $=s=>box.querySelector(s);
  if($('#exEnd')) $('#exEnd').onclick=finishExam;
  $('#exQuit').onclick=()=>{ if(EX.phase==='run'){ confirmBox('¿Abandonar el examen?','No se guarda nada.','Abandonar',()=>{ clearInterval(exTimer); EX=null; renderExam(); }); } else { EX=null; renderExam(); } };
  box.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{ EX.items[+b.dataset.mk].mark=b.dataset.v; const y=box.scrollTop; renderExam(); box.scrollTop=y; });
  if($('#exSave')) $('#exSave').onclick=saveExam;
  if(EX.phase==='run') tickExam();
}
function saveExam(){
  const ok=EX.items.filter(i=>i.mark==='ok').length;
  EX.items.filter(i=>i.mark==='bad').forEach(i=>addError(i.topic, i.q, i.a));
  const k=iso(today()); study().log[k]=(+study().log[k]||0)+EX.used; addAcc(true,ok); addAcc(false,EX.total-ok);
  let msg='';
  if(EX.topic==='SIM'){ const f=S.evals.find(e=>e.id==='final'); if(f){ f.max=EX.total; f.score=ok; } msg='Guardado en el Simulacro final: '+ok+'/'+EX.total; }
  else { const p=P(EX.topic); p.test=Math.round(ok/EX.total*10); p.minutes=(+p.minutes||0)+EX.used; msg='Nota de '+EX.topic+': '+p.test+'/10'; }
  const topic=EX.topic, pass = topic!=='SIM' && ok/EX.total>=0.8 && !isDom(topic);
  save(); EX=null; renderExam(); refreshAll();
  if(pass) confirmBox('¡Llegaste a 8/10!','¿Marcamos '+topic+' como dominado con fecha de hoy?','Sí, dominado',()=>{ const p=P(topic); p.status='dominado'; if(!p.date) p.date=iso(today()); save(); refreshAll(); toast('¡'+topic+' dominado! 🎉'); });
  else toast(msg);
}

/* ===================== Plan del día y pomodoro ===================== */
let pomo=null, pomoTimer=null;
function dayTasks(){
  const t=today(), w=curWeek(), dow=t.getDay(), B=byId(), tasks=[];
  const node=S.nodes.find(n=>n.week===w && /^T|^X/.test(n.id));
  const ev=S.evals.find(e=>e.date===iso(t));
  if(w<1) tasks.push({k:'pre', t:'El plan empieza el lunes 16 nov 2026. Hoy: arma tu horario de estudio.'});
  else if(w>19) tasks.push({k:'uni', t:'¡Plan terminado! Repasa tus temas débiles antes de la universidad.'});
  if(ev) tasks.push({k:'ev', t:`📝 Hoy toca ${ev.name}: ${ev.topic}. Hazla sin apuntes y guarda tu puntaje.`, go:'vEval'});
  if(dow===0){ const p1=B.P1; tasks.push({k:'p1', t:'🐍 Domingo de programación: avanza CS50P (P1).', link:(p1&&p1.links&&p1.links[0])?p1.links[0][1]:'https://cs50.harvard.edu/python/'}); }
  if(w>=1 && w<=19){
    if(REVIEW_WEEKS[w] && dow!==0) tasks.push({k:'rv', t:`🔁 Semana de repaso: ${REVIEW_WEEKS[w]}.`});
    if(node && dow!==0 && !ev){
      const p=S.progress[node.id]||{};
      if(isDom(node.id)) tasks.push({k:'adv', t:`✅ ${node.id} ya está dominado. Adelanta el siguiente tema o practica un tema extra.`});
      else if(dow===6) tasks.push({k:'exam', t:`⏱ Sábado: haz un examen de práctica de ${node.id} (10 ejercicios, meta 8/10).`, exam:node.id});
      else { const rem=Math.max(0,node.target-(+p.count||0)); const daysLeft=Math.max(1, 6-dow); const n=Math.max(5, Math.ceil(rem/daysLeft));
        tasks.push({k:'main', t: rem? `📘 ${node.id} · ${node.title}: resuelve unos ${n} ejercicios (llevas ${+p.count||0} de ${node.target}).` : `📘 ${node.id}: ya hiciste los ${node.target} ejercicios. Prueba el modo examen.`, prac:node.id}); }
    }
  }
  const rv=S.nodes.filter(n=>reviewDue(n.id)); if(rv.length) tasks.push({k:'srs', t:`🔁 Repasa: ${rv.map(n=>n.id).join(', ')} (5 ejercicios cada uno, sin apuntes).`});

let TH=null;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prepQ(item, topic){ const [q,opts,c,e,vf]=item; if(vf) return {q,opts:opts.slice(),c,e,topic}; const o=shuffle(opts.map((t,i)=>({t,ok:i===c}))); return {q,opts:o.map(x=>x.t),c:o.findIndex(x=>x.ok),e,topic}; }
function theoryTopics(){ return S.nodes.filter(n=>THEORY[n.id]); }
function startTheory(topic){
  let qs;
  if(topic==='MIX'){ const w=curWeek(); let ts=theoryTopics().filter(n=>n.week && n.week<=Math.max(1,w)); ts=ts.concat(theoryTopics().filter(n=>isDom(n.id)&&!ts.includes(n))); if(!ts.length) ts=theoryTopics().slice(0,1);
    qs=shuffle(ts.flatMap(n=>THEORY[n.id].map(x=>prepQ(x,n.id)))).slice(0,10); }
  else qs=shuffle(THEORY[topic].map(x=>prepQ(x,topic)));
  TH={topic, qs, i:0, ans:null, ok:0};
}
function theoryCard(){
  const tps=theoryTopics(), cw=curWeek();
  let h=`<div class="card" id="theoryCard"><h2>🧠 Teoría</h2>`;
  if(!TH){
    h+=`<p class="muted" style="margin-top:0">Preguntas de concepto con explicación: comprueba que entiendes el porqué, no solo el procedimiento.</p>
      <select id="thTopic"><option value="MIX">Mezcla de lo visto hasta esta semana (10)</option>${tps.map(n=>{ const t=(S.progress[n.id]||{}).theory; return `<option value="${esc(n.id)}" ${n.week===cw?'selected':''}>${esc(n.id+' · '+n.title)}${t?' · mejor '+t.best+'/'+t.n:''}</option>`; }).join('')}</select>
      <button class="btn pri" id="thGo" style="margin-top:8px;width:100%">Empezar</button>`;
  } else if(TH.i>=TH.qs.length){
    const n=TH.qs.length, pct=Math.round(TH.ok/n*100);
    h+=`<div class="big">${TH.ok}/${n} · ${pct} %</div><div style="margin-top:6px">${pct>=80?'✅ Dominas la teoría de este tema.':pct>=60?'Bien, pero repasa las explicaciones de las que fallaste.':'Repasa la teoría (subtemas y videos) y vuelve a intentarlo.'}</div>
      <div class="muted" style="margin-top:6px">Las que fallaste se guardaron en tu cuaderno de errores.</div>
      <div class="mact"><button class="btn" id="thExit">Salir</button><button class="btn pri" id="thAgain">Otra vez</button></div>`;
  } else {
    const q=TH.qs[TH.i], a=TH.ans;
    h+=`<div class="muted" style="margin-top:-4px">${esc(q.topic)} · pregunta ${TH.i+1} de ${TH.qs.length} · ${TH.ok} bien</div>
      <div style="font-size:16px;margin:8px 0 10px">${mth(q.q)}</div><div class="nlist">`;
    q.opts.forEach((o,i)=>{ const st = a===null ? '' : i===q.c ? 'background:#14361f;border-color:#4ade80' : i===a ? 'background:#3a1518;border-color:#f87171' : 'opacity:.55';
      h+=`<button class="btn ${a!==null&&i===q.c?'th-ok':a===i?'th-bad':''}" data-tha="${i}" style="text-align:left;${st}" ${a!==null?'disabled':''}>${a!==null&&i===q.c?'✓ ':a===i?'✗ ':''}${mth(o)}</button>`; });
    h+=`</div>`;
    if(a!==null) h+=`<div class="goal reveal" style="margin-top:10px">${a===q.c?'✅ Correcto. ':'❌ La respuesta es: <b>'+mth(q.opts[q.c])+'</b>. '}${mth(q.e)}</div>
      <div class="mact"><button class="btn" id="thExit">Salir</button><button class="btn pri" id="thNext">${TH.i+1<TH.qs.length?'Siguiente ›':'Ver resultado'}</button></div>`;
    else h+=`<div class="mact"><button class="btn" id="thExit">Salir</button></div>`;
  }
  return h+`</div>`;
}
function renderTheoryCard(){ const el=document.getElementById('theoryCard'); if(!el) return; el.outerHTML=theoryCard(); bindTheory(document.getElementById('studyWrap')); }
function bindTheory(w){
  const $=s=>w.querySelector(s);
  if($('#thGo')) $('#thGo').onclick=()=>{ startTheory($('#thTopic').value); renderTheoryCard(); };
  if($('#thExit')) $('#thExit').onclick=()=>{ TH=null; renderTheoryCard(); };
  if($('#thAgain')) $('#thAgain').onclick=()=>{ startTheory(TH.topic); renderTheoryCard(); };
  w.querySelectorAll('[data-tha]').forEach(b=>b.onclick=()=>{ if(TH.ans!==null) return; const q=TH.qs[TH.i]; TH.ans=+b.dataset.tha;
    if(TH.ans===q.c){ TH.ok++; addAcc(true); buzz(12); save(); } else { addAcc(false); buzz([30,40,30]); addError(q.topic, '🧠 '+q.q, q.opts[q.c]+' · '+q.e); renderHeader(); }
    renderTheoryCard(); });
  if($('#thNext')) $('#thNext').onclick=()=>{ TH.i++; TH.ans=null;
    if(TH.i>=TH.qs.length && TH.topic!=='MIX'){ const p=P(TH.topic), n=TH.qs.length; const prev=p.theory; p.theory={n, last:TH.ok, best:Math.max(TH.ok, prev&&prev.n===n?prev.best:0), date:iso(today())}; save(); }
    renderTheoryCard(); document.getElementById('theoryCard').scrollIntoView({block:'nearest'}); };
}
function goTheory(id){ TH=null; goView('vStudy'); startTheory(id); renderTheoryCard(); setTimeout(()=>{ const el=document.getElementById('theoryCard'); if(el) el.scrollIntoView({behavior:'smooth'}); },60); }

const unpar = s => /^\(.*\)$/.test(s) ? s.slice(1,-1) : s;
const MOP = '(\\([^()<>&]+\\)[²³]?|√\\([^()<>&]+\\)|[−-]?√?[0-9A-Za-zθπ.,²³⁴⁵⁶⁷⁸⁹⁰¹ⁿᵐ₀-₉]+)';
const FRAC_RE = new RegExp(MOP+'\\s?/\\s?'+MOP,'g');
function fmtMath(h){ // recibe texto ya escapado
  h = h.replace(/\[([^\[\]<>&]+;[^\[\]<>&]+)\]/g,(m,b)=>{ const rows=b.split(';').map(r=>r.trim().split(/\s+/)); const c=Math.max(...rows.map(r=>r.length)); return `<span class="mat" style="grid-template-columns:repeat(${c},auto)">${rows.flat().map(x=>`<span>${x}</span>`).join('')}</span>`; });
  h = h.replace(/\^\(([^()<>]+)\)/g,'<sup>$1</sup>');

  h = h.replace(FRAC_RE,(m,a,b)=>`<span class="fr"><span>${unpar(a)}</span><span>${unpar(b)}</span></span>`);
  h = h.replace(/√\(([^()<>]+)\)/g,'<span class="rad">√<span class="rc">$1</span></span>').replace(/√([0-9A-Za-zθ]+)/g,'<span class="rad">√<span class="rc">$1</span></span>');

/* ===================== Radar por fase ===================== */
function nodeLevel(n){ const p=S.progress[n.id]||{}; if(p.status==='dominado') return 1;
  const ex = n.target>0 ? Math.min(1,(+p.count||0)/n.target) : 0, ts = (p.test!==null&&p.test!==undefined)? +p.test/10 : 0;
  const v = n.target>0 ? 0.55*ex+0.35*ts : 0; return p.status==='progreso' ? Math.max(0.15, Math.min(0.85,v||0.3)) : Math.min(0.6,v); }
function radar(){
  const axes=['F1','F2','F3','F4','P','R'].filter(k=>S.nodes.some(n=>n.phase===k)); const N=axes.length; if(N<3) return '';
  const cx=160, cy=118, R=84, ang=i=>-Math.PI/2+i*2*Math.PI/N, pt=(i,v)=>[cx+Math.cos(ang(i))*R*v, cy+Math.sin(ang(i))*R*v];

  s+=`<g class="radar-v"><polygon points="${val.map((v,i)=>pt(i,Math.max(0.02,v)).join(',')).join(' ')}" fill="color-mix(in srgb,var(--acc) 22%,transparent)" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>${val.map((v,i)=>{ const [x,y]=pt(i,Math.max(0.02,v)); return `<circle cx="${x}" cy="${y}" r="3.5" fill="${PHASES[axes[i]].color}"/>`; }).join('')}</g>`;
  return `<div class="card"><h2>🕸 Nivel por fase</h2><svg viewBox="0 0 320 240" style="width:100%;max-width:420px;display:block;margin:0 auto" role="img" aria-label="Nivel por fase">${s}</svg><div class="muted">Cuenta temas dominados, ejercicios hechos y notas de examen. ${axes.map(k=>`<b style="color:${PHASES[k].color}">${k}</b> ${esc(PHASES[k].name.split('·')[1]||'').trim()}`).join(' · ')}</div></div>`;

/* ===================== Avance real vs planeado ===================== */
function realVsPlan(){

  const w=Math.min(19,Math.max(1,curWeek())), plan=[], real=[];
  for(let k=1;k<=19;k++){ plan.push(pl.filter(n=>n.week<=k).length);
    if(k<=w){ const end=addDays(START,k*7-1); real.push(pl.filter(n=>{ if(!isDom(n.id)) return false; const d=(S.progress[n.id]||{}).date; return /^\d{4}-\d{2}-\d{2}$/.test(d||'') ? ymd(d)<=end || k===w : k===w; }).length); } }
  const Lp=30,Rp=10,Tp=10,Bp=24,Wv=320,Hv=170, X=k=>Lp+(k-1)*(Wv-Lp-Rp)/18, Y=v=>Tp+(Hv-Tp-Bp)*(1-v/tot);

  s+=`<line x1="${X(w)}" x2="${X(w)}" y1="${Tp}" y2="${Hv-Bp}" stroke="var(--tx3)" stroke-dasharray="2 3"/><text x="${X(w)}" y="${Tp+8}" text-anchor="${w>15?'end':'start'}" dx="${w>15?-4:4}" font-size="9" fill="var(--tx2)">hoy</text>`;
  s+=`<polyline fill="none" stroke="var(--tx3)" stroke-width="2" stroke-dasharray="5 4" points="${plan.map((v,i)=>X(i+1)+','+Y(v)).join(' ')}"/>`;
