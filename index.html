    ex:[{q:'√75 − √12 + √27', s:[['Saca los cuadrados perfectos de cada raíz','√75 = 5√3 ;  √12 = 2√3 ;  √27 = 3√3'],['Ahora son semejantes: opera los coeficientes','5√3 − 2√3 + 3√3'],['Resultado','6√3']], r:'6√3'},
      {q:'Racionaliza: 6/(√5 − √2)', s:[['Multiplica arriba y abajo por el conjugado','(√5 + √2)'],['Denominador: suma por diferencia','(√5)² − (√2)² = 5 − 2 = 3'],['Numerador','6(√5 + √2)'],['Divide entre 3','2(√5 + √2) = 2√5 + 2√2']], r:'2√5 + 2√2'}],
    err:['√(a + b) no es √a + √b: √(9 + 16) = 5, pero √9 + √16 = 7.','√2 + √3 no es √5: solo se suman radicales semejantes.']},
  T4:{intro:['Un polinomio es una suma de términos con la variable elevada a exponentes enteros positivos, como 3x² − 5x + 2. Su grado es el mayor exponente que aparece.',
      'Los productos notables son multiplicaciones que aparecen tanto que conviene reconocerlas de memoria. Ahorran tiempo y, leídas al revés, son la base para factorizar en el tema siguiente.'],
    conc:[['Términos semejantes','Tienen la misma parte literal (3x² y −7x²) y solo ellos se pueden sumar.'],['Grado','El mayor exponente de la variable: 4x³ − x + 1 es de grado 3.'],['Binomio al cuadrado','(a ± b)² = a² ± 2ab + b²: el término del medio es el doble producto.'],['Suma por diferencia','(a + b)(a − b) = a² − b²: los términos del medio se cancelan.']],
    ex:[{q:'Multiplica: (3x + 2)(x − 4)', s:[['Cada término del primero por cada término del segundo','3x·x + 3x·(−4) + 2·x + 2·(−4)'],['Calcula','3x² − 12x + 2x − 8'],['Junta términos semejantes','3x² − 10x − 8']], r:'3x² − 10x − 8'},
      {q:'Simplifica: (x + 2)³ − (x − 2)³', s:[['Cubo de una suma','(x + 2)³ = x³ + 6x² + 12x + 8'],['Cubo de una diferencia','(x − 2)³ = x³ − 6x² + 12x − 8'],['Resta: cambia todos los signos del segundo','x³ + 6x² + 12x + 8 − x³ + 6x² − 12x + 8'],['Junta términos semejantes','12x² + 16']], r:'12x² + 16'}],
    err:['(a + b)² no es a² + b²: falta el término 2ab.','Al restar un paréntesis cambian TODOS los signos de adentro, no solo el primero.']},
  T5:{intro:['Factorizar es lo contrario de multiplicar: escribir un polinomio como un producto. Es como descomponer 12 = 2·2·3, pero con expresiones algebraicas.',
      'Se usa para resolver ecuaciones (si un producto es 0, algún factor es 0), para simplificar fracciones algebraicas y para calcular límites. Regla de oro: siempre empieza buscando factor común.'],
    conc:[['Factor común','Lo que se repite en todos los términos: 6x² + 9x = 3x(2x + 3).'],['Diferencia de cuadrados','a² − b² = (a + b)(a − b).'],['Trinomio x² + bx + c','Busca dos números que multiplicados den c y sumados den b.'],['Aspa simple','Para ax² + bx + c con a ≠ 1: descompones los extremos y compruebas que el cruce dé bx.']],
    ex:[{q:'Factoriza: 2x³ − 8x', s:[['Factor común 2x','2x(x² − 4)'],['x² − 4 es diferencia de cuadrados','x² − 4 = (x + 2)(x − 2)'],['Resultado completo','2x(x + 2)(x − 2)']], r:'2x(x + 2)(x − 2)'},
      {q:'Factoriza: 6x² + x − 2', s:[['Descompón los extremos','6x² = (3x)(2x) ;  −2 = (2)(−1)'],['Comprueba el aspa','3x·(−1) + 2·2x = −3x + 4x = x ✓'],['Escribe los factores en horizontal','(3x + 2)(2x − 1)']], r:'(3x + 2)(2x − 1)'}],
    err:['Olvidar el factor común en el resultado: 2x² − 8 = 2(x + 2)(x − 2), no solo (x + 2)(x − 2).','x² + 9 no se factoriza en los reales: no es diferencia de cuadrados.']},
  X1:{intro:['Dividir polinomios funciona como la división larga de números: dividendo = divisor · cociente + residuo. Cuando el divisor es de la forma x − r, Ruffini hace la división usando solo los coeficientes.',
      'El teorema del resto dice que el residuo de dividir P(x) entre (x − r) es P(r). Si P(r) = 0, entonces (x − r) es un factor: así se factorizan polinomios de grado 3 o más.'],
    conc:[['Coeficientes completos','Escribe todos los grados, con 0 en el que falte: x³ − 7x + 6 → 1, 0, −7, 6.'],['Valor r','Para dividir entre (x + 2) se usa r = −2.'],['Teorema del resto','Residuo de P(x) ÷ (x − r) = P(r).'],['Raíces candidatas','Las raíces enteras posibles son los divisores del término independiente.']],
    ex:[{q:'Halla el residuo de (x³ − 2x + 5) ÷ (x + 1)', s:[['Por el teorema del resto, r = −1','Residuo = P(−1)'],['Reemplaza','(−1)³ − 2(−1) + 5 = −1 + 2 + 5'],['Resultado','6']], r:'Residuo 6'},
      {q:'Factoriza: x³ − 7x + 6', s:[['Candidatas: divisores de 6','±1, ±2, ±3, ±6'],['Prueba x = 1','1 − 7 + 6 = 0 → (x − 1) es factor'],['Ruffini con 1, 0, −7, 6 y r = 1','Cociente: x² + x − 6, residuo 0'],['Factoriza el cociente','x² + x − 6 = (x + 3)(x − 2)'],['Resultado','(x − 1)(x − 2)(x + 3)']], r:'(x − 1)(x − 2)(x + 3)'}],
    err:['No poner 0 en el grado que falta: cambia todo el resultado.','Usar r = 2 para dividir entre (x + 2): el valor correcto es r = −2.']},
  T7:{intro:['Una ecuación es como una balanza: lo que hagas a un lado debes hacerlo al otro para que siga en equilibrio. Resolver es dejar la x sola.',
      'En una ecuación lineal la x aparece con exponente 1, así que normalmente tiene una única solución. Sirve para modelar problemas de dinero, edades, mezclas y movimiento.'],
    conc:[['Transponer','Un término pasa al otro lado con la operación contraria: lo que suma pasa restando.'],['Quitar denominadores','Multiplica TODA la ecuación por el MCM de los denominadores.'],['Comprobar','Reemplaza la solución en la ecuación original: ambos lados deben dar lo mismo.'],['Plantear','Traducir el texto a símbolos: "el doble de un número más 3" es 2x + 3.']],
    ex:[{q:'5x − 7 = 2x + 8', s:[['Las x a la izquierda y los números a la derecha','5x − 2x = 8 + 7'],['Opera','3x = 15'],['Divide entre 3','x = 5']], r:'x = 5'},
      {q:'(x + 1)/3 − (x − 2)/4 = 2', s:[['Multiplica todo por el MCM = 12','4(x + 1) − 3(x − 2) = 24'],['Distribuye (ojo con el signo menos)','4x + 4 − 3x + 6 = 24'],['Junta términos','x + 10 = 24'],['Despeja','x = 14'],['Comprueba: 15/3 − 12/4','5 − 3 = 2 ✓']], r:'x = 14'}],
    err:['Al multiplicar por el MCM, olvidar multiplicar también el lado derecho.','−(x − 2) es −x + 2, no −x − 2.']},
  T8:{intro:['Una fracción algebraica es un cociente de polinomios, como (x + 1)/(x − 3). Se opera igual que las fracciones numéricas: para simplificar se factoriza y se cancelan factores comunes.',
      'Siempre hay restricciones: los valores que hacen 0 el denominador están prohibidos. En una ecuación racional, una "solución" que anula un denominador se descarta.'],
    conc:[['Restricción','Valor prohibido de x porque anula un denominador.'],['Simplificar','Se cancelan factores (cosas que multiplican), nunca términos sumados.'],['Denominador común','Para sumar, se usa el MCM de los denominadores ya factorizados.'],['Solución extraña','Aparece al resolver, pero viola una restricción: se descarta.']],
    ex:[{q:'Simplifica: (x² − 9)/(x² + 3x)', s:[['Factoriza el numerador','(x + 3)(x − 3)'],['Factoriza el denominador','x(x + 3)'],['Cancela (x + 3)','(x − 3)/x'],['Restricciones (del original)','x ≠ 0 y x ≠ −3']], r:'(x − 3)/x'},
      {q:'Resuelve: x/(x − 1) = 2 + 1/(x − 1)', s:[['Restricción','x ≠ 1'],['Multiplica todo por (x − 1)','x = 2(x − 1) + 1'],['Resuelve','x = 2x − 1 → x = 1'],['x = 1 está prohibido','Se descarta']], r:'No tiene solución'}],
    err:['Cancelar términos sumados: (x + 3)/3 no es x.','Olvidar revisar las restricciones al final de una ecuación racional.']},
  T9:{intro:['Una ecuación cuadrática tiene la forma ax² + bx + c = 0 con a ≠ 0. Su gráfica es una parábola y las soluciones son los puntos donde corta al eje x.',
      'Tiene como máximo dos soluciones reales. Primero intenta factorizar; si no sale fácil, la fórmula general siempre funciona. El discriminante Δ = b² − 4ac te dice cuántas soluciones hay antes de calcularlas.'],
    conc:[['Discriminante','Δ > 0: dos soluciones; Δ = 0: una (doble); Δ < 0: ninguna real.'],['Producto cero','Si A·B = 0, entonces A = 0 o B = 0. Por eso factorizar resuelve.'],['Fórmula general','x = (−b ± √Δ)/(2a)'],['Suma y producto','Las raíces suman −b/a y multiplican c/a.']],
    ex:[{q:'x² + x − 12 = 0', s:[['Dos números que multiplican −12 y suman 1','4 y −3'],['Factoriza','(x + 4)(x − 3) = 0'],['Producto cero','x = −4 o x = 3']], r:'x = −4 o x = 3'},
      {q:'El largo de un rectángulo mide 4 más que el ancho y su área es 60. Halla sus lados', s:[['Ancho x, largo x + 4','x(x + 4) = 60'],['Ordena','x² + 4x − 60 = 0'],['Factoriza','(x + 10)(x − 6) = 0'],['Un lado no puede ser negativo','x = 6 (se descarta −10)'],['Largo','6 + 4 = 10']], r:'6 de ancho y 10 de largo'}],
    err:['Dividir entre x: en x² = 3x se pierde la solución x = 0. Mejor factoriza: x(x − 3) = 0.','Equivocarse con −b: si b = −5, entonces −b = 5.']},
  T10:{intro:['Un sistema son varias ecuaciones que deben cumplirse al mismo tiempo. Con dos incógnitas, cada ecuación es una recta y la solución es el punto donde se cruzan.',
      'Por eso puede haber una solución (rectas que se cortan), ninguna (rectas paralelas) o infinitas (la misma recta). Los métodos principales son sustitución, igualación y reducción.'],
    conc:[['Sustitución','Despejas una variable en una ecuación y la reemplazas en la otra.'],['Reducción','Sumas o restas las ecuaciones para que se cancele una variable.'],['Incompatible','Sin solución: al operar llegas a algo falso como 0 = 5.'],['Comprobación','El par (x, y) debe cumplir las DOS ecuaciones.']],
    ex:[{q:'x + y = 10 ;  x − y = 4', s:[['Suma las dos ecuaciones: se cancela y','2x = 14'],['Despeja','x = 7'],['Reemplaza en la primera','7 + y = 10 → y = 3']], r:'x = 7, y = 3'},
      {q:'Entrada de adulto S/ 12 y de niño S/ 7. Se vendieron 50 entradas y se recaudó S/ 475. ¿Cuántas de cada tipo?', s:[['Plantea con a adultos y n niños','a + n = 50 ;  12a + 7n = 475'],['Despeja n en la primera','n = 50 − a'],['Sustituye','12a + 7(50 − a) = 475'],['Resuelve','5a + 350 = 475 → a = 25'],['Calcula n','n = 50 − 25 = 25']], r:'25 de adulto y 25 de niño'}],
    err:['Encontrar x y olvidar calcular y.','Al restar ecuaciones, no restar también el lado derecho.']},
  T11:{intro:['Una inecuación compara con <, >, ≤ o ≥, y su solución es un intervalo de valores, no un solo número. Se resuelve casi igual que una ecuación, con una regla extra: al multiplicar o dividir por un negativo, el signo se invierte.',
      'El valor absoluto |x| es la distancia de x al 0, siempre positiva o cero. Por eso |x| < 3 significa "a menos de 3 unidades del cero": −3 < x < 3.'],
    conc:[['Intervalo','Paréntesis ( ) si el extremo no se incluye; corchete [ ] si se incluye.'],['Inversión del signo','Multiplicar o dividir por un negativo voltea la desigualdad.'],['|x| < a','Equivale a −a < x < a: un solo intervalo.'],['|x| > a','Equivale a x < −a o x > a: dos intervalos unidos.']],
    ex:[{q:'3 − 2x ≤ 9', s:[['Pasa el 3','−2x ≤ 6'],['Divide entre −2: se invierte el signo','x ≥ −3'],['Escribe el intervalo','[−3, +∞)']], r:'x ∈ [−3, +∞)'},
      {q:'|2x − 1| > 5', s:[['Mayor que: se separa en dos casos','2x − 1 > 5  o  2x − 1 < −5'],['Primer caso','2x > 6 → x > 3'],['Segundo caso','2x < −4 → x < −2'],['Une los intervalos','(−∞, −2) ∪ (3, +∞)']], r:'x ∈ (−∞, −2) ∪ (3, +∞)'}],
    err:['Olvidar invertir el signo al dividir por un negativo.','Resolver |x| > 3 como −3 < x < 3: eso corresponde a |x| < 3.']},
  T12:{intro:['En el plano cartesiano cada punto es un par (x, y). Una recta queda definida por su pendiente m, que dice cuánto sube por cada paso hacia la derecha, y un punto por donde pasa.',
      'La forma y = mx + b es la más útil: m es la inclinación y b el corte con el eje y. Rectas paralelas tienen la misma pendiente; perpendiculares, pendientes cuyo producto es −1.'],
    conc:[['Pendiente','m = (y₂ − y₁)/(x₂ − x₁): cambio vertical entre cambio horizontal.'],['Punto-pendiente','y − y₁ = m(x − x₁): la forma más rápida de escribir una recta.'],['Paralelas y perpendiculares','Paralelas: m₁ = m₂. Perpendiculares: m₁·m₂ = −1.'],['Distancia','d = √((x₂ − x₁)² + (y₂ − y₁)²), sale de Pitágoras.']],
    ex:[{q:'Distancia entre (1, 2) y (4, 6)', s:[['Diferencias','Δx = 4 − 1 = 3 ;  Δy = 6 − 2 = 4'],['Pitágoras','d = √(3² + 4²) = √25'],['Resultado','d = 5']], r:'d = 5'},
      {q:'Recta perpendicular a 2x + y = 5 que pasa por (4, 1)', s:[['Despeja y para ver la pendiente','y = −2x + 5 → m = −2'],['Perpendicular: inverso con signo cambiado','m = 1/2'],['Punto-pendiente','y − 1 = (1/2)(x − 4)'],['Despeja y','y = (1/2)x − 1']], r:'y = (1/2)x − 1'}],
    err:['Calcular la pendiente al revés, Δx entre Δy: es Δy entre Δx.','Mezclar el orden: si arriba restas y₂ − y₁, abajo debe ser x₂ − x₁.']},
  T13:{intro:['Una función es una regla que a cada x le asigna un único y. El dominio son los x permitidos y el rango son los y que realmente se obtienen.',
      'Para el dominio busca lo prohibido: dividir entre 0 y raíces pares de negativos. La gráfica muestra el rango, los cortes con los ejes y dónde la función crece o decrece.'],
    conc:[['Dominio','Todos los x donde la fórmula tiene sentido.'],['Rango','Todos los valores de y que la función alcanza.'],['Prueba de la recta vertical','Una gráfica es función si ninguna recta vertical la corta dos veces.'],['Vértice','En ax² + bx + c el vértice está en x = −b/(2a); es el máximo o el mínimo.']],
    ex:[{q:'Dominio de f(x) = √(x − 3)', s:[['El radicando no puede ser negativo','x − 3 ≥ 0'],['Despeja','x ≥ 3'],['Intervalo','[3, +∞)']], r:'Dominio [3, +∞)'},
      {q:'Vértice, rango y corte con el eje y de f(x) = x² − 4x + 1', s:[['x del vértice','−b/(2a) = 4/2 = 2'],['y del vértice','f(2) = 4 − 8 + 1 = −3'],['a = 1 > 0: abre hacia arriba, el vértice es el mínimo','Rango [−3, +∞)'],['Corte con el eje y: x = 0','f(0) = 1 → (0, 1)']], r:'V(2, −3); rango [−3, +∞); corta al eje y en (0, 1)'}],
    err:['Decir que el dominio de 1/x es (0, +∞): solo se excluye el 0, los negativos sí valen.','Confundir dominio (valores de x) con rango (valores de y).']},
  X10:{intro:['Una función a trozos usa una fórmula distinta en cada parte del dominio, como una tarifa que cambia según los minutos usados. Para evaluarla, primero miras en qué trozo cae x.',
      'Las transformaciones mueven una gráfica conocida: f(x − h) + k la desplaza h a la derecha y k hacia arriba; −f(x) la refleja sobre el eje x; a·f(x) la estira verticalmente.'],
    conc:[['Desplazamiento horizontal','f(x − h) va h a la derecha; f(x + h) va h a la izquierda (al revés de lo que parece).'],['Desplazamiento vertical','f(x) + k sube k unidades; f(x) − k baja k.'],['Reflexión','−f(x) voltea la gráfica sobre el eje x.'],['Continuidad en la unión','Los trozos deben coincidir en el punto donde cambian.']],
    ex:[{q:'f(x) = x² si x < 1 ;  3x − 1 si x ≥ 1. Calcula f(−2) y f(3)', s:[['−2 < 1: usa el primer trozo','f(−2) = (−2)² = 4'],['3 ≥ 1: usa el segundo trozo','f(3) = 3·3 − 1 = 8']], r:'f(−2) = 4 ;  f(3) = 8'},
      {q:'Describe g(x) = −(x + 3)² + 4 a partir de y = x²', s:[['El signo menos de afuera','Se refleja: abre hacia abajo'],['x + 3 adentro','Se mueve 3 a la izquierda'],['+ 4 afuera','Sube 4'],['El vértice (0, 0) pasa a','(−3, 4), que ahora es un máximo']], r:'Vértice (−3, 4), abre hacia abajo'}],
    err:['Mover a la derecha cuando ves x + 3: en realidad se mueve 3 a la izquierda.','Usar el trozo equivocado en el punto de unión: mira si dice < o ≤.']},
  T14:{intro:['La circunferencia es el conjunto de puntos a la misma distancia r de un centro (h, k). Su ecuación sale directo de la fórmula de distancia: (x − h)² + (y − k)² = r².',
      'La parábola es el conjunto de puntos que están a la misma distancia de un foco y de una recta llamada directriz. Con eje vertical: (x − h)² = 4p(y − k), donde p es la distancia del vértice al foco.'],
    conc:[['Completar cuadrados','x² + bx = (x + b/2)² − (b/2)²: convierte la forma general en la ordinaria.'],['Forma general','x² + y² + Dx + Ey + F = 0: hay que completar cuadrados para ver centro y radio.'],['Parámetro p','Si p > 0 la parábola abre hacia arriba (o a la derecha); si p < 0, al lado contrario.'],['Eje de simetría','La recta que pasa por el vértice y el foco y divide la parábola en dos mitades iguales.']],
    ex:[{q:'Ecuación de la circunferencia con centro (−1, 4) que pasa por (2, 8)', s:[['El radio es la distancia del centro al punto','r = √((2 + 1)² + (8 − 4)²)'],['Calcula','r = √(9 + 16) = 5'],['Reemplaza en (x − h)² + (y − k)² = r²','(x + 1)² + (y − 4)² = 25']], r:'(x + 1)² + (y − 4)² = 25'},
      {q:'Vértice y foco de y² − 4y − 8x + 28 = 0', s:[['Deja lo de y a la izquierda','y² − 4y = 8x − 28'],['Completa el cuadrado (suma 4)','(y − 2)² = 8x − 24'],['Factoriza la derecha','(y − 2)² = 8(x − 3)'],['4p = 8 → p = 2, eje horizontal, abre a la derecha','V(3, 2)'],['El foco está p unidades a la derecha del vértice','F(5, 2)']], r:'V(3, 2) y F(5, 2)'}],
    err:['Al completar cuadrados, sumar el número solo a un lado de la ecuación.','En (x + 2)² el centro tiene h = −2, no 2.']},
  T15:{intro:['Una matriz es una tabla de números ordenada en filas y columnas; una matriz 2×3 tiene 2 filas y 3 columnas. Sirve para organizar datos y resolver sistemas de ecuaciones.',
      'La suma es elemento a elemento, pero la multiplicación es fila por columna. Por eso A·B solo existe si el número de columnas de A es igual al de filas de B, y en general A·B ≠ B·A.'],
    conc:[['Orden','m×n: m filas y n columnas. Solo se suman matrices del mismo orden.'],['Producto','El elemento (i, j) de A·B es la fila i de A por la columna j de B.'],['Identidad','I tiene 1 en la diagonal y 0 en el resto: A·I = A.'],['Transpuesta','Aᵀ: las filas pasan a ser columnas.']],
    ex:[{q:'Calcula 2·[1 −3; 0 4] − [3 1; 2 −1]', s:[['Multiplica cada elemento por 2','[2 −6; 0 8]'],['Resta elemento a elemento','[2 − 3  −6 − 1; 0 − 2  8 + 1]'],['Resultado','[−1 −7; −2 9]']], r:'[−1 −7; −2 9]'},
      {q:'Calcula [1 2; 3 4] · [2 0; 1 −1]', s:[['Fila 1 por columna 1 y por columna 2','1·2 + 2·1 = 4 ;  1·0 + 2·(−1) = −2'],['Fila 2 por columna 1 y por columna 2','3·2 + 4·1 = 10 ;  3·0 + 4·(−1) = −4'],['Ordena los resultados','[4 −2; 10 −4]']], r:'[4 −2; 10 −4]'}],
    err:['Multiplicar matrices elemento a elemento: así no se multiplican.','Suponer que A·B = B·A: el orden sí importa.']},
  X9:{intro:['El determinante es un número que se calcula a partir de una matriz cuadrada. Si es 0, la matriz no tiene inversa y el sistema asociado no tiene solución única.',
      'En 2×2, det = ad − bc. En 3×3 se usa la regla de Sarrus o el desarrollo por cofactores. La regla de Cramer resuelve sistemas dividiendo determinantes.'],
    conc:[['Matriz singular','Su determinante es 0: no tiene inversa.'],['Inversa 2×2','A⁻¹ = (1 ÷ det A)·[d −b; −c a]'],['Sarrus','Suma de los productos de las 3 diagonales hacia abajo menos los de las 3 hacia arriba.'],['Cramer','x = det Aₓ ÷ det A, donde Aₓ cambia la columna de x por los resultados.']],
    ex:[{q:'Resuelve con Cramer: 2x + y = 7 ;  x − y = 2', s:[['Determinante del sistema','det A = 2·(−1) − 1·1 = −3'],['Columna de x reemplazada','det Aₓ = 7·(−1) − 1·2 = −9 → x = −9 ÷ (−3) = 3'],['Columna de y reemplazada','det Aᵧ = 2·2 − 7·1 = −3 → y = −3 ÷ (−3) = 1']], r:'x = 3, y = 1'},
      {q:'Calcula det [2 1 0; 1 3 1; 0 1 2] con Sarrus', s:[['Diagonales hacia abajo','2·3·2 + 1·1·0 + 0·1·1 = 12'],['Diagonales hacia arriba','0·3·0 + 2·1·1 + 1·1·2 = 4'],['Resta','12 − 4 = 8']], r:'det = 8'}],
    err:['Restar al revés: es ad − bc (diagonal principal menos secundaria).','Intentar invertir una matriz con determinante 0.']},
  T16:{intro:['Una función exponencial tiene la variable en el exponente, como 2ˣ. Crece o decrece muy rápido y modela intereses, poblaciones y desintegración radiactiva.',
      'El logaritmo es la operación inversa: log_b(x) = y significa bʸ = x. Responde la pregunta "¿a qué exponente elevo b para obtener x?". Solo existe para x > 0.'],
    conc:[['Definición','log_b(x) = y  ⇔  bʸ = x'],['Propiedades','log(A·B) = log A + log B ;  log(A ÷ B) = log A − log B ;  log(Aⁿ) = n·log A'],['Cambio de base','log_b(x) = (ln x)/(ln b), útil con la calculadora.'],['Logaritmo natural','ln x usa la base e ≈ 2,718.']],
    ex:[{q:'Resuelve: 3^(x + 1) = 81', s:[['Escribe 81 como potencia de 3','81 = 3⁴'],['Bases iguales: iguala exponentes','x + 1 = 4'],['Despeja','x = 3']], r:'x = 3'},
      {q:'Resuelve: log₂(x) + log₂(x − 2) = 3', s:[['Suma de logaritmos = logaritmo del producto','log₂(x(x − 2)) = 3'],['Pasa a forma exponencial','x² − 2x = 2³ = 8'],['Resuelve la cuadrática','x² − 2x − 8 = 0 → (x − 4)(x + 2) = 0'],['x = −2 dejaría argumentos negativos','Se descarta']], r:'x = 4'}],
    err:['log(a + b) no es log a + log b.','No verificar: la solución debe dejar positivos todos los argumentos.']},
  T17:{intro:['El límite de f(x) cuando x → a es el valor al que se acerca f(x) mientras x se acerca a a, sin importar lo que pase exactamente en a.',
      'Es la base del cálculo: la derivada se define con un límite. Una función es continua en a si el límite existe y coincide con f(a); intuitivamente, se puede dibujar sin levantar el lápiz.'],
    conc:[['Límites laterales','Por la izquierda (x → a⁻) y por la derecha (x → a⁺). El límite existe solo si ambos coinciden.'],['Indeterminación 0/0','No es un resultado: avisa que hay que factorizar o racionalizar.'],['Continuidad','f(a) existe, el límite existe y son iguales.'],['Límite al infinito','En un cociente de polinomios mandan los términos de mayor grado.']],
    ex:[{q:'lím x→2 (3x² − x + 1)', s:[['Es un polinomio: es continuo, reemplaza directo','3·4 − 2 + 1'],['Resultado','11']], r:'11'},
      {q:'lím x→4 (√x − 2)/(x − 4)', s:[['Reemplazar da 0/0','Hay que racionalizar'],['Multiplica arriba y abajo por (√x + 2)','(x − 4) ÷ ((x − 4)(√x + 2))'],['Cancela (x − 4)','1/(√x + 2)'],['Reemplaza x = 4','1/(2 + 2) = 1/4']], r:'1/4'}],
    err:['Creer que 0/0 vale 0 o 1: es una indeterminación.','Pensar que el límite siempre es f(a): eso solo pasa si la función es continua.']},
  T18:{intro:['La derivada f′(x) mide qué tan rápido cambia f en cada punto: es la pendiente de la recta tangente. Si f′ > 0 la función crece y si f′ < 0 decrece.',
      'Donde f′(x) = 0 la tangente es horizontal: ahí pueden estar los máximos y mínimos. Por eso las derivadas se usan para optimizar costos, ganancias, áreas y tiempos.'],
    conc:[['Recta tangente','y − f(a) = f′(a)(x − a)'],['Punto crítico','Donde f′(x) = 0 o no existe: candidato a máximo o mínimo.'],['Regla de la cadena','Derivada de afuera (dejando adentro igual) por la derivada de adentro.'],['Regla del cociente','(f/g)′ = (f′g − fg′)/g²']],
    ex:[{q:'Deriva: f(x) = 5x³ − 2x + 9', s:[['5x³: baja el 3 y resta 1 al exponente','15x²'],['−2x → −2 y la constante 9 → 0',''],['Junta','f′(x) = 15x² − 2']], r:'f′(x) = 15x² − 2'},
      {q:'Recta tangente a f(x) = x² − 3x en x = 2', s:[['Punto de tangencia','f(2) = 4 − 6 = −2 → (2, −2)'],['Pendiente','f′(x) = 2x − 3 → f′(2) = 1'],['Punto-pendiente','y + 2 = 1·(x − 2)'],['Despeja','y = x − 4']], r:'y = x − 4'}],
    err:['Derivar un producto multiplicando derivadas: (f·g)′ no es f′·g′.','Olvidar multiplicar por la derivada de adentro en la regla de la cadena.']},
  X2:{intro:['En un triángulo rectángulo, las razones trigonométricas comparan dos lados según el ángulo θ que mires. No dependen del tamaño del triángulo, solo del ángulo.',
      'Con la circunferencia unitaria se extienden a cualquier ángulo: cos θ es la coordenada x y sen θ la coordenada y del punto. Los ángulos también se miden en radianes: 180° = π rad.'],
    conc:[['SOH-CAH-TOA','Seno = opuesto ÷ hipotenusa; coseno = adyacente ÷ hipotenusa; tangente = opuesto ÷ adyacente.'],['Ángulos notables','30°, 45° y 60° tienen valores exactos con √2 y √3.'],['Radianes','Para pasar de grados a radianes multiplica por π/180.'],['Signos por cuadrante','I: todas +; II: solo seno +; III: solo tangente +; IV: solo coseno +.']],
    ex:[{q:'Convierte 150° a radianes', s:[['Multiplica por π/180','150·π/180'],['Simplifica 150/180','5/6'],['Resultado','5π/6']], r:'5π/6'},
      {q:'A 60 m de un edificio, el ángulo de elevación hacia la azotea es 30°. ¿Cuánto mide el edificio?', s:[['La altura es el cateto opuesto y 60 m el adyacente','tan 30° = h ÷ 60'],['Valor exacto','tan 30° = √3/3'],['Despeja h','h = 60·√3/3 = 20√3'],['Aproxima','20√3 ≈ 34,6 m']], r:'20√3 ≈ 34,6 m'}],
    err:['Usar la calculadora en radianes cuando el ángulo está en grados.','sen 2x no es 2·sen x.']},
  X3:{intro:['La elipse es el conjunto de puntos cuya suma de distancias a dos focos es constante (igual a 2a); se ve como un círculo estirado. La hipérbola usa la diferencia de distancias y tiene dos ramas.',
      'En la elipse a > b y c² = a² − b². En la hipérbola c² = a² + b², y además tiene asíntotas y = ±(b/a)x que guían sus ramas.'],
    conc:[['Semieje mayor a','En la elipse, a² es el denominador mayor; si está debajo de y, la elipse es vertical.'],['Focos','Están a distancia c del centro, sobre el eje mayor.'],['Excentricidad','e = c/a: en la elipse está entre 0 y 1 (cerca de 0 es casi un círculo).'],['Asíntotas','Rectas a las que la hipérbola se acerca sin tocarlas: y = ±(b/a)x.']],
    ex:[{q:'Focos y excentricidad de x²/16 + y²/9 = 1', s:[['Lee a y b','a² = 16 → a = 4 ;  b² = 9 → b = 3'],['Elipse: c² = a² − b²','c² = 16 − 9 = 7 → c = √7'],['Focos sobre el eje x','(±√7, 0)'],['Excentricidad','e = √7/4 ≈ 0,66']], r:'Focos (±√7, 0); e = √7/4'},
      {q:'Vértices, focos y asíntotas de x²/16 − y²/9 = 1', s:[['Es hipérbola (hay resta)','a = 4, b = 3'],['Hipérbola: c² = a² + b²','c² = 16 + 9 = 25 → c = 5'],['Vértices y focos','(±4, 0) y (±5, 0)'],['Asíntotas','y = ±(3/4)x']], r:'V(±4, 0); F(±5, 0); y = ±(3/4)x'},
      {q:'Lleva 9x² + 4y² = 36 a la forma canónica y halla vértices y focos', s:[['Divide todo entre 36','x²/4 + y²/9 = 1'],['El mayor (9) está bajo y: elipse vertical','a = 3, b = 2'],['c² = 9 − 4 = 5','c = √5'],['Sobre el eje y','Vértices (0, ±3); focos (0, ±√5)']], r:'V(0, ±3); F(0, ±√5)'}],
    err:['Suponer que a² siempre va debajo de x: el mayor denominador marca el eje mayor.','Usar c² = a² − b² en la hipérbola: ahí es c² = a² + b².']},
  X4:{intro:['Un vector tiene magnitud y dirección. Se escribe por componentes, u = (u₁, u₂), y se dibuja como una flecha. Representa desplazamientos, fuerzas y velocidades.',
      'Los vectores se suman componente a componente. El producto escalar u·v = u₁v₁ + u₂v₂ da un número que mide qué tan alineados están: si es 0, son perpendiculares.'],
    conc:[['Magnitud','|u| = √(u₁² + u₂²): el largo de la flecha.'],['Vector unitario','u ÷ |u|: misma dirección, largo 1.'],['Producto escalar','u·v = u₁v₁ + u₂v₂. Positivo: ángulo agudo; 0: perpendiculares; negativo: obtuso.'],['Ángulo entre vectores','cos θ = u·v ÷ (|u|·|v|)']],
    ex:[{q:'u = (3, −1), v = (1, 4). Calcula 2u − v', s:[['Multiplica u por 2','2u = (6, −2)'],['Resta componente a componente','(6 − 1, −2 − 4)'],['Resultado','(5, −6)']], r:'(5, −6)'},
      {q:'Magnitud y vector unitario de u = (6, 8)', s:[['Magnitud','|u| = √(36 + 64) = √100 = 10'],['Divide cada componente entre 10','(6/10, 8/10)'],['Simplifica','(3/5, 4/5)']], r:'|u| = 10; unitario (3/5, 4/5)'},
      {q:'Ángulo entre u = (1, 2) y v = (3, 1)', s:[['Producto escalar','u·v = 1·3 + 2·1 = 5'],['Magnitudes','|u| = √5 ;  |v| = √10'],['Coseno','cos θ = 5 ÷ (√5·√10) = 5 ÷ √50 = √2/2'],['Ángulo','θ = 45°']], r:'θ = 45°'}],
    err:['Creer que |u + v| = |u| + |v|: solo pasa si apuntan en la misma dirección.','Confundir el producto escalar (da un número) con multiplicar por un escalar (da un vector).']},
  X5:{intro:['Una proposición es una afirmación que es verdadera (V) o falsa (F). Con conectores como ¬ (no), ∧ (y), ∨ (o) y → (si… entonces) se forman proposiciones compuestas, y su valor se analiza con tablas de verdad.',
      'Un conjunto es una colección de elementos. La unión (∪) junta, la intersección (∩) toma lo común y la diferencia (A − B) quita lo de B. Los diagramas de Venn ayudan a contar sin repetir.'],
    conc:[['Condicional p → q','Solo es falsa cuando p es V y q es F.'],['Leyes de De Morgan','¬(p ∧ q) ≡ ¬p ∨ ¬q ;  ¬(p ∨ q) ≡ ¬p ∧ ¬q'],['Cardinal de la unión','n(A ∪ B) = n(A) + n(B) − n(A ∩ B)'],['Complemento','A′: lo que está en el universo U pero no en A.']],
    ex:[{q:'A = {1, 2, 3, 4} y B = {3, 4, 5}. Halla A ∪ B, A ∩ B y A − B', s:[['Unión: todo, sin repetir','A ∪ B = {1, 2, 3, 4, 5}'],['Intersección: lo común','A ∩ B = {3, 4}'],['Diferencia: lo de A que no está en B','A − B = {1, 2}']], r:'{1, 2, 3, 4, 5} ; {3, 4} ; {1, 2}'},
      {q:'Si p es V y q es V, ¿cuál es el valor de (p ∧ q) → ¬p?', s:[['Conjunción','p ∧ q = V ∧ V = V'],['Negación','¬p = F'],['Condicional V → F','F']], r:'Falso'},
      {q:'De 40 estudiantes, 25 llevan Matemática, 18 Física y 10 ambos. ¿Cuántos no llevan ninguno?', s:[['Al menos uno (sin contar dos veces a los de ambos)','25 + 18 − 10 = 33'],['Ninguno','40 − 33 = 7'],['De paso: solo Matemática','25 − 10 = 15']], r:'7 estudiantes'}],
    err:['Sumar n(A) + n(B) sin restar la intersección.','Negar "todos aprueban" como "nadie aprueba": lo correcto es "alguno no aprueba".']},
  X6:{intro:['Componer es encadenar funciones: (f ∘ g)(x) = f(g(x)) aplica primero g y luego f. El orden importa: f ∘ g casi nunca es igual a g ∘ f.',
      'La inversa f⁻¹ deshace lo que hace f: si f(2) = 7, entonces f⁻¹(7) = 2. Solo existe si f es inyectiva (cada y viene de un solo x). Su gráfica es el reflejo de f sobre la recta y = x.'],
    conc:[['Composición','(f ∘ g)(x) = f(g(x)): lo de adentro se calcula primero.'],['Inyectiva','Valores distintos de x dan valores distintos de y.'],['Cómo hallar la inversa','Escribe y = f(x), despeja x y luego intercambia x con y.'],['Comprobación','f(f⁻¹(x)) = x y f⁻¹(f(x)) = x.']],
    ex:[{q:'f(x) = 2x + 1 y g(x) = x². Halla (f ∘ g)(x) y (g ∘ f)(x)', s:[['f ∘ g: reemplaza x en f por x²','2x² + 1'],['g ∘ f: eleva al cuadrado 2x + 1','(2x + 1)² = 4x² + 4x + 1'],['Comparación','Son distintas: el orden importa']], r:'2x² + 1 ;  4x² + 4x + 1'},
      {q:'Halla la inversa de f(x) = 3x − 5', s:[['Escribe y = 3x − 5','y + 5 = 3x'],['Despeja x','x = (y + 5)/3'],['Intercambia x e y','f⁻¹(x) = (x + 5)/3']], r:'f⁻¹(x) = (x + 5)/3'},
      {q:'Halla la inversa de f(x) = (2x − 1)/(x + 3)', s:[['Multiplica en cruz','y(x + 3) = 2x − 1'],['Distribuye y agrupa las x','xy − 2x = −1 − 3y'],['Factor común x','x(y − 2) = −(3y + 1)'],['Despeja','x = (3y + 1)/(2 − y)'],['Intercambia x e y','f⁻¹(x) = (3x + 1)/(2 − x)']], r:'f⁻¹(x) = (3x + 1)/(2 − x)'}],
    err:['Confundir f⁻¹(x) con 1 ÷ f(x): el −1 no es un exponente aquí.','Componer en el orden equivocado: en f ∘ g primero actúa g.']},
  X7:{intro:['Una sucesión es una lista ordenada de números: a₁, a₂, a₃, … En la aritmética se suma siempre la misma diferencia d; en la geométrica se multiplica siempre por la misma razón r.',
      'La sumatoria Σ es una forma corta de escribir sumas largas. Se usa en finanzas (cuotas, interés compuesto), en estadística y más adelante en integrales.'],
    conc:[['Aritmética','aₙ = a₁ + (n − 1)d'],['Suma aritmética','Sₙ = n(a₁ + aₙ)/2: número de términos por el promedio del primero y el último.'],['Geométrica','aₙ = a₁·r^(n − 1)'],['Suma geométrica','Sₙ = a₁(rⁿ − 1)/(r − 1), con r ≠ 1.']],
    ex:[{q:'Halla el término 20 de 5, 9, 13, …', s:[['Diferencia','d = 9 − 5 = 4'],['Fórmula','a₂₀ = 5 + 19·4'],['Resultado','a₂₀ = 81']], r:'a₂₀ = 81'},
      {q:'En la aritmética 7, 12, 17, … halla a₁₂ y la suma de los 12 primeros', s:[['d = 5','a₁₂ = 7 + 11·5 = 62'],['Suma','S₁₂ = 12(7 + 62)/2'],['Calcula','S₁₂ = 6·69 = 414']], r:'a₁₂ = 62 ;  S₁₂ = 414'},
      {q:'Suma los 8 primeros términos de 3, 6, 12, …', s:[['Es geométrica','a₁ = 3, r = 2'],['Fórmula','S₈ = 3(2⁸ − 1)/(2 − 1)'],['Calcula','3·255 = 765']], r:'S₈ = 765'}],
    err:['Usar n en vez de n − 1 en el término general.','Confundir aritmética (se suma d) con geométrica (se multiplica por r).']},
  X8:{intro:['Contar bien es la base de la probabilidad. Si una tarea se hace de m formas y otra de n formas, juntas se hacen de m·n formas (principio multiplicativo). Si importa el orden se usan permutaciones; si no importa, combinaciones.',
      'La probabilidad clásica es casos favorables ÷ casos posibles, siempre entre 0 y 1. Para "al menos uno" suele ser más fácil calcular 1 − P(ninguno).'],
    conc:[['Factorial','n! = n·(n − 1)·…·2·1 ;  0! = 1'],['Permutación','P(n, k) = n! ÷ (n − k)!: elegir k ordenados.'],['Combinación','C(n, k) = n! ÷ (k!·(n − k)!): elegir k sin orden.'],['Complemento','P(no A) = 1 − P(A)']],
    ex:[{q:'¿De cuántas formas se pueden ordenar 4 libros en un estante?', s:[['El orden importa y se usan todos','4!'],['Calcula','4·3·2·1 = 24']], r:'24 formas'},
      {q:'¿Cuántos comités de 3 personas se forman con 8 personas?', s:[['En un comité no importa el orden: combinación','C(8, 3)'],['Fórmula','(8·7·6) ÷ (3·2·1)'],['Calcula','336 ÷ 6 = 56']], r:'56 comités'},
      {q:'Una bolsa tiene 4 bolas rojas y 6 azules. Se sacan 2. ¿Probabilidad de que ambas sean rojas?', s:[['Casos posibles: elegir 2 de 10','C(10, 2) = 45'],['Casos favorables: elegir 2 de las 4 rojas','C(4, 2) = 6'],['Probabilidad','6/45 = 2/15']], r:'2/15'}],
    err:['Usar permutación cuando el orden no importa (un comité no tiene orden).','Sumar probabilidades de eventos que pueden ocurrir a la vez.']},
  X11:{intro:['Una identidad trigonométrica es una igualdad que se cumple para todo ángulo, como sen²x + cos²x = 1, que sale de Pitágoras en la circunferencia unitaria.',
      'Se usan para simplificar expresiones, demostrar igualdades y resolver ecuaciones trigonométricas. Estrategia: escribe todo en senos y cosenos y trabaja el lado más complicado.'],
    conc:[['Pitagórica','sen²x + cos²x = 1 ;  1 + tan²x = sec²x'],['Recíprocas','csc x = 1 ÷ sen x ;  sec x = 1 ÷ cos x ;  cot x = 1 ÷ tan x'],['Ángulo doble','sen 2x = 2 sen x cos x'],['Coseno doble','cos 2x = cos²x − sen²x = 1 − 2sen²x']],
    ex:[{q:'Simplifica: tan x · cos x', s:[['Escribe la tangente en senos y cosenos','(sen x)/(cos x) · cos x'],['Cancela cos x','sen x']], r:'sen x'},
      {q:'Demuestra: sec²x − tan²x = 1', s:[['Pasa a senos y cosenos','1/(cos²x) − (sen²x)/(cos²x)'],['Mismo denominador','(1 − sen²x)/(cos²x)'],['Pitagórica: 1 − sen²x = cos²x','(cos²x)/(cos²x) = 1 ✓']], r:'Queda demostrado'},
      {q:'Resuelve 2sen²x − 1 = 0 para 0° ≤ x < 360°', s:[['Despeja','sen²x = 1/2 → sen x = ±√2/2'],['sen x = √2/2 (cuadrantes I y II)','x = 45° o 135°'],['sen x = −√2/2 (cuadrantes III y IV)','x = 225° o 315°']], r:'45°, 135°, 225° y 315°'}],
    err:['Escribir sen²x como sen(x²): sen²x significa (sen x)².','Dividir ambos lados entre sen x y perder las soluciones donde sen x = 0.']}
};
/* ---------- Modo profundo: el porqué de cada cosa ---------- */
const DEEP = {
  T1:{pq:[['¿Por qué menos por menos da más?','Multiplicar por −1 significa "dar la vuelta" en la recta numérica. Si das la vuelta dos veces, vuelves a mirar hacia el mismo lado. Además, si (−1)(−1) fuera −1, la propiedad distributiva fallaría: (−1)(1 + (−1)) = 0 obliga a que (−1)(−1) = 1.'],
      ['¿Por qué existe la jerarquía de operaciones?','Es un acuerdo para que una expresión tenga un solo resultado. Multiplicar es una suma repetida, por eso "pesa" más y se hace antes: 2 + 3·4 significa 2 más tres cuatros, es decir 14.'],
      ['¿Por qué para sumar fracciones necesito denominador común?','Solo se suman partes del mismo tamaño. Un medio y un tercio son pedazos distintos; al pasarlos a sextos (3/6 y 2/6) ya son pedazos iguales y se pueden contar: 5/6.'],
      ['¿Por qué dividir es multiplicar por el inverso?','Dividir entre 2/3 pregunta "¿cuántos 2/3 caben?". Como 1 ÷ (2/3) = 3/2, dividir entre 2/3 es lo mismo que multiplicar por 3/2.']],
    rec:['Resuelve primero lo de adentro de los paréntesis.','Luego las potencias, después multiplicaciones y divisiones, y al final sumas y restas.','Para sumar o restar fracciones, busca el MCM; para multiplicar, no lo necesitas.','Simplifica al final y revisa el signo.'],
    w:[['Sin el mismo denominador las partes son de tamaños distintos y no se pueden sumar ni restar.','Se multiplica arriba y abajo por el mismo número (3 y 2): la fracción cambia de forma pero no de valor.','Con el mismo denominador, solo cuentas cuántas partes hay: 9 − 10 = −1 doceavo.'],
       ['El paréntesis manda: se resuelve antes que todo lo de afuera.','Dividir entre −5/6 es multiplicar por su inverso −6/5. El signo sale negativo porque + por − da −.','La suma va al final por la jerarquía; para sumar 1 se escribe como 5/5.']]},
  T2:{pq:[['¿Por qué al multiplicar potencias se suman los exponentes?','x³ · x² = (x·x·x)·(x·x): en total hay 5 factores x. Contar factores es sumar exponentes.'],
      ['¿Por qué a⁰ = 1?','Por la regla de la división: a³ ÷ a³ = a^(3−3) = a⁰, pero todo número entre sí mismo da 1. Para que la regla siga funcionando, a⁰ tiene que valer 1.'],
      ['¿Por qué un exponente negativo es una fracción?','a² ÷ a⁵ = a^(−3), pero también es (a·a) ÷ (a·a·a·a·a) = 1/a³. Por eso a^(−3) = 1/a³.'],
      ['¿Por qué subir 20 % es multiplicar por 1,2?','Tienes el 100 % y le agregas 20 %: te queda el 120 % = 120/100 = 1,2 veces lo que tenías.']],
    rec:['Si hay potencias con la misma base, suma o resta exponentes.','Si hay potencia de potencia, multiplica exponentes.','Exponente negativo: pasa la potencia al otro lado de la fracción.','En porcentajes, convierte a un factor (1 + p ÷ 100 o 1 − p ÷ 100) y multiplica.'],
    w:[['Al multiplicar, los factores 2 se juntan: 3 + 5 = 8 factores.','Al dividir, se cancelan 6 factores de arriba con 6 de abajo y quedan 2.','2² es 2·2.'],
       ['Subir 20 % es quedarte con el 100 % más el 20 %, o sea 120 %.','Bajar 20 % deja el 80 % de lo que había.','Aplicar un cambio después de otro es multiplicar los factores.','El 20 % de bajada se calcula sobre un precio mayor, por eso se pierde más de lo que se ganó.']]},
  T3:{pq:[['¿Por qué √(a·b) = √a · √b?','Porque (√a·√b)² = a·b. Si al cuadrado da a·b y es positivo, es justamente √(a·b). Esto permite sacar factores cuadrados: √50 = √(25·2) = 5√2.'],
      ['¿Por qué √(a + b) no es √a + √b?','Elevar al cuadrado una suma produce un término extra: (√a + √b)² = a + b + 2√(ab). Ese 2√(ab) hace que no coincidan.'],
      ['¿Por qué funciona el conjugado?','Por la suma por diferencia: (√a − b)(√a + b) = a − b². El término con raíz se cancela, así que el denominador queda sin raíz.'],
      ['¿Por qué racionalizar?','Es una convención para comparar y operar resultados con facilidad. 1/√2 y √2/2 valen lo mismo, pero la segunda forma es más fácil de sumar con otros radicales.']],
    rec:['Descompón cada radicando buscando el mayor cuadrado perfecto.','Saca ese cuadrado de la raíz.','Suma solo radicales semejantes.','Si hay raíz abajo, multiplica por la raíz (si es una sola) o por el conjugado (si es una suma o resta).'],
    w:[['75 = 25·3, 12 = 4·3 y 27 = 9·3: en los tres aparece 3 multiplicado por un cuadrado perfecto.','Todos tienen √3, así que se comportan como "x": 5x − 2x + 3x.','5 − 2 + 3 = 6.'],
       ['Multiplicar arriba y abajo por lo mismo es multiplicar por 1: no cambia el valor.','Suma por diferencia elimina la raíz: (√5)² = 5.','El numerador solo se distribuye o se deja indicado.','6 entre 3 se puede simplificar porque 3 divide al 6.']]},
  T4:{pq:[['¿Por qué solo se suman términos semejantes?','3x² + 5x no se pueden juntar porque representan cosas distintas, como sumar áreas con longitudes. 3x² + 5x² sí da 8x² porque ambos cuentan "x²".'],
      ['¿De dónde sale (a + b)² = a² + 2ab + b²?','Es (a + b)(a + b): a·a + a·b + b·a + b·b. Los dos términos del medio son iguales, por eso aparece 2ab. Geométricamente, es un cuadrado de lado a + b partido en 4 piezas.'],
      ['¿Por qué (a + b)(a − b) = a² − b²?','Al multiplicar aparecen −ab y +ab, que se anulan. Solo quedan a² y −b².'],
      ['¿Para qué memorizar productos notables?','Porque leídos al revés son factorizaciones. Si ves x² − 9, reconoces (x + 3)(x − 3) al instante.']],
    rec:['Identifica si es un producto notable; si lo es, usa la fórmula directa.','Si no, multiplica cada término del primero por cada término del segundo.','Cuida los signos en cada producto.','Junta los términos semejantes y ordena por grado.'],
    w:[['Es la propiedad distributiva aplicada dos veces: cada término se multiplica con todos los del otro paréntesis.','Al multiplicar x por x los exponentes se suman: x². El signo de 2·(−4) es negativo.','−12x y 2x son semejantes (ambos llevan x): −12 + 2 = −10.'],
       ['(a + b)³ = a³ + 3a²b + 3ab² + b³ con a = x y b = 2.','Con b = −2, los términos con potencia impar de b cambian de signo.','El signo menos delante del paréntesis multiplica a cada término por −1.','x³ se cancela con −x³ y 12x con −12x; 6x² + 6x² = 12x² y 8 + 8 = 16.']]},
  T5:{pq:[['¿Por qué factorizar ayuda a resolver ecuaciones?','Si A·B = 0, uno de los dos tiene que ser 0: ningún producto de números distintos de 0 da 0. Así una ecuación difícil se divide en ecuaciones simples.'],
      ['¿Por qué buscar dos números que sumen b y multipliquen c?','Porque (x + p)(x + q) = x² + (p + q)x + pq. Comparando con x² + bx + c, se necesita p + q = b y pq = c.'],
      ['¿Por qué empezar con el factor común?','Simplifica todo lo demás: deja números más chicos y a veces revela una diferencia de cuadrados escondida.'],
      ['¿Cómo sé que factoricé bien?','Multiplica tus factores: si vuelves al polinomio original, está bien. Es la comprobación más rápida.']],
    rec:['¿Hay factor común? Sácalo primero.','¿Dos términos con resta de cuadrados? Diferencia de cuadrados.','¿Tres términos? Trinomio cuadrado perfecto, x² + bx + c o aspa.','¿Cuatro términos? Agrupa de dos en dos.','Revisa si algún factor se puede seguir factorizando.'],
    w:[['2 divide a 2 y a 8, y x aparece en ambos términos (con la menor potencia, x¹).','x² − 4 = x² − 2²: es una resta de dos cuadrados.','Se pone todo junto: el factor común no se pierde.'],
       ['Los primeros términos de los factores deben multiplicar 6x² y los últimos −2.','El término del medio sale de los productos cruzados; si no da x, se prueba otra combinación.','Cada fila del aspa es un factor.']]},
  X1:{pq:[['¿Por qué el residuo de P(x) ÷ (x − r) es P(r)?','Siempre P(x) = (x − r)·Q(x) + R. Si reemplazas x = r, el primer término se anula porque (r − r) = 0, y queda P(r) = R.'],
      ['¿Por qué las raíces enteras dividen al término independiente?','Si P(x) = (x − r)·Q(x), el término independiente es (−r) por el término independiente de Q. Así que r tiene que ser un divisor de ese número.'],
      ['¿Por qué Ruffini funciona solo con x − r?','El esquema se basa en multiplicar por r y sumar, que es exactamente lo que pasa al dividir entre (x − r). Para dividir entre 2x − 1, primero se divide todo entre 2.'],
      ['¿Por qué se pone 0 en el grado que falta?','Cada columna representa una potencia de x. Si saltas una, todo queda corrido y los coeficientes se mezclan.']],
    rec:['Ordena el polinomio y completa con 0 los grados que faltan.','Si te piden el residuo, usa el teorema del resto: calcula P(r).','Para factorizar, prueba divisores del término independiente hasta que P(r) = 0.','Haz Ruffini con esa raíz y factoriza el cociente (que es de grado menor).'],
    w:[['x + 1 = x − (−1): por eso r = −1.','El teorema del resto evita hacer toda la división.','Potencia impar de −1 da −1; −2 por −1 da +2.'],
       ['Si hay una raíz entera, tiene que dividir a 6.','P(1) = 0 significa que el residuo es 0: la división es exacta.','Ruffini divide entre (x − 1) y baja un grado: de cúbico a cuadrático.','El cociente cuadrático se factoriza con la técnica de T5.','P(x) = (x − 1)·cociente, y el cociente ya está factorizado.']]},
  T7:{pq:[['¿Por qué puedo "pasar" un número al otro lado?','En realidad sumas o restas lo mismo en ambos lados. Si a los dos platos de una balanza les quitas 7, sigue equilibrada; "pasar restando" es un atajo de eso.'],
      ['¿Por qué multiplicar por el MCM quita los denominadores?','El MCM es múltiplo de todos los denominadores, así que cada fracción se simplifica a un número entero. Y como multiplicas los dos lados por lo mismo, la igualdad se mantiene.'],
      ['¿Por qué comprobar la solución?','Porque un error de signo no se nota hasta que reemplazas. Si ambos lados dan lo mismo, estás 100 % seguro.'],
      ['¿Cuándo una ecuación lineal no tiene solución?','Si al simplificar las x desaparecen y queda algo falso como 0 = 5. Si queda 0 = 0, cualquier x sirve.']],
    rec:['Quita paréntesis distribuyendo (cuidado con el signo menos).','Si hay fracciones, multiplica todo por el MCM.','Lleva las x a un lado y los números al otro.','Divide entre el coeficiente de x.','Comprueba en la ecuación original.'],
    w:[['Restar 2x y sumar 7 en ambos lados mantiene la balanza equilibrada.','5x − 2x = 3x y 8 + 7 = 15.','Dividir los dos lados entre 3 deja la x sola.'],
       ['12 es el MCM de 3 y 4: así desaparecen las fracciones.','El menos afecta a todo el paréntesis: −3·(−2) = +6.','4x − 3x = x y 4 + 6 = 10.','Restar 10 en ambos lados.','Reemplazar confirma que no hubo errores de signo.']]},
  T8:{pq:[['¿Por qué no puedo cancelar términos que se suman?','(x + 3)/3: el 3 de abajo divide a TODO el numerador, no solo al 3. Solo se cancela lo que multiplica a todo, es decir un factor.'],
      ['¿Por qué hay restricciones?','Dividir entre 0 no está definido. Aunque después de simplificar el factor desaparezca, la expresión original no existe en ese valor.'],
      ['¿Por qué aparecen soluciones falsas?','Al multiplicar por (x − 1) multiplicas por algo que puede ser 0. Eso puede agregar soluciones que no cumplen la ecuación original.'],
      ['¿Por qué factorizar antes de sumar?','Para encontrar el denominador común más simple, igual que el MCM con números.']],
    rec:['Anota las restricciones mirando los denominadores originales.','Factoriza numeradores y denominadores.','Para simplificar, cancela factores iguales.','Para resolver, multiplica todo por el denominador común.','Descarta las soluciones que violen las restricciones.'],
    w:[['x² − 9 es diferencia de cuadrados.','Factor común x en x² + 3x.','(x + 3) multiplica arriba y abajo, así que se puede cancelar.','Las restricciones se toman antes de cancelar: x = −3 también anulaba el original.'],
       ['x = 1 haría 0 los denominadores.','Multiplicar por (x − 1) elimina todas las fracciones a la vez.','Se agrupan las x: x − 2x = −1.','La única solución algebraica es justo el valor prohibido.']]},
  T9:{pq:[['¿De dónde sale la fórmula general?','De completar cuadrados en ax² + bx + c = 0: se divide entre a, se suma (b/2a)² a ambos lados y se saca raíz. El resultado es x = (−b ± √Δ)/(2a).'],
      ['¿Por qué el discriminante dice cuántas soluciones hay?','Es lo que va dentro de la raíz. Si es positivo hay dos valores (±), si es 0 el ± no cambia nada, y si es negativo no hay raíz real.'],
      ['¿Por qué no puedo dividir entre x?','Porque x podría ser 0, y dividir entre 0 no existe. Al hacerlo pierdes justamente la solución x = 0.'],
      ['¿Por qué hay dos soluciones?','Porque la parábola puede cortar al eje x en dos puntos: uno a cada lado del vértice.']],
    rec:['Pasa todo a un lado: ax² + bx + c = 0.','Si falta c, saca factor común x. Si falta b, despeja x².','Si no, intenta factorizar.','Si no sale, usa la fórmula general (primero Δ).','En problemas, descarta soluciones sin sentido (medidas negativas).'],
    w:[['Así (x + p)(x + q) da x² + (p + q)x + pq.','4 · (−3) = −12 y 4 + (−3) = 1.','Si un producto es 0, uno de los factores es 0.'],
       ['El área de un rectángulo es largo por ancho.','Para usar producto cero, todo debe estar igualado a 0.','−60 = 10·(−6) y 10 − 6 = 4.','Una longitud no puede ser negativa.','El largo es 4 más que el ancho.']]},
  T10:{pq:[['¿Por qué la solución es el cruce de las rectas?','Cada ecuación es el conjunto de puntos que la cumplen (una recta). El punto que cumple las dos está en ambas rectas: su intersección.'],
      ['¿Por qué sumar ecuaciones es válido?','Si A = B y C = D, entonces A + C = B + D. Sumas cantidades iguales a ambos lados.'],
      ['¿Cuándo uso sustitución y cuándo reducción?','Sustitución si una variable ya está despejada o tiene coeficiente 1. Reducción si los coeficientes son opuestos o fáciles de igualar.'],
      ['¿Qué significa que no tenga solución?','Que las rectas son paralelas: tienen la misma pendiente y nunca se cruzan. Al operar llegas a algo falso como 0 = 3.']],
    rec:['Ordena las ecuaciones: x, y = número.','Elige método: sustitución si hay coeficiente 1, reducción si se cancelan fácil.','Halla una variable y reemplaza para hallar la otra.','Comprueba en las dos ecuaciones.'],
    w:[['y y −y son opuestos: al sumar se cancelan.','14 ÷ 2 = 7.','Cualquiera de las ecuaciones sirve para hallar y.'],
       ['Una ecuación cuenta entradas y la otra cuenta dinero.','La primera ecuación tiene coeficientes 1: es fácil despejar.','Así queda una ecuación con una sola incógnita.','12a − 7a = 5a; 7·50 = 350.','Vuelves a la primera ecuación.']]},
  T11:{pq:[['¿Por qué se invierte el signo al multiplicar por un negativo?','Multiplicar por −1 refleja la recta numérica: 2 < 5 pero −2 > −5. El orden se da vuelta.'],
      ['¿Por qué |x| < 3 da un intervalo y |x| > 3 dos?','|x| es la distancia al 0. "Menos de 3" son los puntos cerca del 0: un tramo. "Más de 3" son los que están lejos, a la izquierda o a la derecha: dos tramos.'],
      ['¿Por qué en las cuadráticas se usan signos por intervalos?','Un producto solo cambia de signo cuando uno de sus factores pasa por 0. Entre raíces, el signo se mantiene; basta probar un punto de cada tramo.'],
      ['¿Paréntesis o corchete?','Corchete si el extremo cumple (≤ o ≥); paréntesis si no (< o >) y siempre con ∞, que no es un número.']],
    rec:['Despeja como en una ecuación.','Si multiplicas o divides por negativo, invierte el signo.','Con valor absoluto: < da un intervalo, > da dos.','Con cuadráticas: factoriza, ubica las raíces y analiza signos.','Escribe la respuesta como intervalo.'],
    w:[['Restar 3 en ambos lados no cambia la desigualdad.','Dividir entre negativo da vuelta el orden de la recta.','≥ incluye el −3: corchete.'],
       ['Estar a más de 5 del 0 es estar a la derecha de 5 o a la izquierda de −5.','Sumar 1 y dividir entre 2 (positivo, no se invierte).','Igual, con el otro caso.','"o" significa unión de los dos tramos.']]},
  T12:{pq:[['¿Por qué la pendiente es Δy entre Δx?','Mide cuánto sube la recta por cada unidad que avanza hacia la derecha. En una recta ese cociente es igual entre cualquier par de puntos.'],
      ['¿Por qué las perpendiculares cumplen m₁·m₂ = −1?','Girar una recta 90° convierte el avance (1, m) en (−m, 1), cuya pendiente es −1/m. Multiplicadas dan −1.'],
      ['¿De dónde sale la fórmula de distancia?','Δx y Δy son los catetos de un triángulo rectángulo y la distancia es la hipotenusa: Pitágoras.'],
      ['¿Por qué usar punto-pendiente?','Porque viene directo de la definición de pendiente: (y − y₁)/(x − x₁) = m. Solo necesitas un punto y m.']],
    rec:['Halla la pendiente (con dos puntos o despejando y).','Si es paralela, la misma m; si es perpendicular, −1/m.','Usa y − y₁ = m(x − x₁) con un punto conocido.','Despeja y para dejarla como y = mx + b.'],
    w:[['Son los catetos del triángulo rectángulo entre los puntos.','La distancia es la hipotenusa.','3, 4, 5 es un triángulo rectángulo clásico.'],
       ['En y = mx + b, m es el número que acompaña a x.','El producto de las pendientes debe ser −1: (−2)·(1/2) = −1.','Se usa el punto dado (4, 1).','Distribuye 1/2 y suma 1.']]},
  T13:{pq:[['¿Por qué una función no puede dar dos y para el mismo x?','Porque una función debe ser predecible: cada entrada produce una única salida. Si no, no sabrías qué valor usar.'],
      ['¿Por qué el vértice está en x = −b/(2a)?','La parábola es simétrica y sus raíces están en (−b ± √Δ)/(2a). El punto medio entre ellas, donde está el eje, es −b/(2a).'],
      ['¿Por qué el radicando debe ser ≥ 0?','Ningún número real al cuadrado da negativo, así que la raíz cuadrada de un negativo no existe en los reales.'],
      ['¿Cómo sé el rango de una parábola?','Si abre hacia arriba, el vértice es el punto más bajo: rango [k, +∞). Si abre hacia abajo, es el más alto: (−∞, k].']],
    rec:['Dominio: busca denominadores (≠ 0) y raíces pares (≥ 0).','Para parábolas, halla el vértice.','Mira hacia dónde abre (signo de a) para el rango.','Cortes: x = 0 para el eje y; f(x) = 0 para el eje x.'],
    w:[['La raíz cuadrada solo acepta números ≥ 0.','Sumar 3 en ambos lados.','El corchete incluye al 3 porque √0 sí existe.'],
       ['Es el eje de simetría de la parábola.','Se reemplaza x = 2 en la función.','a positivo: las ramas suben, el vértice es el mínimo.','En el eje y, x vale 0.']]},
  X10:{pq:[['¿Por qué f(x − h) se mueve a la derecha?','Para obtener el mismo valor que f tenía en x = 0, ahora necesitas x = h. Todo ocurre h unidades después: a la derecha.'],
      ['¿Por qué −f(x) refleja sobre el eje x?','Cada altura y se vuelve −y: lo que estaba arriba queda abajo a la misma distancia.'],
      ['¿Por qué importa < o ≤ en una función a trozos?','Indica a qué trozo pertenece exactamente el punto de unión. Solo un trozo puede incluirlo.'],
      ['¿Qué significa que sea continua?','Que los trozos se unen sin salto: los dos trozos valen lo mismo en el punto de unión.']],
    rec:['Identifica la función base (x², |x|, √x).','Lo que está dentro del paréntesis mueve en horizontal (al revés del signo).','Lo que está fuera mueve en vertical (con el signo).','Un menos afuera refleja; un número afuera estira.','En trozos, ubica primero en qué tramo está x.'],
    w:[['−2 cumple x < 1.','3 cumple x ≥ 1.'],
       ['Multiplica todas las alturas por −1.','Para que x + 3 valga 0 se necesita x = −3: el vértice se va a la izquierda.','El + 4 se suma a la salida: sube.','Se aplican los movimientos al vértice (0, 0).']]},
  T14:{pq:[['¿De dónde sale la ecuación de la circunferencia?','Un punto (x, y) está en ella si su distancia al centro es r: √((x − h)² + (y − k)²) = r. Elevando al cuadrado se obtiene la ecuación.'],
      ['¿Por qué completar cuadrados?','x² − 6x no muestra el centro, pero (x − 3)² − 9 sí. Completar el cuadrado convierte la forma general en una que se lee directo.'],
      ['¿Por qué la parábola tiene foco?','Todos sus puntos están a la misma distancia del foco y de la directriz. Por eso las antenas parabólicas concentran la señal en el foco.'],
      ['¿Qué indica el signo de p?','Hacia dónde abre: p > 0 hacia arriba (o derecha), p < 0 hacia abajo (o izquierda).']],
    rec:['Agrupa x con x y y con y; pasa el número al otro lado.','Completa cuadrados sumando (b/2)² a ambos lados.','Circunferencia: lee centro (h, k) y radio √(lado derecho).','Parábola: deja el cuadrado a un lado y factoriza el otro para leer 4p.'],
    w:[['El radio es la distancia de cualquier punto de la circunferencia al centro.','Pitágoras: 9 + 16 = 25.','h = −1 da x + 1 y k = 4 da y − 4.'],
       ['La variable al cuadrado (y) se queda sola a un lado.','(−4 ÷ 2)² = 4 se suma en ambos lados.','Se saca factor común 8 para ver la forma (y − k)² = 4p(x − h).','Está al cuadrado la y: el eje es horizontal y p > 0 abre a la derecha.','El foco está sobre el eje, a distancia p del vértice.']]},
  T15:{pq:[['¿Por qué se multiplica fila por columna?','Una matriz representa una transformación. Multiplicar es aplicar una tras otra, y la fila por columna es justo lo que combina los coeficientes correctamente.'],
      ['¿Por qué A·B no es igual a B·A?','Aplicar transformaciones en distinto orden da resultados distintos, igual que ponerse medias y zapatos en diferente orden.'],
      ['¿Por qué deben coincidir columnas de A con filas de B?','Cada elemento del producto empareja los números de una fila de A con los de una columna de B; si no tienen el mismo largo, sobran números.'],
      ['¿Para qué sirve la identidad?','Es el "1" de las matrices: no cambia nada al multiplicar. Se usa para definir la inversa: A·A⁻¹ = I.']],
    rec:['Revisa los órdenes antes de operar.','Suma y resta: posición por posición.','Escalar: multiplica cada elemento.','Producto: fila i por columna j, multiplicando pares y sumando.'],
    w:[['Un escalar afecta a todos los elementos.','Se restan los elementos que ocupan la misma posición.','Cada posición se calcula por separado.'],
       ['La fila 1 de la primera combina con cada columna de la segunda.','Igual con la fila 2.','El resultado (i, j) se coloca en la fila i y columna j.']]},
  X9:{pq:[['¿Por qué det = 0 significa que no hay inversa?','La inversa lleva un factor 1 ÷ det. Si det = 0, esa división no existe. Geométricamente, la matriz "aplasta" el plano y no se puede deshacer.'],
      ['¿De dónde sale la regla de Cramer?','De resolver el sistema general por reducción: al despejar x aparece un cociente de determinantes.'],
      ['¿Qué significa el determinante?','En 2×2 es el factor por el que cambia el área. Si es 0, el área se vuelve 0: todo cae sobre una recta.'],
      ['¿Por qué Sarrus solo sirve en 3×3?','Porque es un atajo de cofactores que solo coincide en 3×3. Para 4×4 hay que usar cofactores.']],
    rec:['Calcula det A primero: si es 0, no hay inversa ni solución única.','Inversa 2×2: intercambia a y d, cambia signo a b y c, divide entre det.','Cramer: reemplaza la columna de la incógnita por los resultados.','Divide cada determinante entre det A.'],
    w:[['Diagonal principal menos diagonal secundaria.','La columna de x se reemplaza por los resultados 7 y 2.','Ahora se reemplaza la columna de y.'],
       ['Se repiten las dos primeras columnas a la derecha y se multiplican tres diagonales hacia abajo.','Las tres diagonales hacia arriba van con signo menos.','Diferencia de ambas sumas.']]},
  T16:{pq:[['¿Por qué log(A·B) = log A + log B?','Porque los logaritmos son exponentes, y al multiplicar potencias de la misma base los exponentes se suman.'],
      ['¿Por qué el logaritmo solo existe para x > 0?','bʸ es siempre positivo si b > 0. No hay exponente que haga que una potencia positiva dé 0 o un negativo.'],
      ['¿Por qué igualar bases permite igualar exponentes?','La función bˣ es inyectiva: nunca repite un valor. Si b^m = b^n, necesariamente m = n.'],
      ['¿Qué tiene de especial e?','Es la base donde la función crece con una rapidez igual a su propio valor. Por eso aparece en interés continuo, poblaciones y derivadas.']],
    rec:['Si puedes, escribe todo con la misma base e iguala exponentes.','Si no, saca logaritmo a ambos lados.','En ecuaciones logarítmicas, junta los logaritmos con las propiedades.','Pasa a forma exponencial.','Descarta las soluciones con argumento ≤ 0.'],
    w:[['81 = 3·3·3·3.','Si las potencias son iguales y la base también, los exponentes son iguales.','Restar 1.'],
       ['Propiedad del producto: log₂x + log₂(x − 2) = log₂(x·(x − 2)), porque los logaritmos son exponentes y al multiplicar potencias de 2 los exponentes se suman.','log₂(algo) = 3 significa que algo = 2³.','Ahora es una cuadrática que se factoriza.','log₂(−2) no existe.']]},
  T17:{pq:[['¿Por qué puedo cancelar (x − a) si x → a?','El límite mira lo que pasa cerca de a, no en a. Para x ≠ a, (x − a) ≠ 0 y cancelar es válido.'],
      ['¿Por qué 0/0 no es un resultado?','Porque 0/0 puede terminar siendo cualquier valor: depende de qué tan rápido van a 0 numerador y denominador. Hay que simplificar para descubrirlo.'],
      ['¿Por qué al infinito mandan los términos de mayor grado?','Para x enorme, x³ es muchísimo mayor que x² o x. Los demás términos se vuelven insignificantes.'],
      ['¿Por qué importa la continuidad?','Las funciones continuas se pueden evaluar directo en el límite. Además, muchas propiedades del cálculo (como hallar máximos) solo valen para funciones continuas.']],
    rec:['Reemplaza directo.','Si sale un número, ese es el límite.','Si sale 0/0: factoriza y cancela, o racionaliza.','Si sale k/0: revisa los laterales (puede ser ±∞).','Si x → ∞: compara grados.'],
    w:[['Los polinomios son continuos en todo punto.','3·4 − 2 + 1 = 11.'],
       ['Numerador y denominador tienden a 0: hay que simplificar.','El conjugado elimina la raíz del numerador.','x ≠ 4 mientras se acerca, así que se puede cancelar.','Ya no hay 0/0: reemplazar es válido.']]},
  T18:{pq:[['¿De dónde sale (xⁿ)′ = n·x^(n−1)?','Del límite de [(x + h)ⁿ − xⁿ]/h. Al desarrollar (x + h)ⁿ, el único término que sobrevive al hacer h → 0 es n·x^(n−1)·h, que dividido entre h da n·x^(n−1).'],
      ['¿Por qué la derivada es una pendiente?','Es el límite de la pendiente de rectas secantes cuando los dos puntos se juntan: queda la pendiente de la tangente.'],
      ['¿Por qué en un máximo la derivada es 0?','Justo antes la función sube (f′ > 0) y justo después baja (f′ < 0). Al pasar de positivo a negativo, f′ vale 0: la tangente es horizontal.'],
      ['¿Por qué la regla de la cadena multiplica?','Si g cambia 3 veces más rápido que x y f cambia 2 veces más rápido que g, f cambia 2·3 = 6 veces más rápido que x.']],
    rec:['Identifica la forma: suma, producto, cociente o composición.','Aplica la regla correspondiente.','Deriva cada término con la regla de la potencia.','Simplifica.','Para tangentes: punto con f(a), pendiente con f′(a).'],
    w:[['Regla de la potencia: el exponente baja multiplicando y se reduce en 1.','x¹ se vuelve 1 y una constante no cambia, su derivada es 0.','Se deriva término a término porque la derivada de una suma es la suma de derivadas.'],

function donut(segs, size, sw, inner){
  const r=(size-sw)/2, C=2*Math.PI*r, tot=segs.reduce((a,s)=>a+s[0],0); let off=0, s='';
  const gap=segs.filter(x=>x[0]>0).length>1?2:0;
  if(tot>0) segs.forEach(([v,c],i)=>{ const len=v/tot*C; if(len<=0) return; s+=`<circle class="dn-seg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-dasharray="${Math.max(0.5,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" style="animation-delay:${i*.1}s"/>`; off+=len; });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="donut"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="${sw}"/>${s}${inner||''}</svg>`;
}
function xpCard(){
  const xi=xpInfo(), parts=xi.parts.filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]), mx=Math.max(1,...parts.map(p=>p[1]));
  return `<div class="card"><h2>⭐ Nivel y experiencia</h2><div class="lvl-row"><div class="lvl-badge"><span>Nivel</span><b>${xi.L}</b></div><div style="flex:1;min-width:0"><b style="font-size:16px">${esc(xi.name)}</b><div class="muted">${xi.xp} XP en total · ${xi.need-xi.cur} XP para el nivel ${xi.L+1}</div><div class="xpbar" style="margin-top:7px"><i style="width:${xi.pct}%"></i></div></div></div>
    ${parts.length?`<h3 class="mini-h">De dónde viene tu XP</h3>${parts.map(([l,v,c])=>`<div class="ph-row"><div class="t"><span style="color:var(--tx)">${esc(l)}</span><span>${Math.round(v)} XP</span></div><div class="pbar" style="--c:${c}"><i style="width:${v/mx*100}%;background:${c}"></i></div></div>`).join('')}`:'<div class="muted" style="margin-top:8px">Resuelve ejercicios, termina lecciones y registra minutos para ganar XP.</div>'}
    <div class="muted" style="margin-top:6px;font-size:12px">Dominar un tema vale 150 XP; cada ejercicio, 2; cada minuto de estudio, 1.</div></div>`;
}
function accuracyCard(){
  const all=accRange(), tot=all.ok+all.bad, t=today();
  const wk=accRange(iso(addDays(t,-6)),iso(t)), pw=accRange(iso(addDays(t,-13)),iso(addDays(t,-7)));
  const pc=x=>x.ok+x.bad?Math.round(x.ok/(x.ok+x.bad)*100):null, p=pc(all), pwk=pc(wk), ppw=pc(pw);
  let bars='', mx=1; const a=accLog(), days=[]; for(let i=13;i>=0;i--){ const d=addDays(t,-i), r=a[iso(d)]||{}; days.push([d,+r.ok||0,+r.bad||0]); mx=Math.max(mx,(+r.ok||0)+(+r.bad||0)); }
  days.forEach(([d,o,b],i)=>{ const x=i*22+4, ho=o/mx*58, hb=b/mx*58; bars+=`<g class="acc-b" style="animation-delay:${i*.03}s">${o?`<rect x="${x}" y="${66-ho}" width="16" height="${ho}" rx="3" fill="#4ade80"/>`:''}${b?`<rect x="${x}" y="${66-ho-hb-(o?1.5:0)}" width="16" height="${hb}" rx="3" fill="#f87171"/>`:''}${!o&&!b?`<rect x="${x}" y="64" width="16" height="2" rx="1" fill="var(--line)"/>`:''}<title>${esc(fmt(d,{day:'numeric',month:'short'}))}: ${o} bien, ${b} mal</title></g><text x="${x+8}" y="80" text-anchor="middle" font-size="9" fill="var(--tx3)">${d.getDate()}</text>`; });
  const trend = pwk!==null&&ppw!==null ? (pwk-ppw) : null;
  return `<div class="card"><h2>🎯 Precisión</h2>${tot?`<div class="acc-top"><div class="acc-d">${donut([[all.ok,'#4ade80'],[all.bad,'#f87171']],104,12)}<div class="acc-c"><b>${p}%</b><span>aciertos</span></div></div>
    <div class="acc-l"><div><i style="background:#4ade80"></i>${all.ok} bien</div><div><i style="background:#f87171"></i>${all.bad} para repasar</div><div class="muted" style="margin-top:4px">Últimos 7 días: <b style="color:var(--tx)">${pwk===null?'—':pwk+' %'}</b>${trend!==null?` <span class="trend ${trend>=0?'up':'down'}">${trend>=0?'▲':'▼'} ${Math.abs(trend)}</span>`:''}</div></div></div>
    <svg viewBox="0 0 312 86" style="width:100%;margin-top:10px">${bars}</svg>`:`<div class="muted">Responde en Practicar, Teoría o un examen y aquí verás tu porcentaje de aciertos día a día.</div>`}</div>`;
}
function phaseTimeCard(){
  const per={}; S.nodes.forEach(n=>{ const m=+(S.progress[n.id]||{}).minutes||0; if(m>0) per[n.phase]=(per[n.phase]||0)+m; });
  const segs=Object.entries(per).sort((a,b)=>b[1]-a[1]), tot=segs.reduce((a,s)=>a+s[1],0);
  if(!tot) return `<div class="card"><h2>🧭 Tiempo por fase</h2><div class="muted">Elige un tema al registrar minutos (o usa el pomodoro y los exámenes) y verás en qué fases inviertes tu tiempo.</div></div>`;
  const hm=m=>m>=60?Math.floor(m/60)+' h '+(m%60?m%60+' min':''):m+' min';
  return `<div class="card"><h2>🧭 Tiempo por fase</h2><div class="acc-top"><div class="acc-d">${donut(segs.map(([k,m])=>[m,PHASES[k].color]),104,14)}<div class="acc-c"><b>${tot>=60?String(Math.round(tot/6)/10).replace('.',','):tot}</b><span>${tot>=60?'horas':'min'}</span></div></div>
    <div class="acc-l">${segs.map(([k,m])=>`<div><i style="background:${PHASES[k].color}"></i><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(PHASES[k].name.split(' · ')[1]||k)}</span><b>${Math.round(m/tot*100)}%</b></div>`).join('')}</div></div>
    <div class="muted" style="margin-top:8px;font-size:12px">Solo cuenta los minutos registrados con tema. Total: ${hm(tot)}.</div></div>`;
}
function badgesCard(){
  const got=badgesGot(), n=BADGES.filter(b=>got[b.id]).length;
  return `<div class="card" id="badgesCard"><h2>🏅 Logros · ${n}/${BADGES.length}</h2><div class="bgrid">${BADGES.map(b=>{ const s=badgeState(b), on=!!got[b.id]; return `<div class="bd ${on?'on':''}" title="${esc(b.d)}">${hexBadge(b,on,54)}<b>${esc(b.n)}</b>${on?`<small>${esc(fmt(ymd(got[b.id]),{day:'numeric',month:'short'}))}</small>`:`<span class="mini"><i style="width:${Math.round(s.r*100)}%"></i></span>`}</div>`; }).join('')}</div><div class="muted" style="margin-top:10px;font-size:12px">Toca y mantén un logro para ver qué pide.</div></div>`;
}

/* ---------- Microinteracciones ---------- */
document.addEventListener('pointerdown', e=>{
  if(RM()) return; const b=e.target.closest('.btn,.qa,.chip,.nchip,.stbtn,.hm-row,.ls-chip,.theme-b'); if(!b||b.disabled) return;
  const r=b.getBoundingClientRect(), d=Math.max(r.width,r.height)*2.2, s=document.createElement('span'); s.className='rip';
  s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`; b.appendChild(s); setTimeout(()=>s.remove(),650);
}, {passive:true});
document.addEventListener('click', e=>{ const b=e.target.closest('[data-lesson]'); if(b){ openLesson(b.dataset.lesson); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && LS) closeLesson(); });
(function(){ let y0=null, dy=0;
  panel.addEventListener('touchstart',e=>{ if(innerWidth>=900 || !e.target.closest('.grab') || e.target.closest('button')) return; y0=e.touches[0].clientY; dy=0; panel.style.transition='none'; },{passive:true});
  panel.addEventListener('touchmove',e=>{ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); panel.style.transform=`translateY(${dy}px)`; },{passive:true});
  const end=()=>{ if(y0===null) return; y0=null; panel.style.transition=''; panel.style.transform=''; if(dy>80){ buzz(8); closePanel(); } };
  panel.addEventListener('touchend',end); panel.addEventListener('touchcancel',end);
})();
const EMO_RE=/^((?:\p{Extended_Pictographic}|[∫Σ])(?:️|‍\p{Extended_Pictographic})*)\s*/u;
function iconize(root){ root.querySelectorAll('.card>h2:not([data-i])').forEach(h=>{ h.dataset.i='1'; const t=h.firstChild; if(!t||t.nodeType!==3) return; const m=t.data.match(EMO_RE); if(!m) return; t.data=t.data.slice(m[0].length); const s=document.createElement('span'); s.className='hic'; s.setAttribute('aria-hidden','true'); s.textContent=m[1]; h.insertBefore(s,t); }); }
try{ const mainEl=document.querySelector('main'); new MutationObserver(()=>iconize(mainEl)).observe(mainEl,{childList:true,subtree:true}); }catch(e){}

let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
let curView='vHome';
const ORDER=['vHome','vTree','vStudy','vProg','vEval','vMalla','vEdit'];
function goView(v){
  if(!document.getElementById(v)) v='vHome';
  const prev=curView; curView=v;
  document.querySelectorAll('nav button').forEach(x=>{ const on=x.dataset.v===v; x.classList.toggle('active',on); if(on) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current'); });
  document.body.classList.toggle('malla', v==='vMalla'); document.body.classList.toggle('home', v==='vHome'); if(v==='vMalla') ensureMalla();
  try{ localStorage.setItem('arbolAli.app', v==='vMalla'?'malla':'mat'); }catch(e){}
  if(v==='vTree'){ renderHeader(); renderTree(); if(!firstFit) requestAnimationFrame(()=>{ fitView(); firstFit=!!svg.getBoundingClientRect().width; if(firstFit&&!RM()){ world.classList.add('intro'); setTimeout(()=>world.classList.remove('intro'),1400); } }); }
  else if(v!=='vHome'&&v!=='vMalla') renderHeader();
  document.querySelectorAll('.view').forEach(x=>{ x.classList.toggle('active',x.id===v); x.classList.remove('enter'); });
  const cv=document.getElementById(v);
  if(prev!==v){ cv.style.setProperty('--dx',(ORDER.indexOf(v)>=ORDER.indexOf(prev)?26:-26)+'px'); void cv.offsetWidth; cv.classList.add('enter'); clearTimeout(cv._et); cv._et=setTimeout(()=>cv.classList.remove('enter'),1300); buzz(5); }
  renderCurrent(); if(prev!==v && v==='vHome') countUp(document.getElementById('homeWrap'));
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>goView(b.dataset.v));
function renderCurrent(){ if(curView==='vHome') renderHome(); else if(curView==='vStudy') renderStudy(); else if(curView==='vProg') renderProgress(); else if(curView==='vEval') renderEvals(); else if(curView==='vEdit') renderEditor(); }
function refreshAll(){ renderHeader(); renderTree(); renderCurrent(); }
let firstFit=false;
function setAppH(){ const h=(window.visualViewport&&!/input|textarea|select/i.test((document.activeElement||{}).tagName||''))?Math.round(visualViewport.height):innerHeight; document.documentElement.style.setProperty('--appH', Math.max(h,innerHeight*0.6)+'px'); }
setAppH(); addEventListener('resize',setAppH); addEventListener('orientationchange',()=>setTimeout(setAppH,250)); if(window.visualViewport) visualViewport.addEventListener('resize',setAppH);
window.addEventListener('resize', ()=>{ if(!firstFit){ fitView(); } });
meta(); save(); autoSnapshot();
renderHeader(); renderTree(); renderHome(true); try{ if(localStorage.getItem('arbolAli.app')==='malla') showApp('malla'); }catch(e){}
setTimeout(backupCheck, 1200);
// Si la app queda abierta y cambia el día, actualiza racha, plan y semana al volver.
let lastDay=iso(today());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState!=='visible') return; const d=iso(today()); if(d===lastDay) return; lastDay=d; autoSnapshot(); refreshAll(); setTimeout(backupCheck, 800); });
requestAnimationFrame(()=>{ fitView(); firstFit = !!svg.getBoundingClientRect().width; });
</script>
