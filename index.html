<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Árbol de Matemática</title>
<script>
try{ const t=localStorage.getItem('arbolAli.theme'); if(t==='noche'||t==='verde'||t==='oscuro'||t==='calido') document.documentElement.dataset.theme=t; }catch(e){}
if(/^https?:$/.test(location.protocol)){
  document.write('<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">');
  if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Árbol Ali">
<style>
:root{
  /* Medianoche (por defecto): casi negro neutro, superficies escalonadas y un solo acento violeta */
  --bg:#08090b; --bg2:#111215; --bg3:#1a1b20; --line:#24252b; --line2:#33353d; --tx:#ededf0; --tx2:#a2a3ad; --tx3:#6f717c;
  --ok:#4ade80; --mid:#facc15; --bad:#f87171; --acc:#8b7cff; --accG:linear-gradient(180deg,#9d90ff,#7563f5); --onAcc:#0c0920;
  --glass:#111215e6; --bg0:#060709; --card-hi:#15161a; --hl:#ffffff0b; --shadow:0 12px 30px -16px #000;
  --node:#141519; --nodeL:#0f1013; --nodeLs:#3a3c44; --nodeLt:#7b7d88; --dot:#1c1d22; --edge:#43454e;
  --cur:#1c1a33; --info:#1d1938; --infoTx:#d3ccff; --link:#ab9fff;
  --au1:#6d5cff47; --au2:#2f8bff33; --au3:#c04bff2b;
}
:root[data-theme="calido"]{--bg:#0e0c0a; --bg2:#171411; --bg3:#221d18; --line:#342c24; --line2:#4a3f34; --tx:#f4ede4; --tx2:#bfb1a1; --tx3:#8a7c6c;   --ok:#4ade80; --mid:#facc15; --bad:#f87171; --acc:#f2a65a; --accG:linear-gradient(180deg,#f7b878,#e88f45); --onAcc:#1d1207;   --glass:#171411e8; --bg0:#0a0807; --card-hi:#1d1915; --hl:#ffffff0d; --shadow:0 10px 28px -14px #000;   --node:#1b1612; --nodeL:#14110e; --nodeLs:#4d4237; --nodeLt:#8f8170; --dot:#2b231b; --edge:#5c4d3f;   --cur:#2b2016; --info:#36250f; --infoTx:#fcd9a8; --link:#f5b97a; --au1:#c2621a3d; --au2:#8a3d122e; --au3:#f2a65a24;}
:root[data-theme="oscuro"]{--au1:#3b5bdb2e;--au2:#1c7ed624;--au3:transparent;--bg:#0d1017;--bg2:#151a23;--bg3:#1d2330;--line:#2a3242;--line2:#3a4252;--tx:#e6e8ee;--tx2:#9aa3b2;--tx3:#6b7383;--acc:#7aa2ff;--accG:var(--acc);--onAcc:#0b1020;--glass:#151a23e6;--bg0:#090c12;--card-hi:var(--bg2);--hl:#ffffff08;--node:#141925;--nodeL:#161a22;--nodeLs:#4a5160;--nodeLt:#7d8595;--dot:#1c2230;--edge:#465064;--cur:#1a2338;--info:#172443;--infoTx:#bfd0ff;--link:#9ab8ff}
:root[data-theme="noche"]{--au1:#3b6cff38;--au2:#5b8cff26;--au3:#7a5cff1f;--line2:#33467a;--accG:var(--acc);--onAcc:#0b1020;--card-hi:#131f3b;--hl:#ffffff0a;--node:#121b34;--nodeL:#0f172b;--nodeLs:#3d4d78;--nodeLt:#7f8cb3;--dot:#16213f;--edge:#41548a;--cur:#18264d;--info:#172443;--infoTx:#bfd0ff;--link:#9ab8ff;--bg:#0a1020;--bg2:#101a33;--bg3:#18254a;--line:#24345f;--tx:#e8edff;--tx2:#a3b0d6;--tx3:#6f7ca3;--acc:#8fb4ff;--glass:#101a33e6;--bg0:#070c19}
:root[data-theme="verde"]{--au1:#1fae7a33;--au2:#2dd4bf24;--au3:#0e7a5a1f;--line2:#2f5440;--accG:var(--acc);--onAcc:#052019;--card-hi:#13221c;--hl:#ffffff0a;--node:#12201a;--nodeL:#0e1814;--nodeLs:#3b5a4a;--nodeLt:#7f9a8c;--dot:#15261e;--edge:#3f6352;--cur:#173026;--info:#0f2e26;--infoTx:#b5f5e4;--link:#7ee8d3;--bg:#0a120f;--bg2:#101c17;--bg3:#172a22;--line:#23402f;--tx:#e6f2ec;--tx2:#9db8aa;--tx3:#6a8577;--acc:#5eead4;--glass:#101c17e6;--bg0:#07100c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;height:100%;}
body{background:transparent;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"tnum" 0}
h1,h2,h3,.big{letter-spacing:-.01em}.big{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;height:var(--appH,100dvh);overflow:hidden}
#mallaFrame{display:block;width:100%;height:100%;border:0;background:var(--bg)}
#vMalla{padding:0;overflow:hidden}
body.malla header{display:none}
header{grid-row:1} main{grid-row:2} nav{grid-row:3}
/* Cabecera */
header{display:flex;gap:10px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);position:relative;z-index:3;border-bottom:1px solid var(--line);box-shadow:0 6px 18px -12px #000}
#rankIcon{flex:0 0 auto;width:44px;height:50px}
.hd-txt{min-width:0;flex:1}
.hd-rank{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-rank small{font-weight:500;color:var(--tx2);font-size:12px;margin-left:4px}
.hd-next{font-size:12.5px;color:var(--tx2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hd-next b{color:var(--tx)}
.hd-days{flex:0 0 auto;text-align:center;background:var(--bg3);box-shadow:inset 0 1px 0 var(--hl);border-radius:10px;padding:4px 8px;line-height:1.1}
.hd-days b{display:block;font-size:18px}
.hd-days span{font-size:10.5px;color:var(--tx2)}
main{position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none;padding:14px 14px 30px}
.view.active{display:block}
#vTree{padding:0;overflow:hidden}
/* Navegación */
nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:color-mix(in srgb,var(--bg2) 86%,transparent);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));position:relative;z-index:6;min-height:62px}
nav button{background:none;border:0;padding:5px 0 4px;color:var(--tx2);font-size:10.5px;font-weight:600;letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
nav button>span:not(.badge){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav .ic{width:46px;height:28px;padding:3px 12px;border-radius:999px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:background-color .25s,color .25s,transform .25s var(--ez)}
nav button.active{color:var(--tx)}
nav button.active .ic{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
nav button{position:relative}
nav .badge{position:absolute;top:2px;left:calc(50% + 8px);background:#f87171;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px;line-height:1.3}
.hd-days .stk{display:block;font-size:11px;color:#fbd3ab;margin-top:2px}

/* Árbol */
#tree{width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none;background:
 radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.5px) 0 0/22px 22px}
.node{cursor:pointer;transition:opacity .2s}
.node .box{stroke-width:2}
.node text{pointer-events:none}
.node .nid{font-weight:800;font-size:12px}
.node .nwk{font-size:10.5px}
.node .ntl{font-size:12.5px;font-weight:600}
.st-lock .box{fill:var(--nodeL);stroke:var(--nodeLs)}
.st-lock text{fill:var(--nodeLt)}
.st-avail .box{fill:var(--node)}
.st-avail text{fill:var(--tx)}
.st-avail .nid,.st-prog .nid{fill:var(--c)}
.st-prog .box{fill:var(--node);stroke-width:3}
.st-prog .over{fill:var(--c);opacity:.22}
.st-prog text{fill:var(--tx)}
.st-dom .box{fill:var(--c)}
.st-dom text{fill:#10131a}
.node .bar-bg{fill:#00000055}
.node .bar{fill:var(--c)}
.st-dom .bar{fill:#10131a;opacity:.45}
.node.dim{opacity:.18}
.node.sel .box{stroke:#fff;stroke-width:3.5}
.node.hl .box{filter:drop-shadow(0 0 6px var(--c))}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6;transition:opacity .2s}
.edge.dash{stroke-dasharray:6 5}
.edge.dim{opacity:.12}
.edge.hl{stroke:var(--tx);stroke-width:2.4}
.edge.path{stroke:#facc15;stroke-width:2.6}
.now-ring{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:4 4;opacity:.8;animation:spin 6s linear infinite}
@keyframes spin{to{stroke-dashoffset:-80}}
.now-tag{font-size:10.5px;font-weight:700;fill:#fff}
.side-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#4ade80;opacity:.8}
.lvl-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.75}
.tb{position:absolute;display:flex;gap:6px;flex-wrap:wrap}
.tb-top{top:10px;left:10px;right:10px}
@media (max-width:600px){.tb-top .chip{flex:1 1 0;line-height:1.2;font-size:12px;padding:6px 8px}}
.chip{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(4px);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--tx)}
.chip.on{background:#facc15;color:#111;border-color:#facc15;font-weight:700}
.tb-zoom{right:10px;bottom:12px;flex-direction:column}
.zbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:20px;color:var(--tx)}
.legend{position:absolute;left:10px;bottom:12px;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:11px;color:var(--tx2);display:grid;grid-template-columns:auto auto;gap:3px 10px}
.legend.min{grid-template-columns:auto}.legend.min div{display:none}.legend.min::before{content:'Leyenda ▸'}
@media (max-width:600px){.legend{font-size:10px}}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:2px solid var(--acc)}
.banner{flex:1 0 100%;background:#2a2410f2;border:1px solid #facc1580;color:#fde68a;border-radius:12px;padding:9px 12px;font-size:13px;display:none}
.banner.show{display:block}
/* Panel de nodo */
#panel{position:absolute;left:0;right:0;bottom:0;max-height:74%;overflow:auto;background:var(--bg2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px #0008;transform:translateY(105%);transition:transform .25s ease;padding:0 16px 20px;z-index:5;overscroll-behavior:contain}
#panel.open{transform:none}
.grab{position:sticky;top:0;background:var(--bg2);padding:10px 0 8px;z-index:2;display:flex;align-items:flex-start;gap:10px}
.grab::before{content:"";position:absolute;left:50%;top:5px;width:40px;height:4px;border-radius:2px;background:var(--line2);transform:translateX(-50%)}
.p-id{font-weight:800;font-size:13px;padding:3px 8px;border-radius:8px;color:#111;margin-top:9px}
.p-title{flex:1;margin-top:6px}
.p-title h2{margin:0;font-size:17px;line-height:1.25}
.p-title div{font-size:12.5px;color:var(--tx2)}
.xbtn{background:var(--bg3);border:0;border-radius:10px;width:36px;height:36px;font-size:18px;margin-top:6px;flex:0 0 auto}
.sec{margin-top:12px}
.sec h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{border:1px solid var(--line);background:var(--bg3);border-radius:8px;padding:5px 9px;font-size:13px}
.nchip b{color:var(--c)}
.nchip.done{background:color-mix(in srgb,var(--c) 25%,var(--bg3))}
.nchip.done::after{content:" ✓";color:var(--ok)}
.muted{color:var(--tx3);font-size:13px}
.warn{background:#2b1d10;border:1px solid #f4a26166;color:#fbd3ab;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.goal{background:var(--bg3);border-radius:10px;padding:9px 11px;font-size:14px}
.counter{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.counter button{background:var(--bg3);border:1px solid var(--line);border-radius:10px;min-width:44px;height:40px;font-size:16px;font-weight:700}
.counter input[type=number]{width:72px;height:40px;text-align:center;font-size:17px;font-weight:700}
.counter .of{color:var(--tx2);font-size:15px}
input[type=number],input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:40px}
input[type=date]{color-scheme:dark}
@media (max-width:600px){input[type=number],input[type=text],input[type=date],select,textarea{font-size:16px}}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
label.f{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.pbar{height:9px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-top:6px}
.pbar>i{display:block;height:100%;background:var(--c,var(--acc));border-radius:6px;transition:width .3s}
.stbtn{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:0;font-weight:800;font-size:15px;color:#111}
.stnow{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg3)}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:14px}
.btn.pri{background:var(--accG);border-color:var(--acc);color:var(--onAcc);font-weight:700;box-shadow:0 4px 14px -6px var(--acc)}
.btn.danger{background:#3a1518;border-color:#f8717166;color:#fecaca}
.btn.sm{padding:6px 10px;font-size:13px}
/* Tarjetas */
.card{background:linear-gradient(180deg,var(--card-hi),var(--bg2) 70%);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
.card h2{margin:0 0 10px;font-size:16.5px;font-weight:750;letter-spacing:-.015em}
.big{font-size:28px;font-weight:800;line-height:1.1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg3);border-radius:12px;padding:11px 12px;box-shadow:inset 0 1px 0 var(--hl)}
.stat span{display:block;font-size:12px;color:var(--tx2)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700}
.pill.ok{background:#14361f;color:#86efac}.pill.mid{background:#3a2f0b;color:#fde68a}.pill.bad{background:#3a1518;color:#fecaca}.pill.info{background:var(--info);color:var(--infoTx)}
.ph-row{margin:9px 0}
.ph-row .t{display:flex;justify-content:space-between;font-size:13.5px}
.ph-row .t span{color:var(--tx2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13.5px}
.tl li.cur{background:var(--cur);border-radius:10px;border-bottom-color:transparent}
.tl .wk{font-weight:800;color:var(--tx2);font-size:12px;text-align:center}
.tl .d{font-size:11.5px;color:var(--tx3)}
.tl .rv{color:var(--tx2);font-style:italic}
.ev{border-left:4px solid var(--line)}
.ev.next{border-left-color:var(--acc)}
.ev .meta{font-size:12.5px;color:var(--tx2)}
.ev .inp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ev .inp input[type=number]{width:76px;text-align:center}
.ev .res{margin-top:9px;font-size:13.5px}
.rule{font-size:13px;color:var(--tx2)}
.rule li{margin:3px 0}
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:10px;padding:8px 10px}
.nitem .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.nitem .tx{flex:1;min-width:0;font-size:13.5px}
.nitem .tx small{display:block;color:var(--tx3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranks{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;gap:10px;align-items:center;font-size:13.5px}
.rk svg{flex:0 0 auto}
.rk.lock{opacity:.4}
.rk small{display:block;color:var(--tx2);font-size:12px}
/* Modal */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92dvh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.mbox h2{margin:0 0 10px;font-size:18px}
.mbox .fld{margin-bottom:11px}
.reqbox{display:flex;flex-wrap:wrap;gap:6px}
.reqbox label{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.reqbox label.no{opacity:.35}
.reqbox input{width:auto;min-height:0;margin:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:20px;height:20px;min-height:0}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.err{color:#fca5a5;font-size:13px;min-height:1em}
#exam{position:fixed;inset:0;background:var(--bg);z-index:18;overflow:auto;display:none;padding:12px 14px calc(30px + env(safe-area-inset-bottom));padding-top:max(12px,env(safe-area-inset-top))}
#exam.show{display:block}
.ex-wrap{max-width:700px;margin:0 auto}
.ex-top{display:flex;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:-12px;background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
.ex-clock{font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;background:var(--bg3);border-radius:10px;padding:4px 10px;flex:0 0 auto}
.ex-clock.low{color:#fca5a5}
.ex-list{padding-left:22px}.ex-list li{margin:12px 0;font-size:16px}
.ex-mk{display:flex;gap:8px;margin-top:6px}
.pomo{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg3);border-radius:12px;padding:10px;margin-top:10px}
.pomo .ex-clock{font-size:20px;background:var(--bg)}
.tips{margin-top:10px;font-size:13.5px}.tips summary{cursor:pointer;color:var(--tx2)}.tips li{margin:5px 0}
a{color:var(--link)}
.subs{display:flex;flex-direction:column;gap:2px}
label.sub{font-size:13.5px;align-items:flex-start;padding:4px 0}
label.sub input{width:18px;height:18px;margin-top:1px;flex:0 0 auto}
label.sub input:checked+span{text-decoration:line-through;opacity:.6}
.tl details{margin-top:4px}.tl summary{font-size:12px;color:var(--tx2);cursor:pointer}
#updBar{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:25;background:var(--info);border:1px solid var(--acc);color:var(--infoTx);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 6px 20px #0008}

/* ---------- Fórmulas ---------- */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 2px}
.fr>span{padding:0 3px;white-space:nowrap}
.fr>span:first-child{border-bottom:1.4px solid currentColor;padding-bottom:1px}
.fr>span:last-child{padding-top:1px}
.rad{white-space:nowrap}.rad .rc{border-top:1.4px solid currentColor;padding:0 1px;margin-left:1px}

/* ---------- Animaciones ---------- */
:root{--ez:cubic-bezier(.22,1,.36,1)}

@keyframes okPulse{0%{box-shadow:0 0 0 0 #4ade8099}100%{box-shadow:0 0 0 12px #4ade8000}}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-4deg)}}
@keyframes fall{0%{transform:translate(0,-10vh) rotate(0);opacity:1}100%{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@keyframes ruIn{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.08) rotate(3deg);opacity:1}100%{transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px var(--g))}50%{filter:drop-shadow(0 0 22px var(--g))}}

button:active:not(:disabled),.btn:active,.nchip:active,.zbtn:active{transform:scale(.95)}

.bdgt{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:36;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:20px;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));box-shadow:0 18px 44px -14px #000,0 0 30px -10px var(--acc);transition:transform .55s var(--ez);width:max-content;max-width:calc(100vw - 24px);cursor:pointer}
.bdgt.show{transform:translate(-50%,0)}
.bdgt small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--acc);font-weight:800}
.bdgt b{font-size:15px}
.bdgt.show .hx{animation:pop .6s var(--ez) .2s both}
.xppop{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:34;padding:5px 13px;border-radius:99px;background:var(--accG);background-color:var(--acc);color:var(--onAcc);font-weight:850;font-size:13px;letter-spacing:.02em;box-shadow:0 8px 22px -8px var(--acc);animation:xpUp 1.6s var(--ez) forwards;pointer-events:none;transform:translateX(-50%)}
@keyframes xpUp{0%{opacity:0;transform:translate(-50%,12px) scale(.8)}14%{opacity:1;transform:translate(-50%,0) scale(1.08)}24%{transform:translate(-50%,0) scale(1)}78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-14px)}}
.lv-big{position:relative;width:132px;height:132px;margin:0 auto;filter:drop-shadow(0 0 22px var(--acc))}
.lv-n b{font-size:52px;font-weight:900;line-height:1;color:var(--tx)}
.lv-rays{position:absolute;inset:-40px;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--acc) 30%,transparent) 0 8deg,transparent 8deg 22deg);mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spinR 14s linear infinite}
@keyframes spinR{to{transform:rotate(360deg)}}
.rankup .ring-v{animation:ringIn 1.2s var(--ez) .2s both}
/* Progreso: tarjetas nuevas */
.lvl-row{display:flex;gap:14px;align-items:center}
.lvl-badge{flex:0 0 auto;width:64px;height:64px;border-radius:18px;background:var(--accG);background-color:var(--acc);color:var(--onAcc);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 24px -12px var(--acc)}
.lvl-badge span{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.lvl-badge b{font-size:28px;line-height:1;font-weight:900}
.mini-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);margin:14px 0 6px}
.acc-top{display:flex;gap:16px;align-items:center}
.acc-d{position:relative;flex:0 0 auto;width:104px;height:104px}.acc-d svg{display:block}
.acc-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.acc-c b{font-size:24px;font-weight:850;letter-spacing:-.03em}.acc-c span{font-size:10.5px;color:var(--tx3)}
.acc-l{flex:1;min-width:0;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.acc-l>div{display:flex;align-items:center;gap:8px}.acc-l i{flex:0 0 auto;width:10px;height:10px;border-radius:3px}
.trend{font-size:11.5px;font-weight:800;padding:1px 6px;border-radius:99px}.trend.up{background:#14361f;color:#86efac}.trend.down{background:#3a1518;color:#fecaca}
@keyframes dnIn{from{opacity:0;stroke-dasharray:0 1000}}
.view.enter .dn-seg{animation:fadeIn .7s var(--ez) both}
.view.enter .acc-b{animation:fadeIn .5s both}
/* Lecciones */
#lesson{position:fixed;inset:0;z-index:19;background:var(--bg);overflow:auto;display:none;padding:0 14px calc(34px + env(safe-area-inset-bottom));overscroll-behavior:contain}
#lesson.show{display:block;animation:sheetUp .45s var(--ez) both}
@keyframes sheetUp{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
.ls-wrap{max-width:720px;margin:0 auto}
.ls-top{position:sticky;top:0;z-index:3;display:flex;gap:10px;align-items:center;padding:max(12px,env(safe-area-inset-top)) 0 10px;background:linear-gradient(var(--bg) 82%,transparent)}
.ls-tt{flex:1;min-width:0}.ls-tt h2{margin:0;font-size:19px;letter-spacing:-.025em;line-height:1.2}
.ls-k{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--c);font-weight:800}
.ls-prog{height:5px;border-radius:9px;background:var(--bg3);overflow:hidden;margin-bottom:14px}.ls-prog i{display:block;height:100%;border-radius:inherit;background:var(--c);transition:width .55s var(--ez);box-shadow:0 0 10px var(--c)}
.ls-sec{background:linear-gradient(180deg,var(--card-hi),var(--bg2) 70%);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:inset 0 1px 0 var(--hl),var(--shadow);animation:cardIn .45s var(--ez) both}
.ls-sec:nth-of-type(2){animation-delay:.06s}.ls-sec:nth-of-type(3){animation-delay:.12s}
.ls-sec h3{margin:0 0 9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--tx2)}
.ls-idea{margin:0;font-size:15.5px;line-height:1.55}
.fx{padding:10px 12px;border-radius:12px;background:var(--bg3);border-left:3px solid var(--c);margin-bottom:8px;font-size:15px;animation:cardIn .45s var(--ez) both;animation-delay:calc(var(--i)*.08s + .15s)}
.fx:last-child{margin-bottom:0}
.ls-q{font-size:17px;font-weight:650;padding:14px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 13%,var(--bg3));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);text-align:center}
.ls-steps{list-style:none;padding:0;margin:8px 0 0}
.ls-steps li{display:flex;gap:11px;padding:11px 0 9px;border-bottom:1px dashed var(--line)}
.ls-steps li.new{animation:stepIn .5s var(--ez) both}
@keyframes stepIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.ls-n{flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:var(--c);color:#111;font-size:12.5px;font-weight:850;display:grid;place-items:center}
.ls-m{margin-top:7px;font-size:16px;padding:7px 11px;border-radius:10px;background:var(--bg3);display:block;width:fit-content;max-width:100%;overflow-x:auto}
.ls-steps li.new .ls-m{animation:hlm 1.4s ease-out .15s both}
@keyframes hlm{0%{box-shadow:0 0 0 2px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.ls-res{margin-top:12px;padding:12px 14px;border-radius:12px;background:#14361f;border:1px solid #4ade8066;color:#d1fae5;animation:pop .5s var(--ez) both;font-size:15.5px}
.warn-sec{border-color:#facc1555;background:linear-gradient(180deg,#facc1510,var(--bg2))}.warn-sec p{margin:0}
.ls-act{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;animation:cardIn .45s var(--ez) .1s both}.ls-act .pri{grid-column:1/-1;padding:12px}
.ls-grid{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}.ls-grid::-webkit-scrollbar{display:none}
.ls-chip{flex:0 0 138px;scroll-snap-align:start;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px 11px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,var(--bg3)),var(--bg3) 70%);display:flex;flex-direction:column;gap:5px;color:var(--tx);min-height:82px}
.ls-chip.cur{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:4px}.lc-top b{color:var(--c);font-size:13px}
.lc-top i{font-style:normal;width:18px;height:18px;border-radius:50%;background:#4ade80;color:#0b2;color:#06290f;font-size:11px;font-weight:900;display:grid;place-items:center}
.lc-top em{font-style:normal;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.lc-t{font-size:12.5px;line-height:1.25;color:var(--tx2)}
.ls-chip.done .lc-t{color:var(--tx)}
/* Microinteracciones */
.btn,.qa,.chip,.nchip,.stbtn,.hm-row,.ls-chip,.theme-b{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
nav button.active .ic{animation:navPop .4s var(--ez)}
@keyframes navPop{0%{transform:scale(.8)}55%{transform:scale(1.1)}100%{transform:none}}
.hic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--acc) 15%,var(--bg3));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 26%,transparent);font-size:15px;margin-right:10px;vertical-align:middle;position:relative;top:-1px}
.ed-back{margin-bottom:12px}
#toast{background:color-mix(in srgb,var(--bg3) 94%,transparent);color:var(--tx);border:1px solid var(--line2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;box-shadow:0 14px 34px -12px #000;padding:10px 16px}
</style>

  const due = plan.filter(n=>n.week < w && !isDom(n.id)).sort((a,b)=>a.week-b.week);
  const ahead = plan.filter(n=>n.week > w && isDom(n.id));
  if(w>19 && !due.length) return {k:'ok', t:'Plan terminado', due, ahead};
  if(due.length) return {k:'bad', t:'Atrasado', due, ahead};
  if(ahead.length) return {k:'info', t:'Adelantado', due, ahead};
  return {k:'ok', t:'Al día', due, ahead};
}
function weekLabel(w){
  if(w<1) return 'El plan empieza el lunes 16 nov 2026';
  if(w>19) return 'Plan de 19 semanas terminado';
  const n = S.nodes.find(x=>x.week===w);
  return 'Semana '+w+': '+(n? n.id+' · '+n.title : (REVIEW_WEEKS[w]||'—'));
}

/* ===================== Árbol: diseño ===================== */
const W=150, H=78, GX=18, GY=58;
let LAY = {};
function computeLayout(){
  const B=byId(), lvl={}, visiting=new Set();
  function L(id){
    if(lvl[id]!==undefined) return lvl[id];
    if(visiting.has(id)) return 0; visiting.add(id);
    const n=B[id]; let v=0;
    n.reqs.forEach(r=>{ if(B[r]) v=Math.max(v, L(r)+1); });
    if(n.row!==undefined) v=Math.max(v,n.row);
    visiting.delete(id); return lvl[id]=v;
  }
  S.nodes.forEach(n=>L(n.id));
  const SIDE=['P','R']; const main = S.nodes.filter(n=>!SIDE.includes(n.phase)), side = S.nodes.filter(n=>SIDE.includes(n.phase));
  const rows = {}; main.forEach(n=>(rows[lvl[n.id]]=rows[lvl[n.id]]||[]).push(n));
  const pos = {}; let half = W/2;
  Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(l=>{
    const r = rows[l];
    r.forEach(n=>{ const xs=n.reqs.filter(q=>pos[q]).map(q=>pos[q].x+W/2); n._b = xs.length? xs.reduce((a,b)=>a+b,0)/xs.length : 0; });
    r.sort((a,b)=> (a._b-b._b) || ((a.week||99)-(b.week||99)) || a.id.localeCompare(b.id,'es',{numeric:true}));
    const tot = r.length*W + (r.length-1)*GX; half = Math.max(half, tot/2);
    r.forEach((n,i)=>{ pos[n.id] = {x:-tot/2 + i*(W+GX), y:l*(H+GY)}; });
  });
  const sx = half + 70, cols = SIDE.filter(ph=>side.some(n=>n.phase===ph)), colX = {};
  cols.forEach((ph,i)=>{ colX[ph]=sx+i*(W+40); const used={}; side.filter(n=>n.phase===ph).sort((a,b)=>lvl[a.id]-lvl[b.id]||a.id.localeCompare(b.id,'es',{numeric:true})).forEach(n=>{ let l=lvl[n.id]; while(used[l]) l++; used[l]=1; pos[n.id]={x:colX[ph], y:l*(H+GY)}; }); });
  const maxL = Math.max(0,...Object.values(pos).map(p=>p.y));
  LAY = {pos, half, sx, colX, hasSide:side.length>0, minX:-half, maxX: cols.length? sx+(cols.length-1)*(W+40)+W : half, maxY:maxL+H};
}

/* ===================== Árbol: dibujo ===================== */
const svg = document.getElementById('tree'), world = document.getElementById('world');
let selected = null, pathMode = null;
function wrap(text, max){
  const words = String(text).split(/\s+/), lines=[]; let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>max && cur){ lines.push(cur); cur=w; } else cur=(cur+' '+w).trim(); });
  if(cur) lines.push(cur);
  if(lines.length>3){ lines.length=3; lines[2]=lines[2].slice(0,max-1)+'…'; }
  return lines;
}
function renderTree(){
  computeLayout();
  const B = byId(), pos = LAY.pos, w = curWeek();
  let lit = null, pathSet = null;
  if(selected && B[selected]){ lit = new Set([selected, ...ancestors(selected), ...descendants(selected)]); }
  if(pathMode && B[pathMode]){ pathSet = new Set([...ancestors(pathMode), pathMode].filter(id=>!isDom(id))); }
  const A = selected ? ancestors(selected) : null, D = selected ? descendants(selected) : null;
  // reparto de entradas/salidas para que las flechas no se encimen
  const inc = {}, out = {};
  S.nodes.forEach(n=>n.reqs.forEach(r=>{ if(B[r]){ (inc[n.id]=inc[n.id]||[]).push(r); (out[r]=out[r]||[]).push(n.id); } }));
  const slot = (list, key, id) => { const arr=(list[key]||[]).slice().sort((a,b)=>pos[a].x-pos[b].x); const i=arr.indexOf(id), k=arr.length; return k<=1?0:(i/(k-1)-.5)*W*0.6; };
  let h = '';
  // etiquetas laterales
  if(LAY.colX.P!==undefined) h += `<text class="side-lbl" x="${LAY.colX.P+W/2}" y="-14" text-anchor="middle">RAMA P · PROGRAMACIÓN</text>`;
  if(LAY.colX.R!==undefined) h += `<text class="side-lbl" x="${LAY.colX.R+W/2}" y="-14" text-anchor="middle" style="fill:#fb7185">RAMA R · PREPARACIÓN</text>`;
  const uNodes = S.nodes.filter(n=>n.phase==='U'&&pos[n.id]);
  if(uNodes.length){ const y=Math.min(...uNodes.map(n=>pos[n.id].y)); h += `<line x1="${-LAY.half-20}" x2="${LAY.half+20}" y1="${y-GY/2}" y2="${y-GY/2}" stroke="#facc1555" stroke-dasharray="3 6"/><text class="lvl-lbl" x="${-LAY.half-16}" y="${y-GY/2-7}" fill="#facc15">UNIVERSIDAD · 29 MAR 2027</text>`; }
  h += `<text class="lvl-lbl" x="${-LAY.half-16}" y="-14" fill="var(--tx2)">ANTES DE LA UNIVERSIDAD</text>`;
  // flechas
  S.nodes.forEach(n=>n.reqs.forEach(r=>{
    if(!B[r]||!pos[r]||!pos[n.id]) return;
    const a=pos[r], b=pos[n.id];
    const x1=a.x+W/2+slot(out,r,n.id), y1=a.y+H, x2=b.x+W/2+slot(inc,n.id,r), y2=b.y-2;
    const dy=Math.max(28,(y2-y1)*0.45);
    let cls='edge', mk='ar';
    if(n.dashed||B[r].dashed) cls+=' dash';
    if(lit){ const on=(r===selected||A.has(r))&&(n.id===selected||A.has(n.id)) || (r===selected||D.has(r))&&(n.id===selected||D.has(n.id)); cls+= on?' hl':' dim'; if(on) mk='arH'; }
    else if(pathSet){ const on=pathSet.has(n.id)&&(pathSet.has(r)); cls+= on?' path':' dim'; if(on) mk='arP'; }
    h += `<path class="${cls}" marker-end="url(#${mk})" d="M${x1} ${y1} C${x1} ${y1+dy} ${x2} ${y2-dy} ${x2} ${y2}"/>`;
  }));
  // nodos
  S.nodes.forEach(n=>{
    const p=pos[n.id]; if(!p) return;
    const st=nodeState(n), pr=S.progress[n.id]||{}, c=col(n);
    let cls='node st-'+st;
    if(lit) cls += lit.has(n.id)?' hl':' dim';
    else if(pathSet) cls += pathSet.has(n.id)?' hl':' dim';
    if(n.id===selected) cls+=' sel';
    const lines = wrap(n.title, 19);
    const ty = 46 - (lines.length-1)*6.5;
    const wk = n.week ? 'Sem '+n.week : (n.dates.length<=14 ? n.dates : (/^ciclo/i.test(n.dates) ? n.dates.split(' ').slice(0,2).join(' ')+'+' : n.dates.split(' ')[0]));
    let g = `<g class="${cls}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})" style="--c:${c}">`;
    if(n.week===w && st!=='dom') g += `<rect class="now-ring" x="-6" y="-6" width="${W+12}" height="${H+12}" rx="15"/><text class="now-tag" x="${W/2}" y="-10" text-anchor="middle">▼ ESTA SEMANA</text>`;
    g += `<rect class="box" width="${W}" height="${H}" rx="11" style="stroke:${st==='lock'?'':c}" ${n.dashed?'stroke-dasharray="7 5"':''}/>`;
    if(st==='prog') g += `<rect class="over" width="${W}" height="${H}" rx="11"/>`;
    g += `<text class="nid" x="10" y="17">${esc(n.id)}${st==='dom'?' ✓':''}${reviewDue(n.id)?' 🔁':''}${st==='lock'?' 🔒':''}</text>`;
    g += `<text class="nwk" x="${W-9}" y="17" text-anchor="end">${esc(wk)}</text>`;
    g += `<text class="ntl" x="${W/2}" y="${ty}" text-anchor="middle">${lines.map((l,i)=>`<tspan x="${W/2}" dy="${i?14:0}">${esc(l)}</tspan>`).join('')}</text>`;
    if(n.target>0 && !n.grade20){ const r=Math.min(1,(pr.count||0)/n.target); g += `<rect class="bar-bg" x="10" y="${H-9}" width="${W-20}" height="4" rx="2"/><rect class="bar" x="10" y="${H-9}" width="${(W-20)*r}" height="4" rx="2"/>`; }
    else if(n.grade20 && gradeOf(n.id)!==null){ g += `<text class="nwk" x="${W/2}" y="${H-6}" text-anchor="middle">Nota ${gradeOf(n.id)}/20</text>`; }
    g += `</g>`; h += g;
  });
  world.innerHTML = h;
  document.querySelectorAll('[data-path]').forEach(b=>b.classList.toggle('on', b.dataset.path===pathMode));
  const bn = document.getElementById('banner');
  if(pathSet){
    const list=[...pathSet].filter(id=>id!==pathMode).map(id=>B[id]).sort((a,b)=>(a.week||99)-(b.week||99));
    bn.innerHTML = list.length ? `Te faltan <b>${list.length}</b> temas para llegar a <b>${esc(B[pathMode].title)}</b>: ${list.map(n=>esc(n.id)).join(', ')}` : (isDom(pathMode)?`¡Ya dominaste ${esc(B[pathMode].title)}!`:`¡Tienes todo lo necesario para <b>${esc(B[pathMode].title)}</b>!`);
    bn.classList.add('show');
  } else bn.classList.remove('show');
  applyView();
}

/* ===================== Zoom y desplazamiento ===================== */
let view = {x:0,y:0,s:1};
const clampS = s => Math.min(2.5, Math.max(0.25, s));
function applyView(){ world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.s})`); }
function fitView(){
  const r = svg.getBoundingClientRect(); if(!r.width) return;
  const tw = LAY.maxX - LAY.minX + 60;
  let s = Math.min(1.1, r.width / tw);
  if(r.width < 600) s = Math.max(s, 0.62);
  view.s = s;
  // en celular: centrar la columna principal; en pantalla grande: todo el ancho
  const cx = (s*tw <= r.width) ? (LAY.minX+LAY.maxX)/2 : 0;
  view.x = r.width/2 - cx*s; view.y = 100;
  const cur = S.nodes.find(n=>n.week===curWeek()), cp = cur && LAY.pos[cur.id];
  if(cp && view.y + (cp.y+H)*s > r.height - 90){ view.y = r.height*0.35 - cp.y*s; if(r.width<600) view.x = r.width/2 - (cp.x+W/2)*s; }
  applyView();
}
function zoomAt(f, cx, cy){ const ns=clampS(view.s*f); const wx=(cx-view.x)/view.s, wy=(cy-view.y)/view.s; view.s=ns; view.x=cx-wx*ns; view.y=cy-wy*ns; applyView(); }
const pts = new Map(); let gest = null;
const local = e => { const r=svg.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
svg.addEventListener('pointerdown', e=>{
  svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e));
  if(pts.size===1){ const p=local(e); gest={t:'pan', sx:p.x, sy:p.y, vx:view.x, vy:view.y, moved:false, target:e.target}; }
  else if(pts.size===2){ const [a,b]=[...pts.values()]; const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; gest={t:'pinch', d0:Math.hypot(a.x-b.x,a.y-b.y)||1, s0:view.s, wx:(m.x-view.x)/view.s, wy:(m.y-view.y)/view.s, moved:true}; }
});
svg.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)||!gest) return; pts.set(e.pointerId, local(e));
  if(gest.t==='pan' && pts.size===1){ const p=local(e); const dx=p.x-gest.sx, dy=p.y-gest.sy; if(Math.hypot(dx,dy)>7) gest.moved=true; if(gest.moved){ view.x=gest.vx+dx; view.y=gest.vy+dy; applyView(); } }
  else if(gest.t==='pinch' && pts.size>=2){ const [a,b]=[...pts.values()]; const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; const s=clampS(gest.s0*Math.hypot(a.x-b.x,a.y-b.y)/gest.d0); view.s=s; view.x=m.x-gest.wx*s; view.y=m.y-gest.wy*s; applyView(); }
});
function endPtr(e){
  if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
  if(gest && gest.t==='pan' && !gest.moved && e.type==='pointerup'){
    const g = gest.target && gest.target.closest && gest.target.closest('.node');
    if(g) selectNode(g.dataset.id); else { if(selected) closePanel(); }
  }
  if(pts.size===1 && gest && gest.t==='pinch'){ const p=[...pts.values()][0]; gest={t:'pan',sx:p.x,sy:p.y,vx:view.x,vy:view.y,moved:true}; }
  if(!pts.size) gest=null;
}
svg.addEventListener('pointerup', endPtr); svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e=>{ e.preventDefault(); const p=local(e); zoomAt(Math.exp(-e.deltaY*0.0015), p.x, p.y); }, {passive:false});
document.getElementById('zIn').onclick = ()=>{ const r=svg.getBoundingClientRect(); smooth(()=>zoomAt(1.3, r.width/2, r.height/2)); };
document.getElementById('zOut').onclick = ()=>{ const r=svg.getBoundingClientRect(); smooth(()=>zoomAt(0.77, r.width/2, r.height/2)); };
document.getElementById('zFit').onclick = ()=>smooth(fitView);
if(innerWidth<600) document.getElementById('legend').classList.add('min');
document.getElementById('legend').onclick = e=>e.currentTarget.classList.toggle('min');
document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{ pathMode = pathMode===b.dataset.path?null:b.dataset.path; if(pathMode){ selected=null; closePanel(true); } pulseWorld(pathMode?'anim-in':'anim-out'); renderTree(); });

/* ===================== Panel del nodo ===================== */
const panel = document.getElementById('panel');
const STATUS = {pendiente:'Pendiente', progreso:'En progreso', dominado:'Dominado'};
const NEXT = {pendiente:'progreso', progreso:'dominado', dominado:'pendiente'};
function selectNode(id){ selected=id; pathMode=null; pulseWorld('anim-in'); renderTree(); openPanel(id); smooth(()=>revealNode(id)); }
function revealNode(id){
  const p=LAY.pos[id]; if(!p) return; const r=svg.getBoundingClientRect();
  const wide = innerWidth>=900; const visW = wide? r.width-400 : r.width; const visH = wide? r.height : r.height*0.26 + 20;
  const sx=view.x+(p.x+W/2)*view.s, sy=view.y+p.y*view.s;
  const top = wide? 60 : 70;
  if(sx<20||sx>visW-20||sy<top||sy+H*view.s>visH+(wide?0:40)){ view.x = visW/2-(p.x+W/2)*view.s; view.y = (wide? r.height/3 : top) - p.y*view.s; applyView(); }
}
function closePanel(keep){ panel.classList.remove('open'); if(!keep){ if(selected) pulseWorld('anim-out'); selected=null; renderTree(); } }
function chipsFor(ids){ const B=byId(); return ids.length? `<div class="chips">${ids.filter(i=>B[i]).map(i=>`<button class="nchip ${isDom(i)?'done':''}" data-go="${esc(i)}" style="--c:${col(B[i])}"><b>${esc(i)}</b> ${esc(B[i].title)}</button>`).join('')}</div>` : '<div class="muted">Ninguno</div>'; }

/* ===================== Evaluaciones ===================== */
function weakness(n){ const p=S.progress[n.id]||{}; const t=(p.test===null||p.test===undefined)?null:+p.test; const r=n.target?(+p.count||0)/n.target:1; return (t===null?5:t)*10 + r*10 + (isDom(n.id)?50:0); }
function evalAdvice(e,pct){
  if(pct>=80) return '';
  const B=byId(); const ns=(e.nodes||[]).map(i=>B[i]).filter(Boolean).sort((a,b)=>weakness(a)-weakness(b));
  if(!ns.length) return '';
  const lbl = n => esc(n.id+' ('+n.title+(n.week?', semana '+n.week:'')+')');
  if(pct>=60) return `<div class="muted" style="margin-top:5px">Repasa sobre todo: ${ns.slice(0,2).map(lbl).join(' y ')}.</div>`;
  return `<div class="warn">Semana más débil sugerida: <b>${lbl(ns[0])}</b>. Se elige por la nota de prueba más baja y menos ejercicios hechos.</div>`;
}
function evalMsg(pct){
  if(pct>=80) return {k:'ok', t:'80 % o más: avanza a la semana siguiente.'};
  if(pct>=60) return {k:'mid', t:'Entre 60 y 79 %: avanza, pero repasa los temas que fallaste.'};
  return {k:'bad', t:'Menos de 60 %: repite la semana más débil antes de avanzar.'};
}
function renderEvals(){
  const t=today(); const nextE = S.evals.find(e=>e.date && ymd(e.date)>=t && e.score===null);
  let h = `<div class="card"><h2>Mini evaluaciones (sábados)</h2><ul class="rule" style="padding-left:18px;margin:0">
    <li><b style="color:#86efac">80 % o más</b> → avanzar</li><li><b style="color:#fde68a">60 a 79 %</b> → avanzar y repasar los temas fallados</li><li><b style="color:#fecaca">Menos de 60 %</b> → repetir la semana más débil</li></ul></div>` + evalChart();
  S.evals.forEach(e=>{
    const pct=evalPct(e), m = pct!==null?evalMsg(pct):null, d=e.date?ymd(e.date):null;
    h += `<div class="card ev ${nextE===e?'next':''}" data-ev="${esc(e.id)}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h2 style="margin:0">${esc(e.name)}</h2>${nextE===e?'<span class="pill info">Próxima</span>':''}</div>
      <div class="meta">${d?esc(fmt(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'})):''} · ${esc(e.topic)}</div>
      <div class="inp"><label class="f" style="margin:0">Puntaje</label><input type="number" min="0" step="0.5" inputmode="decimal" class="evS" value="${e.score??''}" placeholder="—"><span class="muted">de</span><input type="number" min="1" step="1" inputmode="numeric" class="evM" value="${e.max}"><button class="btn pri sm evSave">Guardar</button></div>
      ${(e.nodes||[]).length?`<div class="meta" style="margin-top:6px">Temas: ${e.nodes.map(esc).join(', ')}</div>`:''}
      <div class="res">${m?`<span class="pill ${m.k}">${pct} %</span> ${esc(m.t)}${evalAdvice(e,pct)}`:(d&&d<t?'<span class="muted">Pendiente de registrar.</span>':'')}</div></div>`;
  });
  const w = document.getElementById('evalWrap'); w.innerHTML = h;
  w.querySelectorAll('.evSave').forEach(b=>b.onclick=()=>{
    const card=b.closest('.ev'), e=S.evals.find(x=>x.id===card.dataset.ev);
    const sv=card.querySelector('.evS').value, mx=+card.querySelector('.evM').value;

    e.max=mx; e.score = sv===''?null:+sv; save();
    const pct=evalPct(e); toast(pct===null?'Puntaje borrado':pct+' % · '+evalMsg(pct).t.split(': ')[1]);
    renderEvals(); renderHeader(); renderTree();
  });
}

function exportJSON(){
  let malla=null; try{ malla=JSON.parse(localStorage.getItem(MALLA_KEY)||'null'); }catch(e){}
  const blob=new Blob([JSON.stringify({app:'arbol-ali',version:2,exportado:new Date().toISOString(),matematica:S,malla},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='arbol-ali-'+iso(today())+'.json'; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); meta().lastBackup=iso(today()); meta().snoozeUntil=''; save(); if(curView==='vEdit') renderEditor(); toast('Respaldo descargado. Guárdalo en Drive o en tu correo.');
}
document.getElementById('fileIn').onchange = e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=async ()=>{ e.target.value='';
    let raw; try{ raw=JSON.parse(r.result); }catch(err){ toast('Ese archivo no es un respaldo válido'); return; }
    let mat=null, mal=null;
    if(raw && (raw.matematica || raw.malla)){ mat = raw.matematica ? normalize(raw.matematica) : null; mal = raw.malla || null; }
    else if(raw && Array.isArray(raw.nodes) && raw.nodes.some(n=>n && /^T\d+$/.test(n.id))) mat = normalize(raw);
    else mal = raw;
    if(mal){ const w = await ensureMalla(); try{ mal = w.normalize(mal); }catch(err){ mal=null; } }
    if(!mat && !mal){ toast('Ese archivo no es un respaldo válido'); return; }
    const parts = [mat?'Matemática ('+mat.nodes.length+' temas)':'', mal?'Malla':''].filter(Boolean).join(' y ');
    confirmBox('¿Importar este archivo?','Reemplaza lo que tienes ahora en: '+parts+'.','Importar',()=>{
      if(mat){ S=mat; save(); selected=null; pathMode=null; closePanel(true); refreshAll(); fitView(); }
      if(mal){ try{ localStorage.setItem(MALLA_KEY, JSON.stringify(mal)); }catch(err){} reloadMalla(); }
      toast('Progreso importado: '+parts);
    });
  };
  r.readAsText(f);
};

const MALLA_KEY = 'arbolMallaAli.v1';
const mallaFrame = document.getElementById('mallaFrame');
let mallaReady = null;
function mallaHtml(){ const b=atob(document.getElementById('mallaSrc').textContent.trim()); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return new TextDecoder().decode(u); }
function ensureMalla(){
  if(!mallaReady) mallaReady = new Promise(res=>{ mallaFrame.onload=()=>{ syncMallaTheme(); res(mallaFrame.contentWindow); }; mallaFrame.srcdoc = mallaHtml(); });
  return mallaReady;
}
function syncMallaTheme(){ try{ const d=mallaFrame.contentDocument; if(!d||!d.head) return; let st=d.getElementById('parentTheme'); if(!st){ st=d.createElement('style'); st.id='parentTheme'; d.head.appendChild(st); }
  const cs=getComputedStyle(document.documentElement), V=['--bg','--bg2','--bg3','--line','--tx','--tx2','--tx3','--acc'];
  st.textContent=`:root{${V.map(v=>v+':'+cs.getPropertyValue(v).trim()+' !important').join(';')}} html,body{background:var(--bg)!important} nav{background:var(--bg2)!important}`; }catch(e){} }
function reloadMalla(){ if(mallaReady){ mallaReady=null; if(document.body.classList.contains('malla')) ensureMalla(); } }

/* ===================== Estudio: racha y minutos ===================== */
function study(){ if(!S.study||typeof S.study!=='object') S.study={log:{}}; if(!S.study.log) S.study.log={}; return S.study; }
function meta(){ if(!S.meta||typeof S.meta!=='object') S.meta={}; if(!S.meta.firstUse) S.meta.firstUse=iso(today()); return S.meta; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function minutesOn(dt){ return +(study().log[iso(dt)]||0); }
function streak(){
  let d=today(), n=0;
  if(!minutesOn(d)) d=addDays(d,-1);
  while(minutesOn(d)>0){ n++; d=addDays(d,-1); }
  return n;
}
function bestStreak(){
  const days=Object.keys(study().log).filter(k=>study().log[k]>0).sort(); let best=0,cur=0,prev=null;
  days.forEach(k=>{ const d=ymd(k); cur = prev && daysBetween(prev,d)===1 ? cur+1 : 1; best=Math.max(best,cur); prev=d; });
  return best;
}
function logMinutes(min, nodeId){
  min=Math.round(+min); if(!(min>0) || min>600){ toast('Escribe minutos entre 1 y 600'); return; }
  const k=iso(today()); study().log[k]=(+study().log[k]||0)+min;
  if(nodeId && byId()[nodeId]){ const p=P(nodeId); p.minutes=(+p.minutes||0)+min; }
  save(); renderHeader(); toast('+'+min+' min · racha de '+streak()+' día'+(streak()===1?'':'s')+' 🔥');
}

/* ===================== Repaso espaciado ===================== */
const REVIEW_DAYS=[7,21,60];
function reviewInfo(id){
  const p=S.progress[id]; if(!p||p.status!=='dominado'||!p.date||!/^\d{4}-\d{2}-\d{2}$/.test(p.date)) return null;
  const done=Array.isArray(p.reviews)?p.reviews:[]; const i=done.length;
  if(i>=REVIEW_DAYS.length) return {complete:true, done};
  const due=addDays(ymd(p.date), REVIEW_DAYS[i]);
  return {i, due, days:daysBetween(today(),due), done, complete:false};
}
const reviewDue = id => { const r=reviewInfo(id); return !!(r && !r.complete && r.days<=0); };
function markReview(id){ const p=P(id); p.reviews=(Array.isArray(p.reviews)?p.reviews:[]).concat(iso(today())); save(); refreshAll(); if(selected===id) openPanel(id); toast('Repaso de '+id+' registrado'); }
function dueCount(){ return S.nodes.filter(n=>reviewDue(n.id)).length; }

  const B=byId(), t=today(), st=streak();
  const curNode = S.nodes.find(n=>n.week===curWeek());
  const opts = S.nodes.filter(n=>n.phase!=='U').map(n=>`<option value="${esc(n.id)}" ${curNode&&curNode.id===n.id?'selected':''}>${esc(n.id+' · '+n.title)}</option>`).join('');

  let bars=''; const days=[]; for(let i=13;i>=0;i--) days.push(addDays(t,-i));

/* ===================== Gráfico de mini evaluaciones ===================== */
function evalChart(){
  const ev=S.evals, n=ev.length; if(!n) return '';
  const W2=320, H2=170, L=38, R=12, T2=12, Bt=28, iw=W2-L-R, ih=H2-T2-Bt;
  const X=i=>L+(n===1?iw/2:i*iw/(n-1)), Y=p=>T2+ih*(1-p/100);
  let s=`<svg viewBox="0 0 ${W2} ${H2}" style="width:100%" role="img" aria-label="Notas de las mini evaluaciones">`;
  s+=`<rect x="${L}" y="${Y(100)}" width="${iw}" height="${Y(80)-Y(100)}" fill="#4ade80" opacity=".07"/><rect x="${L}" y="${Y(80)}" width="${iw}" height="${Y(60)-Y(80)}" fill="#facc15" opacity=".07"/><rect x="${L}" y="${Y(60)}" width="${iw}" height="${Y(0)-Y(60)}" fill="#f87171" opacity=".06"/>`;
  [0,60,80,100].forEach(v=>{ s+=`<line x1="${L}" x2="${W2-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===80?'#4ade80':v===60?'#facc15':'var(--line)'}" stroke-dasharray="${v===60||v===80?'4 4':''}" opacity=".7"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#9aa3b2">${v}%</text>`; });
  const pts=ev.map((e,i)=>[i,evalPct(e)]).filter(p=>p[1]!==null);
  if(pts.length>1) s+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map(([i,p])=>X(i)+','+Y(Math.min(100,p))).join(' ')}"/>`;
  ev.forEach((e,i)=>{ const p=evalPct(e); s+=`<text x="${X(i)}" y="${H2-10}" text-anchor="middle" font-size="9" fill="var(--tx2)">${e.id==='final'?'F':i+1}</text>`;
    if(p!==null){ const c=p>=80?'#4ade80':p>=60?'#facc15':'#f87171'; s+=`<circle cx="${X(i)}" cy="${Y(Math.min(100,p))}" r="4.5" fill="${c}" stroke="var(--bg2)" stroke-width="1.5"><title>${esc(e.name)}: ${p} %</title></circle><text x="${X(i)}" y="${Y(Math.min(100,p))-8}" text-anchor="middle" font-size="9" fill="var(--tx)">${Math.round(p)}</text>`; }
    else s+=`<circle cx="${X(i)}" cy="${Y(0)}" r="2.5" fill="#2a3242"/>`; });
  s+=`</svg>`;
  const avg = pts.length ? Math.round(pts.reduce((a,p)=>a+p[1],0)/pts.length) : null;
  return `<div class="card"><h2>📊 Tus notas en el tiempo</h2>${s}<div class="muted">${pts.length?`Promedio: <b style="color:var(--tx)">${avg} %</b> en ${pts.length} prueba${pts.length>1?'s':''}. Verde ≥ 80 %, amarillo 60–79 %, rojo &lt; 60 %.`:'Cuando guardes puntajes aparecerán aquí.'}</div></div>`;
}

/* ===================== Respaldo semanal ===================== */
const SNAP_KEY='arbolAli.autosnap';
function hasAnyData(){ return errs().length>0 || Object.values(S.progress).some(p=>p&&(p.status!=='pendiente'||p.count||p.notes)) || S.evals.some(e=>e.score!==null) || Object.keys(study().log).length>0; }
function autoSnapshot(){
  const m=meta(); if(m.lastSnap && daysBetween(ymd(m.lastSnap),today())<7) return;
  try{ let malla=null; try{ malla=JSON.parse(localStorage.getItem(MALLA_KEY)||'null'); }catch(e){}
    localStorage.setItem(SNAP_KEY, JSON.stringify({fecha:iso(today()), matematica:S, malla})); m.lastSnap=iso(today()); save(); }catch(e){}
}
function snapInfo(){ try{ const d=JSON.parse(localStorage.getItem(SNAP_KEY)||'null'); return d&&d.fecha?d:null; }catch(e){ return null; } }
function backupCheck(){
  const m=meta(); if(!hasAnyData()) return;
  const ref = m.lastBackup || m.firstUse; const ago = daysBetween(ymd(ref), today());
  if(ago<7) return; if(m.snoozeUntil && ymd(m.snoozeUntil)>today()) return;
  showModal(`<h2>💾 Hora de tu respaldo semanal</h2><p style="color:var(--tx2)">${m.lastBackup?'Tu último respaldo fue hace '+ago+' días.':'Aún no has descargado ningún respaldo.'} Tu progreso solo vive en este navegador: si se borran los datos del navegador, se pierde. Descarga el archivo y guárdalo en Drive o en tu correo.</p>
    <div class="mact"><button class="btn" id="bLater">Mañana</button><button class="btn pri" id="bNow">Descargar respaldo</button></div>`);
  mbox.querySelector('#bLater').onclick=()=>{ m.snoozeUntil=iso(addDays(today(),1)); save(); hideModal(); };
  mbox.querySelector('#bNow').onclick=()=>{ hideModal(); exportJSON(); };
}
function restoreSnap(){
  const d=snapInfo(); if(!d) return;
  confirmBox('¿Restaurar la copia automática?','Vuelve todo (Matemática y Malla) a como estaba el '+fmt(ymd(d.fecha),{day:'numeric',month:'long',year:'numeric'})+'. Lo que hiciste después se pierde.','Restaurar',()=>{
    const mat=normalize(d.matematica); if(mat){ S=mat; save(); }
    if(d.malla){ try{ localStorage.setItem(MALLA_KEY, JSON.stringify(d.malla)); }catch(e){} reloadMalla(); }
    selected=null; pathMode=null; closePanel(true); refreshAll(); fitView(); toast('Copia restaurada');
  });
}

/* ===================== Cuaderno de errores ===================== */
function errs(){ if(!Array.isArray(S.errors)) S.errors=[]; return S.errors; }
function addError(topic, q, a){ errs().push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5), topic:topic||'', q:String(q), a:String(a||''), added:iso(today()), due:iso(today()), tries:0}); save(); }
const errorsDue = () => errs().filter(e=>!e.fixed && ymd(e.due)<=today());
function errorRetry(id, ok){ const e=errs().find(x=>x.id===id); if(!e) return; addAcc(!!ok);
  if(ok){ e.fixed=iso(today()); toast('¡Error superado! ✅'); } else { e.tries=(e.tries||0)+1; e.due=iso(addDays(today(), e.tries>1?3:2)); toast('Vuelve a salir en '+(e.tries>1?3:2)+' días'); }
  save(); renderHeader(); renderStudy(); }

/* ===================== Modo examen ===================== */
let EX=null, exTimer=null;
function examTopics(){ return S.nodes.filter(n=>GEN[n.id]); }
function simTopics(){ const t=S.nodes.filter(n=>GEN[n.id] && n.week); return t.length?t:examTopics(); }
function startExam(topic){
  let items, total, mins;
  if(topic==='SIM'){ const ts=simTopics(); total=15; mins=40; items=[]; const order=ts.slice().sort(()=>Math.random()-.5); for(let i=0;i<total;i++){ const t=order[i%order.length]; items.push({...GEN[t.id](), topic:t.id}); } }
  else { total=10; mins = (topic==='T1'||topic==='T3')?20: topic==='T4'?10 : 25; items=genFor(topic,total).map(x=>({...x, topic})); }
  const custom = +(document.getElementById('exMin')||{}).value; if(custom>0) mins=custom;
  EX={topic, items, total, mins, start:Date.now(), end:Date.now()+mins*60000, phase:'run'};
  document.getElementById('exam').classList.add('show'); renderExam();
  clearInterval(exTimer); exTimer=setInterval(tickExam, 1000);
}
function tickExam(){ if(!EX||EX.phase!=='run') return clearInterval(exTimer); const left=EX.end-Date.now(); const el=document.getElementById('exClock'); if(el){ const s=Math.max(0,Math.ceil(left/1000)); el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); el.classList.toggle('low', s<=120); }
  if(left<=0){ toast('⏰ Se acabó el tiempo'); finishExam(); } }
function finishExam(){ if(!EX) return; EX.phase='check'; EX.used=Math.max(1,Math.round((Date.now()-EX.start)/60000)); clearInterval(exTimer); renderExam(); }
function renderExam(){
  const box=document.getElementById('exam'), B=byId(); if(!EX){ box.classList.remove('show'); return; }
  const title = EX.topic==='SIM' ? 'Simulacro final · 15 ejercicios' : `Examen de ${EX.topic} · ${esc(B[EX.topic]?.title||'')}`;
  let h = `<div class="ex-top"><div><b>${title}</b><div class="muted">${EX.phase==='run'?'Sin apuntes y sin pistas. Resuelve en papel.':'Corrige con honestidad: marca ✓ o ✗ en cada uno.'}</div></div>`;
  if(EX.phase==='run') h += `<div class="ex-clock" id="exClock">--:--</div></div>`;
  else { const ok=EX.items.filter(i=>i.mark==='ok').length, marked=EX.items.filter(i=>i.mark).length; h += `<div class="ex-clock">${ok}/${EX.total}</div></div><div class="muted" style="margin:6px 0 0">Tiempo usado: ${EX.used} min · corregidos ${marked} de ${EX.total}</div>`; }
  h += `<ol class="ex-list">` + EX.items.map((it,i)=>`<li><div class="ex-q">${mth(it.q)}${EX.topic==='SIM'?` <span class="muted">(${esc(it.topic)})</span>`:''}</div>${EX.phase==='check'?`<div class="goal" style="margin-top:6px">Respuesta: ${mth(it.a)}</div><div class="ex-mk"><button class="btn sm ${it.mark==='ok'?'pri':''}" data-mk="${i}" data-v="ok">✓ Bien</button><button class="btn sm ${it.mark==='bad'?'danger':''}" data-mk="${i}" data-v="bad">✗ Mal</button></div>`:''}</li>`).join('') + `</ol>`;
  if(EX.phase==='run') h += `<div class="mact"><button class="btn" id="exQuit">Abandonar</button><button class="btn pri" id="exEnd">Terminé: ver respuestas</button></div>`;
  else {
    const ok=EX.items.filter(i=>i.mark==='ok').length, all=EX.items.every(i=>i.mark); const pct=Math.round(ok/EX.total*100);
    if(all){ const m=evalMsg(pct); h += `<div class="card" style="margin-top:10px"><div class="big">${ok}/${EX.total} · ${pct} %</div><div style="margin-top:6px">${EX.topic==='SIM'?esc(m.t):(ok>=8?'✅ Cumples el criterio de dominio (8/10 sin apuntes).':'⏳ Aún no llegas a 8/10. Repasa los errores y vuelve a intentarlo en unos días.')}</div>
      <div class="muted" style="margin-top:6px">Al guardar: ${EX.topic==='SIM'?'se anota en el Simulacro final':'la nota va a "Nota de la prueba" de '+esc(EX.topic)}, los ✗ pasan a tu cuaderno de errores y se registran ${EX.used} min de estudio.</div></div>`; }
    h += `<div class="mact"><button class="btn" id="exQuit">Salir sin guardar</button><button class="btn pri" id="exSave" ${all?'':'disabled'}>Guardar resultado</button></div>`;
  }
  box.innerHTML = `<div class="ex-wrap">${h}</div>`;
  const $=s=>box.querySelector(s);
  if($('#exEnd')) $('#exEnd').onclick=finishExam;
  $('#exQuit').onclick=()=>{ if(EX.phase==='run'){ confirmBox('¿Abandonar el examen?','No se guarda nada.','Abandonar',()=>{ clearInterval(exTimer); EX=null; renderExam(); }); } else { EX=null; renderExam(); } };
  box.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{ EX.items[+b.dataset.mk].mark=b.dataset.v; const y=box.scrollTop; renderExam(); box.scrollTop=y; });
  if($('#exSave')) $('#exSave').onclick=saveExam;
  if(EX.phase==='run') tickExam();
}
function saveExam(){
  const ok=EX.items.filter(i=>i.mark==='ok').length;
  EX.items.filter(i=>i.mark==='bad').forEach(i=>addError(i.topic, i.q, i.a));
  const k=iso(today()); study().log[k]=(+study().log[k]||0)+EX.used; addAcc(true,ok); addAcc(false,EX.total-ok);
  let msg='';
  if(EX.topic==='SIM'){ const f=S.evals.find(e=>e.id==='final'); if(f){ f.max=EX.total; f.score=ok; } msg='Guardado en el Simulacro final: '+ok+'/'+EX.total; }
  else { const p=P(EX.topic); p.test=Math.round(ok/EX.total*10); p.minutes=(+p.minutes||0)+EX.used; msg='Nota de '+EX.topic+': '+p.test+'/10'; }
  const topic=EX.topic, pass = topic!=='SIM' && ok/EX.total>=0.8 && !isDom(topic);
  save(); EX=null; renderExam(); refreshAll();
  if(pass) confirmBox('¡Llegaste a 8/10!','¿Marcamos '+topic+' como dominado con fecha de hoy?','Sí, dominado',()=>{ const p=P(topic); p.status='dominado'; if(!p.date) p.date=iso(today()); save(); refreshAll(); toast('¡'+topic+' dominado! 🎉'); });
  else toast(msg);
}

/* ===================== Plan del día y pomodoro ===================== */
let pomo=null, pomoTimer=null;
function dayTasks(){
  const t=today(), w=curWeek(), dow=t.getDay(), B=byId(), tasks=[];
  const node=S.nodes.find(n=>n.week===w && /^T|^X/.test(n.id));
  const ev=S.evals.find(e=>e.date===iso(t));
  if(w<1) tasks.push({k:'pre', t:'El plan empieza el lunes 16 nov 2026. Hoy: arma tu horario de estudio.'});
  else if(w>19) tasks.push({k:'uni', t:'¡Plan terminado! Repasa tus temas débiles antes de la universidad.'});
  if(ev) tasks.push({k:'ev', t:`📝 Hoy toca ${ev.name}: ${ev.topic}. Hazla sin apuntes y guarda tu puntaje.`, go:'vEval'});
  if(dow===0){ const p1=B.P1; tasks.push({k:'p1', t:'🐍 Domingo de programación: avanza CS50P (P1).', link:(p1&&p1.links&&p1.links[0])?p1.links[0][1]:'https://cs50.harvard.edu/python/'}); }
  if(w>=1 && w<=19){
    if(REVIEW_WEEKS[w] && dow!==0) tasks.push({k:'rv', t:`🔁 Semana de repaso: ${REVIEW_WEEKS[w]}.`});
    if(node && dow!==0 && !ev){
      const p=S.progress[node.id]||{};
      if(isDom(node.id)) tasks.push({k:'adv', t:`✅ ${node.id} ya está dominado. Adelanta el siguiente tema o practica un tema extra.`});
      else if(dow===6) tasks.push({k:'exam', t:`⏱ Sábado: haz un examen de práctica de ${node.id} (10 ejercicios, meta 8/10).`, exam:node.id});
      else { const rem=Math.max(0,node.target-(+p.count||0)); const daysLeft=Math.max(1, 6-dow); const n=Math.max(5, Math.ceil(rem/daysLeft));
        tasks.push({k:'main', t: rem? `📘 ${node.id} · ${node.title}: resuelve unos ${n} ejercicios (llevas ${+p.count||0} de ${node.target}).` : `📘 ${node.id}: ya hiciste los ${node.target} ejercicios. Prueba el modo examen.`, prac:node.id}); }
    }
  }
  const rv=S.nodes.filter(n=>reviewDue(n.id)); if(rv.length) tasks.push({k:'srs', t:`🔁 Repasa: ${rv.map(n=>n.id).join(', ')} (5 ejercicios cada uno, sin apuntes).`});
  const er=errorsDue().length; if(er) tasks.push({k:'err', t:`📒 Reintenta ${Math.min(er,5)} error${er===1?'':'es'} de tu cuaderno.`});
  tasks.push({k:'min', t:'⏱ Registra tus minutos de hoy para mantener la racha.'});
  return tasks;
}
function dayDone(){ if(!S.dayDone||typeof S.dayDone!=='object') S.dayDone={}; const k=iso(today()); if(!S.dayDone[k]) S.dayDone[k]={}; return S.dayDone[k]; }
function startPomo(){ const sel=document.getElementById('sTopic'); pomo={end:Date.now()+25*60000, topic: sel?sel.value:''}; clearInterval(pomoTimer); pomoTimer=setInterval(tickPomo,1000); tickPomo(); }
function tickPomo(){ const el=document.getElementById('pomoClock'); if(!pomo){ clearInterval(pomoTimer); return; } const s=Math.max(0,Math.ceil((pomo.end-Date.now())/1000));
  if(el) el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  if(s<=0){ const tp=pomo.topic; pomo=null; clearInterval(pomoTimer); logMinutes(25,tp); toast('🍅 ¡Pomodoro terminado! +25 min. Descansa 5 minutos.'); if(curView==='vStudy') renderStudy(); } }
function planCard(){
  const t=today(), done=dayDone(), tasks=dayTasks();
  let h=`<div class="card"><h2>📅 Plan de hoy</h2><div class="muted" style="margin-top:-4px;margin-bottom:8px">${esc(fmt(t,{weekday:'long',day:'numeric',month:'long'}))} · ${esc(weekLabel(curWeek()))}</div><div class="nlist">`;
  tasks.forEach(k=>{ h+=`<label class="nitem" style="align-items:flex-start;cursor:pointer"><input type="checkbox" data-day="${k.k}" ${done[k.k]?'checked':''} style="width:20px;height:20px;min-height:0;margin-top:2px"><div class="tx" style="${done[k.k]?'text-decoration:line-through;opacity:.6':''}">${esc(k.t)}${k.prac?` <a href="#" data-prac2="${esc(k.prac)}">Practicar</a>`:''}${k.exam?` <a href="#" data-exam2="${esc(k.exam)}">Empezar examen</a>`:''}${k.go?` <a href="#" data-go2="${k.go}">Abrir</a>`:''}${k.link?` <a href="${esc(k.link)}" target="_blank" rel="noopener">Abrir ↗</a>`:''}</div></label>`; });
  h+=`</div><div class="pomo"><div><b>🍅 Pomodoro</b><div class="muted">25 min de foco y 5 de descanso. Al terminar se suman 25 min a tu racha.</div></div>${pomo?`<div class="ex-clock" id="pomoClock">25:00</div><button class="btn sm" id="pomoStop">Parar</button>`:`<button class="btn pri sm" id="pomoGo">Iniciar 25 min</button>`}</div>`;
  h+=`<details class="tips"><summary>💡 Tips para estudiar mejor</summary><ul>
    <li><b>Intenta antes de mirar la solución.</b> Aunque te equivoques, el esfuerzo de recordar es lo que fija el tema.</li>
    <li><b>Explícalo en voz alta</b>, como si le enseñaras a alguien. Si te trabas, ahí está lo que no entiendes.</li>
    <li><b>Pomodoro de 25 min</b> con el celular lejos; 5 min de descanso; cada 4 pomodoros, uno largo.</li>
    <li><b>Mezcla tipos de ejercicios</b> en vez de repetir el mismo; así aprendes a elegir el método.</li>
    <li><b>Anota cada error</b> en el cuaderno de errores y vuelve a intentarlo días después.</li>
    <li><b>Duerme bien</b> la noche antes de una evaluación: el sueño consolida lo estudiado.</li></ul></details></div>`;
  return h;
}
function bindPlan(w){
  w.querySelectorAll('[data-day]').forEach(c=>c.onchange=()=>{ dayDone()[c.dataset.day]=c.checked; save(); const tx=c.nextElementSibling; tx.style.textDecoration=c.checked?'line-through':''; tx.style.opacity=c.checked?.6:1; });
  w.querySelectorAll('[data-prac2]').forEach(a=>a.onclick=e=>{ e.preventDefault(); goPractice(a.dataset.prac2); });
  w.querySelectorAll('[data-exam2]').forEach(a=>a.onclick=e=>{ e.preventDefault(); startExam(a.dataset.exam2); });
  w.querySelectorAll('[data-go2]').forEach(a=>a.onclick=e=>{ e.preventDefault(); goView(a.dataset.go2); });
  if(w.querySelector('#pomoGo')) w.querySelector('#pomoGo').onclick=()=>{ startPomo(); renderStudy(); };
  if(w.querySelector('#pomoStop')) w.querySelector('#pomoStop').onclick=()=>{ pomo=null; clearInterval(pomoTimer); renderStudy(); };
  if(pomo) tickPomo();
}

function errorCard(){
  const due=errorsDue(), pend=errs().filter(e=>!e.fixed), fixed=errs().filter(e=>e.fixed).length, B=byId();
  let h=`<div class="card"><h2>📒 Cuaderno de errores</h2><p class="muted" style="margin-top:0">Los ejercicios que fallas vuelven a aparecer hasta que los resuelvas bien. ${pend.length} pendiente${pend.length===1?'':'s'} · ${fixed} superado${fixed===1?'':'s'}.</p>`;
  if(due.length) h += due.slice(0,5).map(e=>`<div class="nitem" style="flex-direction:column;align-items:stretch;margin-bottom:8px"><div><b style="color:${B[e.topic]?col(B[e.topic]):'var(--tx2)'}">${esc(e.topic||'—')}</b> ${mth(e.q)}</div>
     <div class="goal" id="ea-${e.id}" style="display:none;margin-top:6px">${e.a?mth(e.a):'(sin respuesta guardada)'}</div>
     <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn sm" data-eshow="${e.id}">Ver respuesta</button><button class="btn sm pri" data-eok="${e.id}">✓ Ya me sale</button><button class="btn sm" data-ebad="${e.id}">✗ Aún no</button></div></div>`).join('') + (due.length>5?`<div class="muted">y ${due.length-5} más…</div>`:'');
  else h += `<div class="muted">${pend.length?'Nada que reintentar hoy. Los próximos vuelven en unos días.':'Aún no hay errores guardados. En Practicar y en Modo examen, marca ✗ cuando falles.'}</div>`;
  h += `<details style="margin-top:10px"><summary class="muted">+ Anotar un error a mano</summary><div style="margin-top:8px"><select id="eTopic">${S.nodes.filter(n=>n.phase!=='U').map(n=>`<option value="${esc(n.id)}">${esc(n.id+' · '+n.title)}</option>`).join('')}</select>
    <input type="text" id="eQ" placeholder="Ejercicio o duda" style="margin-top:6px"><input type="text" id="eA" placeholder="Respuesta correcta (opcional)" style="margin-top:6px"><button class="btn sm pri" id="eAdd" style="margin-top:6px">Guardar en el cuaderno</button></div></details></div>`;
  return h;
}
function bindErrors(w){
  w.querySelectorAll('[data-eshow]').forEach(b=>b.onclick=()=>{ const el=w.querySelector('#ea-'+b.dataset.eshow); el.style.display=el.style.display==='none'?'block':'none'; });
  w.querySelectorAll('[data-eok]').forEach(b=>b.onclick=()=>errorRetry(b.dataset.eok,true));
  w.querySelectorAll('[data-ebad]').forEach(b=>b.onclick=()=>errorRetry(b.dataset.ebad,false));
  const add=w.querySelector('#eAdd'); if(add) add.onclick=()=>{ const q=w.querySelector('#eQ').value.trim(); if(!q){ toast('Escribe el ejercicio'); return; } addError(w.querySelector('#eTopic').value, q, w.querySelector('#eA').value.trim()); toast('Guardado en el cuaderno'); renderStudy(); };
  const go=w.querySelector('#exGo'); if(go) go.onclick=()=>startExam(w.querySelector('#exTopic').value);
}

function subsOf(id){ const n=byId()[id]; return (n&&Array.isArray(n.subs)&&n.subs.length)?n.subs:(SUBT[id]||[]); }
function subsDone(id){ const p=S.progress[id]; return (p&&Array.isArray(p.subs))?p.subs:[]; }
function toggleSub(id,i,on){ const p=P(id); const s=new Set(Array.isArray(p.subs)?p.subs:[]); on?s.add(i):s.delete(i); p.subs=[...s].sort((a,b)=>a-b); save(); }
function subsHtml(id, compact){
  const L=subsOf(id); if(!L.length) return ''; const d=subsDone(id);
  return `<div class="subs">${L.map((t,i)=>`<label class="chk sub"><input type="checkbox" data-sub="${esc(id)}:${i}" ${d.includes(i)?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div>`;
}
function bindSubs(root, after){ root.querySelectorAll('[data-sub]').forEach(c=>c.onchange=()=>{ const [id,i]=c.dataset.sub.split(':'); toggleSub(id,+i,c.checked); if(after) after(id); }); }

const MOP = '(\\([^()<>&]+\\)|√\\([^()<>&]+\\)|[−-]?√?[0-9A-Za-zθπ.,²³⁴⁵⁶⁷⁸⁹⁰¹ⁿᵐ₀-₉]+)';
const FRAC_RE = new RegExp(MOP+'\\s?/\\s?'+MOP,'g');
function fmtMath(h){ // recibe texto ya escapado
  h = h.replace(/\[([^\[\]<>&]+;[^\[\]<>&]+)\]/g,(m,b)=>{ const rows=b.split(';').map(r=>r.trim().split(/\s+/)); const c=Math.max(...rows.map(r=>r.length)); return `<span class="mat" style="grid-template-columns:repeat(${c},auto)">${rows.flat().map(x=>`<span>${x}</span>`).join('')}</span>`; });
  h = h.replace(/\^\(([^()<>]+)\)/g,'<sup>$1</sup>');
  h = h.replace(/\(([^()<>&]+)\) ÷ \(([^()<>&]+)\)/g,'($1)/($2)');
  h = h.replace(FRAC_RE,(m,a,b)=>`<span class="fr"><span>${unpar(a)}</span><span>${unpar(b)}</span></span>`);
  h = h.replace(/√\(([^()<>]+)\)/g,'<span class="rad">√<span class="rc">$1</span></span>').replace(/√([0-9A-Za-zθ]+)/g,'<span class="rad">√<span class="rc">$1</span></span>');

/* ===================== Radar por fase ===================== */
function nodeLevel(n){ const p=S.progress[n.id]||{}; if(p.status==='dominado') return 1;

  const v = n.target>0 ? 0.55*ex+0.35*ts : 0; return p.status==='progreso' ? Math.max(0.15, Math.min(0.85,v||0.3)) : Math.min(0.6,v); }

/* ===================== Avance real vs planeado ===================== */

    if(k<=w){ const end=addDays(START,k*7-1); real.push(pl.filter(n=>{ if(!isDom(n.id)) return false; const d=(S.progress[n.id]||{}).date; return /^\d{4}-\d{2}-\d{2}$/.test(d||'') ? ymd(d)<=end || k===w : k===w; }).length); } }
  const Lp=30,Rp=10,Tp=10,Bp=24,Wv=320,Hv=170, X=k=>Lp+(k-1)*(Wv-Lp-Rp)/18, Y=v=>Tp+(Hv-Tp-Bp)*(1-v/tot);

/* ===================== Curva de olvido ===================== */

/* ===================== Gráficas paso a paso ===================== */
const gnum = v => { if(Math.abs(v-Math.round(v))<1e-9) return num(Math.round(v)); for(let d=2;d<=12;d++){ const n=v*d; if(Math.abs(n-Math.round(n))<1e-9){ const f=Fr(Math.round(n),d); return fs(f); } } const r=Math.round(v*100)/100; return (r<0?'−':'')+String(Math.abs(r)).replace('.',','); };

  switch(kind){

    case 'quad': { const a=pick([1,1,-1,0.5,-0.5,2]), h=rnd(-3,3), k=rnd(-4,4); return {kind,a,h,k}; }
    case 'abs': { const a=pick([1,-1,2]), h=rnd(-3,3), k=rnd(-3,3); return {kind,a,h,k}; }

}
function gBuild(g){

    if(g.a*g.k<0){ const d=Math.sqrt(-g.k/g.a); st.push({t:`Raíces (cortes con el eje x): x = ${gnum(g.h-d)} y x = ${gnum(g.h+d)}.`, p:[P(g.h-d,0,gnum(g.h-d)),P(g.h+d,0,gnum(g.h+d))]}); }
    if(Math.abs(f(0))<=8 && g.h!==0) st.push({t:`Corte con el eje y: f(0) = ${gnum(f(0))}.`, p:[P(0,f(0),`(0, ${gnum(f(0))})`)]});
    st.push({t:'Une los puntos con una curva suave en forma de U.', curve:true}); return {f, eq:`y = ${co(g.a)}${g.h?'('+sh(g.h)+')':'x'}²${kk(g.k)}`, st}; }
  if(g.kind==='abs'){ const f=x=>g.a*Math.abs(x-g.h)+g.k; return {f, eq:`y = ${co(g.a)}|${sh(g.h)}|${kk(g.k)}`, st:[{t:ax},{t:`Vértice (punta de la V) en (${gnum(g.h)}, ${gnum(g.k)}): traslación de |x|.`, p:[P(g.h,g.k,`(${gnum(g.h)}, ${gnum(g.k)})`)], vl:g.h},{t:`Pendiente ${gnum(g.a)} a la derecha y ${gnum(-g.a)} a la izquierda: x = ${gnum(g.h)} ± 2 dan y = ${gnum(f(g.h+2))}.`, p:[P(g.h-2,f(g.h-2)),P(g.h+2,f(g.h+2))]},{t:'Traza dos rectas desde el vértice: forma de V.', curve:true}]}; }

}

  return `<div class="gw" data-gw="${key}"><div class="gw-eq">${mth(b.eq)}</div>${gSVG(b,st)}<div class="gw-step"><b>Paso ${st+1} de ${b.st.length}.</b> ${mth(b.st[st].t)}</div>
    <div class="gw-dots">${b.st.map((_,i)=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>
    <div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm" data-gprev="${key}" ${st===0?'disabled':''}>‹ Atrás</button><button class="btn pri sm" data-gnext="${key}" style="flex:1">${st<last?'Siguiente paso ›':'↺ Repetir'}</button></div></div>`;
}

function bindGraphs(w){
  const host=k=>k==='main'?GW:practice.items[+k];
  const rer=k=>{ const o=host(k); const el=w.querySelector(`[data-gw="${k}"]`); if(el){ el.outerHTML=graphWidget(o.g,o.s||0,k); bindGraphs(w); } };
  w.querySelectorAll('[data-gnext]').forEach(b=>b.onclick=()=>{ const k=b.dataset.gnext, o=host(k), n=gBuild(o.g).st.length; o.s=((o.s||0)+1>=n)?0:(o.s||0)+1; rer(k); });
  w.querySelectorAll('[data-gprev]').forEach(b=>b.onclick=()=>{ const k=b.dataset.gprev, o=host(k); o.s=Math.max(0,(o.s||0)-1); rer(k); });
  const kd=w.querySelector('#gKind'); if(kd && !kd._b){ kd._b=1; kd.onchange=()=>{ GW={kind:kd.value,g:gSpec(kd.value),s:0}; rer('main'); }; }
  const nw=w.querySelector('#gNew'); if(nw && !nw._b){ nw._b=1; nw.onclick=()=>{ GW={kind:GW.kind,g:gSpec(GW.kind),s:0}; rer('main'); }; }
  w.querySelectorAll('[data-gshow]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.gshow, it=practice.items[i]; it.gopen=!it.gopen; it.s=0; const box=w.querySelector('#gbox'+i); box.innerHTML=it.gopen?graphWidget(it.g,0,String(i)):''; bindGraphs(w); });
}

function xpParts(){
  const st=study(), days=Object.keys(st.log).filter(k=>st.log[k]>0).length, mins=Object.values(st.log).reduce((a,b)=>a+(+b||0),0);
  const evx=S.evals.reduce((a,e)=>{ const p=evalPct(e); return a+(p===null?0:Math.min(100,p)*1.5); },0);
  return [
    ['Temas dominados', S.nodes.filter(n=>isDom(n.id)).length*150, 'var(--acc)'],
    ['Ejercicios', sumP(p=>p.count)*2, '#60a5fa'],
    ['Exámenes', sumP(p=>p.test)*10, '#f472b6'],
    ['Teoría', sumP(p=>p.theory?p.theory.best:0)*8, '#a78bfa'],
    ['Lecciones', sumP(p=>p.lesson?1:0)*20, '#2dd4bf'],
    ['Minutos de estudio', mins, '#f4a261'],
    ['Días estudiados', days*10, '#facc15'],
    ['Errores superados', errs().filter(e=>e.fixed).length*20, '#4ade80'],
    ['Repasos', sumP(p=>Array.isArray(p.reviews)?p.reviews.length:0)*40, '#fb7185'],
    ['Evaluaciones', Math.round(evx), '#38bdf8']
  ];
}
const LV_NAMES=['Aprendiz','Explorador','Constructor','Analista','Estratega','Experto','Maestro','Sabio','Leyenda'];
function xpInfo(){
  const parts=xpParts(), xp=Math.round(parts.reduce((a,p)=>a+p[1],0)); let L=1, base=0, need=100;
  while(xp>=base+need){ base+=need; L++; need=100+50*(L-1); }
  return {xp, L, cur:xp-base, need, pct:Math.round((xp-base)/need*100), name:LV_NAMES[Math.min(LV_NAMES.length-1, Math.floor((L-1)/3))], parts};
}

let celebS=null, celebDom=0, celebRank=0, celebXP=0, celebL=0;
function celebrateCheck(){
  const d=S.nodes.filter(n=>isDom(n.id)).length, r=rankIndex(), xi=xpInfo(), live=celebS===S, got=badgesGot(), fresh=[];
  BADGES.forEach(b=>{ if(!got[b.id] && badgeState(b).ok){ got[b.id]=iso(today()); fresh.push(b); } });
  if(fresh.length){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  if(live){
    if(r>celebRank) rankUp(RANKS[r]); else if(xi.L>celebL) levelUp(xi); else if(d>celebDom) confetti();
    if(xi.xp>celebXP) xpPop(xi.xp-celebXP);
    fresh.forEach((b,i)=>setTimeout(()=>badgeToast(b), 700+i*2600));
  }
  celebS=S; celebDom=d; celebRank=r; celebXP=xi.xp; celebL=xi.L;
}

    ex:{q:'1/2 + 3/4 × 2/3', s:[['La multiplicación va antes que la suma (jerarquía)','3/4 × 2/3 = 6/12 = 1/2'],['Ahora la suma','1/2 + 1/2'],['Mismo denominador: suma los numeradores','2/2 = 1']], r:'1'},

    ex:{q:'√50 + √18 − √8', s:[['Busca el mayor cuadrado perfecto dentro de cada raíz','√50 = √(25·2) = 5√2'],['Igual con la segunda','√18 = √(9·2) = 3√2'],['Y con la tercera','√8 = √(4·2) = 2√2'],['Ahora son semejantes: suma los coeficientes','5√2 + 3√2 − 2√2 = 6√2']], r:'6√2'},
