  let s=''; [0,.5,1].forEach(r=>{ s+=`<line x1="${Lp}" x2="${Wv-Rp}" y1="${Y(r)}" y2="${Y(r)}" stroke="var(--line)"/><text x="${Lp-5}" y="${Y(r)+3}" text-anchor="end" font-size="9" fill="var(--tx3)">${r*100}%</text>`; });
  [0,15,30,45,60].forEach(d=>{ s+=`<text x="${X(d)}" y="${Hv-6}" text-anchor="middle" font-size="9" fill="var(--tx3)">${d} d</text>`; });
  s+=`<line x1="${Lp}" x2="${Wv-Rp}" y1="${Y(.7)}" y2="${Y(.7)}" stroke="#facc15" stroke-dasharray="3 4" opacity=".6"/>`;
  L.slice(0,5).forEach(([n,m],ci)=>{ const c=PAL[ci]; const pts=[]; for(let x=0;x<=D;x+=2) pts.push(X(x).toFixed(1)+' '+Y(Math.exp(-x/m.S)).toFixed(1)); s+=`<path class="draw" d="M${pts.join(' L')}" fill="none" stroke="${c}" stroke-width="2" opacity=".9"/>`;
    if(m.t<=D) s+=`<circle cx="${X(m.t)}" cy="${Y(m.R)}" r="4" fill="${c}" stroke="var(--bg2)" stroke-width="1.5"><title>${esc(n.id)}: ${Math.round(m.R*100)} %</title></circle><text x="${X(m.t)+6}" y="${Y(m.R)-6}" font-size="10" font-weight="700" fill="${c}" paint-order="stroke" stroke="var(--bg2)" stroke-width="3">${esc(n.id)}</text>`; });
  h+=`<svg viewBox="0 0 ${Wv} ${Hv}" style="width:100%" role="img" aria-label="Curva de olvido">${s}</svg>`;
  h+=L.slice(0,6).map(([n,m],ci)=>{ const pc=Math.round(m.R*100), c=pc>=70?'#4ade80':pc>=50?'#facc15':'#f87171'; return `<div class="ph-row"><div class="t"><b style="color:${col(n)}">${ci<5?`<i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${PAL[ci]};margin-right:5px"></i>`:''}${esc(n.id)} <span style="color:var(--tx);font-weight:500">${esc(n.title)}</span></b><span style="color:${c};font-weight:700">${pc} %</span></div><div class="pbar" style="--c:${c}"><i style="width:${pc}%"></i></div><div class="muted" style="font-size:12px;margin-top:2px">${m.t} d desde ${m.n?'el último repaso':'que lo dominaste'} · ${m.n} repaso${m.n===1?'':'s'}${pc<70?' · <b style="color:#fde68a">conviene repasarlo</b>':''}</div></div>`; }).join('');
  return h+`<div class="muted">Estimación: la memoria cae como e^(−días/estabilidad); cada repaso triplica la estabilidad. Línea amarilla = 70 %.</div></div>`;
}

/* ===================== Gráficas paso a paso ===================== */
const gnum = v => { if(Math.abs(v-Math.round(v))<1e-9) return num(Math.round(v)); for(let d=2;d<=12;d++){ const n=v*d; if(Math.abs(n-Math.round(n))<1e-9){ const f=Fr(Math.round(n),d); return fs(f); } } const r=Math.round(v*100)/100; return (r<0?'−':'')+String(Math.abs(r)).replace('.',','); };
function gSpec(kind){
  switch(kind){
    case 'line': { const m=pick([-3,-2,-1,1,2,3,0.5,-0.5]), b=rnd(-4,4); return {kind, m, b}; }
    case 'quad': { const a=pick([1,1,-1,0.5,-0.5,2]), h=rnd(-3,3), k=rnd(-4,4); return {kind,a,h,k}; }
    case 'abs': { const a=pick([1,-1,2]), h=rnd(-3,3), k=rnd(-3,3); return {kind,a,h,k}; }
    case 'sqrt': { const h=rnd(-4,1), k=rnd(-3,2); return {kind,h,k}; }
    case 'exp': { const b=pick([2,3]), k=rnd(-3,1); return {kind,b,k}; }
    case 'log': { const b=pick([2,3]); return {kind,b}; }
    default: { const c=rnd(-1,2), m=pick([-1,1,2]), bb=rnd(-2,3); return {kind:'piece',c,m,bb}; }
  }
}
function gBuild(g){
  if(g.kind==='fx'){ const cs=[(g.c||[]).map(gCompile).filter(Boolean),(g.c2||[]).map(gCompile).filter(Boolean)]; return {f:()=>NaN, cs, eq:g.eq, st:g.st.map(t=>Object.assign({},t,{p:(t.p||[]).map(a=>({x:a[0],y:a[1],l:a[2]||'',open:!!a[3],below:!!a[4]}))}))}; }
  const P=(x,y,l,o)=>({x,y,l,open:!!o}), ax='Dibuja los ejes x e y con la misma escala.';
  const sh=(h)=>h===0?'x':h>0?`x − ${gnum(h)}`:`x + ${gnum(-h)}`, kk=k=>k===0?'':k>0?` + ${gnum(k)}`:` − ${gnum(-k)}`;
  const co=a=>a===1?'':a===-1?'−':a===0.5?'(1/2)':a===-0.5?'−(1/2)':gnum(a);
  if(g.kind==='line'){ const f=x=>g.m*x+g.b, st=[{t:ax}, {t:`Corte con el eje y: x = 0 → y = ${gnum(g.b)}.`, p:[P(0,g.b,`(0, ${gnum(g.b)})`)]}, {t:`Pendiente ${gnum(g.m)}: desde (0, ${gnum(g.b)}) avanza 1 a la derecha y ${g.m>=0?'sube':'baja'} ${gnum(Math.abs(g.m))}.`, p:[P(1,f(1),`(1, ${gnum(f(1))})`)]}];
    if(g.m) st.push({t:`Corte con el eje x: y = 0 → x = ${gnum(-g.b/g.m)}.`, p:[P(-g.b/g.m,0,`(${gnum(-g.b/g.m)}, 0)`)]});
    st.push({t:'Une los puntos con una recta.', curve:true}); return {f, eq:`y = ${co(g.m)}${g.m?'x':''}${g.m?kk(g.b):gnum(g.b)}`, st}; }
  if(g.kind==='quad'){ const f=x=>g.a*(x-g.h)**2+g.k, st=[{t:ax}, {t:`Vértice en (${gnum(g.h)}, ${gnum(g.k)}). El eje de simetría es x = ${gnum(g.h)}.`, p:[{...P(g.h,g.k,`V(${gnum(g.h)}, ${gnum(g.k)})`), below:g.a>0}], vl:g.h}, {t:`a = ${gnum(g.a)} ${g.a>0?'> 0: la parábola abre hacia arriba':'< 0: abre hacia abajo'}. Calcula puntos simétricos: x = ${gnum(g.h-1)} y x = ${gnum(g.h+1)} dan y = ${gnum(f(g.h+1))}.`, p:[P(g.h-1,f(g.h-1)),P(g.h+1,f(g.h+1))]}];
    if(g.a*g.k<0){ const d=Math.sqrt(-g.k/g.a); st.push({t:`Raíces (cortes con el eje x): x = ${gnum(g.h-d)} y x = ${gnum(g.h+d)}.`, p:[P(g.h-d,0,gnum(g.h-d)),P(g.h+d,0,gnum(g.h+d))]}); }
    if(Math.abs(f(0))<=8 && g.h!==0) st.push({t:`Corte con el eje y: f(0) = ${gnum(f(0))}.`, p:[P(0,f(0),`(0, ${gnum(f(0))})`)]});
    st.push({t:'Une los puntos con una curva suave en forma de U.', curve:true}); return {f, eq:`y = ${co(g.a)}${g.h?'('+sh(g.h)+')':'x'}²${kk(g.k)}`, st}; }
  if(g.kind==='abs'){ const f=x=>g.a*Math.abs(x-g.h)+g.k; return {f, eq:`y = ${co(g.a)}|${sh(g.h)}|${kk(g.k)}`, st:[{t:ax},{t:`Vértice (punta de la V) en (${gnum(g.h)}, ${gnum(g.k)}): traslación de |x|.`, p:[P(g.h,g.k,`(${gnum(g.h)}, ${gnum(g.k)})`)], vl:g.h},{t:`Pendiente ${gnum(g.a)} a la derecha y ${gnum(-g.a)} a la izquierda: x = ${gnum(g.h)} ± 2 dan y = ${gnum(f(g.h+2))}.`, p:[P(g.h-2,f(g.h-2)),P(g.h+2,f(g.h+2))]},{t:'Traza dos rectas desde el vértice: forma de V.', curve:true}]}; }
  if(g.kind==='sqrt'){ const f=x=>x<g.h?NaN:Math.sqrt(x-g.h)+g.k; return {f, eq:`y = √(${sh(g.h)})${kk(g.k)}`, st:[{t:ax},{t:`Punto inicial: x − (${gnum(g.h)}) = 0 → (${gnum(g.h)}, ${gnum(g.k)}). Dominio x ≥ ${gnum(g.h)}.`, p:[P(g.h,g.k,`(${gnum(g.h)}, ${gnum(g.k)})`)], vl:g.h},{t:'Usa valores con raíz exacta: avanzar 1 sube 1, avanzar 4 sube 2, avanzar 9 sube 3.', p:[P(g.h+1,g.k+1),P(g.h+4,g.k+2),P(g.h+9,g.k+3)]},{t:'Une los puntos: crece cada vez más lento.', curve:true}]}; }
  if(g.kind==='exp'){ const f=x=>g.b**x+g.k; return {f, eq:`y = ${g.b}ˣ${kk(g.k)}`, st:[{t:ax},{t:`Asíntota horizontal y = ${gnum(g.k)}: la curva se acerca pero nunca la toca.`, hl:g.k},{t:`Puntos: x = 0 → ${gnum(1+g.k)}; x = 1 → ${gnum(g.b+g.k)}; x = −1 → ${gnum(1/g.b+g.k)}.`, p:[P(0,1+g.k,`(0, ${gnum(1+g.k)})`),P(1,g.b+g.k),P(-1,1/g.b+g.k)]},{t:`Une los puntos: crece rápido a la derecha (base ${g.b} > 1).`, curve:true}]}; }
  if(g.kind==='log'){ const f=x=>x<=0?NaN:Math.log(x)/Math.log(g.b); return {f, eq:`y = log${sub(g.b)}(x)`, st:[{t:ax},{t:'Asíntota vertical x = 0: el dominio es x > 0.', vlA:0},{t:`Puntos: (1, 0) porque ${g.b}⁰ = 1; (${g.b}, 1); (1/${g.b}, −1).`, p:[P(1,0,'(1, 0)'),P(g.b,1,`(${g.b}, 1)`),P(1/g.b,-1)]},{t:'Une los puntos: es la reflexión de la exponencial sobre y = x.', curve:true}]}; }
  const f=x=>x<g.c?x*x:g.m*x+g.bb;
  return {f, brk:g.c, eq:`f(x) = x² si x < ${gnum(g.c)}; ${co(g.m)}x${kk(g.bb)} si x ≥ ${gnum(g.c)}`, st:[{t:ax},{t:`Marca la frontera x = ${gnum(g.c)}.`, vl:g.c},{t:`Trozo izquierdo x²: en x = ${gnum(g.c)} llega a ${gnum(g.c*g.c)} con punto abierto (no incluido).`, p:[P(g.c,g.c*g.c,'',true),P(g.c-1,(g.c-1)**2),P(g.c-2,(g.c-2)**2)]},{t:`Trozo derecho: en x = ${gnum(g.c)} vale ${gnum(g.m*g.c+g.bb)}, punto cerrado (incluido).`, p:[P(g.c,g.m*g.c+g.bb,`(${gnum(g.c)}, ${gnum(g.m*g.c+g.bb)})`),P(g.c+2,g.m*(g.c+2)+g.bb)]},{t:'Dibuja cada trozo solo en su intervalo.', curve:true}]};
}
function gSVG(b, step){
  const Z=8, Wv=300, sc=Wv/(2*Z), X=x=>Wv/2+x*sc, Y=y=>Wv/2-y*sc; let s='';
  for(let i=-Z;i<=Z;i++){ s+=`<line x1="${X(i)}" x2="${X(i)}" y1="0" y2="${Wv}" stroke="var(--line)" stroke-width="${i%5?0.5:1}" opacity=".6"/><line y1="${Y(i)}" y2="${Y(i)}" x1="0" x2="${Wv}" stroke="var(--line)" stroke-width="${i%5?0.5:1}" opacity=".6"/>`; }
  s+=`<g class="g-axes"><line x1="0" x2="${Wv}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--tx2)" stroke-width="1.4"/><line y1="0" y2="${Wv}" x1="${X(0)}" x2="${X(0)}" stroke="var(--tx2)" stroke-width="1.4"/><text x="${Wv-8}" y="${Y(0)-5}" font-size="11" fill="var(--tx2)">x</text><text x="${X(0)+5}" y="11" font-size="11" fill="var(--tx2)">y</text>${[-5,5].map(i=>`<text x="${X(i)}" y="${Y(0)+12}" font-size="9" text-anchor="middle" fill="var(--tx3)">${i}</text><text x="${X(0)-4}" y="${Y(i)+3}" font-size="9" text-anchor="end" fill="var(--tx3)">${i}</text>`).join('')}</g>`;
  b.st.slice(0,step+1).forEach((st,i)=>{ const fresh=i===step?'g-new':'';
    if(st.vl!==undefined) s+=`<line class="${fresh}" x1="${X(st.vl)}" x2="${X(st.vl)}" y1="0" y2="${Wv}" stroke="#facc15" stroke-dasharray="4 4" opacity=".7"/>`;
    if(st.vlA!==undefined) s+=`<line class="${fresh}" x1="${X(st.vlA)}" x2="${X(st.vlA)}" y1="0" y2="${Wv}" stroke="#f87171" stroke-dasharray="6 4"/>`;
    if(st.hl!==undefined) s+=`<line class="${fresh}" y1="${Y(st.hl)}" y2="${Y(st.hl)}" x1="0" x2="${Wv}" stroke="#f87171" stroke-dasharray="6 4"/>`;
    (st.dl||[]).forEach(([m,c])=>{ s+=`<line class="${fresh}" x1="${X(-Z)}" y1="${Y(-m*Z+c)}" x2="${X(Z)}" y2="${Y(m*Z+c)}" stroke="var(--tx3)" stroke-width="1.3" stroke-dasharray="5 4"/>`; });
    if(st.curve&&b.cs){ (b.cs[st.curve===2?1:0]||[]).forEach(cv=>{ s+=`<path class="g-curve" d="${gPath(cv,X,Y,Z)}" fill="none" stroke="${st.curve===2?'#f472b6':'var(--acc)'}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`; }); }
    else if(st.curve){ let d='', pen=false; for(let k=0;k<=600;k++){ const x=-Z+k*(2*Z)/600, y=b.f(x); const ok=Number.isFinite(y)&&Math.abs(y)<=Z+1 && !(b.brk!==undefined && pen && x>=b.brk && x-(2*Z)/600<b.brk); if(ok){ d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1); pen=true; } else pen=false; } s+=`<path class="g-curve" d="${d}" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`; }
    (st.p||[]).forEach(p=>{ if(Math.abs(p.x)>Z||Math.abs(p.y)>Z) return; s+=`<g class="${fresh} g-pt"><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${p.open?'var(--bg2)':'#facc15'}" stroke="#facc15" stroke-width="2"/>${p.l?`<text x="${X(p.x)+(p.x>Z-3?-7:7)}" y="${Y(p.y)+(p.below?18:-8)}" font-size="10.5" font-weight="700" text-anchor="${p.x>Z-3?'end':'start'}" fill="var(--tx)" paint-order="stroke" stroke="var(--bg2)" stroke-width="3">${esc(p.l)}</text>`:''}</g>`; });
  });
  return `<svg viewBox="0 0 ${Wv} ${Wv}" class="gsvg" role="img" aria-label="Gráfica paso a paso">${s}</svg>`;
}
function graphWidget(g, step, key){
  const b=gBuild(g), last=b.st.length-1, st=Math.min(step,last);
  return `<div class="gw" data-gw="${key}"><div class="gw-eq">${mth(b.eq)}</div>${gSVG(b,st)}<div class="gw-step"><b>Paso ${st+1} de ${b.st.length}.</b> ${mth(b.st[st].t)}</div>

let celebS=null, celebDom=0, celebRank=0, celebXP=0, celebL=0;
function celebrateCheck(){
  const d=S.nodes.filter(n=>isDom(n.id)).length, r=rankIndex(), xi=xpInfo(), live=celebS===S, got=badgesGot(), fresh=[];
  BADGES.forEach(b=>{ if(!got[b.id] && badgeState(b).ok){ got[b.id]=iso(today()); fresh.push(b); } });
  if(fresh.length){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  if(live){
    if(r>celebRank) rankUp(RANKS[r]); else if(xi.L>celebL) levelUp(xi); else if(d>celebDom) confetti();
    if(xi.xp>celebXP) xpPop(xi.xp-celebXP);
    fresh.forEach((b,i)=>setTimeout(()=>badgeToast(b), 700+i*2600));
  }
  celebS=S; celebDom=d; celebRank=r; celebXP=xi.xp; celebL=xi.L;
}
let xpAcc=0, xpEl=null, xpT=null;

  xpAcc = xpEl && xpEl.isConnected ? xpAcc+n : n;
  if(!xpEl || !xpEl.isConnected){ xpEl=document.createElement('div'); xpEl.className='xppop'; document.body.appendChild(xpEl); }
  else { xpEl.style.animation='none'; void xpEl.offsetWidth; xpEl.style.animation=''; }
  xpEl.textContent='+'+xpAcc+' XP'; clearTimeout(xpT); const el=xpEl; xpT=setTimeout(()=>{ el.remove(); },1600);
}

function badgeToast(b){
  buzz([20,40,20]);

}

let LS=null;
const lessonBox = () => document.getElementById('lesson');
function openLesson(id){
  const L=LESSONS[id], n=byId()[id]; if(!L||!n) return;
  LS={id, step:0, gs:0}; const box=lessonBox(); renderLesson(); box.scrollTop=0; box.classList.add('show'); buzz(8);
}
function closeLesson(){ const box=lessonBox(); box.classList.remove('show'); LS=null; if(curView==='vHome') renderHome(); else if(curView==='vStudy'){ const y=document.getElementById('vStudy').scrollTop; renderStudy(); document.getElementById('vStudy').scrollTop=y; } if(selected && panel.classList.contains('open')) openPanel(selected); }
function lessonStep(s,i,fresh){ return `<li class="${fresh?'new':''}"><span class="ls-n">${i+1}</span><div>${mth(s[0])}${s[1]?`<div class="ls-m">${mth(s[1])}</div>`:''}</div></li>`; }
function lessonTail(){
  const L=LESSONS[LS.id], n=byId()[LS.id], ns=L.ex.s.length;
  if(LS.step<ns) return `<button class="btn pri" id="lsNext" style="width:100%;margin-top:10px">${LS.step?'Siguiente paso ›':'Resolver paso a paso ›'}</button>`;
  return `<div class="ls-res">✅ Resultado: <b>${mth(L.ex.r)}</b></div>${L.g?`<div id="lsG" style="margin-top:12px">${graphWidget(L.g, LS.gs, 'L')}</div>`:''}`;
}
function lessonAfter(){
  const L=LESSONS[LS.id], n=byId()[LS.id]; if(LS.step<L.ex.s.length) return '';
  const done=(S.progress[n.id]||{}).lesson;
  return `<section class="ls-sec warn-sec"><h3>⚠️ Error común</h3><p>${mth(L.err)}</p></section>
    <div class="ls-act">${GUIA[n.id]?`<button class="btn" data-guide="${esc(n.id)}">🪜 Paso a paso</button>`:''}${EXPLAIN[n.id]?`<button class="btn" data-exp="${esc(n.id)}">📘 Explicación</button>`:''}${GEN[n.id]?`<button class="btn" id="lsPrac">🧮 Practicar</button>`:''}${THEORY[n.id]?`<button class="btn" id="lsTheo">🧠 Teoría</button>`:''}<button class="btn pri" id="lsDone" ${done?'disabled':''}>${done?'✓ Lección completada':'Terminé la lección · +20 XP'}</button></div>`;
}
function renderLesson(){
  const box=lessonBox(), L=LESSONS[LS.id], n=byId()[LS.id], c=col(n), ns=L.ex.s.length;
  box.innerHTML=`<div class="ls-wrap" style="--c:${c}"><div class="ls-top"><span class="p-id" style="background:${c};margin-top:0">${esc(n.id)}</span><div class="ls-tt"><div class="ls-k">Lección${n.week?' · semana '+n.week:''}</div><h2>${esc(n.title)}</h2></div><button class="xbtn" id="lsX" aria-label="Cerrar" style="margin-top:0">✕</button></div>
    <div class="ls-prog"><i id="lsBar" style="width:${Math.round(LS.step/ns*100)}%"></i></div>${summaryDetails(n.id,false)}
    <section class="ls-sec"><h3>💡 La idea</h3><p class="ls-idea">${mth(L.idea)}</p></section>
    <section class="ls-sec"><h3>📐 Fórmulas clave</h3>${L.f.map((f,i)=>`<div class="fx" style="--i:${i}">${mth(f)}</div>`).join('')}</section>
    <section class="ls-sec"><h3>✏️ Ejemplo resuelto</h3><div class="ls-q">${mth(L.ex.q)}</div><ol class="ls-steps" id="lsSteps">${L.ex.s.slice(0,LS.step).map((s,i)=>lsStep(s,i,false)).join('')}</ol><div id="lsTail">${lessonTail()}</div></section><div id="lsAfter">${lessonAfter()}</div></div>`;
  bindLesson();
}
function bindLesson(){
  const box=lessonBox(), $=s=>box.querySelector(s), L=LESSONS[LS.id], id=LS.id;
  $('#lsX').onclick=closeLesson;
  if($('#lsNext')) $('#lsNext').onclick=()=>{
    const ns=L.ex.s.length; LS.step=Math.min(ns,LS.step+1); buzz(6);
    $('#lsSteps').insertAdjacentHTML('beforeend', lsStep(L.ex.s[LS.step-1], LS.step-1, true));
    $('#lsBar').style.width=Math.round(LS.step/ns*100)+'%';
    $('#lsTail').innerHTML=lessonTail(); $('#lsAfter').innerHTML=lessonAfter(); bindLesson();
    const li=$('#lsSteps').lastElementChild; setTimeout(()=>{ (LS&&LS.step>=ns?$('#lsTail'):li).scrollIntoView({behavior:RM()?'auto':'smooth', block:'nearest'}); },30);
  };
  if($('#lsDone')) $('#lsDone').onclick=()=>{ const p=P(id); if(!p.lesson){ p.lesson=iso(today()); save(); } const b=$('#lsDone'); b.disabled=true; b.textContent='✓ Lección completada'; toast('📖 Lección de '+id+' completada'); };
  if($('#lsPrac')) $('#lsPrac').onclick=()=>{ closeLesson(); goPractice(id); };
  if($('#lsTheo')) $('#lsTheo').onclick=()=>{ closeLesson(); goTheory(id); };
  const gw=()=>{ const el=$('[data-gw="L"]'); if(el){ el.outerHTML=graphWidget(L.g, LS.gs, 'L'); bindLesson(); } };
  const gn=$('[data-gnext="L"]'), gp=$('[data-gprev="L"]');
  if(gn) gn.onclick=()=>{ const n=gBuild(L.g).st.length; LS.gs=LS.gs+1>=n?0:LS.gs+1; gw(); };
  if(gp) gp.onclick=()=>{ LS.gs=Math.max(0,LS.gs-1); gw(); };
}
function lessonCard(){
  const B=byId(), ids=Object.keys(LESSONS).filter(id=>B[id]).sort((a,b)=>((B[a].week||30)-(B[b].week||30))), done=ids.filter(id=>(S.progress[id]||{}).lesson).length, cw=curWeek();
  return `<div class="card" id="lessonCard"><h2>📖 Lecciones</h2><p class="muted" style="margin-top:0">La idea, las fórmulas clave y un ejemplo resuelto paso a paso. <b style="color:var(--tx)">${done}/${ids.length}</b> completadas.</p>
    <div class="ls-grid">${ids.map(id=>{ const n=B[id], d=(S.progress[id]||{}).lesson; return `<button class="ls-chip ${d?'done':''} ${n.week===cw?'cur':''}" data-lesson="${esc(id)}" style="--c:${col(n)}"><span class="lc-top"><b>${esc(id)}</b>${d?'<i>✓</i>':n.week===cw?'<em>Esta semana</em>':''}</span><span class="lc-t">${esc(n.title)}</span></button>`; }).join('')}</div></div>`;
}

}
function summaryDetails(id, open){ return SUMMARY[id]?`<details class="sumry" ${open?'open':''}><summary><span class="sm-ic">📚</span><span class="sm-tt"><b>Resumen del tema</b><small>Teoría y fórmulas explicadas</small></span><span class="sm-chev">›</span></summary><div class="sm-body">${summaryBody(id)}</div></details>`:''; }
function openSummary(id){
  const n=byId()[id]; if(!SUMMARY[id]||!n) return; LS=null; const box=lessonBox(), c=col(n);
  box.innerHTML=`<div class="ls-wrap" style="--c:${c}"><div class="ls-top"><span class="p-id" style="background:${c};margin-top:0">${esc(n.id)}</span><div class="ls-tt"><div class="ls-k">Resumen${n.week?' · semana '+n.week:''}</div><h2>${esc(n.title)}</h2></div><button class="xbtn" id="smX" aria-label="Cerrar" style="margin-top:0">✕</button></div>
    <section class="ls-sec">${summaryBody(id)}</section><div class="ls-act">${LESSONS[id]?`<button class="btn" data-lesson="${esc(id)}">📖 Lección</button>`:''}${GEN[id]?`<button class="btn" id="smPrac">🧮 Practicar</button>`:''}</div></div>`;
  box.scrollTop=0; box.classList.add('show'); buzz(8);
  box.querySelector('#smX').onclick=()=>{ box.classList.remove('show'); };
  const pr=box.querySelector('#smPrac'); if(pr) pr.onclick=()=>{ box.classList.remove('show'); goPractice(id); };
}
function summaryCard(){
  const B=byId(), ids=Object.keys(SUMMARY).filter(id=>B[id]).sort((a,b)=>((B[a].week||30)-(B[b].week||30))||a.localeCompare(b,'es',{numeric:true})), cw=curWeek();
  return `<div class="card" id="summaryCard"><h2>📚 Resúmenes</h2><p class="muted" style="margin-top:0">Lo esencial de cada tema para leer: qué es, sus fórmulas y qué significa cada parte.</p>
    <div class="ls-grid">${ids.map(id=>{ const n=B[id]; return `<button class="ls-chip ${n.week===cw?'cur':''}" data-sum="${esc(id)}" style="--c:${col(n)}"><span class="lc-top"><b>${esc(id)}</b>${n.week===cw?'<em>Esta semana</em>':''}</span><span class="lc-t">${esc(n.title)}</span></button>`; }).join('')}</div></div>`;
}
