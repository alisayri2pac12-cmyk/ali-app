let LS=null;
const lessonBox = () => document.getElementById('lesson');
function openLesson(id){
  const L=LESSONS[id], n=byId()[id]; if(!L||!n) return;
  LS={id, step:0, gs:0}; const box=lessonBox(); renderLesson(); box.scrollTop=0; box.classList.add('show'); buzz(8);
}
function closeLesson(){ const box=lessonBox(); box.classList.remove('show'); LS=null; if(curView==='vHome') renderHome(); else if(curView==='vStudy'){ const y=document.getElementById('vStudy').scrollTop; renderStudy(); document.getElementById('vStudy').scrollTop=y; } if(selected && panel.classList.contains('open')) openPanel(selected); }
function lessonStep(s,i,fresh){ return `<li class="${fresh?'new':''}"><span class="ls-n">${i+1}</span><div>${mth(s[0])}${s[1]?`<div class="ls-m">${mth(s[1])}</div>`:''}</div></li>`; }
function lessonTail(){
  const L=LESSONS[LS.id], n=byId()[LS.id], ns=L.ex.s.length;
  if(LS.step<ns) return `<button class="btn pri" id="lsNext" style="width:100%;margin-top:10px">${LS.step?'Siguiente paso ›':'Resolver paso a paso ›'}</button>`;
  return `<div class="ls-res">✅ Resultado: <b>${mth(L.ex.r)}</b></div>${L.g?`<div id="lsG" style="margin-top:12px">${graphWidget(L.g, LS.gs, 'L')}</div>`:''}`;
}
function lessonAfter(){
  const L=LESSONS[LS.id], n=byId()[LS.id]; if(LS.step<L.ex.s.length) return '';
  const done=(S.progress[n.id]||{}).lesson;
  return `<section class="ls-sec warn-sec"><h3>⚠️ Error común</h3><p>${mth(L.err)}</p></section>
    <div class="ls-act">${GEN[n.id]?`<button class="btn" id="lsPrac">🧮 Practicar</button>`:''}${THEORY[n.id]?`<button class="btn" id="lsTheo">🧠 Teoría</button>`:''}<button class="btn pri" id="lsDone" ${done?'disabled':''}>${done?'✓ Lección completada':'Terminé la lección · +20 XP'}</button></div>`;
}
function renderLesson(){
  const box=lessonBox(), L=LESSONS[LS.id], n=byId()[LS.id], c=col(n), ns=L.ex.s.length;
  box.innerHTML=`<div class="ls-wrap" style="--c:${c}"><div class="ls-top"><span class="p-id" style="background:${c};margin-top:0">${esc(n.id)}</span><div class="ls-tt"><div class="ls-k">Lección${n.week?' · semana '+n.week:''}</div><h2>${esc(n.title)}</h2></div><button class="xbtn" id="lsX" aria-label="Cerrar" style="margin-top:0">✕</button></div>
    <div class="ls-prog"><i id="lsBar" style="width:${Math.round(LS.step/ns*100)}%"></i></div>
    <section class="ls-sec"><h3>💡 La idea</h3><p class="ls-idea">${mth(L.idea)}</p></section>
    <section class="ls-sec"><h3>📐 Fórmulas clave</h3>${L.f.map((f,i)=>`<div class="fx" style="--i:${i}">${mth(f)}</div>`).join('')}</section>
    <section class="ls-sec"><h3>✏️ Ejemplo resuelto</h3><div class="ls-q">${mth(L.ex.q)}</div><ol class="ls-steps" id="lsSteps">${L.ex.s.slice(0,LS.step).map((s,i)=>lessonStep(s,i,false)).join('')}</ol><div id="lsTail">${lessonTail()}</div></section><div id="lsAfter">${lessonAfter()}</div></div>`;
  bindLesson();
}
function bindLesson(){
  const box=lessonBox(), $=s=>box.querySelector(s), L=LESSONS[LS.id], id=LS.id;
  $('#lsX').onclick=closeLesson;
  if($('#lsNext')) $('#lsNext').onclick=()=>{
    const ns=L.ex.s.length; LS.step=Math.min(ns,LS.step+1); buzz(6);
    $('#lsSteps').insertAdjacentHTML('beforeend', lessonStep(L.ex.s[LS.step-1], LS.step-1, true));
    $('#lsBar').style.width=Math.round(LS.step/ns*100)+'%';
    $('#lsTail').innerHTML=lessonTail(); $('#lsAfter').innerHTML=lessonAfter(); bindLesson();
    const li=$('#lsSteps').lastElementChild; setTimeout(()=>{ (LS&&LS.step>=ns?$('#lsTail'):li).scrollIntoView({behavior:RM()?'auto':'smooth', block:'nearest'}); },30);
  };
  if($('#lsDone')) $('#lsDone').onclick=()=>{ const p=P(id); if(!p.lesson){ p.lesson=iso(today()); save(); } const b=$('#lsDone'); b.disabled=true; b.textContent='✓ Lección completada'; toast('📖 Lección de '+id+' completada'); };
  if($('#lsPrac')) $('#lsPrac').onclick=()=>{ closeLesson(); goPractice(id); };
  if($('#lsTheo')) $('#lsTheo').onclick=()=>{ closeLesson(); goTheory(id); };
  const gw=()=>{ const el=$('[data-gw="L"]'); if(el){ el.outerHTML=graphWidget(L.g, LS.gs, 'L'); bindLesson(); } };
  const gn=$('[data-gnext="L"]'), gp=$('[data-gprev="L"]');
  if(gn) gn.onclick=()=>{ const n=gBuild(L.g).st.length; LS.gs=LS.gs+1>=n?0:LS.gs+1; gw(); };
  if(gp) gp.onclick=()=>{ LS.gs=Math.max(0,LS.gs-1); gw(); };
}
function lessonCard(){

  return `<div class="card" id="lessonCard"><h2>📖 Lecciones</h2><p class="muted" style="margin-top:0">La idea, las fórmulas clave y un ejemplo resuelto paso a paso. <b style="color:var(--tx)">${done}/${ids.length}</b> completadas.</p>
    <div class="ls-grid">${ids.map(id=>{ const n=B[id], d=(S.progress[id]||{}).lesson; return `<button class="ls-chip ${d?'done':''} ${n.week===cw?'cur':''}" data-lesson="${esc(id)}" style="--c:${col(n)}"><span class="lc-top"><b>${esc(id)}</b>${d?'<i>✓</i>':n.week===cw?'<em>Esta semana</em>':''}</span><span class="lc-t">${esc(n.title)}</span></button>`; }).join('')}</div></div>`;

function sparkArea(vals, w, h, color){
  const mx=Math.max(1,...vals), n=vals.length, X=i=>i*(w/(n-1)), Y=v=>h-4-(v/mx)*(h-10);
  let d=''; vals.forEach((v,i)=>{ const x=X(i), y=Y(v); if(!i) d+=`M${x} ${y}`; else { const px=X(i-1), py=Y(vals[i-1]), cx=(px+x)/2; d+=` C${cx} ${py} ${cx} ${y} ${x} ${y}`; } });
  const id='sa'+Math.random().toString(36).slice(2,6);
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#${id})" class="sp-fill"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" class="draw"/><circle cx="${X(n-1)}" cy="${Y(vals[n-1])}" r="3.5" fill="${color}" stroke="var(--bg2)" stroke-width="2"/></svg>`;
}

      <div class="ms-meta"><div><b>${+p.count||0}<small>/${mn.target||0}</small></b>ejercicios<i class="mm" style="--p:${mn.target?Math.min(100,(+p.count||0)/mn.target*100):0}%"></i></div><div><b>${sd}<small>/${sb.length}</small></b>subtemas<i class="mm" style="--p:${sb.length?sd/sb.length*100:0}%"></i></div><div><b>${th?th.best+'<small>/'+th.n+'</small>':'—'}</b>teoría<i class="mm" style="--p:${th&&th.n?th.best/th.n*100:0}%"></i></div></div>
      <div class="qa-row">${LESSONS[mn.id]?`<button class="qa ${p.lesson?'':'pri'}" data-q="lesson"><i>📖</i>Lección</button>`:''}${GEN[mn.id]?`<button class="qa ${LESSONS[mn.id]&&!p.lesson?'':'pri'}" data-q="prac"><i>🧮</i>Practicar</button>`:''}${THEORY[mn.id]?`<button class="qa" data-q="theo"><i>🧠</i>Teoría</button>`:''}${GEN[mn.id]?`<button class="qa" data-q="exam"><i>⏱️</i>Examen</button>`:''}</div>
      <button class="hm-row" data-go="vStudy"><span class="hr-ic">📅</span><span class="hr-tx"><b>Plan de hoy</b><small>${tdone} de ${tasks.length} tareas hechas</small></span><span class="hr-bar"><i style="width:${Math.round(tdone/Math.max(1,tasks.length)*100)}%"></i></span><span class="hr-go">›</span></button></div>`;
  }
  // semana
  const dow=(t.getDay()+6)%7, mon=addDays(t,-dow), L7=['L','M','M','J','V','S','D']; let wm=0, wd=0;
  let strip=''; for(let i=0;i<7;i++){ const d=addDays(mon,i), m=minutesOn(d), fut=d>t; wm+=m; if(m>0) wd++;
    strip+=`<div class="wk-d ${i===dow?'today':''} ${fut?'fut':''}"><span>${L7[i]}</span><div class="wk-r">${ringSVG(Math.min(100,Math.round(m/GOAL_MIN*100)),36,4)}${m>=GOAL_MIN?'<em>✓</em>':''}</div><small>${fut?'':m}</small></div>`; }
  const last14=[]; for(let i=13;i>=0;i--) last14.push(minutesOn(addDays(t,-i)));
  h+=`<div class="card"><h2>📆 Tu semana</h2><div class="wk-strip">${strip}</div><div class="wk-sum"><span><b>${Math.floor(wm/60)} h ${wm%60} min</b> esta semana</span><span><b>${wd}/7</b> días con estudio</span></div>
    <div class="spark-box"><div class="muted" style="font-size:11.5px;margin-bottom:2px">Minutos por día · últimas 2 semanas</div>${sparkArea(last14,320,64,'var(--acc)')}</div></div>`;
  // próxima evaluación
  const ne=S.evals.find(e=>e.date && ymd(e.date)>=t && e.score===null);
  if(ne){ const dl=daysBetween(t,ymd(ne.date)), ns=(ne.nodes||[]).filter(id=>byId()[id]), rd=ns.filter(isDom).length;
    h+=`<div class="card"><h2>📝 Próxima prueba</h2><div class="cd"><div class="cd-n"><b data-count="${dl}">${dl}</b><span>${dl===1?'día':'días'}</span></div><div style="min-width:0"><b>${esc(ne.name)}</b><div class="muted">${esc(fmt(ymd(ne.date),{weekday:'long',day:'numeric',month:'long'}))} · ${esc(ne.topic)}</div>
      ${ns.length?`<div class="cd-ready"><span>Temas listos ${rd}/${ns.length}</span><span class="hr-bar"><i style="width:${Math.round(rd/ns.length*100)}%"></i></span></div>`:''}</div></div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-go="vEval" style="flex:1">Ver pruebas</button><button class="btn pri" id="hmSim" style="flex:1.3">⏱ Simular examen</button></div></div>`;
  }
  // pendientes
  const rv=S.nodes.filter(n=>reviewDue(n.id)), er=errorsDue().length;
  if(rv.length||er) h+=`<div class="card"><h2>🔔 Pendientes</h2>${rv.length?`<button class="hm-row" data-go="vStudy"><span class="hr-ic">🔁</span><span class="hr-tx"><b>Repaso espaciado</b><small>Toca repasar ${esc(rv.map(n=>n.id).join(', '))}</small></span><span class="hr-go">›</span></button>`:''}${er?`<button class="hm-row" data-go="vStudy"><span class="hr-ic">📒</span><span class="hr-tx"><b>Cuaderno de errores</b><small>${er} error${er===1?'':'es'} para reintentar hoy</small></span><span class="hr-go">›</span></button>`:''}</div>`;
  // logros
  const got=badgesGot(), gl=BADGES.filter(b=>got[b.id]).sort((a,b)=>(got[b.id]||'').localeCompare(got[a.id]||'')), nx=BADGES.filter(b=>!got[b.id]).map(b=>[b,badgeState(b)]).sort((a,b)=>b[1].r-a[1].r)[0];
  h+=`<div class="card"><h2>🏅 Logros</h2>${nx?`<div class="nx-b">${hexBadge(nx[0],false,50)}<div style="flex:1;min-width:0"><div class="ms-k" style="letter-spacing:.1em">Próximo logro</div><b>${esc(nx[0].n)}</b><div class="muted" style="font-size:12.5px">${esc(nx[0].d)}</div><div class="hr-bar" style="margin-top:6px"><i style="width:${Math.round(nx[1].r*100)}%"></i></div><small class="muted">${Math.floor(nx[1].c)} / ${nx[1].m}</small></div></div>`:''}
    <div class="got-row">${gl.slice(0,5).map(b=>hexBadge(b,true,40)).join('')}<button class="btn sm" data-go="vProg" data-badges="1" style="margin-left:auto">${gl.length}/${BADGES.length} · Ver todos ›</button></div></div>`;
  // consejo
  const doy=Math.floor((t-new Date(t.getFullYear(),0,0))/DAY);
  h+=`<div class="card tip"><h2>💡 Consejo del día</h2><p>${esc(TIPS[doy%TIPS.length])}</p></div>`;
  const wrap=document.getElementById('homeWrap'); wrap.innerHTML=h;
  const $=s=>wrap.querySelector(s);
  $('#hmGear').onclick=()=>goView('vEdit');
  $('#hmRank').onclick=()=>goView('vTree');
  wrap.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ goView(b.dataset.go); if(b.dataset.badges) setTimeout(()=>{ const c=document.getElementById('badgesCard'); if(c) c.scrollIntoView({behavior:'smooth'}); },120); });
  if(mn) wrap.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const q=b.dataset.q; if(q==='lesson') openLesson(mn.id); else if(q==='prac') goPractice(mn.id); else if(q==='theo') goTheory(mn.id); else if(q==='exam') startExam(mn.id); });
  if($('#hmSim')) $('#hmSim').onclick=()=>{ if(ne.id==='final') return startExam('SIM'); const ns=(ne.nodes||[]).filter(id=>GEN[id]); const tg=ns.find(id=>!isDom(id))||ns[0]; startExam(tg||'SIM'); };
  if(anim) countUp(wrap);
}
function countUp(root){
  if(RM()) return;
  root.querySelectorAll('[data-count]').forEach(el=>{ const to=+el.dataset.count; if(!(to>0)) return; const t0=performance.now(), d=to>200?1200:900; el.textContent='0';
    const f=now=>{ const k=Math.min(1,(now-t0)/d), e=1-Math.pow(1-k,3); el.textContent=String(Math.round(to*e)); if(k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); });
}

/* ---------- Más gráficos en Progreso ---------- */
function donut(segs, size, sw, inner){
  const r=(size-sw)/2, C=2*Math.PI*r, tot=segs.reduce((a,s)=>a+s[0],0); let off=0, s='';
  const gap=segs.filter(x=>x[0]>0).length>1?2:0;
  if(tot>0) segs.forEach(([v,c],i)=>{ const len=v/tot*C; if(len<=0) return; s+=`<circle class="dn-seg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-dasharray="${Math.max(0.5,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" style="animation-delay:${i*.1}s"/>`; off+=len; });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="donut"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="${sw}"/>${s}${inner||''}</svg>`;
}
function xpCard(){
  const xi=xpInfo(), parts=xi.parts.filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]), mx=Math.max(1,...parts.map(p=>p[1]));
  return `<div class="card"><h2>⭐ Nivel y experiencia</h2><div class="lvl-row"><div class="lvl-badge"><span>Nivel</span><b>${xi.L}</b></div><div style="flex:1;min-width:0"><b style="font-size:16px">${esc(xi.name)}</b><div class="muted">${xi.xp} XP en total · ${xi.need-xi.cur} XP para el nivel ${xi.L+1}</div><div class="xpbar" style="margin-top:7px"><i style="width:${xi.pct}%"></i></div></div></div>
    ${parts.length?`<h3 class="mini-h">De dónde viene tu XP</h3>${parts.map(([l,v,c])=>`<div class="ph-row"><div class="t"><span style="color:var(--tx)">${esc(l)}</span><span>${Math.round(v)} XP</span></div><div class="pbar" style="--c:${c}"><i style="width:${v/mx*100}%;background:${c}"></i></div></div>`).join('')}`:'<div class="muted" style="margin-top:8px">Resuelve ejercicios, termina lecciones y registra minutos para ganar XP.</div>'}
    <div class="muted" style="margin-top:6px;font-size:12px">Dominar un tema vale 150 XP; cada ejercicio, 2; cada minuto de estudio, 1.</div></div>`;
}
function accuracyCard(){
  const all=accRange(), tot=all.ok+all.bad, t=today();
  const wk=accRange(iso(addDays(t,-6)),iso(t)), pw=accRange(iso(addDays(t,-13)),iso(addDays(t,-7)));
  const pc=x=>x.ok+x.bad?Math.round(x.ok/(x.ok+x.bad)*100):null, p=pc(all), pwk=pc(wk), ppw=pc(pw);
  let bars='', mx=1; const a=accLog(), days=[]; for(let i=13;i>=0;i--){ const d=addDays(t,-i), r=a[iso(d)]||{}; days.push([d,+r.ok||0,+r.bad||0]); mx=Math.max(mx,(+r.ok||0)+(+r.bad||0)); }
  days.forEach(([d,o,b],i)=>{ const x=i*22+4, ho=o/mx*58, hb=b/mx*58; bars+=`<g class="acc-b" style="animation-delay:${i*.03}s">${o?`<rect x="${x}" y="${66-ho}" width="16" height="${ho}" rx="3" fill="#4ade80"/>`:''}${b?`<rect x="${x}" y="${66-ho-hb-(o?1.5:0)}" width="16" height="${hb}" rx="3" fill="#f87171"/>`:''}${!o&&!b?`<rect x="${x}" y="64" width="16" height="2" rx="1" fill="var(--line)"/>`:''}<title>${esc(fmt(d,{day:'numeric',month:'short'}))}: ${o} bien, ${b} mal</title></g><text x="${x+8}" y="80" text-anchor="middle" font-size="9" fill="var(--tx3)">${d.getDate()}</text>`; });
  const trend = pwk!==null&&ppw!==null ? (pwk-ppw) : null;
  return `<div class="card"><h2>🎯 Precisión</h2>${tot?`<div class="acc-top"><div class="acc-d">${donut([[all.ok,'#4ade80'],[all.bad,'#f87171']],104,12)}<div class="acc-c"><b>${p}%</b><span>aciertos</span></div></div>
    <div class="acc-l"><div><i style="background:#4ade80"></i>${all.ok} bien</div><div><i style="background:#f87171"></i>${all.bad} para repasar</div><div class="muted" style="margin-top:4px">Últimos 7 días: <b style="color:var(--tx)">${pwk===null?'—':pwk+' %'}</b>${trend!==null?` <span class="trend ${trend>=0?'up':'down'}">${trend>=0?'▲':'▼'} ${Math.abs(trend)}</span>`:''}</div></div></div>
    <svg viewBox="0 0 312 86" style="width:100%;margin-top:10px">${bars}</svg>`:`<div class="muted">Responde en Practicar, Teoría o un examen y aquí verás tu porcentaje de aciertos día a día.</div>`}</div>`;
}
function phaseTimeCard(){
  const per={}; S.nodes.forEach(n=>{ const m=+(S.progress[n.id]||{}).minutes||0; if(m>0) per[n.phase]=(per[n.phase]||0)+m; });
  const segs=Object.entries(per).sort((a,b)=>b[1]-a[1]), tot=segs.reduce((a,s)=>a+s[1],0);
  if(!tot) return `<div class="card"><h2>🧭 Tiempo por fase</h2><div class="muted">Elige un tema al registrar minutos (o usa el pomodoro y los exámenes) y verás en qué fases inviertes tu tiempo.</div></div>`;
  const hm=m=>m>=60?Math.floor(m/60)+' h '+(m%60?m%60+' min':''):m+' min';
  return `<div class="card"><h2>🧭 Tiempo por fase</h2><div class="acc-top"><div class="acc-d">${donut(segs.map(([k,m])=>[m,PHASES[k].color]),104,14)}<div class="acc-c"><b>${tot>=60?String(Math.round(tot/6)/10).replace('.',','):tot}</b><span>${tot>=60?'horas':'min'}</span></div></div>
    <div class="acc-l">${segs.map(([k,m])=>`<div><i style="background:${PHASES[k].color}"></i><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(PHASES[k].name.split(' · ')[1]||k)}</span><b>${Math.round(m/tot*100)}%</b></div>`).join('')}</div></div>
    <div class="muted" style="margin-top:8px;font-size:12px">Solo cuenta los minutos registrados con tema. Total: ${hm(tot)}.</div></div>`;
}
function badgesCard(){
  const got=badgesGot(), n=BADGES.filter(b=>got[b.id]).length;
  return `<div class="card" id="badgesCard"><h2>🏅 Logros · ${n}/${BADGES.length}</h2><div class="bgrid">${BADGES.map(b=>{ const s=badgeState(b), on=!!got[b.id]; return `<div class="bd ${on?'on':''}" title="${esc(b.d)}">${hexBadge(b,on,54)}<b>${esc(b.n)}</b>${on?`<small>${esc(fmt(ymd(got[b.id]),{day:'numeric',month:'short'}))}</small>`:`<span class="mini"><i style="width:${Math.round(s.r*100)}%"></i></span>`}</div>`; }).join('')}</div><div class="muted" style="margin-top:10px;font-size:12px">Toca y mantén un logro para ver qué pide.</div></div>`;
}

/* ---------- Microinteracciones ---------- */
document.addEventListener('pointerdown', e=>{
  if(RM()) return; const b=e.target.closest('.btn,.qa,.chip,.nchip,.stbtn,.hm-row,.ls-chip,.theme-b'); if(!b||b.disabled) return;
  const r=b.getBoundingClientRect(), d=Math.max(r.width,r.height)*2.2, s=document.createElement('span'); s.className='rip';
  s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`; b.appendChild(s); setTimeout(()=>s.remove(),650);
}, {passive:true});
document.addEventListener('click', e=>{ const b=e.target.closest('[data-lesson]'); if(b){ openLesson(b.dataset.lesson); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && LS) closeLesson(); });
(function(){ let y0=null, dy=0;
  panel.addEventListener('touchstart',e=>{ if(innerWidth>=900 || !e.target.closest('.grab') || e.target.closest('button')) return; y0=e.touches[0].clientY; dy=0; panel.style.transition='none'; },{passive:true});
  panel.addEventListener('touchmove',e=>{ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); panel.style.transform=`translateY(${dy}px)`; },{passive:true});
  const end=()=>{ if(y0===null) return; y0=null; panel.style.transition=''; panel.style.transform=''; if(dy>80){ buzz(8); closePanel(); } };
  panel.addEventListener('touchend',end); panel.addEventListener('touchcancel',end);
})();
const EMO_RE=/^((?:\p{Extended_Pictographic}|[∫Σ])(?:️|‍\p{Extended_Pictographic})*)\s*/u;
function iconize(root){ root.querySelectorAll('.card>h2:not([data-i])').forEach(h=>{ h.dataset.i='1'; const t=h.firstChild; if(!t||t.nodeType!==3) return; const m=t.data.match(EMO_RE); if(!m) return; t.data=t.data.slice(m[0].length); const s=document.createElement('span'); s.className='hic'; s.setAttribute('aria-hidden','true'); s.textContent=m[1]; h.insertBefore(s,t); }); }
try{ const mainEl=document.querySelector('main'); new MutationObserver(()=>iconize(mainEl)).observe(mainEl,{childList:true,subtree:true}); }catch(e){}

let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
let curView='vHome';
const ORDER=['vHome','vTree','vStudy','vProg','vEval','vMalla','vEdit'];
function goView(v){
  if(!document.getElementById(v)) v='vHome';
  const prev=curView; curView=v;
  document.querySelectorAll('nav button').forEach(x=>{ const on=x.dataset.v===v; x.classList.toggle('active',on); if(on) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current'); });
  document.body.classList.toggle('malla', v==='vMalla'); document.body.classList.toggle('home', v==='vHome'); if(v==='vMalla') ensureMalla();
  try{ localStorage.setItem('arbolAli.app', v==='vMalla'?'malla':'mat'); }catch(e){}
  if(v==='vTree'){ renderHeader(); renderTree(); if(!firstFit) requestAnimationFrame(()=>{ fitView(); firstFit=!!svg.getBoundingClientRect().width; if(firstFit&&!RM()){ world.classList.add('intro'); setTimeout(()=>world.classList.remove('intro'),1400); } }); }
  else if(v!=='vHome'&&v!=='vMalla') renderHeader();
  document.querySelectorAll('.view').forEach(x=>{ x.classList.toggle('active',x.id===v); x.classList.remove('enter'); });
  const cv=document.getElementById(v);
  if(prev!==v){ cv.style.setProperty('--dx',(ORDER.indexOf(v)>=ORDER.indexOf(prev)?26:-26)+'px'); void cv.offsetWidth; cv.classList.add('enter'); clearTimeout(cv._et); cv._et=setTimeout(()=>cv.classList.remove('enter'),1300); buzz(5); }
  renderCurrent(); if(prev!==v && v==='vHome') countUp(document.getElementById('homeWrap'));
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>goView(b.dataset.v));
function renderCurrent(){ if(curView==='vHome') renderHome(); else if(curView==='vStudy') renderStudy(); else if(curView==='vProg') renderProgress(); else if(curView==='vEval') renderEvals(); else if(curView==='vEdit') renderEditor(); }
function refreshAll(){ renderHeader(); renderTree(); renderCurrent(); }
let firstFit=false;
function setAppH(){ const h=(window.visualViewport&&!/input|textarea|select/i.test((document.activeElement||{}).tagName||''))?Math.round(visualViewport.height):innerHeight; document.documentElement.style.setProperty('--appH', Math.max(h,innerHeight*0.6)+'px'); }
setAppH(); addEventListener('resize',setAppH); addEventListener('orientationchange',()=>setTimeout(setAppH,250)); if(window.visualViewport) visualViewport.addEventListener('resize',setAppH);
window.addEventListener('resize', ()=>{ if(!firstFit){ fitView(); } });
meta(); save(); autoSnapshot();
renderHeader(); renderTree(); renderHome(true); try{ if(localStorage.getItem('arbolAli.app')==='malla') showApp('malla'); }catch(e){}
setTimeout(backupCheck, 1200);
// Si la app queda abierta y cambia el día, actualiza racha, plan y semana al volver.
let lastDay=iso(today());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState!=='visible') return; const d=iso(today()); if(d===lastDay) return; lastDay=d; autoSnapshot(); refreshAll(); setTimeout(backupCheck, 800); });
requestAnimationFrame(()=>{ fitView(); firstFit = !!svg.getBoundingClientRect().width; });
</script>
