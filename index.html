<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Árbol de Matemática</title>
<script>
try{ const t=localStorage.getItem('arbolAli.theme'); if(t==='noche'||t==='verde'||t==='oscuro'||t==='calido') document.documentElement.dataset.theme=t; }catch(e){}
if(/^https?:$/.test(location.protocol)){
  document.write('<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">');
  if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Árbol Ali">
<style>
:root{
  /* Medianoche (por defecto): casi negro neutro, superficies escalonadas y un solo acento violeta */
  --bg:#08090b; --bg2:#111215; --bg3:#1a1b20; --line:#24252b; --line2:#33353d; --tx:#ededf0; --tx2:#a2a3ad; --tx3:#6f717c;
  --ok:#4ade80; --mid:#facc15; --bad:#f87171; --acc:#8b7cff; --accG:linear-gradient(180deg,#9d90ff,#7563f5); --onAcc:#0c0920;
  --glass:#111215e6; --bg0:#060709; --card-hi:#15161a; --hl:#ffffff0b; --shadow:0 12px 30px -16px #000;
  --node:#141519; --nodeL:#0f1013; --nodeLs:#3a3c44; --nodeLt:#7b7d88; --dot:#1c1d22; --edge:#43454e;
  --cur:#1c1a33; --info:#1d1938; --infoTx:#d3ccff; --link:#ab9fff;
  --au1:#6d5cff47; --au2:#2f8bff33; --au3:#c04bff2b;
}
:root[data-theme="calido"]{--bg:#0e0c0a; --bg2:#171411; --bg3:#221d18; --line:#342c24; --line2:#4a3f34; --tx:#f4ede4; --tx2:#bfb1a1; --tx3:#8a7c6c;   --ok:#4ade80; --mid:#facc15; --bad:#f87171; --acc:#f2a65a; --accG:linear-gradient(180deg,#f7b878,#e88f45); --onAcc:#1d1207;   --glass:#171411e8; --bg0:#0a0807; --card-hi:#1d1915; --hl:#ffffff0d; --shadow:0 10px 28px -14px #000;   --node:#1b1612; --nodeL:#14110e; --nodeLs:#4d4237; --nodeLt:#8f8170; --dot:#2b231b; --edge:#5c4d3f;   --cur:#2b2016; --info:#36250f; --infoTx:#fcd9a8; --link:#f5b97a; --au1:#c2621a3d; --au2:#8a3d122e; --au3:#f2a65a24;}
:root[data-theme="oscuro"]{--au1:#3b5bdb2e;--au2:#1c7ed624;--au3:transparent;--bg:#0d1017;--bg2:#151a23;--bg3:#1d2330;--line:#2a3242;--line2:#3a4252;--tx:#e6e8ee;--tx2:#9aa3b2;--tx3:#6b7383;--acc:#7aa2ff;--accG:var(--acc);--onAcc:#0b1020;--glass:#151a23e6;--bg0:#090c12;--card-hi:var(--bg2);--hl:#ffffff08;--node:#141925;--nodeL:#161a22;--nodeLs:#4a5160;--nodeLt:#7d8595;--dot:#1c2230;--edge:#465064;--cur:#1a2338;--info:#172443;--infoTx:#bfd0ff;--link:#9ab8ff}
:root[data-theme="noche"]{--au1:#3b6cff38;--au2:#5b8cff26;--au3:#7a5cff1f;--line2:#33467a;--accG:var(--acc);--onAcc:#0b1020;--card-hi:#131f3b;--hl:#ffffff0a;--node:#121b34;--nodeL:#0f172b;--nodeLs:#3d4d78;--nodeLt:#7f8cb3;--dot:#16213f;--edge:#41548a;--cur:#18264d;--info:#172443;--infoTx:#bfd0ff;--link:#9ab8ff;--bg:#0a1020;--bg2:#101a33;--bg3:#18254a;--line:#24345f;--tx:#e8edff;--tx2:#a3b0d6;--tx3:#6f7ca3;--acc:#8fb4ff;--glass:#101a33e6;--bg0:#070c19}
:root[data-theme="verde"]{--au1:#1fae7a33;--au2:#2dd4bf24;--au3:#0e7a5a1f;--line2:#2f5440;--accG:var(--acc);--onAcc:#052019;--card-hi:#13221c;--hl:#ffffff0a;--node:#12201a;--nodeL:#0e1814;--nodeLs:#3b5a4a;--nodeLt:#7f9a8c;--dot:#15261e;--edge:#3f6352;--cur:#173026;--info:#0f2e26;--infoTx:#b5f5e4;--link:#7ee8d3;--bg:#0a120f;--bg2:#101c17;--bg3:#172a22;--line:#23402f;--tx:#e6f2ec;--tx2:#9db8aa;--tx3:#6a8577;--acc:#5eead4;--glass:#101c17e6;--bg0:#07100c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;height:100%;}
body{background:transparent;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"tnum" 0}
h1,h2,h3,.big{letter-spacing:-.01em}.big{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;height:var(--appH,100dvh);overflow:hidden}
#mallaFrame{display:block;width:100%;height:100%;border:0;background:var(--bg)}
#vMalla{padding:0;overflow:hidden}
body.malla header{display:none}
header{grid-row:1} main{grid-row:2} nav{grid-row:3}
/* Cabecera */
header{display:flex;gap:10px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);position:relative;z-index:3;border-bottom:1px solid var(--line);box-shadow:0 6px 18px -12px #000}
#rankIcon{flex:0 0 auto;width:44px;height:50px}
.hd-txt{min-width:0;flex:1}
.hd-rank{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-rank small{font-weight:500;color:var(--tx2);font-size:12px;margin-left:4px}
.hd-next{font-size:12.5px;color:var(--tx2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hd-next b{color:var(--tx)}
.hd-days{flex:0 0 auto;text-align:center;background:var(--bg3);box-shadow:inset 0 1px 0 var(--hl);border-radius:10px;padding:4px 8px;line-height:1.1}
.hd-days b{display:block;font-size:18px}
.hd-days span{font-size:10.5px;color:var(--tx2)}
main{position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none;padding:14px 14px 30px}
.view.active{display:block}
#vTree{padding:0;overflow:hidden}
/* Navegación */
nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:color-mix(in srgb,var(--bg2) 86%,transparent);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));position:relative;z-index:6;min-height:62px}
nav button{background:none;border:0;padding:5px 0 4px;color:var(--tx2);font-size:10.5px;font-weight:600;letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
nav button>span:not(.badge){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav .ic{width:46px;height:28px;padding:3px 12px;border-radius:999px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:background-color .25s,color .25s,transform .25s var(--ez)}
nav button.active{color:var(--tx)}
nav button.active .ic{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
nav button{position:relative}
nav .badge{position:absolute;top:2px;left:calc(50% + 8px);background:#f87171;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px;line-height:1.3}
.hd-days .stk{display:block;font-size:11px;color:#fbd3ab;margin-top:2px}

/* Árbol */
#tree{width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none;background:
 radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.5px) 0 0/22px 22px}
.node{cursor:pointer;transition:opacity .2s}
.node .box{stroke-width:2}
.node text{pointer-events:none}
.node .nid{font-weight:800;font-size:12px}
.node .nwk{font-size:10.5px}
.node .ntl{font-size:12.5px;font-weight:600}
.st-lock .box{fill:var(--nodeL);stroke:var(--nodeLs)}
.st-lock text{fill:var(--nodeLt)}
.st-avail .box{fill:var(--node)}
.st-avail text{fill:var(--tx)}
.st-avail .nid,.st-prog .nid{fill:var(--c)}
.st-prog .box{fill:var(--node);stroke-width:3}
.st-prog .over{fill:var(--c);opacity:.22}
.st-prog text{fill:var(--tx)}
.st-dom .box{fill:var(--c)}
.st-dom text{fill:#10131a}
.node .bar-bg{fill:#00000055}
.node .bar{fill:var(--c)}
.st-dom .bar{fill:#10131a;opacity:.45}
.node.dim{opacity:.18}
.node.sel .box{stroke:#fff;stroke-width:3.5}
.node.hl .box{filter:drop-shadow(0 0 6px var(--c))}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6;transition:opacity .2s}
.edge.dash{stroke-dasharray:6 5}
.edge.dim{opacity:.12}
.edge.hl{stroke:var(--tx);stroke-width:2.4}
.edge.path{stroke:#facc15;stroke-width:2.6}
.now-ring{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:4 4;opacity:.8;animation:spin 6s linear infinite}
@keyframes spin{to{stroke-dashoffset:-80}}
.now-tag{font-size:10.5px;font-weight:700;fill:#fff}
.side-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#4ade80;opacity:.8}
.lvl-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.75}
.tb{position:absolute;display:flex;gap:6px;flex-wrap:wrap}
.tb-top{top:10px;left:10px;right:10px}
@media (max-width:600px){.tb-top .chip{flex:1 1 0;line-height:1.2;font-size:12px;padding:6px 8px}}
.chip{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(4px);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--tx)}
.chip.on{background:#facc15;color:#111;border-color:#facc15;font-weight:700}
.tb-zoom{right:10px;bottom:12px;flex-direction:column}
.zbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:20px;color:var(--tx)}
.legend{position:absolute;left:10px;bottom:12px;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:11px;color:var(--tx2);display:grid;grid-template-columns:auto auto;gap:3px 10px}
.legend.min{grid-template-columns:auto}.legend.min div{display:none}.legend.min::before{content:'Leyenda ▸'}
@media (max-width:600px){.legend{font-size:10px}}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:2px solid var(--acc)}
.banner{flex:1 0 100%;background:#2a2410f2;border:1px solid #facc1580;color:#fde68a;border-radius:12px;padding:9px 12px;font-size:13px;display:none}
.banner.show{display:block}
/* Panel de nodo */
#panel{position:absolute;left:0;right:0;bottom:0;max-height:74%;overflow:auto;background:var(--bg2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px #0008;transform:translateY(105%);transition:transform .25s ease;padding:0 16px 20px;z-index:5;overscroll-behavior:contain}
#panel.open{transform:none}
.grab{position:sticky;top:0;background:var(--bg2);padding:10px 0 8px;z-index:2;display:flex;align-items:flex-start;gap:10px}
.grab::before{content:"";position:absolute;left:50%;top:5px;width:40px;height:4px;border-radius:2px;background:var(--line2);transform:translateX(-50%)}
.p-id{font-weight:800;font-size:13px;padding:3px 8px;border-radius:8px;color:#111;margin-top:9px}
.p-title{flex:1;margin-top:6px}
.p-title h2{margin:0;font-size:17px;line-height:1.25}
.p-title div{font-size:12.5px;color:var(--tx2)}
.xbtn{background:var(--bg3);border:0;border-radius:10px;width:36px;height:36px;font-size:18px;margin-top:6px;flex:0 0 auto}
.sec{margin-top:12px}
.sec h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{border:1px solid var(--line);background:var(--bg3);border-radius:8px;padding:5px 9px;font-size:13px}
.nchip b{color:var(--c)}
.nchip.done{background:color-mix(in srgb,var(--c) 25%,var(--bg3))}
.nchip.done::after{content:" ✓";color:var(--ok)}
.muted{color:var(--tx3);font-size:13px}
.warn{background:#2b1d10;border:1px solid #f4a26166;color:#fbd3ab;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.goal{background:var(--bg3);border-radius:10px;padding:9px 11px;font-size:14px}
.counter{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.counter button{background:var(--bg3);border:1px solid var(--line);border-radius:10px;min-width:44px;height:40px;font-size:16px;font-weight:700}
.counter input[type=number]{width:72px;height:40px;text-align:center;font-size:17px;font-weight:700}
.counter .of{color:var(--tx2);font-size:15px}
input[type=number],input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:40px}
input[type=date]{color-scheme:dark}
@media (max-width:600px){input[type=number],input[type=text],input[type=date],select,textarea{font-size:16px}}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
label.f{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.pbar{height:9px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-top:6px}
.pbar>i{display:block;height:100%;background:var(--c,var(--acc));border-radius:6px;transition:width .3s}
.stbtn{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:0;font-weight:800;font-size:15px;color:#111}
.stnow{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg3)}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:14px}
.btn.pri{background:var(--accG);border-color:var(--acc);color:var(--onAcc);font-weight:700;box-shadow:0 4px 14px -6px var(--acc)}
.btn.danger{background:#3a1518;border-color:#f8717166;color:#fecaca}
.btn.sm{padding:6px 10px;font-size:13px}
/* Tarjetas */
.card{background:linear-gradient(180deg,var(--card-hi),var(--bg2) 70%);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
.card h2{margin:0 0 10px;font-size:16.5px;font-weight:750;letter-spacing:-.015em}
.big{font-size:28px;font-weight:800;line-height:1.1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg3);border-radius:12px;padding:11px 12px;box-shadow:inset 0 1px 0 var(--hl)}
.stat span{display:block;font-size:12px;color:var(--tx2)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700}
.pill.ok{background:#14361f;color:#86efac}.pill.mid{background:#3a2f0b;color:#fde68a}.pill.bad{background:#3a1518;color:#fecaca}.pill.info{background:var(--info);color:var(--infoTx)}
.ph-row{margin:9px 0}
.ph-row .t{display:flex;justify-content:space-between;font-size:13.5px}
.ph-row .t span{color:var(--tx2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13.5px}
.tl li.cur{background:var(--cur);border-radius:10px;border-bottom-color:transparent}
.tl .wk{font-weight:800;color:var(--tx2);font-size:12px;text-align:center}
.tl .d{font-size:11.5px;color:var(--tx3)}
.tl .rv{color:var(--tx2);font-style:italic}
.ev{border-left:4px solid var(--line)}
.ev.next{border-left-color:var(--acc)}
.ev .meta{font-size:12.5px;color:var(--tx2)}
.ev .inp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ev .inp input[type=number]{width:76px;text-align:center}
.ev .res{margin-top:9px;font-size:13.5px}
.rule{font-size:13px;color:var(--tx2)}
.rule li{margin:3px 0}
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:10px;padding:8px 10px}
.nitem .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.nitem .tx{flex:1;min-width:0;font-size:13.5px}
.nitem .tx small{display:block;color:var(--tx3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranks{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;gap:10px;align-items:center;font-size:13.5px}
.rk svg{flex:0 0 auto}
.rk.lock{opacity:.4}
.rk small{display:block;color:var(--tx2);font-size:12px}
/* Modal */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92dvh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.mbox h2{margin:0 0 10px;font-size:18px}
.mbox .fld{margin-bottom:11px}
.reqbox{display:flex;flex-wrap:wrap;gap:6px}
.reqbox label{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.reqbox label.no{opacity:.35}
.reqbox input{width:auto;min-height:0;margin:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:20px;height:20px;min-height:0}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.err{color:#fca5a5;font-size:13px;min-height:1em}
#exam{position:fixed;inset:0;background:var(--bg);z-index:18;overflow:auto;display:none;padding:12px 14px calc(30px + env(safe-area-inset-bottom));padding-top:max(12px,env(safe-area-inset-top))}
#exam.show{display:block}
.ex-wrap{max-width:700px;margin:0 auto}
.ex-top{display:flex;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:-12px;background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
.ex-clock{font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;background:var(--bg3);border-radius:10px;padding:4px 10px;flex:0 0 auto}
.ex-clock.low{color:#fca5a5}
.ex-list{padding-left:22px}.ex-list li{margin:12px 0;font-size:16px}
.ex-mk{display:flex;gap:8px;margin-top:6px}
.pomo{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg3);border-radius:12px;padding:10px;margin-top:10px}
.pomo .ex-clock{font-size:20px;background:var(--bg)}
.tips{margin-top:10px;font-size:13.5px}.tips summary{cursor:pointer;color:var(--tx2)}.tips li{margin:5px 0}
a{color:var(--link)}
.subs{display:flex;flex-direction:column;gap:2px}
label.sub{font-size:13.5px;align-items:flex-start;padding:4px 0}
label.sub input{width:18px;height:18px;margin-top:1px;flex:0 0 auto}
label.sub input:checked+span{text-decoration:line-through;opacity:.6}
.tl details{margin-top:4px}.tl summary{font-size:12px;color:var(--tx2);cursor:pointer}
#updBar{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:25;background:var(--info);border:1px solid var(--acc);color:var(--infoTx);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 6px 20px #0008}

/* ---------- Fórmulas ---------- */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 2px}
.fr>span{padding:0 3px;white-space:nowrap}
.fr>span:first-child{border-bottom:1.4px solid currentColor;padding-bottom:1px}
.fr>span:last-child{padding-top:1px}
.rad{white-space:nowrap}.rad .rc{border-top:1.4px solid currentColor;padding:0 1px;margin-left:1px}

/* ---------- Animaciones ---------- */
:root{--ez:cubic-bezier(.22,1,.36,1)}

@keyframes okPulse{0%{box-shadow:0 0 0 0 #4ade8099}100%{box-shadow:0 0 0 12px #4ade8000}}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-4deg)}}
@keyframes fall{0%{transform:translate(0,-10vh) rotate(0);opacity:1}100%{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@keyframes ruIn{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.08) rotate(3deg);opacity:1}100%{transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px var(--g))}50%{filter:drop-shadow(0 0 22px var(--g))}}

button:active:not(:disabled),.btn:active,.nchip:active,.zbtn:active{transform:scale(.95)}

.guide-tg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 13px;margin:0 0 10px;border-radius:14px;border:1px solid var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 12%,var(--bg2));color:var(--tx);font:inherit;cursor:pointer}.guide-tg>i{font-style:normal;font-size:22px}.guide-tg span{flex:1;min-width:0}.guide-tg b{display:block;font-size:14.5px}.guide-tg small{display:block;font-size:12px;color:var(--tx2);margin-top:1px}.guide-tg em{font-style:normal;font-size:20px;color:var(--tx3)}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.deep-tg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 13px;margin:0 0 10px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--acc)) 14%,var(--bg3)),var(--bg2));color:var(--tx)}
.deep-tg span{flex:1;min-width:0}.deep-tg b{display:block;font-size:14.5px}.deep-tg small{display:block;font-size:12px;color:var(--tx2);margin-top:1px}
.deep-tg i{flex:0 0 auto;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .25s}
.deep-tg i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s var(--ez)}
.deep-tg.on{border-color:var(--c,var(--acc))}.deep-tg.on i{background:var(--c,var(--acc))}.deep-tg.on i::after{transform:translateX(18px)}
.deep-sec{border-color:color-mix(in srgb,var(--c,var(--acc)) 45%,var(--line))}
.dq{border-radius:12px;background:var(--bg3);margin-bottom:8px;overflow:hidden;animation:cardIn .4s var(--ez) both;animation-delay:calc(var(--i)*.05s)}
.dq summary{list-style:none;cursor:pointer;padding:10px 34px 10px 12px;font-weight:650;font-size:14.5px;position:relative}.dq summary::-webkit-details-marker{display:none}
.dq summary::after{content:"›";position:absolute;right:12px;top:8px;font-size:20px;color:var(--tx3);transition:transform .25s}.dq[open] summary::after{transform:rotate(90deg)}
.dq p{margin:0;padding:0 12px 12px;font-size:14px;line-height:1.55;color:var(--tx2)}
.rec{margin:0;padding-left:22px}.rec li{margin-bottom:7px;line-height:1.5}.rec li::marker{color:var(--c,var(--acc));font-weight:800}
.ls-why{margin-top:6px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--c,var(--acc)) 10%,transparent);border-left:2px solid var(--c,var(--acc));font-size:13.5px;line-height:1.45;color:var(--tx2)}.ls-why b{color:var(--tx);font-size:12.5px}
</style>

/* ===================== Árbol: dibujo ===================== */
const svg = document.getElementById('tree'), world = document.getElementById('world');
let selected = null, pathMode = null;
function wrap(text, max){
  const words = String(text).split(/\s+/), lines=[]; let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>max && cur){ lines.push(cur); cur=w; } else cur=(cur+' '+w).trim(); });
  if(cur) lines.push(cur);

}
function renderTree(){

  if(pathMode && B[pathMode]){ pathSet = new Set([...ancestors(pathMode), pathMode].filter(id=>!isDom(id))); }

  const inc = {}, out = {};

  const slot = (list, key, id) => { const arr=(list[key]||[]).slice().sort((a,b)=>pos[a].x-pos[b].x); const i=arr.indexOf(id), k=arr.length; return k<=1?0:(i/(k-1)-.5)*W*0.6; };
  let h = '';

  if(LAY.colX.R!==undefined) h += `<text class="side-lbl" x="${LAY.colX.R+W/2}" y="-14" text-anchor="middle" style="fill:#fb7185">RAMA R · PREPARACIÓN</text>`;
  const uNodes = S.nodes.filter(n=>n.phase==='U'&&pos[n.id]);
  if(uNodes.length){ const y=Math.min(...uNodes.map(n=>pos[n.id].y)); h += `<line x1="${-LAY.half-20}" x2="${LAY.half+20}" y1="${y-GY/2}" y2="${y-GY/2}" stroke="#facc1555" stroke-dasharray="3 6"/><text class="lvl-lbl" x="${-LAY.half-16}" y="${y-GY/2-7}" fill="#facc15">UNIVERSIDAD · 29 MAR 2027</text>`; }
  h += `<text class="lvl-lbl" x="${-LAY.half-16}" y="-14" fill="var(--tx2)">ANTES DE LA UNIVERSIDAD</text>`;
  // flechas
  S.nodes.forEach(n=>n.reqs.forEach(r=>{
    if(!B[r]||!pos[r]||!pos[n.id]) return;
    const a=pos[r], b=pos[n.id];
    const x1=a.x+W/2+slot(out,r,n.id), y1=a.y+H, x2=b.x+W/2+slot(inc,n.id,r), y2=b.y-2;
    const dy=Math.max(28,(y2-y1)*0.45);

    if(lit){ const on=(r===selected||A.has(r))&&(n.id===selected||A.has(n.id)) || (r===selected||D.has(r))&&(n.id===selected||D.has(n.id)); cls+= on?' hl':' dim'; if(on) mk='arH'; }
    else if(pathSet){ const on=pathSet.has(n.id)&&(pathSet.has(r)); cls+= on?' path':' dim'; if(on) mk='arP'; }
    h += `<path class="${cls}" marker-end="url(#${mk})" d="M${x1} ${y1} C${x1} ${y1+dy} ${x2} ${y2-dy} ${x2} ${y2}"/>`;
  }));
  // nodos
  S.nodes.forEach(n=>{
    const p=pos[n.id]; if(!p) return;
    const st=nodeState(n), pr=S.progress[n.id]||{}, c=col(n);

    const lines = wrap(n.title, 19);

    const wk = n.week ? 'Sem '+n.week : (n.dates.length<=14 ? n.dates : (/^ciclo/i.test(n.dates) ? n.dates.split(' ').slice(0,2).join(' ')+'+' : n.dates.split(' ')[0]));
    let g = `<g class="${cls}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})" style="--c:${c}">`;
    if(n.week===w && st!=='dom') g += `<rect class="now-ring" x="-6" y="-6" width="${W+12}" height="${H+12}" rx="15"/><text class="now-tag" x="${W/2}" y="-10" text-anchor="middle">▼ ESTA SEMANA</text>`;
    g += `<rect class="box" width="${W}" height="${H}" rx="11" style="stroke:${st==='lock'?'':c}" ${n.dashed?'stroke-dasharray="7 5"':''}/>`;
    if(st==='prog') g += `<rect class="over" width="${W}" height="${H}" rx="11"/>`;
    g += `<text class="nid" x="10" y="17">${esc(n.id)}${st==='dom'?' ✓':''}${reviewDue(n.id)?' 🔁':''}${st==='lock'?' 🔒':''}</text>`;
    g += `<text class="nwk" x="${W-9}" y="17" text-anchor="end">${esc(wk)}</text>`;
    g += `<text class="ntl" x="${W/2}" y="${ty}" text-anchor="middle">${lines.map((l,i)=>`<tspan x="${W/2}" dy="${i?14:0}">${esc(l)}</tspan>`).join('')}</text>`;
    if(n.target>0 && !n.grade20){ const r=Math.min(1,(pr.count||0)/n.target); g += `<rect class="bar-bg" x="10" y="${H-9}" width="${W-20}" height="4" rx="2"/><rect class="bar" x="10" y="${H-9}" width="${(W-20)*r}" height="4" rx="2"/>`; }
    else if(n.grade20 && gradeOf(n.id)!==null){ g += `<text class="nwk" x="${W/2}" y="${H-6}" text-anchor="middle">Nota ${gradeOf(n.id)}/20</text>`; }
    g += `</g>`; h += g;

    bn.classList.add('show');

}

/* ===================== Zoom y desplazamiento ===================== */
let view = {x:0,y:0,s:1};
const clampS = s => Math.min(2.5, Math.max(0.25, s));
function applyView(){ world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.s})`); }
function fitView(){
  const r = svg.getBoundingClientRect(); if(!r.width) return;
  const tw = LAY.maxX - LAY.minX + 60;
  let s = Math.min(1.1, r.width / tw);
  if(r.width < 600) s = Math.max(s, 0.62);
  view.s = s;
  // en celular: centrar la columna principal; en pantalla grande: todo el ancho
  const cx = (s*tw <= r.width) ? (LAY.minX+LAY.maxX)/2 : 0;
  view.x = r.width/2 - cx*s; view.y = 100;
  const cur = S.nodes.find(n=>n.week===curWeek()), cp = cur && LAY.pos[cur.id];
  if(cp && view.y + (cp.y+H)*s > r.height - 90){ view.y = r.height*0.35 - cp.y*s; if(r.width<600) view.x = r.width/2 - (cp.x+W/2)*s; }
  applyView();
}
function zoomAt(f, cx, cy){ const ns=clampS(view.s*f); const wx=(cx-view.x)/view.s, wy=(cy-view.y)/view.s; view.s=ns; view.x=cx-wx*ns; view.y=cy-wy*ns; applyView(); }
const pts = new Map(); let gest = null;
const local = e => { const r=svg.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
svg.addEventListener('pointerdown', e=>{
  svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e));
  if(pts.size===1){ const p=local(e); gest={t:'pan', sx:p.x, sy:p.y, vx:view.x, vy:view.y, moved:false, target:e.target}; }
  else if(pts.size===2){ const [a,b]=[...pts.values()]; const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; gest={t:'pinch', d0:Math.hypot(a.x-b.x,a.y-b.y)||1, s0:view.s, wx:(m.x-view.x)/view.s, wy:(m.y-view.y)/view.s, moved:true}; }
});
svg.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)||!gest) return; pts.set(e.pointerId, local(e));
  if(gest.t==='pan' && pts.size===1){ const p=local(e); const dx=p.x-gest.sx, dy=p.y-gest.sy; if(Math.hypot(dx,dy)>7) gest.moved=true; if(gest.moved){ view.x=gest.vx+dx; view.y=gest.vy+dy; applyView(); } }
  else if(gest.t==='pinch' && pts.size>=2){ const [a,b]=[...pts.values()]; const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; const s=clampS(gest.s0*Math.hypot(a.x-b.x,a.y-b.y)/gest.d0); view.s=s; view.x=m.x-gest.wx*s; view.y=m.y-gest.wy*s; applyView(); }
});
function endPtr(e){
  if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
  if(gest && gest.t==='pan' && !gest.moved && e.type==='pointerup'){
    const g = gest.target && gest.target.closest && gest.target.closest('.node');
    if(g) selectNode(g.dataset.id); else { if(selected) closePanel(); }
  }
  if(pts.size===1 && gest && gest.t==='pinch'){ const p=[...pts.values()][0]; gest={t:'pan',sx:p.x,sy:p.y,vx:view.x,vy:view.y,moved:true}; }
  if(!pts.size) gest=null;
}
svg.addEventListener('pointerup', endPtr); svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e=>{ e.preventDefault(); const p=local(e); zoomAt(Math.exp(-e.deltaY*0.0015), p.x, p.y); }, {passive:false});
document.getElementById('zIn').onclick = ()=>{ const r=svg.getBoundingClientRect(); smooth(()=>zoomAt(1.3, r.width/2, r.height/2)); };
document.getElementById('zOut').onclick = ()=>{ const r=svg.getBoundingClientRect(); smooth(()=>zoomAt(0.77, r.width/2, r.height/2)); };

/* ===================== Evaluaciones ===================== */
function weakness(n){ const p=S.progress[n.id]||{}; const t=(p.test===null||p.test===undefined)?null:+p.test; const r=n.target?(+p.count||0)/n.target:1; return (t===null?5:t)*10 + r*10 + (isDom(n.id)?50:0); }
function evalAdvice(e,pct){
  if(pct>=80) return '';
  const B=byId(); const ns=(e.nodes||[]).map(i=>B[i]).filter(Boolean).sort((a,b)=>weakness(a)-weakness(b));
  if(!ns.length) return '';
  const lbl = n => esc(n.id+' ('+n.title+(n.week?', semana '+n.week:'')+')');
  if(pct>=60) return `<div class="muted" style="margin-top:5px">Repasa sobre todo: ${ns.slice(0,2).map(lbl).join(' y ')}.</div>`;
  return `<div class="warn">Semana más débil sugerida: <b>${lbl(ns[0])}</b>. Se elige por la nota de prueba más baja y menos ejercicios hechos.</div>`;
}
function evalMsg(pct){
  if(pct>=80) return {k:'ok', t:'80 % o más: avanza a la semana siguiente.'};
  if(pct>=60) return {k:'mid', t:'Entre 60 y 79 %: avanza, pero repasa los temas que fallaste.'};
  return {k:'bad', t:'Menos de 60 %: repite la semana más débil antes de avanzar.'};
}
function renderEvals(){
  const t=today(); const nextE = S.evals.find(e=>e.date && ymd(e.date)>=t && e.score===null);
  let h = `<div class="card"><h2>Mini evaluaciones (sábados)</h2><ul class="rule" style="padding-left:18px;margin:0">
    <li><b style="color:#86efac">80 % o más</b> → avanzar</li><li><b style="color:#fde68a">60 a 79 %</b> → avanzar y repasar los temas fallados</li><li><b style="color:#fecaca">Menos de 60 %</b> → repetir la semana más débil</li></ul></div>` + evalChart();
  S.evals.forEach(e=>{
    const pct=evalPct(e), m = pct!==null?evalMsg(pct):null, d=e.date?ymd(e.date):null;
    h += `<div class="card ev ${nextE===e?'next':''}" data-ev="${esc(e.id)}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h2 style="margin:0">${esc(e.name)}</h2>${nextE===e?'<span class="pill info">Próxima</span>':''}</div>
      <div class="meta">${d?esc(fmt(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'})):''} · ${esc(e.topic)}</div>
      <div class="inp"><label class="f" style="margin:0">Puntaje</label><input type="number" min="0" step="0.5" inputmode="decimal" class="evS" value="${e.score??''}" placeholder="—"><span class="muted">de</span><input type="number" min="1" step="1" inputmode="numeric" class="evM" value="${e.max}"><button class="btn pri sm evSave">Guardar</button></div>
      ${(e.nodes||[]).length?`<div class="meta" style="margin-top:6px">Temas: ${e.nodes.map(esc).join(', ')}</div>`:''}
      <div class="res">${m?`<span class="pill ${m.k}">${pct} %</span> ${esc(m.t)}${evalAdvice(e,pct)}`:(d&&d<t?'<span class="muted">Pendiente de registrar.</span>':'')}</div></div>`;
  });
  const w = document.getElementById('evalWrap'); w.innerHTML = h;
  w.querySelectorAll('.evSave').forEach(b=>b.onclick=()=>{
    const card=b.closest('.ev'), e=S.evals.find(x=>x.id===card.dataset.ev);
    const sv=card.querySelector('.evS').value, mx=+card.querySelector('.evM').value;
    if(!(mx>0)){ toast('El máximo debe ser mayor que 0'); return; }
    if(sv!=='' && (+sv<0 || +sv>mx)){ toast('El puntaje debe estar entre 0 y '+mx); return; }
    e.max=mx; e.score = sv===''?null:+sv; save();
    const pct=evalPct(e); toast(pct===null?'Puntaje borrado':pct+' % · '+evalMsg(pct).t.split(': ')[1]);
    renderEvals(); renderHeader(); renderTree();
  });
}

function exportJSON(){

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='arbol-ali-'+iso(today())+'.json'; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); meta().lastBackup=iso(today()); meta().snoozeUntil=''; save(); if(curView==='vEdit') renderEditor(); toast('Respaldo descargado. Guárdalo en Drive o en tu correo.');

document.getElementById('fileIn').onchange = e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=async ()=>{ e.target.value='';
    let raw; try{ raw=JSON.parse(r.result); }catch(err){ toast('Ese archivo no es un respaldo válido'); return; }
    let mat=null, mal=null;
    if(raw && (raw.matematica || raw.malla)){ mat = raw.matematica ? normalize(raw.matematica) : null; mal = raw.malla || null; }
    else if(raw && Array.isArray(raw.nodes) && raw.nodes.some(n=>n && /^T\d+$/.test(n.id))) mat = normalize(raw);
    else mal = raw;
    if(mal){ const w = await ensureMalla(); try{ mal = w.normalize(mal); }catch(err){ mal=null; } }
    if(!mat && !mal){ toast('Ese archivo no es un respaldo válido'); return; }
    const parts = [mat?'Matemática ('+mat.nodes.length+' temas)':'', mal?'Malla':''].filter(Boolean).join(' y ');
    confirmBox('¿Importar este archivo?','Reemplaza lo que tienes ahora en: '+parts+'.','Importar',()=>{
      if(mat){ S=mat; save(); selected=null; pathMode=null; closePanel(true); refreshAll(); fitView(); }
      if(mal){ try{ localStorage.setItem(MALLA_KEY, JSON.stringify(mal)); }catch(err){} reloadMalla(); }
      toast('Progreso importado: '+parts);
    });
  };
  r.readAsText(f);
};

function ensureMalla(){
  if(!mallaReady) mallaReady = new Promise(res=>{ mallaFrame.onload=()=>{ syncMallaTheme(); res(mallaFrame.contentWindow); }; mallaFrame.srcdoc = mallaHtml(); });

function syncMallaTheme(){ try{ const d=mallaFrame.contentDocument; if(!d||!d.head) return; let st=d.getElementById('parentTheme'); if(!st){ st=d.createElement('style'); st.id='parentTheme'; d.head.appendChild(st); }

/* ===================== Estudio: racha y minutos ===================== */
function study(){ if(!S.study||typeof S.study!=='object') S.study={log:{}}; if(!S.study.log) S.study.log={}; return S.study; }
function meta(){ if(!S.meta||typeof S.meta!=='object') S.meta={}; if(!S.meta.firstUse) S.meta.firstUse=iso(today()); return S.meta; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function minutesOn(dt){ return +(study().log[iso(dt)]||0); }
function streak(){
  let d=today(), n=0;
  if(!minutesOn(d)) d=addDays(d,-1);
  while(minutesOn(d)>0){ n++; d=addDays(d,-1); }
  return n;
}
function bestStreak(){
  const days=Object.keys(study().log).filter(k=>study().log[k]>0).sort(); let best=0,cur=0,prev=null;
  days.forEach(k=>{ const d=ymd(k); cur = prev && daysBetween(prev,d)===1 ? cur+1 : 1; best=Math.max(best,cur); prev=d; });
  return best;
}
function logMinutes(min, nodeId){
  min=Math.round(+min); if(!(min>0) || min>600){ toast('Escribe minutos entre 1 y 600'); return; }
  const k=iso(today()); study().log[k]=(+study().log[k]||0)+min;
  if(nodeId && byId()[nodeId]){ const p=P(nodeId); p.minutes=(+p.minutes||0)+min; }
  save(); renderHeader(); toast('+'+min+' min · racha de '+streak()+' día'+(streak()===1?'':'s')+' 🔥');
}

/* ===================== Repaso espaciado ===================== */
const REVIEW_DAYS=[7,21,60];
function reviewInfo(id){
  const p=S.progress[id]; if(!p||p.status!=='dominado'||!p.date||!/^\d{4}-\d{2}-\d{2}$/.test(p.date)) return null;
  const done=Array.isArray(p.reviews)?p.reviews:[]; const i=done.length;
  if(i>=REVIEW_DAYS.length) return {complete:true, done};
  const due=addDays(ymd(p.date), REVIEW_DAYS[i]);
  return {i, due, days:daysBetween(today(),due), done, complete:false};
}
const reviewDue = id => { const r=reviewInfo(id); return !!(r && !r.complete && r.days<=0); };
function markReview(id){ const p=P(id); p.reviews=(Array.isArray(p.reviews)?p.reviews:[]).concat(iso(today())); save(); refreshAll(); if(selected===id) openPanel(id); toast('Repaso de '+id+' registrado'); }
function dueCount(){ return S.nodes.filter(n=>reviewDue(n.id)).length; }

    const dg=diagnose(it.u,it.a,it.q); it.fbc='bad'; it.fb=`❌ Todavía no${it.tries>1?' (intento '+it.tries+')':''}. ${dg?'':'Revisa tu desarrollo'+((it.st||[]).length?' o pide una pista':'')+'. '}${it.tries===1?'<small>Lo guardé en tu cuaderno de errores.</small>':''}${dg?`<span class="dg">🔎 ${dg}</span>`:''}`; fb.className='fb bad'; fb.innerHTML=it.fb;
    fb.classList.remove('shake'); void fb.offsetWidth; fb.classList.add('shake'); });
  card.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.rule, it=practice.items[i]; it.rl=true; buzz(6); card.querySelector('#rl'+i).innerHTML=`<div class="rule-box"><b>🧭 Regla que se usa</b>${mth(ruleFor(practice.topic,it.q))}</div>`; b.remove(); });
  card.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.hint, it=practice.items[i], hs=it.st||[]; if((it.h||0)>=hs.length) return; it.h=(it.h||0)+1; buzz(6);
    card.querySelector('#hn'+i).insertAdjacentHTML('beforeend',`<div class="hint new"><b>Pista ${it.h}</b>${mth(hs[it.h-1])}${stepWhy(hs[it.h-1])}</div>`);
    if(it.h>=hs.length){ b.disabled=true; b.textContent='💡 Sin más pistas'; } else b.textContent=`💡 Pista ${it.h+1}/${hs.length}`; });
  const initPad=i=>{ const box=card.querySelector('#skb'+i), cv=box&&box.querySelector('canvas'); if(!cv) return; const it=practice.items[i], ctl=initSketch(cv,it);
    box.querySelector('[data-skpen]').onclick=e=>{ ctl.pen(); e.target.classList.add('on'); box.querySelector('[data-sker]').classList.remove('on'); };
    box.querySelector('[data-sker]').onclick=e=>{ ctl.eraser(); e.target.classList.add('on'); box.querySelector('[data-skpen]').classList.remove('on'); };
    box.querySelector('[data-skclr]').onclick=()=>ctl.clear(); box.querySelector('[data-skpen]').classList.add('on'); };
  practice.items.forEach((it,i)=>{ if(it.skOpen) initPad(i); });
  card.querySelectorAll('[data-skt]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.skt, it=practice.items[i], box=card.querySelector('#skb'+i); it.skOpen=!it.skOpen; box.innerHTML=it.skOpen?sketchPad(i):''; if(it.skOpen){ initPad(i); box.scrollIntoView({behavior:RM()?'auto':'smooth',block:'nearest'}); } });
}

/* Diagnóstico de errores */
function diagnose(u,e,q){
  try{
    u=String(u||''); e=String(e);
    if(/^factoriza/i.test(q||'') && !/\(/.test(u)) return 'Te piden un <b>producto</b>: escribe los factores entre paréntesis, por ejemplo (x + 2)(x − 3).';
    const yn=noAcc(e).match(/^(si|no)\b/); if(yn){ const uy=noAcc(u).match(/^(si|no)\b/); if(uy && uy[1]!==yn[1]) return 'Revisa la conclusión: compara tu cálculo con la condición que se pide.'; return ''; }
    const dc=/\d,\d/.test(e), E=ansSigs(e,dc,false), U=ansSigs(u,dc,true);
    if(!E.list.length||!U.list.length) return '';
    const F=v=>Array.isArray(v), close=(a,b)=>Math.abs(a-b)<1e-6*Math.max(1,Math.abs(a));
    const cst=L=>L.map(v=>{ if(!F(v)) return v; const w=v.filter(y=>y!==null); return w.length&&w.every(y=>Math.abs(y-w[0])<1e-9)?w[0].toPrecision(7):v; }); E.list=cst(E.list); U.list=cst(U.list);
    if(E.list.length===1&&U.list.length===1&&F(E.list[0])&&F(U.list[0])){ const a=E.list[0], b=U.list[0]; const ix=a.map((v,i)=>i).filter(i=>a[i]!==null&&b[i]!==null); if(!ix.length) return '';
      const d=ix.map(i=>b[i]-a[i]); if(d.every(v=>close(v,d[0]))&&Math.abs(d[0])>1e-6) return 'Casi: tu expresión solo difiere en un número constante. Revisa el <b>término independiente</b> (el que no tiene x).';
      const r=ix.filter(i=>Math.abs(a[i])>1e-9).map(i=>b[i]/a[i]); if(r.length&&r.every(v=>close(v,r[0]))){ if(close(r[0],-1)) return 'Tienes el <b>signo cambiado</b> en toda la expresión.'; return 'Tu resultado es el correcto multiplicado por un número: revisa un <b>coeficiente</b> o el factor común.'; }
      return ''; }
    const ex=L=>{ const o=[]; L.forEach(v=>{ if(F(v)||/^inf/.test(v)) return; const n=parseFloat(String(v).replace('±','')); if(!Number.isFinite(n)) return; o.push(n); if(String(v)[0]==='±') o.push(-n); }); return o; };
    const ev=ex(E.list), uv=ex(U.list); if(!ev.length||!uv.length) return '';
    const sh=x=>(ansClean(x).match(/[\[\]()]/g)||[]).join('');
    if(uv.length<ev.length && uv.every(x=>ev.some(y=>close(y,x)))) return /\bo\b|±|,|;| y /.test(e)?'Te falta <b>una solución</b>. ¿Olvidaste el ± al sacar raíz o el otro factor?':'Te falta <b>un valor</b> en tu respuesta.';
    if(uv.length>ev.length && ev.every(y=>uv.some(x=>close(y,x)))) return 'Tienes <b>un valor de más</b>. ¿Revisaste las restricciones (denominador ≠ 0, log de positivos, longitudes positivas)?';
    if(uv.length!==ev.length) return '';
    const A=ev.slice(), B=uv.slice(); for(let i=A.length-1;i>=0;i--){ const j=B.findIndex(x=>close(A[i],x)); if(j>=0){ A.splice(i,1); B.splice(j,1); } }
    if(!A.length){ if(/[∞∪]|^[\[(]|∈/.test(ansClean(e)) && !sh(u)) return 'Escríbelo como <b>intervalo</b>, con corchetes [ ] o paréntesis ( ).'; if(/[∞∪]|^[\[(]|∈/.test(ansClean(e)) && sh(e)!==sh(u)) return 'Los números están bien: revisa los <b>corchetes</b>. [ ] incluye el extremo (≤, ≥) y ( ) lo excluye (<, > y ∞).'; return 'Los valores están bien: revisa el <b>orden</b> en que los escribiste.'; }
    for(let i=0;i<A.length;i++){ const a=A[i], b=B[i];
      if(close(b,-a)) return 'Revisa el <b>signo</b>: obtuviste '+gnum(b)+' en vez de un valor con el signo contrario.';
      if(Math.abs(a)>1e-9&&Math.abs(b)>1e-9&&close(a*b,1)) return 'Parece que <b>invertiste la fracción</b> (arriba y abajo cambiados).';
      if(close(b,2*a)||close(2*b,a)) return 'Te sale el doble o la mitad: revisa un <b>factor 2</b> (por ejemplo el 2a de la fórmula o el 2ab del binomio).';
      if(close(Math.abs(b),Math.abs(a)*Math.abs(a))||close(b*b,Math.abs(a))) return 'Revisa una <b>potencia o raíz</b>: tu valor es el cuadrado o la raíz del correcto.';
      if(close(Math.abs(b-a),1)) return 'Estás a 1 de distancia: revisa una <b>suma o resta</b> pequeña.'; }
    return '';
  }catch(_){ return ''; }
}

 T8:[{k:1,at:2,q:'¿Puedes cancelar x² arriba y abajo en (x² − 9)/(x² + 6x + 9)?',o:['Sí','No: solo se cancelan factores, no términos','Solo si x ≠ 0'],c:1,e:'x² es un término que se suma, no un factor de todo. Primero se factoriza y luego se cancela (x + 3).'},
     {q:'En x/(x − 1) = 2 + 1/(x − 1) sale x = 1. ¿Qué pasaría si la aceptas?',o:['Sería una solución válida','Habría una división entre 0','Cambia el resultado a 2'],c:1,e:'Con x = 1 el denominador x − 1 vale 0, y eso está prohibido. La ecuación no tiene solución.'}],
 T9:[{k:1,at:1,q:'Si el discriminante sale 25 (positivo), ¿cuántas soluciones reales hay?',o:['Ninguna','Una','Dos'],c:2,e:'Δ > 0 da dos soluciones porque ±√Δ produce dos valores distintos.'},
     {q:'¿Qué pasaría si el discriminante fuera negativo?',o:['Dos soluciones negativas','No hay soluciones reales','Una sola solución'],c:1,e:'No existe raíz cuadrada real de un negativo: la parábola no toca el eje x.'}],
 T10:[{k:1,at:0,q:'Si sumas 2x + y = 7 con x − y = 2, ¿qué pasa con la y?',o:['Se duplica','Se cancela','Queda −y'],c:1,e:'y + (−y) = 0: por eso conviene sumar. Queda 3x = 9.'},
     {q:'¿Qué pasaría si las dos rectas del sistema fueran paralelas (distintas)?',o:['Infinitas soluciones','No habría solución','Una solución'],c:1,e:'Rectas paralelas nunca se cortan: no hay punto común. Si fueran la misma recta habría infinitas.'}],
 T11:[{k:0,at:1,q:'En −2x ≤ 6, al dividir entre −2, ¿qué pasa con el ≤?',o:['Se mantiene','Se invierte a ≥','Se vuelve ='],c:1,e:'Multiplicar o dividir entre un negativo invierte el orden: 2 < 3 pero −2 > −3.'},
     {q:'¿Qué pasaría con |x − 2| < −1?',o:['x ∈ (1, 3)','No tiene solución','Todo ℝ'],c:1,e:'Un valor absoluto nunca es negativo, así que nunca es menor que −1: conjunto vacío ∅.'}],
 T12:[{k:1,at:0,q:'¿Cuál es la pendiente entre (1, 2) y (3, 8)?',o:['3','1/3','6'],c:0,e:'m = (8 − 2)/(3 − 1) = 6/2 = 3: cambio en y sobre cambio en x (no al revés).'},
     {q:'¿Cómo es una recta con pendiente 0?',o:['Vertical','Horizontal','Pasa por el origen'],c:1,e:'Pendiente 0 significa que y no cambia: recta horizontal y = b. La vertical no tiene pendiente definida.'}],
 T13:[{k:1,at:1,q:'En 1/(x − 5), ¿qué valor de x está prohibido?',o:['x = 0','x = 5','x = −5'],c:1,e:'Con x = 5 el denominador vale 0, y dividir entre 0 no está definido.'},
     {q:'¿Qué pasaría si en x² − 4x + 1 el coeficiente de x² fuera −1?',o:['Abre hacia abajo y el vértice es un máximo','Nada cambia','Se mueve a la derecha'],c:0,e:'El signo de a decide la apertura: con a < 0 abre hacia abajo y el vértice es el punto más alto.'}],
 X10:[{k:1,at:0,q:'En (x + 2)², ¿hacia dónde se mueve la parábola?',o:['2 a la derecha','2 a la izquierda','2 hacia arriba'],c:1,e:'El vértice queda donde x + 2 = 0, o sea en x = −2: a la izquierda.'},
     {q:'¿Qué pasaría con y = x² si escribes y = x² − 5?',o:['Baja 5','Se mueve 5 a la derecha','Se hace más angosta'],c:0,e:'Lo que se suma o resta afuera mueve la gráfica en vertical: −5 la baja 5.'}],
 T14:[{k:1,at:1,q:'Para completar el cuadrado en x² − 6x, ¿qué número sumas?',o:['6','9','36'],c:1,e:'La mitad de −6 es −3 y (−3)² = 9: x² − 6x + 9 = (x − 3)².'},
     {q:'En (x − 3)² + (y + 2)² = 16, ¿cuál es el centro?',o:['(3, −2)','(−3, 2)','(3, 2)'],c:0,e:'La forma es (x − h)² + (y − k)²: h = 3 y k = −2, porque y + 2 = y − (−2).'}],
 T15:[{k:1,at:0,q:'En A·B, el elemento de fila 1 y columna 1 se obtiene con…',o:['Fila 1 de A por columna 1 de B','Solo a₁₁·b₁₁','Fila 1 de A por fila 1 de B'],c:0,e:'Es la suma de productos de la fila 1 de A con la columna 1 de B: 1·0 + 2·1 = 2.'},
     {q:'¿A·B es siempre igual a B·A?',o:['Sí','No, en general el orden importa','Solo en matrices 2×2'],c:1,e:'Con A = [1 2; 3 4] y B = [0 1; 1 0]: A·B = [2 1; 4 3], pero B·A = [3 4; 1 2].'}],
 X9:[{k:1,at:0,q:'¿Por qué se calcula primero el determinante?',o:['Porque si es 0 no hay inversa','Por costumbre','Para saber el tamaño'],c:0,e:'La inversa divide entre det A; si det = 0, no existe.'},
     {q:'¿Qué pasaría con Cramer si det A = 0?',o:['x = 0','No se puede usar: no hay solución única','Todo da infinito'],c:1,e:'Cramer divide entre det A. Si vale 0, el sistema no tiene solución o tiene infinitas.'}],
 T16:[{k:1,at:1,q:'Si 2^(x+1) = 2⁵, ¿qué ecuación queda?',o:['x + 1 = 5','x = 5','2x + 2 = 10'],c:0,e:'Con la misma base, potencias iguales tienen exponentes iguales.'},
     {q:'En log₂(x) + log₂(x − 2) = 3 también sale x = −2. ¿Qué pasaría si la aceptas?',o:['Es válida','Tendrías log de un negativo, que no existe','Da 3 igual'],c:1,e:'log₂(−2) no está definido: el argumento de un logaritmo debe ser positivo. Por eso se descarta.'}],
 T17:[{k:1,at:2,q:'¿Por qué se puede cancelar (x − 3)?',o:['Porque x vale 3','Porque x se acerca a 3 sin ser 3, así que x − 3 ≠ 0','Porque 0/0 = 1'],c:1,e:'En el límite x nunca es exactamente 3, así que dividir entre x − 3 es válido.'},
     {q:'Si al reemplazar sale 5/0 (y no 0/0), ¿qué indica?',o:['El límite es 0','El límite no es finito: tiende a ±∞ o no existe','Hay que factorizar'],c:1,e:'Un número distinto de 0 dividido entre algo cada vez más cercano a 0 crece sin límite. 0/0 es el caso que se arregla factorizando.'}],
 T18:[{k:1,at:1,q:'¿Cuál es la derivada de 3x⁴?',o:['12x³','12x⁴','3x³'],c:0,e:'(xⁿ)′ = n·xⁿ⁻¹: 3·4x³ = 12x³.'},
     {q:'¿Cuál es la derivada de una constante, como 7?',o:['7','0','1'],c:1,e:'Una constante no cambia, así que su razón de cambio (su pendiente) es 0.'}],
 X2:[{k:1,at:1,q:'Con catetos 3 y 4 e hipotenusa 5, ¿cuánto es sen θ si θ está frente al 3?',o:['3/5','4/5','3/4'],c:0,e:'Seno = opuesto/hipotenusa = 3/5. 4/5 es el coseno y 3/4 la tangente.'},
     {q:'¿Qué pasaría si calculas sen 30° con la calculadora en radianes?',o:['Da 0,5 igual','Da otro valor (sen de 30 radianes ≈ −0,99)','Da error'],c:1,e:'La calculadora entendería 30 radianes. Revisa siempre el modo DEG o RAD.'}],
 X3:[{k:1,at:1,q:'En la hipérbola x²/16 − y²/9 = 1, ¿cuánto vale c²?',o:['16 − 9 = 7','16 + 9 = 25','9 − 16'],c:1,e:'En la hipérbola los focos están más lejos que los vértices: c² = a² + b². En la elipse se resta.'},
     {q:'¿Qué pasaría en una elipse si a = b?',o:['Es una circunferencia','Es una hipérbola','No existe'],c:0,e:'Si a = b entonces c = 0: los focos coinciden en el centro y la elipse es una circunferencia.'}],
 X4:[{k:1,at:1,q:'Si |u| = 10 para u = (6, 8), ¿cuál es el vector unitario?',o:['(6/10, 8/10)','(6, 8)/100','(10, 10)'],c:0,e:'Se divide cada componente entre la magnitud: (3/5, 4/5), que mide 1.'},
     {q:'Si u·v = 0, ¿qué ángulo forman?',o:['0°','90°','180°'],c:1,e:'cos θ = 0, así que θ = 90°: son perpendiculares.'}],
 X5:[{k:2,at:0,q:'Para contar a los que llevan al menos un curso, ¿por qué se resta 10?',o:['Porque los de ambos se contaron dos veces','Porque 10 no estudian','Por redondeo'],c:0,e:'Los 10 de “ambos” están dentro de los 25 y también de los 18: se restan una vez.'},
     {q:'Si p es falsa, ¿qué valor tiene p → q?',o:['Siempre V','Siempre F','Depende de q'],c:0,e:'Un condicional solo es falso cuando va de V a F. Con p falsa, siempre es verdadero.'}],
 X6:[{k:1,at:2,q:'Después de despejar x = (y + 5)/3, ¿qué falta?',o:['Nada','Intercambiar x e y','Multiplicar por 3'],c:1,e:'La inversa se escribe en función de x: f⁻¹(x) = (x + 5)/3.'},
     {q:'¿(f ∘ g)(x) es igual a (g ∘ f)(x)?',o:['Siempre','En general no','Nunca'],c:1,e:'Con f = 2x + 1 y g = x²: f(g(x)) = 2x² + 1 y g(f(x)) = 4x² + 4x + 1. A veces coinciden, pero no en general.'}],
 X7:[{k:1,at:0,q:'En 7, 12, 17, …, ¿cuántas veces se suma d para llegar a a₁₂?',o:['12','11','13'],c:1,e:'De a₁ a a₁₂ hay 11 saltos: aₙ = a₁ + (n − 1)d.'},
     {q:'En una sucesión geométrica con r = 1/2 y a₁ = 8, ¿qué pasa con los términos?',o:['Crecen','Se hacen cada vez más pequeños','Se mantienen'],c:1,e:'Cada término es la mitad del anterior: 8, 4, 2, 1, …'}],
 X8:[{k:1,at:0,q:'En un comité de 3 personas, ¿importa el orden?',o:['Sí: permutación','No: combinación','Depende de los nombres'],c:1,e:'Ana, Beto y Caro forman el mismo comité en cualquier orden: se usa C(n, k).'},
     {q:'¿De cuántas formas se ordenan 4 libros si 2 son idénticos?',o:['24','12','6'],c:1,e:'4!/2! = 12: los órdenes que solo intercambian los libros iguales no son distintos.'}],
 X11:[{k:1,at:2,q:'¿Por qué 1 − sen²x = cos²x?',o:['Por sen²x + cos²x = 1','Porque sen x = cos x','Por la definición de tangente'],c:0,e:'De la identidad pitagórica sen²x + cos²x = 1 se despeja cos²x.'},
     {q:'Si sen x = √2/2, ¿cuántos ángulos entre 0° y 360° cumplen?',o:['Uno: 45°','Dos: 45° y 135°','Cuatro'],c:1,e:'El seno es positivo en los cuadrantes I y II: 45° y 180° − 45° = 135°.'}]

function gexSpec(id,k){ const G=GEX[id]; return G&&G[k]?Object.assign({kind:'fx'},G[k]):null; }
function gCompile(c){ if(typeof c==='string'){ const f=mParse(c); return f?{f}:null; } const fx=mParse(c.px), fy=mParse(c.py); return fx&&fy?{fx,fy,t:c.t}:null; }
function gPath(cv,X,Y,Z){ let d='', pen=false; const par=!!cv.fx, N=par?480:600;
  for(let k=0;k<=N;k++){ let x,y; if(par){ const t=cv.t[0]+k*(cv.t[1]-cv.t[0])/N; x=cv.fx(t); y=cv.fy(t); } else { x=-Z+k*(2*Z)/N; y=cv.f(x); }
    const ok=Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(y)<=Z+1&&Math.abs(x)<=Z+1; if(ok){ d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1); pen=true; } else pen=false; }
  return d; }

  return {
  T1:[
   {t:'Sumar y restar con signos',x:['Imagina la recta numérica: sumar un positivo te mueve a la derecha y sumar un negativo, a la izquierda. Restar un número es sumar su opuesto: a − (−b) = a + b.','Mismo signo: sumas y dejas ese signo. Signos distintos: restas y queda el signo del que tiene mayor valor absoluto.'],ej:['−7 + 3 ; 5 − (−4)','−7 + 3 = −4 (gana el 7, que es negativo) ; 5 − (−4) = 5 + 4 = 9'],
    g:()=>{ const a=nz(-15,15), b=nz(-15,15); return pick([()=>({q:`Calcula: ${num(a)} + ${pr(b)}`,a:num(a+b),st:[`Signos ${a*b>0?'iguales: se suman':'distintos: se restan'} los valores`,`${num(a)} + ${pr(b)} = ${num(a+b)}`]}),()=>({q:`Calcula: ${num(a)} − ${pr(b)}`,a:num(a-b),st:['Restar es sumar el opuesto',`${num(a)} + ${pr(-b)} = ${num(a-b)}`]})])(); }},
   {t:'Multiplicar y dividir signos',x:['Regla de signos: (+)·(+) = +, (−)·(−) = +, y si los signos son distintos el resultado es negativo. Para dividir es la misma regla.','¿Por qué (−)·(−) da +? Multiplicar por −1 es “dar la vuelta” en la recta: dos vueltas te dejan mirando hacia el mismo lado.'],ej:['(−6)·(−4) ; (−20) ÷ 5','(−6)·(−4) = 24 ; (−20) ÷ 5 = −4'],
    g:()=>{ const a=nz(-9,9), b=nz(-9,9); return pick([()=>({q:`Calcula: (${num(a)})·(${num(b)})`,a:num(a*b),st:[`Signos ${a*b>0?'iguales → +':'distintos → −'}`,`${Math.abs(a)}·${Math.abs(b)} = ${Math.abs(a*b)}`]}),()=>({q:`Calcula: (${num(a*b)}) ÷ (${num(b)})`,a:num(a),st:[`Signos ${a>0?'iguales → +':'distintos → −'}`,`${Math.abs(a*b)} ÷ ${Math.abs(b)} = ${Math.abs(a)}`]})])(); }},
   {t:'Jerarquía de operaciones',x:['El orden es: 1) paréntesis, 2) potencias, 3) multiplicaciones y divisiones de izquierda a derecha, 4) sumas y restas.','Si no se respeta, la misma expresión daría resultados distintos según quién la calcule. La jerarquía es el acuerdo para que todos obtengan lo mismo.'],ej:['3 + 4·2 ; (3 + 4)·2','3 + 8 = 11 ; 7·2 = 14'],
    g:()=>{ const a=nz(-9,9), b=rnd(2,6), c=nz(-6,6); return pick([()=>({q:`Calcula: ${num(a)} + ${b}·${pr(c)}`,a:num(a+b*c),st:[`Primero la multiplicación: ${b}·${pr(c)} = ${num(b*c)}`,`Al final la suma: ${num(a)} + ${pr(b*c)} = ${num(a+b*c)}`]}),()=>({q:`Calcula: (${num(a)} + ${b})·${pr(c)}`,a:num((a+b)*c),st:[`Primero el paréntesis: ${num(a)} + ${b} = ${num(a+b)}`,`Luego la multiplicación: ${pr(a+b)}·${pr(c)} = ${num((a+b)*c)}`]}),()=>({q:`Calcula: ${num(a)} − ${b}²`,a:num(a-b*b),st:[`Primero la potencia: ${b}² = ${b*b}`,`Al final la resta: ${num(a)} − ${b*b} = ${num(a-b*b)}`]})])(); }},

   {t:'Sumar y restar fracciones',x:['Solo se pueden sumar partes del mismo tamaño. Por eso primero se busca un denominador común (el MCM de los denominadores).','Luego conviertes cada fracción, sumas o restas los numeradores y simplificas.'],ej:['1/4 + 2/3','MCM(4, 3) = 12 → 3/12 + 8/12 = 11/12'],
    g:()=>{ let a,b; do{ a=Fr(nz(-7,7),rnd(2,9)); b=Fr(rnd(1,7),rnd(2,9)); }while(a.d===b.d||a.d===1||b.d===1); const op=pick(['+','−']), r=op==='+'?fadd(a,b):fsub(a,b), m=lcm(a.d,b.d); return {q:`Calcula: ${fs(a)} ${op} ${fs(b)}`,a:fs(r),st:[`Denominador común: MCM(${a.d}, ${b.d}) = ${m}`,`${fs(a)} = ${a.n*m/a.d}/${m} ; ${fs(b)} = ${b.n*m/b.d}/${m}`,`${op==='+'?'Suma':'Resta'} los numeradores y simplifica: ${fs(r)}`]}; }},
   {t:'Multiplicar y dividir fracciones',x:['Multiplicar: arriba por arriba y abajo por abajo (no hace falta denominador común).','Dividir: multiplica por la fracción invertida, porque dividir entre a/b es lo mismo que multiplicar por b/a.'],ej:['2/3 · 9/4 ; 2/3 ÷ 4/5','18/12 = 3/2 ; 2/3 · 5/4 = 10/12 = 5/6'],
    g:()=>{ const a=Fr(nz(-8,8),rnd(2,9)), b=Fr(rnd(1,8),rnd(2,9)); return pick([()=>({q:`Calcula: ${fs(a)} · ${fs(b)}`,a:fs(fmul(a,b)),st:['Multiplica arriba por arriba y abajo por abajo',`Simplifica: ${fs(fmul(a,b))}`]}),()=>({q:`Calcula: ${fs(a)} ÷ ${fs(b)}`,a:fs(fdiv(a,b)),st:[`Dividir es multiplicar por el inverso: ${fs(a)} · ${b.d}/${b.n}`,`Simplifica: ${fs(fdiv(a,b))}`]})])(); }}],
  T2:[
   {t:'Qué es una potencia',x:['aⁿ significa multiplicar a por sí mismo n veces: 2⁴ = 2·2·2·2 = 16. a es la base y n el exponente.','Ojo con el signo: (−3)² = 9, pero −3² = −9, porque sin paréntesis el exponente solo afecta al 3.'],ej:['(−2)³','(−2)(−2)(−2) = −8'],
    g:()=>{ const b=pick([2,3,4,5,-2,-3]), n=rnd(2,b===2||b===-2?5:3); return {q:`Calcula: ${b<0?`(${num(b)})`:b}${sup(n)}`,a:num(b**n),st:[`Multiplica ${n} veces ${pr(b)}`,`Resultado: ${num(b**n)}`]}; }},
   {t:'Misma base: multiplicar y dividir',x:['aᵐ·aⁿ = aᵐ⁺ⁿ: juntas m factores con n factores, en total m + n.','aᵐ ÷ aⁿ = aᵐ⁻ⁿ: al dividir se cancelan n factores de arriba con los de abajo.'],ej:['x⁵·x³ ; x⁷ ÷ x²','x⁸ ; x⁵'],
    g:()=>{ const m=rnd(2,7), n=rnd(2,6); return pick([()=>({q:`Simplifica: x${sup(m)} · x${sup(n)}`,a:'x'+sup(m+n),st:[`Multiplicación de igual base: suma los exponentes ${m} + ${n}`,`x${sup(m+n)}`]}),()=>({q:`Simplifica: x${sup(m+n)} ÷ x${sup(n)}`,a:'x'+(m>1?sup(m):''),st:[`División de igual base: resta los exponentes ${m+n} − ${n}`,`x${m>1?sup(m):''}`]})])(); }},
   {t:'Potencia de potencia, exponente 0 y negativo',x:['(aᵐ)ⁿ = aᵐ·ⁿ: son n grupos de m factores.','a⁰ = 1 (si a ≠ 0), porque aⁿ ÷ aⁿ = 1. Y a⁻ⁿ = 1/aⁿ: un exponente negativo manda la potencia al denominador.'],ej:['(x³)⁴ ; 2⁻³','x¹² ; 1/2³ = 1/8'],
    g:()=>pick([()=>{ const m=rnd(2,5), n=rnd(2,4); return {q:`Simplifica: (x${sup(m)})${sup(n)}`,a:'x'+sup(m*n),st:[`Potencia de potencia: multiplica ${m}·${n}`,`x${sup(m*n)}`]}; },()=>{ const b=rnd(2,5), n=rnd(1,3); return {q:`Calcula: ${b}^(−${n})`,a:`1/${b**n}`,st:[`Exponente negativo: ${b}^(−${n}) = 1/${b}${sup(n)}`,`= 1/${b**n}`]}; }])() },
   {t:'Decimales y fracciones',x:['Un decimal exacto se escribe sobre 10, 100, 1000… según cuántas cifras decimales tenga: 0,35 = 35/100.','Después se simplifica: 35/100 = 7/20.'],ej:['0,6 ; 1,25','6/10 = 3/5 ; 125/100 = 5/4'],

   {t:'Porcentajes',x:['p % significa p de cada 100: el p % de N es (p/100)·N.','Subir p % es multiplicar por (1 + p/100) y bajar p % es multiplicar por (1 − p/100). Ejemplo: subir 20 % es ×1,2.'],ej:['15 % de 80 ; 200 sube 10 %','0,15·80 = 12 ; 200·1,1 = 220'],

  T3:[
   {t:'Raíz cuadrada y cuadrados perfectos',x:['√a es el número positivo que al cuadrado da a: √49 = 7 porque 7² = 49.','Memoriza los cuadrados perfectos: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144. Son la llave para simplificar raíces.'],ej:['√81 + √16','9 + 4 = 13'],

   {t:'Multiplicar raíces',x:['√a·√b = √(a·b), y los números de afuera se multiplican entre sí: 2√3·5√2 = 10√6.','Al final, simplifica la raíz que resulte.'],ej:['√6·√10','√60 = √(4·15) = 2√15'],
    g:()=>{ const a=pick([2,3,5,6,8,10,12]), b=pick([2,3,5,6,8,10,12]); const [k,m]=sqf(a*b); return {q:`Multiplica: √${a} · √${b}`,a:rad(k,m),st:[`√${a}·√${b} = √${a*b}`,`Simplifica: ${rad(k,m)}`]}; }},

  T4:[
   {t:'Términos semejantes',x:['Un término tiene coeficiente (número) y parte literal (letras con exponentes). Son semejantes si tienen la misma parte literal: 3x² y −5x² sí; 3x² y 3x no.','Solo se suman los semejantes: se suman los coeficientes y la parte literal no cambia.'],ej:['4x² + 3x − x² + 2x','3x² + 5x'],
    g:()=>{ const A=[nz(-6,6),nz(-6,6)], B=[nz(-6,6),nz(-6,6)]; return {q:`Simplifica: ${terms([[A[0],'x²'],[A[1],'x'],[B[0],'x²'],[B[1],'x']])}`,a:poly([A[0]+B[0],A[1]+B[1],0]),st:[`x²: ${num(A[0])} + ${pr(B[0])} = ${num(A[0]+B[0])}`,`x: ${num(A[1])} + ${pr(B[1])} = ${num(A[1]+B[1])}`]}; }},
   {t:'Distributiva',x:['a(b + c) = ab + ac: el factor de afuera multiplica a cada término.','Con letras se usan las leyes de exponentes: 3x·2x = 6x².'],ej:['3x(2x − 5)','6x² − 15x'],
    g:()=>{ const a=nz(-5,5), b=nz(-5,5), c=nz(-9,9); return {q:`Multiplica: ${a===1?'':a===-1?'−':num(a)}x(${poly([b,c])})`,a:poly([a*b,a*c,0]),st:[`${num(a)}x·${b===1?'':b===-1?'−':num(b)}x = ${terms([[a*b,'x²']])}`,`${num(a)}x·${pr(c)} = ${terms([[a*c,'x']])}`]}; }},
   {t:'Multiplicar dos binomios',x:['Cada término del primero multiplica a cada término del segundo: (a + b)(c + d) = ac + ad + bc + bd.','Al final se juntan los términos semejantes (normalmente los dos del medio).'],ej:['(x + 3)(2x − 1)','2x² − x + 6x − 3 = 2x² + 5x − 3'],
    g:()=>{ const a=rnd(1,3), b=nz(-7,7), c=rnd(1,3), d=nz(-7,7); return {q:`Multiplica: (${bin(a,b)})(${bin(c,d)})`,a:poly([a*c,a*d+b*c,b*d]),st:[`Primeros: ${terms([[a*c,'x²']])} ; externos: ${terms([[a*d,'x']])} ; internos: ${terms([[b*c,'x']])} ; últimos: ${num(b*d)}`,`Junta: ${poly([a*c,a*d+b*c,b*d])}`]}; }},
   {t:'Binomio al cuadrado',x:['(a + b)² = a² + 2ab + b² y (a − b)² = a² − 2ab + b². Salen de multiplicar (a + b)(a + b).','El error típico es olvidar el término del medio 2ab: (x + 3)² NO es x² + 9.'],ej:['(2x − 5)²','4x² − 20x + 25'],
    g:()=>{ const a=rnd(1,4), b=nz(-8,8); return {q:`Desarrolla: (${bin(a,b)})²`,a:poly([a*a,2*a*b,b*b]),st:[`Cuadrado del primero: ${terms([[a*a,'x²']])}`,`Doble producto: 2·${a===1?'':a}x·${pr(b)} = ${terms([[2*a*b,'x']])}`,`Cuadrado del segundo: ${b*b}`]}; }},

    g:()=>{ const a=rnd(1,5), b=rnd(1,9); return {q:`Desarrolla: (${bin(a,b)})(${bin(a,-b)})`,a:poly([a*a,0,-b*b]),st:['Suma por diferencia: a² − b²',`${terms([[a*a,'x²']])} − ${b*b}`]}; }},

    g:()=>{ const c=[nz(-4,4),nz(-6,6),rnd(-9,9)], v=nz(-3,3); return {q:`Si P(x) = ${poly(c)}, calcula P(${num(v)})`,a:num(c[0]*v*v+c[1]*v+c[2]),st:[`Reemplaza x por ${pr(v)}`,`${num(c[0])}·${v*v} + ${pr(c[1])}·${pr(v)} + ${pr(c[2])} = ${num(c[0]*v*v+c[1]*v+c[2])}`]}; }}],
  T5:[
